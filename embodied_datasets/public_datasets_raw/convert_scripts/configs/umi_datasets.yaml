id: umi_datasets
name: UMI datasets
source_url: https://umi-gripper.github.io
paper_url: https://arxiv.org/abs/2402.10329
license: MIT
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: umi
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: single_arm
robot_platform: other
num_arms: 1
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
action_frame: relative_trajectory
rotation_representation: rotation_6d
state_dim: 10
action_dim: 10
fps: 59.94
fps_variable: true
num_camera_views: 1
camera_views:
- wrist
has_synchronized_multiview_rig: false
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: false
num_task_types: 1
urdf_available: false
urdf_source: not_found
expected_size_gb: 17.99
expected_num_episodes: 1400
num_subjects: 3
num_scenes: 30
num_objects: 15
review_status: pending_human_review
field_sources:
  source_url: 'https://umi-gripper.github.io (official UMI project page linked from
    paper and GitHub README; original stub had no source_url) Re-verified 2026-07-13:
    curl-fetched https://umi-gripper.github.io directly; page loads and links to the
    same paper/GitHub repo/hardware guide.'
  license: 'https://github.com/real-stanford/universal_manipulation_interface README.md,
    section ''License'': ''This repository is released under the MIT license.'' Re-verified
    2026-07-13: curl-fetched LICENSE file directly from GitHub raw -- ''MIT License,
    Copyright (c) 2023 Columbia Artificial Intelligence and Robotics Lab''.'
  raw_format: 'https://github.com/real-stanford/universal_manipulation_interface README.md:
    processed data is distributed as ''dataset.zarr.zip'' (Zarr store), which is not
    one of RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord, hence classified as Custom. Re-verified
    2026-07-13: GitHub README download commands confirm dataset.zarr.zip / cup_in_the_wild.zarr.zip
    as the only released data artifacts.'
  collection_method: 'arXiv:2402.10329 abstract and Sec III.A: UMI employs hand-held
    grippers as the sole data collection interface (dedicated ''umi'' collection method).
    Re-verified 2026-07-13 against arXiv PDF full text (pdftotext extraction): abstract
    confirms ''UMI employs hand-held grippers ... as the sole data collection interface''.'
  embodiment_class: 'arXiv:2402.10329 Sec V-A and Fig 8(c): the publicly released
    ''cup_in_the_wild'' zarr dataset and its primary Diffusion Policy task config
    (diffusion_policy/config/task/umi.yaml) are single-arm (one camera0_rgb / one
    robot0_eef_pos stream); paper Fig 1 and README note UMI additionally supports
    bimanual (2-arm) tasks in other experiments. Re-verified 2026-07-13: confirmed
    consistent with the corrected num_task_types=1 (the only released dataset is the
    single-arm cup-arrangement task).'
  robot_platform: 'arXiv:2402.10329 Fig 8(c) (''Ours (Franka)'', ''Ours (UR5e)'')
    and GitHub README (''Setup UR5 with teach pendant'', ''If you are using Franka...'',
    ARX X5 via umi-arx repo): policies are deployed across multiple robot arms (UR5/UR5e,
    Franka Panda, ARX X5), not one fixed platform. Re-verified 2026-07-13: GitHub
    README real-world deployment section still lists UR5/UR5e, Franka, and ARX X5
    (via umi-arx) as of the current main-branch README; ''other'' remains the best
    fit since no single robot_platform enum value applies to the hand-held-gripper
    collection device itself.'
  num_arms: 'arXiv:2402.10329 Sec V-A (cup arrangement/dish-washing/tossing experiments
    are single-arm); README: ''our system supports up to 2 arms'' for bimanual tasks
    such as cloth folding. Re-verified 2026-07-13: unchanged, consistent with the
    corrected single-task (cup arrangement) scope of the released dataset.'
  gripper_type: 'arXiv:2402.10329 Sec III.A: ''a trigger-activated, handheld 3D printed
    parallel jaw gripper with soft fingers''; GitHub README deployment setup uses
    a WSG50 parallel-jaw gripper. Re-verified 2026-07-13: unchanged.'
  has_mobile_base: 'arXiv:2402.10329 Sec III (PD2.2) and Fig 10(a): deployment robots
    are stationary arms (base can be manually repositioned between episodes, but the
    system is not a mobile-base robot). Re-verified 2026-07-13: unchanged.'
  action_space: 'arXiv:2402.10329 Sec III.B / Fig 5: ''UMI policy takes in a sequence
    of synchronized observations ... and outputs a sequence of desired relative EE
    pose and gripper width as action.'' Re-verified 2026-07-13: unchanged, cross-checked
    against diffusion_policy/config/task/umi.yaml action shape_meta.'
  rotation_representation: 'GitHub real-stanford/universal_manipulation_interface
    diffusion_policy/config/task/umi.yaml: action and robot0_eef_rot_axis_angle both
    specify ''rotation_rep: rotation_6d''. Re-verified 2026-07-13: re-fetched diffusion_policy/config/task/umi.yaml
    directly, confirms rotation_rep: rotation_6d for both obs (robot0_eef_rot_axis_angle)
    and action.'
  state_dim: 'GitHub diffusion_policy/config/task/umi.yaml shape_meta.obs: robot0_eef_pos
    shape [3] + robot0_eef_rot_axis_angle shape [6] (rotation_6d) + robot0_gripper_width
    shape [1] = 10. Re-verified 2026-07-13: re-fetched task yaml directly, shape_meta.obs
    sums to 3+6+1=10.'
  action_dim: 'GitHub diffusion_policy/config/task/umi.yaml shape_meta.action: shape
    [10], rotation_rep rotation_6d (3 position + 6 rotation + 1 gripper width). Re-verified
    2026-07-13: re-fetched task yaml directly, action.shape: [10].'
  fps: 'GitHub diffusion_policy/config/task/umi.yaml: ''dataset_frequeny: 0 #59.94''
    (GoPro native capture rate ~59.94 fps). Re-verified 2026-07-13: re-fetched task
    yaml directly, ''dataset_frequeny: 0 #59.94'' comment confirmed present.'
  fps_variable: 'arXiv:2402.10329 Fig 5(a): camera/gripper/robot observation streams
    are captured at different native rates (e.g. ~10Hz downsampled camera, 30Hz gripper,
    125Hz robot) and camera obs are ''temporally down-sampled ... to the desired frequency
    (often 10-20Hz)'', which itself varies by task''s obs_down_sample_steps config.
    Re-verified 2026-07-13: unchanged.'
  num_camera_views: 'arXiv:2402.10329 Sec III.A: ''mounted with a GoPro camera as
    the only sensor and recording device'' (one wrist-mounted camera per gripper).
    Re-verified 2026-07-13: unchanged, consistent with corrected has_synchronized_multiview_rig=false.'
  camera_views: 'CORRECTED 2026-07-13 from [''other''] to [''wrist''] now that CameraView.WRIST
    exists in schema.py (added in the same refinement pass per docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    Sec 3.2, for exactly this single-arm generic wrist-camera pattern -- the design
    doc''s backfill table in Sec 4.A lists fastumi/mv_umi/omniumi/fmb/furniturebench/gensim2/the_colosseum
    as getting this correction but omits the original umi_datasets id, which fits
    the identical pattern: arXiv:2402.10329 Sec III.A / Fig 2, single wrist-mounted
    GoPro on the gripper, side-agnostic for a single-gripper task). The prior suggested_new_enum_values
    entry for this field is now removed as resolved.'
  has_camera_calibration: 'GitHub repo: example/calibration/gopro_intrinsics_2_7k.json
    (GoPro intrinsics) and scripts/calibrate_uvc_camera_latency.py, scripts/calibrate_slam_tag.py,
    scripts_slam_pipeline/05_run_calibrations.py. Re-verified 2026-07-13: GitHub API
    listing of example/calibration/ still shows aruco_config.yaml and gopro_intrinsics_2_7k.json.'
  depth_coverage: 'arXiv:2402.10329 Sec III.A (HD3): depth is only implicitly inferred
    via side mirrors + monocular SLAM (''implicit stereo''); no explicit depth channel
    is recorded, only RGB video from a single GoPro. Re-verified 2026-07-13: unchanged,
    no depth sensor/channel found.'
  has_language_instruction: 'GitHub diffusion_policy/config/task/umi.yaml shape_meta.obs
    lists only camera0_rgb / robot0_eef_pos / robot0_eef_rot_axis_angle / robot0_gripper_width;
    no language/instruction field is present in the dataset schema. Re-verified 2026-07-13:
    unchanged.'
  num_task_types: 'CORRECTED 2026-07-13 from 4 to 1. Re-derivation found the prior
    value of 4 (counting all tasks demonstrated in the paper: Cup Arrangement, Dynamic
    Tossing, Bimanual Cloth Folding, Dish Washing -- arXiv:2402.10329 Sec V) is inconsistent
    with the rest of this config: expected_size_gb and expected_num_episodes both
    refer specifically to the single publicly released cup_in_the_wild.zarr.zip file
    (verified via curl HEAD and the zarr_datasets/ and pretrained_models/ directory
    listings on real.stanford.edu/umi/data/, which contain only one dataset and one
    checkpoint, both for the in-the-wild cup arrangement task). The other 3 tasks
    are demonstrated in the paper for framework capability but have no publicly released
    dataset file, so num_task_types is corrected to 1 to match the actual downloadable
    artifact this config describes.'
  urdf_available: 'https://github.com/real-stanford/universal_manipulation_interface
    repo tree: no URDF exists for the UMI gripper hardware itself; the only *.urdf
    files in the repo belong to unrelated legacy simulation assets (diffusion_policy/env/block_pushing,
    kitchen sim). Re-verified 2026-07-13: unchanged, no UMI-gripper URDF found in
    a fresh repo-tree check.'
  urdf_source: 'Same as urdf_available: no UMI-gripper URDF found in the dataset/GitHub
    repo. Re-verified 2026-07-13: unchanged.'
  expected_size_gb: 'Refined 2026-07-13 from 18.0 to 17.99 for precision. curl -I
    https://real.stanford.edu/umi/data/zarr_datasets/cup_in_the_wild.zarr.zip reports
    Content-Length: 17989829476 bytes = 17.9898 decimal GB (rounded 17.99), re-confirmed
    against the directory listing page''s displayed size.'
  expected_num_episodes: 'arXiv:2402.10329 Sec VI (In-the-Wild Generalization Experiments):
    ''Within 12 person-hours, 3 demonstrators collected 1400 demonstrations for the
    cup arrangement task across 30 diverse physical locations.'' This is the dataset
    released as cup_in_the_wild.zarr.zip. Re-verified 2026-07-13: unchanged, matches
    num_subjects=3/num_scenes=30 newly filled from the same paper sentence.'
  paper_url: 'New field, filled. https://arxiv.org/abs/2402.10329 (Cheng Chi et al.,
    ''Universal Manipulation Interface: In-The-Wild Robot Teaching Without In-The-Wild
    Robots'') is the paper linked from the official project page''s [Paper] button
    and cited throughout this config as arXiv:2402.10329.'
  is_multi_embodiment: New field, filled false. The one publicly released, downloadable
    dataset (cup_in_the_wild.zarr.zip, real.stanford.edu/umi/data/zarr_datasets/)
    was collected entirely with the hand-held UMI gripper as a single proxy embodiment
    (arXiv:2402.10329 Sec VI); README's 'up to 2 arms' and multi-robot deployment
    (UR5e/Franka/ARX X5) describe the general framework's flexibility at inference
    time, not multiple embodiments present in this released data.
  hand_pose_representation: New field, filled none. gripper_type is parallel_jaw (a
    simple trigger-actuated 2-finger gripper, not a dexterous multi-finger hand or
    bare-hand MANO/keypoint tracking target); matches convention used for other parallel_jaw
    datasets (e.g. bridgedata_v2, droid, aloha_unleashed).
  has_synchronized_multiview_rig: 'New field, filled false. arXiv:2402.10329 Sec III.A
    / GitHub README: the released cup-arrangement data uses exactly one GoPro per
    gripper (num_camera_views=1); no synchronized multi-camera rig is used for this
    released dataset (bimanual tasks with 2 cameras were demonstrated in the paper
    but not released as downloadable data -- see num_task_types note).'
  action_frame: 'Newly fillable now that ActionFrame.RELATIVE_TRAJECTORY exists in
    schema.py (previously left blank with a suggested_new_enum_values note, now resolved).
    arXiv:2402.10329 Fig 6: ''Relative trajectory, used by UMI, is a sequence of end-effector
    (EE) poses relative to the SAME current EE pose for each inference step.'' Confirmed
    also by diffusion_policy/config/task/umi.yaml pose_repr.action_pose_repr: relative.'
  num_subjects: 'New field, filled 3. arXiv:2402.10329 Sec VI: ''Within 12 person-hours,
    3 demonstrators collected 1400 demonstrations for the cup arrangement task across
    30 diverse physical locations'' -- this is the same 1400-episode in-the-wild dataset
    already recorded as expected_num_episodes.'
  num_scenes: 'New field, filled 30. arXiv:2402.10329 Sec VI, same sentence as num_subjects:
    ''...across 30 diverse physical locations, including homes, offices, restaurants,
    and outdoor environments.'''
  num_objects: 'New field, filled 15, with a caveat for human review. arXiv:2402.10329
    Sec VI: ''The demonstrations involved 15 espresso cups of different colors, shapes
    (cylindrical and tapered), and materials (ceramic, glass, and metal).'' NOTE:
    Appendix Fig. A2 caption states ''we purchased 20 different styles of espresso
    cup with saucer on Amazon, of which 18 are used for training and 2 are reserved
    for testing'' -- a discrepancy with the main-text figure of 15 that the paper
    itself does not reconcile. 15 is used here since it is stated directly in the
    same paragraph as the 1400-episode/3-demonstrator/30-location figures already
    used elsewhere in this config; flagged as an open contradiction in the source
    paper.'
  expected_duration_hours: Checked, left blank. arXiv:2402.10329 Sec VI states '12
    person-hours' for the 1400-demonstration collection, but this is aggregate demonstrator
    labor-time (3 people working in parallel), not the total recorded video/episode
    duration -- the two are not interchangeable (c.f. calvin.yaml/dobb_e.yaml precedent,
    which use directly-stated total-recording-time figures). No per-episode or total
    footage duration figure was found in the paper, README, or dataset page.
  dof_per_arm: Checked, left blank. arXiv:2402.10329 Fig 1 / abstract note policies
    are 'transferable to different robot embodiments (e.g. 6DoF or 7DoF robot arms)'
    -- the released data's action space is an abstracted 10-dim eef_pose (already
    captured in action_dim/state_dim), and no single dof_per_arm value would be representative
    since the collection device (hand-held gripper) has no robot arm at all and downstream
    deployment arms vary (UR5e is 6DoF, some Franka/ARX setups are 7DoF).
  additional_modalities: 'No modalities beyond RGB video and eef/gripper pose found.
    Checked against diffusion_policy/config/task/umi.yaml shape_meta.obs (camera0_rgb,
    robot0_eef_pos, robot0_eef_rot_axis_angle, robot0_gripper_width only). Note: the
    GoPro''s built-in IMU (accelerometer/gyroscope) is used internally by the SLAM
    pipeline for action recovery (arXiv:2402.10329 Sec III.A, HD4) but is not exposed
    as a stored observation channel in the released dataset schema, so it is not counted
    here -- and SensorModality has no IMU option regardless (force_torque/tactile/audio/eye_gaze
    only), so left empty rather than forced into a suggested_new_enum_values entry
    for a modality that isn''t actually exposed in the data.'
  release_type: 'fixed_episode_dataset: the released artifact is a single fixed zarr
    dataset, not a generation framework, scene platform, or RL benchmark env. Re-verified
    2026-07-13: unchanged, confirmed via real.stanford.edu/umi/data/ directory listing
    showing only static pre-recorded files (zarr_datasets/, pretrained_models/, example_demo_session/),
    no code-driven generation.'
  secondary_collection_methods: 'Checked, none apply. Re-verified 2026-07-13: the
    released dataset is collected exclusively via the hand-held UMI gripper; no secondary
    CollectionMethod enum value applies.'
suggested_new_enum_values: {}
