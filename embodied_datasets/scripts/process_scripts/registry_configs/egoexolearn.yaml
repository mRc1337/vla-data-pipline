field_sources:
  paper_url: CVPR 2024 paper page confirmed via https://arxiv.org/abs/2403.16182 (also
    linked from the GitHub README arxiv badge and the project homepage "Paper" link)
  source_url: Re-verified 2026-07-10 by curling https://egoexolearn.github.io/ directly
    (HTTP 200, matches GitHub README project-page badge) - official project homepage,
    unchanged from prior pass
  license: 'Re-verified 2026-07-10 by fetching https://raw.githubusercontent.com/OpenGVLab/EgoExoLearn/main/LICENSE
    directly (HTTP 200, body begins ''MIT License / Copyright (c) 2024 OpenGVLab'')
    and https://huggingface.co/api/datasets/hyf015/EgoExoLearn (cardData.license:
    "mit"). No separate non-commercial/custom terms found on either the HF card or
    GitHub repo. Confirmed unchanged: MIT'
  raw_format: Re-verified 2026-07-10 against https://raw.githubusercontent.com/OpenGVLab/EgoExoLearn/main/README.md
    (Data access section - 320p mp4 videos via Google Drive/BaiduYun/HuggingFace,
    processed gaze .npy files, CLIP/I3D feature files) plus JSON/text annotation files
    in ./annotations/ - custom directory of MP4 videos + JSON/CSV annotations + .npy
    gaze arrays, not RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord/VRS. Confirmed unchanged
    (Custom)
  release_type: Re-derived 2026-07-10 - EgoExoLearn is a fixed, versioned collection
    of 747 pre-recorded video sequences (432 ego + 315 exo) with static annotation
    files distributed via Google Drive/BaiduYun/HuggingFace; it is not a simulation/generation
    framework, a scene/asset platform, or an RL benchmark environment, so 'fixed_episode_dataset'
    is correct (arXiv:2403.16182 Section 3.1; GitHub README Data access section)
  collection_method: Re-verified 2026-07-10 via arXiv:2403.16182 PDF (pdftotext extraction)
    p.2 'Data collection procedure' - 'one [participant] wears the... Pupil Invisible
    Glasses, complete[s] the gaze calibration' before recording egocentric task videos;
    matches 'egocentric_human' directly. Confirmed unchanged
  embodiment_class: Re-verified 2026-07-10 via arXiv:2403.16182 abstract/Section 3
    (PDF text) - human video dataset (camera wearer's hands/body performing procedural
    tasks), not a robot; no MANO/skeleton/hand-pose annotations found anywhere in
    the PDF (grepped 'calibrat', found only gaze calibration, no hand-pose pipeline),
    so 'human_hand' remains the closest available enum value, consistent with ego4d.yaml/ego_exo4d.yaml
    precedent. Confirmed unchanged
  gripper_type: Re-verified 2026-07-10 - dataset captures bare human hands performing
    daily/lab tasks with no mechanical end-effector and no hand-pose/MANO annotation
    pipeline (confirmed absent via full-text search of arXiv:2403.16182 PDF); 'none'
    applies. Confirmed unchanged
  hand_pose_representation: 'New field, filled 2026-07-10: full-text search of arXiv:2403.16182
    PDF found no MANO fits, no 3D keypoint annotations, and no joint-angle data for
    hands/fingers anywhere in the paper or supplementary (only body-level task/gaze/language
    annotations exist) - therefore ''none'' applies, the same absence-of-data basis
    used for gripper_type'
  fps: 'Re-verified 2026-07-10 via arXiv:2403.16182 PDF (pdftotext) p.2: ''All videos
    are converted to a constant frame rate of 25fps to ensure uniformity and consistency
    in our dataset.'' Confirmed unchanged'
  fps_variable: Re-verified 2026-07-10 - same source as fps; the paper explicitly
    states original capture had variable frame rates (device overheating issues) but
    all released videos are post-processed/normalized to a single constant 25fps,
    so fps_variable is false for the released dataset. Confirmed unchanged
  camera_views: 'Re-verified 2026-07-10 via arXiv:2403.16182 PDF (pdftotext) - egocentric
    videos recorded via head-mounted Pupil Invisible Glasses (head); exocentric demonstration
    videos are third-person videos, either curated from YouTube for daily tasks or
    filmed by senior lab members for lab tasks (third_person). Confirmed via full-text
    search for ''synchron'' that the two views are NOT time-synchronized (paper title/abstract:
    ''Bridging Asynchronous Ego- and Exo-centric View''). Confirmed unchanged'
  has_synchronized_multiview_rig: 'New field, filled 2026-07-10: false. The paper''s
    title and abstract explicitly frame the dataset around ASYNCHRONOUS ego/exo pairing
    - egocentric videos are recorded by participants at a different time/place than
    the exocentric demonstration video they followed (which for daily tasks is often
    pre-existing third-party YouTube footage, not filmed by the research team at all).
    There is no synchronized multi-camera rig (arXiv:2403.16182 title + abstract;
    Section 3.1)'
  has_camera_calibration: Re-verified 2026-07-10 via arXiv:2403.16182 PDF full-text
    search for 'calibrat' - the only calibration described is *gaze* calibration for
    the Pupil Invisible eye-tracker ('complete the gaze calibration', 're-do the gaze
    calibration'); no camera intrinsics/extrinsics are published, and exocentric demonstration
    videos are largely third-party YouTube footage with no controlled camera setup.
    Confirmed unchanged (false)
  depth_coverage: Re-verified 2026-07-10 - full-text search of arXiv:2403.16182 PDF
    and GitHub README found no mention of any depth sensor or depth data (only RGB
    video + gaze + language annotations). Confirmed unchanged (none)
  additional_modalities: 'New field, filled 2026-07-10 with [eye_gaze]: arXiv:2403.16182
    abstract ''we record high-quality gaze data''; PDF p.2 ''one [participant] wears
    the Pupil Invisible Glasses, complete[s] the gaze calibration... to ensure gaze
    data fidelity''; GitHub README ''Gaze (processed, npy)'' download option and ''we
    pioneeringly explore the role of gaze in these tasks.'' Full-text search for ''audio''
    in the PDF found only an unrelated citation to a different paper (Epic-Fusion
    audio-visual) - no audio modality is actually recorded/released for this dataset,
    so audio is correctly omitted'
  has_language_instruction: Re-verified 2026-07-10 via arXiv:2403.16182 PDF Section
    3.2 'Annotation' - dataset provides coarse-level (39 categories) and fine-level
    (95 verb / 254 noun categories for ego) manually-annotated, timestamped natural-language
    descriptions per video segment. Confirmed unchanged (true)
  num_task_types: Re-verified 2026-07-10 via arXiv:2403.16182 PDF supplementary S7.4
    'Our dataset is collected for 5 types of daily tasks and three types of specialized
    laboratory tasks' and 'Table S15 shows the names of the 8 tasks' (5 daily + 3
    lab = 8). Confirmed unchanged (8)
  urdf_available: Re-verified 2026-07-10 - no robot hardware of any kind is used or
    described anywhere in arXiv:2403.16182 or https://github.com/OpenGVLab/EgoExoLearn
    (purely human video + gaze + language) - therefore no URDF exists. Confirmed unchanged
  urdf_source: Same basis as urdf_available - no robot/URDF applicable to this human-video
    dataset. Confirmed unchanged (not_found)
  expected_size_gb: 'CORRECTED 2026-07-10 from 142.0 to 142.7: prior value was eyeballed
    from the HF ''Files and versions'' UI rounding to ''142 GB''. Independently queried
    the HuggingFace Hub API directly (https://huggingface.co/api/datasets/hyf015/EgoExoLearn?expand[]=usedStorage)
    which returns the exact byte count usedStorage=142677070847 bytes = 142.68 GB
    (decimal), rounded to 142.7. Per the GitHub README this HuggingFace mirror hosts
    the full-size original videos (''The original size videos can now be found at
    the huggingface repo'')'
  expected_num_episodes: 'Re-verified 2026-07-10 via arXiv:2403.16182 PDF Section
    3.1: ''EgoExoLearn contains 432 egocentric videos totaling 96.5 hours and 315
    demonstration videos spanning 23.5 hours.'' Used the 432 egocentric task-execution
    videos as the episode count (each is one participant''s continuous attempt at
    performing a task); the dataset additionally includes 315 separate exocentric
    reference/demonstration videos (curated from YouTube or filmed by lab members)
    which are not counted as episodes since they are reference material rather than
    task-execution recordings - a reviewer may prefer the combined total of 747 videos
    instead. Confirmed unchanged: 432'
  expected_duration_hours: 'New field, filled 2026-07-10 with 96.5 (kept consistent
    with the 432-egocentric-video episode count above): arXiv:2403.16182 Section 3.1
    ''EgoExoLearn contains 432 egocentric videos totaling 96.5 hours...''. Note the
    dataset''s combined total (ego+exo) is 120 hours per the abstract/GitHub README
    (''spanning 120 hours''); 96.5h was chosen to match the episode-counting convention
    already used for expected_num_episodes (ego videos only)'
  num_scenes: 'New field, filled 2026-07-10 with 7: arXiv:2403.16182 PDF Section 3.1
    ''Scenarios and tasks'' paragraph: ''We record egocentric videos in 4 different
    kitchens and 3 different labs.'' (4 kitchens + 3 labs = 7 distinct recording locations)'
  num_objects: 'New field, filled 2026-07-10 with 254 (approximate, proxy value):
    arXiv:2403.16182 PDF Table 1 (Section 4.1, dataset statistics comparison) lists
    ''# noun classes'' = 254 for the ''Ours-ego'' row (fine-level noun/object categories
    annotated for the egocentric videos); the ''Ours-exo'' row reports a close but
    distinct 251 noun classes for the exocentric videos. Noun categories in this HOI-style
    egocentric annotation scheme denote the distinct objects manipulated/referenced
    in fine-level action labels (analogous to how EPIC-KITCHENS reports ''noun classes''),
    so this is used as the best available proxy for num_objects - flagged as an interpretive
    mapping rather than a field explicitly labelled ''object count'' in the paper'
  is_multi_embodiment: 'New field, filled 2026-07-10 with false: every recording in
    the dataset (all 432 egocentric + 315 exocentric videos) involves the same embodiment
    type (bare human hands/body, no robot, no mixed human+robot data) - arXiv:2403.16182
    throughout; confirmed no robot embodiment appears anywhere in the dataset'
  secondary_collection_methods: 'Left as empty list 2026-07-10 after re-check: the
    432 egocentric videos are collection_method=egocentric_human, but the paired 315
    exocentric demonstration videos have two distinct sub-sources per arXiv:2403.16182
    Section 3.1 - (a) daily-task demos ''curated from online video platforms such
    as YouTube'' (pre-existing internet footage, not actively collected by the research
    team) and (b) lab-task demos that are ''tutorials recorded by senior lab members.''
    Neither of these matches any existing CollectionMethod enum value (teleop/autonomous_policy/umi/egocentric_human/simulation/human_to_robot_synthesis/ar_haptic_guided_synthesis/scene_asset_curation),
    so left blank rather than mis-mapped; see suggested_new_enum_values'
suggested_new_enum_values:
  secondary_collection_methods: Consider adding a CollectionMethod value such as 'web_video_curation'
    (or 'third_person_demonstration_video') to cover datasets like EgoExoLearn where
    a portion of the released video data (its 315 exocentric demonstration videos)
    is either curated from pre-existing internet footage (YouTube) or filmed as third-person
    tutorials by lab members, rather than collected via any teleop/autonomous/simulation/synthesis
    pipeline currently in the enum
