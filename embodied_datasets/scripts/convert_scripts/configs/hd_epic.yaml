field_sources:
  source_url: https://hd-epic.github.io/ -- re-verified live via curl (2026-07-10);
    the root URL now redirects to a shared "Egocentric Datasets & Benchmarks" landing
    page, with the actual HD-EPIC content moved to https://hd-epic.github.io/site.
    Kept source_url as the canonical root since that is the dataset's stable public
    identifier.
  paper_url: 'https://arxiv.org/abs/2502.04144 -- "HD-EPIC: A Highly-Detailed Egocentric
    Video Dataset" (Perrett, Darkhalil, Sinha, et al., CVPR 2025). Field was blank
    in the prior pass; newly filled.'
  license: 're-verified https://hd-epic.github.io/site ''Copyright'' section: ''All
    datasets and benchmarks on this page are copyright by us and published under the
    Creative Commons Attribution-NonCommercial 4.0 International License.'' Unchanged
    from prior pass.'
  raw_format: 'CORRECTED from "Custom" to "VRS": schema.py RawFormat enum now includes
    an explicit VRS member (not available when the prior pass classified this as Custom).
    https://hd-epic.github.io/site Download section lists raw Project Aria VRS sensor
    files (1.9TB) as the largest/primary download component, and arXiv:2502.04144
    Supp. B.1 confirms capture was done natively on Project Aria devices which record
    in VRS. The released mp4/HDF5/pkl/csv/json files are downstream post-processed
    derivatives of this VRS raw capture (paper Supp. B.1: "We post-process VRS files,
    converting videos to mp4..."), so VRS is now the closest exact-enum match for
    the primary raw capture container, consistent with the same correction already
    applied to the sibling Aria-based config hot3d.yaml in this
    registry.'
  release_type: 'arXiv:2502.04144 Supp. B.2: fixed set of 156 pre-recorded, annotated
    videos released as a static download (not a simulation/generation framework, scene-asset
    platform, or RL benchmark environment) -> fixed_episode_dataset. Newly filled.'
  collection_method: 're-verified arXiv:2502.04144 Sec.3: unscripted egocentric video
    recorded by human participants wearing Project Aria glasses (no robot) -> egocentric_human.
    Unchanged from prior pass.'
  secondary_collection_methods: re-checked arXiv:2502.04144 full text and https://hd-epic.github.io/site
    -- the only capture pipeline described is the single egocentric Project Aria device
    worn by participants; no teleop, simulation, or synthesis pipeline is used. Left
    empty (unchanged).
  is_multi_embodiment: 'arXiv:2502.04144 Sec.3/B.1: dataset is built around a single
    embodiment (bare human hands, captured via a head-worn Project Aria device); no
    robot or secondary embodiment type is captured or discussed anywhere in the paper
    or site. Field was blank in the prior pass; newly filled as false.'
  embodiment_class: re-verified arXiv:2502.04144 Sec.4.2 (7.7M hand masks for both
    hands) / https://hd-epic.github.io/site -- no robot embodiment; annotations are
    of human hand interactions -> human_hand. Unchanged from prior pass.
  num_arms: re-verified 'hands' column tracked in HD_EPIC_Narrations.pkl (hd-epic-annotations
    GitHub README) and 7.7M hand masks covering both hands (arXiv:2502.04144 Sec.4.2
    "7.7M total hand masks, 3.9M right...") -> 2. Unchanged from prior pass.
  hand_pose_representation: arXiv:2502.04144 Sec.4.2 ("Hand Masks") describes only
    2D/3D pixel-level hand segmentation masks (via automatic segmentation + manual
    correction); no MANO fit, 3D keypoint skeleton, or joint-angle parameterization
    of hand pose is produced or released anywhere in the paper or site. Field was
    blank in the prior pass; newly filled as none (no parametric hand-pose representation
    exists, only masks), matching the same none value used for gripper_type on this
    bare-hand dataset.
  gripper_type: No gripper; human hands only (no robot end-effector) -> none, per
    task instructions for non-robot fields. Unchanged from prior pass.
  fps: 're-verified arXiv:2502.04144 Supp. B.1/B.2: "We used Profile 28 -- 1408x1408
    resolution 30 FPS RGB footage, 60 FPS eye tracking, 30 FPS SLAM." The released/annotated
    RGB video stream is 30 FPS. Unchanged from prior pass.'
  fps_variable: Same source as fps -- 30 FPS RGB capture stated explicitly (Profile
    28) as a fixed rate; no mention of variable frame rate for the released video.
    Unchanged from prior pass.
  num_camera_views: 're-verified arXiv:2502.04144 Supp. B.1: Project Aria glasses
    are "a multi-sensor platform with 3 forward cameras (1 RGB and 2 SLAM), 7 microphones
    and inward cameras for gaze estimation." The 3 forward/scene-facing cameras map
    to num_camera_views=3; the inward gaze cameras and microphone array are captured
    separately under additional_modalities (eye_gaze, audio) rather than counted as
    scene camera views. Unchanged from prior pass.'
  camera_views: Head-mounted egocentric device (Project Aria glasses); all 3 forward
    cameras are co-located on the same head-worn unit -> head. Unchanged from prior
    pass.
  has_synchronized_multiview_rig: 'No evidence of an external synchronized multi-viewpoint
    rig (e.g. combined third-person + wrist/head cameras from separate devices): the
    only capture hardware is a single head-worn Project Aria unit whose 3 forward
    cameras exist for onboard SLAM/RGB purposes, not independent multi-view coverage
    of the workspace. Field was blank in the prior pass; newly filled as false, consistent
    with the same false value used for the sibling single-Aria-device config
    epic_kitchens_100.yaml.'
  has_camera_calibration: 're-verified https://hd-epic.github.io/site News (Jan 2026)
    + hd-epic-annotations GitHub README: "Per-video static device calibration (cameras
    and sensors), including sensor to device transforms" released as new intermediate
    data -> true. Unchanged from prior pass.'
  depth_coverage: 're-verified arXiv:2502.04144 Sec.4.3 ("Masks to 3D"): "We lift
    object masks to 3D using dense depth estimates and 2D-to-3D sparse correspondences
    provided by MPS." This monocular-estimated depth is used only to lift the ~37K
    annotated object masks to 3D, and is not released as a full per-frame depth-map
    channel for the entire video corpus (the Jan 2026 "intermediate data" release
    covers device calibration, pose, and gaze only, not depth maps) -> partial. Unchanged
    from prior pass.'
  additional_modalities: 'CORRECTED from [] (empty) to [audio, eye_gaze]. arXiv:2502.04144
    Supp. B.1: Project Aria device has "7 microphones and inward cameras for gaze
    estimation"; the paper collects "51K audio events" via dedicated sound annotations
    (Sec.4.2) and the site''s Download section lists a distinct "Audio-HDF5: 27GB"
    package, confirming audio is a released modality. The site News section (May 2025:
    "Eye-Gaze Priming data has now been released!") and the Jan 2026 intermediate-data
    release ("per-frame gaze centre (image space) and 3D gaze direction (world space)")
    confirm eye-gaze is also a released modality, packaged as part of "SLAM-and-Gaze:
    349GB". Both map to SensorModality enum values (audio, eye_gaze); the empty list
    in the prior pass was an oversight.'
  has_language_instruction: 're-verified arXiv:2502.04144 abstract/Sec.4.1: 59,454
    dense fine-grained action narrations plus recipe steps provide language descriptions
    of activity -> true. Unchanged from prior pass.'
  urdf_available: No robot embodiment in this dataset -> false. Unchanged from prior
    pass.
  urdf_source: same basis as urdf_available -- not_found (no robot/URDF exists for
    this bare-hand egocentric dataset). Field was blank in the prior pass; newly filled,
    consistent with the same not_found value used on the sibling human_hand config
    epic_kitchens_100.yaml.
  expected_size_gb: 're-verified https://hd-epic.github.io/site Download section lists
    component sizes: Audio-HDF5 27GB + Digital-Twin 1.35GB + Hands-Masks 1.95GB +
    SLAM-and-Gaze 349GB + VRS 1.9TB(1900GB) + Videos(mp4) 115.5GB; summed = 2394.8GB
    total (independently recomputed and confirmed exact match). VRS raw sensor files
    are the bulk and are optional/skippable per the site (an OneDrive alternate download
    link without VRS files exists). Unchanged from prior pass.'
  expected_num_episodes: 're-verified arXiv:2502.04144 Supp. B.2: "we collected a
    total of 156 videos, with an average length of 15.9 (+/-14.5) mins... totalling
    41.3 hours (4.46M frames)". Unchanged from prior pass.'
  expected_duration_hours: 'arXiv:2502.04144 Supp. B.2: "we collected 41.3 hours (4.46M
    frames) of footage from 9 participants" (also stated in the abstract as "41 hours
    of video"). Field was blank in the prior pass; newly filled as 41.3 (the more
    precise supplementary figure).'
  num_subjects: 'arXiv:2502.04144 Supp. B.2 (exact quote): "we collected 41.3 hours
    (4.46M frames) of footage from 9 participants." Field was blank in the prior pass;
    newly filled as 9.'
  num_scenes: 'arXiv:2502.04144 abstract: "HD-EPIC is 41 hours of video in 9 kitchens
    with digital twins of 413 kitchen fixtures..." -- one kitchen per participant
    (9 participants, 9 kitchens). Field was blank in the prior pass; newly filled
    as 9.'
  num_objects: 'Investigated but left blank: arXiv:2502.04144 reports annotation-event
    counts (e.g. "20K object movements", "37K object masks", "19.9K object movement
    tracks") but never a single stated count of distinct/unique objects or object
    classes. Sec.C.2.3 states HD-EPIC extends EPIC-KITCHENS-100''s existing verb/noun
    clusters by adding "9 new verb clusters and 3 new noun clusters", which would
    require assuming EPIC-KITCHENS-100''s exact baseline (300 noun classes, itself
    an EPIC-KITCHENS-100-specific figure) to derive a total -- this is an uncertain
    computed figure, not a verbatim stated count, so left blank rather than fabricated.'
  num_task_types: 'Investigated but left blank: no discrete "task type" taxonomy (analogous
    to e.g. hot3d''s 4 scenario categories) is defined for HD-EPIC. The 69 recipes
    (arXiv:2502.04144 abstract) are the closest candidate but represent free-form
    participant-chosen recipes rather than a fixed enumerated task-type set, so left
    blank rather than approximated.'
suggested_new_enum_values: {}
