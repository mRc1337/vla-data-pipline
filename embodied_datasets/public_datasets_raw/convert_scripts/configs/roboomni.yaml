id: roboomni
name: RoboOmni
source_url: https://huggingface.co/datasets/OpenMOSS-Team/OmniAction
paper_url: https://arxiv.org/abs/2510.23763
license: CC-BY-NC-4.0
raw_format: RLDS
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods:
