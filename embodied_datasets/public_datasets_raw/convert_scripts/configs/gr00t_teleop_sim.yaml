id: gr00t_teleop_sim
name: GR00T Teleop Sim
source_url: https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-GR00T-Teleop-Sim
license: CC-BY-NC-4.0
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: humanoid
robot_platform: other
num_arms: 2
gripper_type: dexterous_hand
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 44
action_dim: 44
fps: 20.0
fps_variable: false
num_camera_views: 1
camera_views:
- head
depth_coverage: none
additional_modalities: []
has_language_instruction: true
num_task_types: 24
expected_size_gb: 14.0
expected_num_episodes: 24000
review_status: pending_human_review
field_sources:
  source_url: 'Stub had no usable source_url; corrected to the official Hugging Face
    dataset page https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-GR00T-Teleop-Sim
    (found via HF datasets API search for nvidia org + ''teleop'': https://huggingface.co/api/datasets?search=teleop&author=nvidia).
    This is the ''Simulation GR1 Tabletop Task 1K Dataset'', linked from NVIDIA''s
    Isaac-GR00T GitHub repo (https://github.com/NVIDIA/Isaac-GR00T) as one of the
    post-training/PhysicalAI datasets.'
  license: 'Dataset card metadata (`license: cc-by-nc-4.0`) and README.md section
    ''License/Terms of Use'': ''This dataset is licensed under the Creative Commons
    Attribution-NonCommercial 4.0 International License (CC BY-NC 4.0)'' -- https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-GR00T-Teleop-Sim/raw/main/README.md'
  raw_format: 'README.md ''Dataset Format'' section: ''HDF5 format and LeRobot-style
    dataset''; repo file listing confirms 24 top-level HDF5/*.hdf5 files plus a parallel
    LeRobot/ directory of per-task LeRobot v2.0 datasets (parquet+mp4). Chose HDF5
    as the recorded raw_format since it is the native/original per-task capture format;
    the LeRobot-style copy is a converted mirror also shipped in the same repo.'
  collection_method: 'README.md ''Dataset Characterization'' section: ''Data Collection
    Method: [Human Teleoperation in Simulation]'' -- human teleoperation performed
    inside a simulator, closest enum match is teleop.'
  embodiment_class: 'README.md Dataset Description: ''...trajectories in simulation
    using the GR1 robot with upper body control...equipped with simulated Fourier
    hands.'' GR1 is Fourier Intelligence''s full humanoid platform -> humanoid.'
  robot_platform: GR1 (Fourier Intelligence humanoid) is not present in the given
    robot_platform enum list; mapped to 'other' and flagged in suggested_new_enum_values.
  num_arms: 'README.md: ''upper body control'' with ''44 dim of vectorized state (joint
    positions of upper body + waist)'' on a humanoid platform -> two manipulation
    arms (bimanual upper body).'
  gripper_type: 'README.md Dataset Description: ''The robot is equipped with simulated
    Fourier hands'' -- multi-fingered dexterous end effectors, not parallel grippers.'
  has_mobile_base: README.md describes only 'upper body control' for tabletop manipulation
    tasks; no leg/base locomotion or mobility is mentioned, consistent with a stationary
    humanoid torso setup for tabletop tasks.
  action_space: 'README.md ''Modality'' section: ''Action: 44 dim of vectorized action
    (joint positions of upper body + waist)'' -- joint-space position control.'
  action_frame: README.md 'Modality' section describes the action explicitly as 'joint
    positions' (not deltas), consistent with absolute joint-position targets.
  rotation_representation: 'README.md ''Modality'' section: both observation and action
    are joint-position vectors (upper body + waist), not end-effector Cartesian/orientation
    representations, so no rotation representation is used.'
  state_dim: 'README.md ''Modality'' section: ''Observation: 44 dim of vectorized
    state (joint positions of upper body + waist)''.'
  action_dim: 'README.md ''Modality'' section: ''Action: 44 dim of vectorized action
    (joint positions of upper body + waist)''.'
  fps: 'README.md ''Modality'' section: ''Video: RGB video, 256x256 resolution (cropped
    and padded; original resolution is 51x320), 20 fps''; confirmed by LeRobot meta/info.json
    for gr1_unified.PnPBottleToCabinetClose showing ''fps'': 20.0.'
  fps_variable: All tasks share the same 20 fps capture rate per README.md and the
    LeRobot meta/info.json for the sampled task; no per-task rate variation is mentioned.
  num_camera_views: LeRobot meta/info.json 'features' block lists a single video feature
    key, 'observation.images.ego_view', matching README's description of 'a virtual
    camera' (singular).
  camera_views: LeRobot meta/info.json feature key 'observation.images.ego_view' --
    an egocentric camera fixed to/aligned with the humanoid's own head/torso viewpoint
    looking at the tabletop workspace, mapped to the 'head' enum value.
  depth_coverage: README.md 'Modality' section only mentions RGB video observations
    ('uses RGB observations with a virtual camera'); no depth channel or depth key
    is listed in the LeRobot meta/info.json features.
  has_language_instruction: README.md 'Modality' section explicitly gives 'Language
    Instruction Example' entries, e.g. 'pick up the bottled water, place it into the
    cabinet and close the cabinet'.
  num_task_types: 'README.md ''Dataset Quantification'': ''1000 teleoperation trajectories
    for each of the 24 tabletop tasks''; confirmed by the repo''s HDF5/ directory
    containing exactly 24 distinct task .hdf5 files.'
  expected_size_gb: 'README.md ''Dataset Quantification'': ''Total data storage (HDF5
    format): ~14GB'' (the LeRobot-style mirror of the same data is ~39GB, recorded
    here as 14GB to match the chosen HDF5 raw_format).'
  expected_num_episodes: 'README.md ''Dataset Quantification'': ''1000 teleoperation
    trajectories for each of the 24 tabletop tasks'' -> 1000 x 24 = 24000; cross-checked
    against LeRobot meta/info.json for one task showing total_episodes: 1000.'
suggested_new_enum_values:
  robot_platform: 'Add ''fourier_gr1'' (Fourier Intelligence GR1 humanoid). This dataset
    (and NVIDIA''s related PhysicalAI-Robotics-GR00T-* datasets: GR00T-Teleop-GR1,
    GR00T-GR1, GR00T-Tuned-Tasks) all use the GR1 humanoid platform, which currently
    has no dedicated enum value and had to be recorded as ''other''.'
