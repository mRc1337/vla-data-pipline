field_sources:
  source_url: 'RE-VERIFIED 2026-07-10, unchanged: https://ego-exo4d-data.org/ official
    project homepage.'
  paper_url: 'NEW FIELD, filled: https://arxiv.org/abs/2311.18259 (arXiv:2311.18259v4)
    - K. Grauman et al., "Ego-Exo4D: Understanding Skilled Human Activity from First-
    and Third-Person Perspectives", also published at CVPR 2024 and as a 2025 IJCV
    journal version; linked from the homepage Q&A section ("For further detailed information
    refer to our manuscript... ArXiv paper").'
  license: 'RE-VERIFIED 2026-07-10, unchanged: https://docs.ego-exo4d-data.org/getting-started/
    - "you must first review and accept the terms of our license agreement... covers
    the use of the dataset for research purposes and commercial use, along with restrictions
    on redistribution... There are no fees associated with using the dataset" via
    ego4d.dev/request/ego-exo4d, approval takes ~48h, credentials expire in 14 days.
    Confirmed this is a bespoke, signature-gated EULA, not any of MIT/Apache/BSD/CC-*/GPL/Proprietary/Unknown,
    so left blank and kept in suggested_new_enum_values.'
  raw_format: 'RE-VERIFIED 2026-07-10, unchanged: https://docs.ego-exo4d-data.org/data/takes/
    and /overview/ - per-take data is frame-aligned per-camera MP4 (GoPro, H264) files,
    trimmed Aria VRS files (image streams + IMU + audio), plus JSON/CSV metadata and
    annotation files (confirmed exact JSON schemas via /annotations/ego_pose/, /annotations/relations/,
    /annotations/keystep/). NOTE: schema.py now has an explicit RawFormat.VRS enum
    value (used by the sibling hot3d.yaml, which is pure-VRS), but Ego-Exo4D''s take-level
    video is majority plain MP4 with VRS only for the single Aria stream, so the mixed-format
    Custom classification is kept rather than switched to VRS.'
  release_type: 'RE-VERIFIED 2026-07-10, unchanged: fixed set of 5035 pre-recorded/released
    takes (docs.ego-exo4d-data.org/overview/, ego-exo4d-data.org stats table), not
    a generator/framework/scene-platform/RL-env - fits fixed_episode_dataset.'
  collection_method: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2311.18259 abstract
    - "Ego-Exo4D centers around simultaneously-captured egocentric and exocentric
    video of skilled human activities" recorded by human participants wearing Aria
    glasses (no robot/teleop involved). As with the sibling assembly101.yaml, no existing
    CollectionMethod enum value captures the synchronized ego+exo half jointly, so
    egocentric_human is kept as the closest available label (see suggested_new_enum_values).'
  secondary_collection_methods: 'RE-VERIFIED 2026-07-10: no other CollectionMethod
    enum (teleop/autonomous_policy/umi/simulation/human_to_robot_synthesis/ar_haptic_guided_synthesis/scene_asset_curation)
    applies to this human-only, camera-only capture; left empty.'
  is_multi_embodiment: 'NEW FIELD, filled false: arXiv:2311.18259 and docs.ego-exo4d-data.org/overview/
    - all 740 participants are recorded with the same embodiment (bare human hands/body,
    embodiment_class=human_hand); no robot or alternate embodiment variant of this
    dataset was found on the project site, docs site, or GitHub (github.com/EGO4D).'
  embodiment_class: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    - dataset records the camera wearer''s (human participant''s) hands/body performing
    skilled activities; no robot embodiment. 3D/2D hand-joint annotations (EgoPose)
    are consistent with human_hand.'
  num_arms: 'NEW FIELD, filled 2: https://docs.ego-exo4d-data.org/annotations/ego_pose/
    - hand annotations cover "42 [joints] in total, 21 for left hand, 21 for right
    hand" i.e. both hands/arms of the camera wearer are tracked in every take.'
  gripper_type: 'NEW FIELD, filled none: no robot gripper is present; task performed
    with bare human hands (docs.ego-exo4d-data.org/overview/, arXiv:2311.18259). Following
    the same convention as the most-recently re-verified sibling bare-hand datasets
    (assembly101.yaml, hot3d.yaml, hoi4d.yaml, egoexolearn.yaml all use none). NOTE:
    sibling h2o.yaml instead used dexterous_hand for an analogous 21-keypoint/2-hand
    bare-hand-tracking case - this is a registry-wide convention inconsistency, not
    a fact about Ego-Exo4D itself; flagging for human reconciliation.'
  hand_pose_representation: 'NEW FIELD, filled keypoints_3d: https://docs.ego-exo4d-data.org/annotations/ego_pose/
    - EgoPose annotation3D provides per-joint (x,y,z) 3D keypoint coordinates for
    21 named joints per hand x 2 hands (e.g. left_thumb_1..4, right_index_1..4, etc.),
    not MANO parameters and not joint angles - matches keypoints_3d exactly, same
    representation/reasoning as sibling assembly101.yaml.'
  has_mobile_base: 'NEW FIELD, filled false: the camera wearer is a walking human,
    not a robot with an actuated mobile base; docs.ego-exo4d-data.org/overview/ describes
    only wearable (Aria) and stationary (GoPro) recording devices, no robot base.
    Same reasoning/convention as sibling human-hand datasets (assembly101, h2o, egodex).'
  fps_variable: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    - "Video: 4k@60FPS (MP4) for GoPro devices and 1404x1404@30FPS (VRS) for Aria
    devices" - frame rate differs by camera type, so fps is left blank and fps_variable=true.'
  camera_views: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    ("One Aria glass... 4-5 GoPro RGB camera") and ego-exo4d-data.org homepage ("The
    ego camera is calibrated and time-synchronized with 4-5 (stationary) GoPros as
    the exo capture devices") - one head-mounted Aria egocentric camera (head) plus
    4-5 stationary third-person GoPro cameras (third_person) per take.'
  has_synchronized_multiview_rig: 'NEW FIELD, filled true: arXiv:2311.18259 abstract
    - "simultaneously-captured egocentric and exocentric video"; ego-exo4d-data.org
    homepage - "Our goal is to capture simultaneous ego and multiple exo videos...
    The ego camera is calibrated and time-synchronized with 4-5 (stationary) GoPros";
    docs.ego-exo4d-data.org/data/takes/ describes per-capture timesync.csv aligning
    all camera frames - this is a synchronized multi-camera rig per take.'
  has_camera_calibration: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    - "Calibrated camera parameters (intrinsics) for all cameras (in VRS file)" and
    "3D camera poses (trajectories/extrinsic parameters) for all cameras" via Aria
    MPS; confirmed by the ego_pose camera-pose JSON schema which ships explicit camera_intrinsics
    and camera_extrinsics matrices per camera per take.'
  depth_coverage: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    - dataset provides only "Sparse 3D point clouds of static environment" via Aria
    MPS, not dense per-frame depth maps, so classified as partial rather than full.'
  additional_modalities: 'NEW FIELD, filled [audio, eye_gaze]: arXiv:2311.18259 abstract,
    verbatim - "the video is accompanied by multichannel audio, eye gaze, 3D point
    clouds, camera poses, IMU, and multiple paired language descriptions". Confirmed
    by docs.ego-exo4d-data.org/overview/ - "7 x microphones" + GoPro stereo audio,
    and Aria MPS "3D eye gaze vectors". No force_torque or tactile sensing is mentioned
    anywhere, so only audio and eye_gaze are included (IMU and point clouds have no
    corresponding SensorModality enum value; see suggested_new_enum_values).'
  has_language_instruction: 'RE-VERIFIED 2026-07-10, unchanged: docs.ego-exo4d-data.org/overview/
    ("Language-Video Aligned Data": Expert Commentary, Atomic Actions, Narrate and
    Act) and arXiv:2311.18259 abstract - "multiple paired language descriptions including
