id: h2o
name: H2O
source_url: https://h2odataset.ethz.ch/
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: egocentric_human
secondary_collection_methods: []
embodiment_class: human_hand
num_arms: 2
dof_per_arm: 48
gripper_type: dexterous_hand
has_mobile_base: false
rotation_representation: rotation_matrix
state_dim: 126
fps: 30.0
fps_variable: false
num_camera_views: 5
camera_views:
- third_person
- head
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: false
num_task_types: 36
urdf_available: false
urdf_source: not_found
expected_num_episodes: 24
review_status: pending_human_review
field_sources:
  source_url: https://h2odataset.ethz.ch/ (official ETH Zurich project/download page;
    stub had no usable source_url)
  raw_format: https://github.com/taeinkwon/h2odataset README - data is distributed
    as raw per-frame RGB/depth images plus plain-text pose files in a custom directory
    layout, not RLDS/HDF5/LeRobot/TFRecord
  collection_method: https://arxiv.org/abs/2104.11181 abstract - egocentric interaction
    recognition dataset of real human hands (no teleop/robot involved)
  embodiment_class: https://arxiv.org/abs/2104.11181 abstract - '3D pose of two hands
    ... manipulating objects', i.e. human hands, no robot
  num_arms: https://github.com/taeinkwon/h2odataset README hand_pose section - left
    and right hand pose both annotated (2 hands)
  dof_per_arm: https://github.com/taeinkwon/h2odataset README hand_pose_MANO section
    - MANO fit uses 48 pose values per hand (16 joints x 3 axis-angle params)
  gripper_type: https://github.com/taeinkwon/h2odataset README hand_pose/hand_pose_MANO
    sections - 21-keypoint / MANO multi-finger hand model, i.e. a dexterous hand rather
    than a parallel-jaw gripper
  has_mobile_base: arxiv 2104.11181 paper section 4.1 Capture Setup - fixed multi-camera
    rig plus a head-mounted egocentric camera, no robot base present
  rotation_representation: https://github.com/taeinkwon/h2odataset README obj_pose_RT/cam_pose
    sections - poses stored as explicit 4x4 (rotation matrix + translation) matrices
  state_dim: https://github.com/taeinkwon/h2odataset README hand_pose section - 21
    joints x 3 coords x 2 hands = 126 numeric pose values (excluding per-hand annotated
    flags)
  fps: arxiv 2104.11181 paper section 4.1 - 'We record videos ... with a frame rate
    of 30 fps'
  fps_variable: arxiv 2104.11181 paper section 4.1 - single fixed 30 fps capture rate
    stated for the whole dataset
  num_camera_views: https://github.com/taeinkwon/h2odataset README/download_script.py
    - 'five views (four fixed views, one egocentric view)'
  camera_views: https://github.com/taeinkwon/h2odataset README dataset structure -
    cam0-cam3 are fixed (third_person) cameras, cam4 is the head-mounted (head) egocentric
    camera
  has_camera_calibration: arxiv 2104.11181 paper Figure 2/Section 3 (IR-sphere-marker
    + PnP camera calibration) and README cam_intrinsics.txt / cam_pose fields
  depth_coverage: https://github.com/taeinkwon/h2odataset README dataset structure
    - every cam0-cam4 folder (fixed and egocentric) includes an RGB and a depth subfolder
  has_language_instruction: https://github.com/taeinkwon/h2odataset README verb_label/action_label
    sections - labels are integer verb/noun/action class ids, not natural-language
    instructions
  num_task_types: arxiv 2104.11181 paper section 4 - 'features four participants performing
    36 distinct action classes'
  urdf_available: arxiv 2104.11181 paper section 4 - dataset ships object meshes and
    MANO hand fits, no robot URDF is provided or applicable
  urdf_source: same as urdf_available - no robot/URDF exists for this human-hand dataset
  expected_num_episodes: https://github.com/taeinkwon/h2odataset README train/val/test
    sequence lists - 15 train + 3 val + 6 test = 24 total recorded sequences across
    4 subjects
suggested_new_enum_values:
  license: custom_academic_noncommercial - ETH Zurich's H2O Terms of Use (https://h2odataset.ethz.ch/)
    require academic-only, non-commercial use, prohibit redistribution to third parties,
    and allow ETH to revoke access on request; this is a bespoke data-use agreement,
    not any of MIT/Apache/BSD/CC*/GPL/Proprietary/Unknown, so it does not fit the
    current license enum (closest is CC-BY-NC-4.0 but the actual terms are a custom
    contract, not that license).
  action_space: pose_and_discrete_label - H2O provides per-frame discrete verb/noun/action
    classification labels plus continuous 3D hand-joint and 6D object-pose annotations;
    it has no continuous robot control action vector (joint/eef position/velocity/torque),
    so none of joint_position/joint_velocity/joint_torque/eef_pose/mixed/unknown accurately
    describe it.
