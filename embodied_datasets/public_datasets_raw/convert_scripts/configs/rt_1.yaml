id: rt_1
name: RT-1
source_url: https://console.cloud.google.com/storage/browser/gresearch/rt-1-data-release;tab=objects?prefix=&forceOnObjectsSortingFiltering=false
license: CC-BY-4.0
raw_format: RLDS
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: mobile_manipulator
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: true
action_space: mixed
action_frame: delta
rotation_representation: euler_xyz
action_dim: 13
fps: 3.0
fps_variable: false
num_camera_views: 1
camera_views:
- head
