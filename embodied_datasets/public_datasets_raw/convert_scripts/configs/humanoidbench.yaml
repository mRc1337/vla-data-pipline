id: humanoidbench
name: HumanoidBench
source_url: https://humanoid-bench.github.io/
license: MIT
release_type: rl_benchmark_env
collection_method: simulation
secondary_collection_methods: []
is_multi_embodiment: true
embodiment_class: humanoid
robot_platform: unitree_h1
num_arms: 2
dof_per_arm: 4
gripper_type: dexterous_hand
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 151
action_dim: 61
fps: 50.0
fps_variable: false
num_camera_views: 2
camera_views:
- head
additional_modalities: []
has_language_instruction: false
num_task_types: 27
urdf_available: true
urdf_source: manufacturer_official
review_status: pending_human_review
field_sources:
  source_url: 'https://humanoid-bench.github.io/ (live project page, title ''HumanoidBench:
    Simulated Humanoid Benchmark for Whole-Body Locomotion and Manipulation'', links
    to paper arXiv:2403.10506 and code github.com/carlosferrazza/humanoid-bench);
    the stub value was already correct and is retained.'
  license: https://github.com/carlosferrazza/humanoid-bench/blob/main/LICENSE -- top-level
    license text is the MIT License (Copyright (c) 2024 Robot Learning Lab (RLL) @
    UC Berkeley).
  collection_method: 'Paper (arXiv:2403.10506) title and Sec III: ''The simulation
    environment of HumanoidBench uses the MuJoCo physics engine.'' This is a simulated
    RL benchmark/environment, not a teleop or autonomous-policy data-collection pipeline;
    there is no pre-recorded demonstration dataset -- episodes are generated on-the-fly
    during RL training/evaluation in MuJoCo.'
  embodiment_class: 'Paper Sec III: ''we use the Unitree H1 humanoid robot ... with
    two dexterous Shadow Hands attached to its arms'' -- a bipedal whole-body humanoid,
    matching the humanoid enum value directly (not single/dual-arm manipulator).'
  num_arms: 'Paper Sec III / Figure: Unitree H1 humanoid robot with two arms, each
    terminated by a dexterous hand (or optional parallel-jaw gripper).'
  dof_per_arm: 'https://www.unitree.com/h1 official spec page: ''DOF of Each Arm:
    4 (Expandable)'' for the Unitree H1 (the H1-2 variant lists 7); HumanoidBench''s
    primary robot is the base H1.'
  gripper_type: 'Paper Sec III: ''we use the Unitree H1 humanoid robot ... with two
    dexterous Shadow Hands (https://www.shadowrobot.com/dexterous-hand-series/) attached
    to its arms'' -- the primary end-effector across the main h1hand-* benchmark tasks
    is a dexterous hand (Shadow Hand); the repo also optionally supports a Robotiq
    2F-85 parallel-jaw gripper as an alternate end-effector.'
  has_mobile_base: The embodiment is a legged bipedal humanoid (Unitree H1/G1); locomotion
    is via bipedal walking/running, not a wheeled/mobile base, so has_mobile_base
    is false. Paper Sec III and task list (walk, run, stair, crawl, etc.) confirm
    legged locomotion.
  action_space: 'Paper Appendix B-B (Action Space): ''the humanoid robot is controlled
    via position control (i.e., specifying the target joint positions). Torque-based
    control is also supported but we found that position control is generally more
    stable ... We use position control for the benchmarking results in this paper.'''
  action_frame: 'Paper Appendix B-B: position control means ''specifying the target
    joint positions'' -- targets are absolute joint angles, not deltas relative to
    current position.'
  rotation_representation: Action space is a 61-dim vector of joint actuator commands
    (19 body + 21 per hand, per Appendix B-B); there is no Cartesian end-effector
    pose/orientation component in the action, so no rotation representation applies.
  state_dim: 'Paper Appendix B-A (Observation Space): ''The observation space for
    the robot state (joint positions and velocities) comprises 151 dimensions, with
    49 dimensions representing the humanoid robot body and 51 dimensions representing
    each hand'' (49 + 51*2 = 151). Task-specific object/environment state dims are
    added on top for manipulation tasks and are not included in this base figure.'
  action_dim: 'Paper Appendix B-B: ''We normalize the action space to be [-1,1]^||A||,
    where ||A||=61 (19 for the humanoid body and 21 for each hand).'''
  fps: 'Paper Appendix B-B: ''For both position and torque control, the action space
    is 61-dimensional including the two hands, and controlled at 50 Hz.'''
  fps_variable: Paper states a single fixed control frequency (50 Hz) used across
    all 27 tasks/environments; no variable-rate control scheme is described.
  num_camera_views: 'Paper Sec III (Observations): ''Egocentric visual observations
    from two cameras placed on the robot head.'''
  camera_views: 'Paper Sec III / Figure caption: ''the two cameras on the robot head
    are highlighted in green'' -- both cameras are egocentric, head-mounted (no third-person/wrist/top
    cameras described), mapped to the ''head'' enum value.'
  has_language_instruction: No language-conditioning, instruction annotations, or
    text task descriptions are mentioned anywhere in the paper or repo; tasks are
    selected via discrete Gym/MJX environment IDs (e.g. h1hand-walk-v0) and reward
    functions, not natural-language instructions.
  num_task_types: 'Paper abstract / Sec I: ''We benchmark 27 tasks, consisting of
    12 locomotion tasks and 15 distinct manipulation tasks.'' README.md main benchmark
    task list (github.com/carlosferrazza/humanoid-bench) also enumerates exactly 27
    h1hand-*-v0 task IDs.'
  urdf_available: 'Paper Sec III: ''We simulate this humanoid robot using MuJoCo adapting
    the Unitree H1 model provided by Unitree (https://github.com/unitreerobotics/unitree_ros)
    and the dexterous Shadow Hand models available through MuJoCo Menagerie.'' MJCF/URDF-derived
    robot models are shipped in the repo''s humanoid_bench/assets directory.'
  urdf_source: Paper Sec III explicitly cites the H1 model as 'provided by Unitree'
    via the manufacturer's own github.com/unitreerobotics/unitree_ros repository (official
    manufacturer source), with hand models sourced separately from MuJoCo Menagerie/Shadow
    Robot.
suggested_new_enum_values:
  robot_platform: Suggest adding 'unitree_h1' -- the primary and most heavily benchmarked
    embodiment in HumanoidBench is the Unitree H1 humanoid (all 27 main h1hand-*-v0
    tasks), which is not covered by any current enum value (unitree_g1 exists for
    the secondary/alternate G1 variant used by the parallel g1-*-v0 task set, but
    H1 is the primary platform and the paper's default robot). Forcing 'other' or
    'unitree_g1' would misrepresent the actual primary hardware.
  raw_format: HumanoidBench ships no pre-recorded trajectory/episode files at all
    -- it is MuJoCo/Gymnasium simulation source code (MJCF/XML robot+scene assets
    plus Python env code) that generates rollouts on-the-fly during RL training/eval;
    none of RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord/Custom cleanly describes 'no stored
    dataset, code+MJCF sim env only'. Suggest a value like 'sim_env_no_stored_data'
    for benchmark repos that are pure simulation environments rather than recorded
    datasets.
