id: pokeflex
name: PokeFlex
source_url: https://pokeflex-dataset.github.io/
paper_url: https://arxiv.org/abs/2410.07688
license: custom_research_eula
raw_format: Custom
release_type: fixed_episode_dataset
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: single_arm
num_arms: 1
gripper_type: none
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
fps: 30.0
fps_variable: true
num_camera_views: 6
camera_views:
- wrist
- third_person
- other
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: partial
additional_modalities:
- force_torque
has_language_instruction: false
num_task_types: 2
urdf_available: false
urdf_source: not_found
num_scenes: 1
num_objects: 18
review_status: pending_human_review
field_sources:
  license: 'ETH Zurich institutional Terms of Use at https://pokeflex.ait.ethz.ch/
    (registration-gated download page): custom EULA, non-exclusive/non-transferable/non-sub-licensable,
    non-commercial academic use only, redistribution and re-packaging prohibited,
    revocable by ETH on request, no standard CC license text used -> mapped to Proprietary
    (see suggested_new_enum_values for a more precise category).'
  raw_format: 'GitHub repo https://github.com/pokeflex-dataset/reconstruction, dataset/preprocess.py:
    data is organized as per-take folders with per-camera subfolders (volucam/, kinect/,
    realsense/), color/depth images, camera_parameters.json (intrinsics/extrinsics),
    and robot_data records with frame/forces fields -- no standard RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord/VRS
    container is used.'
  release_type: 'Project page + arXiv:2410.07688 abstract: fixed set of 18 objects
    with a fixed number of recorded poking/dropping sequences, released as a static
    downloadable dataset (not a generation framework, scene platform, or RL benchmark
    env).'
  is_multi_embodiment: 'arXiv:2410.07688 Sec 3.1 / project page: single robotic manipulator
    used throughout the poking protocol; dropping protocol uses no robot (free-fall
    onto a flat surface).'
  embodiment_class: 'arXiv:2410.07688 Sec 3.1 and Fig. 3/4: ''a robotic manipulator
    that pokes objects with a transparent acrylic stick'' -- single arm, brand/model
    not disclosed in paper, website, or GitHub repo.'
  num_arms: Same as embodiment_class source -- one manipulator is used.
  gripper_type: 'arXiv:2410.07688 Sec 3.1: the end-effector is a rigid transparent
    acrylic poking stick, not a gripper -- mapped to GripperType.NONE.'
  hand_pose_representation: No dexterous hand or bare-hand tracking is present anywhere
    in the dataset (rigid stick end-effector only) -- mapped to HandPoseRepresentation.NONE.
  has_mobile_base: Paper describes the manipulator as fixed inside the multi-view
    volumetric capture system (MVS) studio rig; no mobile base is mentioned.
  action_space: 'arXiv:2410.07688 Sec 3.1 (ar5iv full text): ''The robot logs end-effector
    poses, interaction forces and torques at 120 Hz.'' Applies only to the poking-protocol
    sequences (not the dropping protocol, which has no robot); this is closer to logged
    robot state during a scripted probing motion than a policy-commanded action, flagged
    here for human review.'
  fps: 'arXiv:2410.07688 Sec 3.1: ''We record data at 30 fps and 60 fps for the poking
    and dropping protocols, respectively.'' 30 fps (poking, the richer/primary protocol)
    used as representative value; fps_variable set true because dropping uses 60 fps.'
  fps_variable: Same source as fps -- two different frame rates are used depending
    on protocol (poking vs dropping).
  num_camera_views: 'arXiv:2410.07688 Table 1 and Sec 3.1: poking sequences record
    2 Volucam RGB cameras (from the MVS) + 2 Intel RealSense D405 RGB-D (eye-in-hand,
    robot end-effector mounted) + 2 Azure Kinect RGB-D (eye-to-hand, opposing external
    viewpoints) = 6 released per-frame camera streams. Dropping sequences use only
    the 2 Volucam cameras (no depth, no robot cams) -- 6 reflects the richer poking-protocol
    setup; see camera_views mapping caveat below.'
  camera_views: 'Mapped from arXiv:2410.07688 Sec 3.1: RealSense D405 (eye-in-hand,
    mounted on robot end-effector) -> wrist; Azure Kinect (eye-to-hand, opposing external
    viewpoints) -> third_person; Volucam cameras (2 of the 106-camera 360 deg volumetric
    capture rig, from Collet et al. 2015-style MVS) -> other, since they do not fit
    any single fixed viewpoint category cleanly.'
  has_synchronized_multiview_rig: 'arXiv:2410.07688 Sec 3.1: all cameras/robot are
    hardware-synchronized via a shared Linear Timecode (LTC) signal from an Atomos
    Ultrasync device, with a leader/follower camera architecture.'
  has_camera_calibration: 'arXiv:2410.07688 Table 1: ''Camera intrinsic and extrinsic
    parameters check''; confirmed in repo dataset/preprocess.py, which loads camera_parameters.json
    per camera with intrinsics/extrinsics.'
  depth_coverage: Depth is only available from the RealSense D405 and Azure Kinect
    cameras during the poking protocol; the Volucam RGB cameras (used in both protocols,
    and the only cameras in the dropping protocol) have no per-pixel depth channel
    -- coverage across the full dataset is partial, not full.
  additional_modalities: 'arXiv:2410.07688 Table 1 / Sec 3.1: ''Estimated 3D contact
    forces and torques'' logged at 120 Hz during poking -- mapped to SensorModality.FORCE_TORQUE.
    No tactile, audio, or eye-gaze modalities are mentioned anywhere.'
  has_language_instruction: No language annotation, instruction, or task description
    field is mentioned anywhere on the project page, arXiv paper (checked via full-text
    search), or GitHub repo.
  num_task_types: 'Two distinct data-collection protocols are described: poking (robot-induced
    deformation) and dropping (free-fall deformation) -- arXiv:2410.07688 Sec 3.1.
    Not manipulation ''skill'' task types in the usual VLA sense; flagged for human
    review.'
  urdf_available: 'No URDF, robot model, or CAD file is present in the GitHub repo
    (https://github.com/pokeflex-dataset/reconstruction directory listing: assets/,
    config/, dataset/, models/, test/, training/, README.md) nor referenced on the
    project page or in the paper. Robot brand/model itself is never disclosed.'
  num_scenes: All data is captured inside a single fixed professional multi-view volumetric
    capture system (MVS) studio setup -- arXiv:2410.07688 Sec 3.1.
  num_objects: 'Project page and arXiv:2410.07688 abstract: ''PokeFlex consists of
    18 deformable objects'' (13 everyday items + 5 3D-printed objects).'
suggested_new_enum_values:
  license: custom_gated_research_only -- a registration-gated, revocable, non-transferable
    institutional EULA (ETH Zurich) that prohibits ANY redistribution (even non-commercial)
    and is not literally a Creative Commons license, distinct from generic 'Proprietary'.
  collection_method: scripted_robot_probing -- a non-learned, pre-programmed/randomized
    robot-arm motion (e.g., poking objects with a rigid tool along randomized trajectories)
    used purely for automated real-world data collection; distinct from teleop (no
    human control), autonomous_policy (not a learned closed-loop policy), and simulation.
    PokeFlex's poking protocol needs this category; left collection_method blank because
    none of the existing CollectionMethod values fit.
