field_sources:
  paper_url: arXiv 2210.17217 PDF rendition of the same paper as source_url
  license: No license stated in paper text, arXiv abstract page, or project site sites.google.com/view/autobag;
    no accompanying code/dataset GitHub repo found (searched BerkeleyAutomation org)
    -- set to Unknown rather than left unassessed
  release_type: Sec. IV-A describes a self-supervised data collection *process* where
    the robot autonomously generates its own training images/labels via action primitives;
    no fixed public episode dataset was found released alongside the paper, so this
    is best characterized as a generation_framework rather than a fixed_episode_dataset
  collection_method: 'Sec. IV-A/IV-B: the YuMi robot autonomously executes randomized
    action primitives (Rotate/Shake/Fold/Compress/Flip sampled per a fixed policy)
    to explore bag configurations and self-collect UV-labeled training images, with
    no human teleoperation involved'
  is_multi_embodiment: Single ABB YuMi robot platform used throughout all training
    and physical experiments (Sec. II-VI)
  embodiment_class: 'Abstract: ''a self-supervised learning framework where a dual-arm
    robot...''; Fig. 2 shows the bimanual ABB YuMi setup'
  robot_platform: 'Fig. 2 caption: ''The physical setup with the ABB YuMi.'' ABB YuMi
    (IRB 14000) is not present in the RobotPlatform enum, so set to other -- see suggested_new_enum_values'
  num_arms: Bimanual/dual-arm YuMi robot, 2 arms (Fig. 2, Sec. III)
  dof_per_arm: ABB YuMi IRB 14000 arms are 7-axis (manufacturer spec for the robot
    identified in Fig. 2); not stated numerically in the paper itself
  gripper_type: 'Sec. III Problem Statement: ''we consider a bimanual robot with parallel-jaw
    grippers'''
  hand_pose_representation: Parallel-jaw grippers only; no dexterous hand or finger-pose
    encoding used
  has_mobile_base: Fig. 2 shows YuMi fixed/mounted on a stand over a flat workspace,
    no mobile base
  action_space: Sec. IV-B action primitives (Recenter, Rotate, Shake, Fold, Compress,
    Flip, Dilate, Pin-Pull) each take heterogeneous parameter sets combining Cartesian
    grasp positions, Euler rotation angles, and scalar shake/compress parameters --
    a genuinely mixed action space rather than pure eef_pose
  action_frame: 'Sec. IV-B: primitives specify absolute (x,y) grasp/target pixel-space
    positions (e.g. Recenter translates to a fixed (0,0) center, Rotate specifies
    absolute target Euler angles), not deltas from current pose'
  rotation_representation: 'Sec. IV-B item 2 ''Rotate (x,y,alpha,beta,gamma)'': gripper
    rotated by Euler angles'
  num_camera_views: 'Sec. III / Fig. 2 caption: single overhead Intel Realsense camera
    used for all perception'
  camera_views: 'Fig. 2: camera is ''placed overhead the robot'' looking down at the
    flat workspace -- top view'
  has_synchronized_multiview_rig: Only one camera is used in the setup (Fig. 2), so
    no multiview rig
  has_camera_calibration: 'Sec. III Problem Statement: ''a bimanual robot with parallel-jaw
    grippers and an overhead calibrated RGB camera above a flat surface'''
  depth_coverage: Sec. III defines the observation as I_t in R^{W x H x 3} (RGB image
    only); although Fig. 2 caption names the camera an RGB(D)-capable Realsense unit,
    only the RGB channels are used/described in the method, so no depth is exposed
  has_language_instruction: No language-conditioning or task instructions are described
    anywhere in the paper; the single 'bagging' task is fixed by problem formulation,
    not specified via language
  num_task_types: Sec. III formulates exactly one task, 'bagging' (open bag, insert
    item(s), lift for transport)
  urdf_available: ABB YuMi (IRB 14000) is a commercial robot with URDF descriptions
    distributed in community ROS-Industrial packages (e.g. abb_experimental/yumi_description);
    not confirmed to be bundled with this paper's own materials
  urdf_source: YuMi URDFs are commonly maintained in third-party/community ROS-Industrial
    GitHub repos rather than an official manufacturer or dataset-repo release tied
    to this paper
  num_scenes: 'Sec. V-B: a single flat workspace of fixed dimensions (70cm x 90cm)
    was used for all training and experiments -- one lab scene'
suggested_new_enum_values:
  robot_platform: abb_yumi -- ABB YuMi (IRB 14000) dual-arm collaborative robot used
    in this paper (Fig. 2); not covered by any existing RobotPlatform value, currently
    mapped to 'other'
  collection_method: self_supervised_autonomous_exploration -- the robot follows a
    fixed/randomized set of hand-designed action primitives (not a learned control
    policy, and not human teleop) purely to self-collect labeled perception training
    data via UV-marker-based auto-labeling (Sec. IV-A); distinct from both 'teleop'
    and 'autonomous_policy' as currently defined, currently mapped to 'autonomous_policy'
    as the closest fit
