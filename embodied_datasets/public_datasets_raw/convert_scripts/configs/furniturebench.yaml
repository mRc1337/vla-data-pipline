id: furniturebench
name: FurnitureBench
source_url: https://clvrai.github.io/furniture-bench/
license: MIT
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: false
action_space: eef_pose
action_frame: delta
rotation_representation: quaternion
state_dim: 14
action_dim: 8
fps: 10.0
fps_variable: false
num_camera_views: 2
camera_views:
- front
- wrist
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: false
num_task_types: 8
urdf_available: true
urdf_source: dataset_repo
expected_size_gb: 1179.0
expected_num_episodes: 5100
review_status: pending_human_review
field_sources:
  source_url: Verified live via https://clvrai.github.io/furniture-bench/ (official
    project homepage, links to paper arXiv:2305.12821, GitHub github.com/clvrai/furniture-bench,
    and docs); stub value confirmed correct, no change needed
  license: 'https://api.github.com/repos/clvrai/furniture-bench (license.key: ''mit'')
    and https://raw.githubusercontent.com/clvrai/furniture-bench/main/LICENSE (''MIT
    License ... Copyright (c) 2023 Cognitive Learning for Vision and Robotics (CLVR)
    lab @ KAIST''); note a downstream HF mirror (IPEC-COMMUNITY/furniture_bench_dataset_lerobot)
    tags itself license:apache-2.0, but the primary/original repo and dataset release
    are MIT'
  raw_format: 'https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    ''Demonstration File Format'': ''Each demonstration is stored in a .pkl file,
    containing a sequence of sensory inputs, actions, rewards, and other metadata''
    -- a custom Python-pickle schema, not RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord
    natively (those exist only as later third-party conversions, e.g. IPEC-COMMUNITY/furniture_bench_dataset_lerobot)'
  collection_method: 'arXiv:2305.12821 Sec IV-A/B: ''219.6 hours of successful demonstrations
    using an Oculus Quest 2 controller and a keyboard''; https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    repeats ''219.6 hours of 5100 successful demonstrations collected using an Oculus
    Quest 2 controller and a keyboard'' -- human VR teleoperation'
  embodiment_class: 'arXiv:2305.12821 Sec IV-A: ''7-DoF Franka Emika Panda robot arm
    with a default parallel gripper''; https://raw.githubusercontent.com/clvrai/furniture-bench/main/furniture_bench/config.py
    defines a single fixed-base robot with no mobile-base component'
  robot_platform: 'arXiv:2305.12821 Sec IV-A: ''7-DoF Franka Emika Panda robot arm'';
    https://huggingface.co/api/datasets/IPEC-COMMUNITY/furniture_bench_dataset_lerobot
    meta/info.json ''robot_type'': ''franka'''
  num_arms: 'arXiv:2305.12821 Sec IV-A and footnote: single-arm setup (''we leave
    extending this work to multi-arm and mobile manipulation for future work'')'
  dof_per_arm: 'arXiv:2305.12821 Sec IV-A: ''7-DoF Franka Emika Panda robot arm'''
  gripper_type: 'arXiv:2305.12821 Sec IV-A: ''Franka Emika Panda robot arm with a
    default parallel gripper'''
  has_mobile_base: 'arXiv:2305.12821 Sec IV-A / config.py: stationary tabletop Franka
    Panda arm bolted to a fixed base tag/table, no mobile base component anywhere
    in the environment or robot control stack'
  action_space: 'arXiv:2305.12821 Appendix B-E ''Action Space'': ''We use an 8D action
    space, which consists of delta end-effector (x,y,z)-position (3D), delta orientation
    (quaternion, 4D), and gripper action (1D)''; https://raw.githubusercontent.com/clvrai/furniture-bench/main/furniture_bench/config.py
    ''action_dim'': 3+4+1'
  action_frame: 'arXiv:2305.12821 Appendix B-E: ''8D action space, which consists
    of delta end-effector (x,y,z)-position ... delta orientation (quaternion) ...'';
    Sec IV-A: ''We use end-effector delta-pose control at 10Hz'''
  rotation_representation: 'arXiv:2305.12821 Appendix B-E: ''delta orientation (quaternion,
    4D)'''
  state_dim: 'arXiv:2305.12821 Appendix B-F Table V ''Observations available in FurnitureBench''
    (Policy column checked): EE position (3) + EE orientation quaternion (4) + EE
    linear velocity (3) + EE rotational velocity (3) + Gripper width (1) = 14D proprioceptive
    state fed to the policy; https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    additionally shows the raw .pkl ''robot_state'' dict also stores joint_positions/joint_velocities/joint_torques
    (7 each, unused by the paper''s baseline policies)'
  action_dim: 'arXiv:2305.12821 Appendix B-E ''We use an 8D action space'' (3+4+1);
    https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html Demonstration
    File Format: "''actions'': List of 8-D actions"; matches franka_description-based
    furniture_bench/config.py ''action_dim'': 3+4+1'
  fps: 'arXiv:2305.12821 Sec IV-A: ''We use end-effector delta-pose control at 10Hz'';
    https://raw.githubusercontent.com/clvrai/furniture-bench/main/furniture_bench/config.py
    robot ''hz'': 10; https://huggingface.co/api/datasets/IPEC-COMMUNITY/furniture_bench_dataset_lerobot
    meta/info.json ''fps'': 10'
  fps_variable: 'furniture_bench/config.py hardcodes a single constant robot control
    rate ''hz'': 10 used for every episode/task; the HF LeRobot mirror''s meta/info.json
    likewise reports one constant top-level ''fps'': 10 for the whole dataset'
  num_camera_views: 'https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    Demonstration File Format: the per-step ''observations'' dict only contains ''color_image1''
    (wrist) and ''color_image2'' (front); https://huggingface.co/api/datasets/IPEC-COMMUNITY/furniture_bench_dataset_lerobot
    meta/info.json ''total_videos'': 10200 over ''total_episodes'': 5100 = 2 videos/episode,
    confirming 2 camera views are actually released per demonstration (a third, rear,
    camera exists in the physical rig per furniture_bench/config.py ''num_camera'':
    3 and arXiv:2305.12821 Table V, but is used only for AprilTag pose estimation/initialization,
    not stored as a per-step image in the released demonstrations)'
  camera_views: front camera ('color_image2') mapped to front; wrist camera ('color_image1')
    mapped to other because FurnitureBench's Panda is a single, non-handed arm and
    the enum only offers left_wrist/right_wrist (same convention as this repo's configs/calvin.yaml,
    configs/libero.yaml, configs/libero_plus.yaml) -- see suggested_new_enum_values
  has_camera_calibration: 'https://raw.githubusercontent.com/clvrai/furniture-bench/main/furniture_bench/config.py
    ''camera'' dict: each of the 3 physical cameras (wrist/front/rear) has an exactly-specified
    ''rel_pose_from_base'' extrinsic transform; arXiv:2305.12821 Appendix H documents
    a detailed step-by-step camera-mount calibration/reproducibility procedure'
  depth_coverage: 'https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    Demonstration File Format: the released per-step ''observations'' dict lists only
    ''color_image1''/''color_image2'' (RGB), robot_state, actions, rewards, and skills
    -- no depth field is present in the actual downloadable demonstration files, even
    though the underlying RealSense D435 sensors and simulator support depth capture
    (arXiv:2305.12821 Table V lists depth channels as available-but-unused environment
    sensors)'
  has_language_instruction: https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    Demonstration File Format lists only 'furniture' (name string), 'observations',
    'actions', 'rewards', and 'skills' fields -- no natural-language instruction field
    is stored per demonstration; tasks are identified only by furniture-model name/id,
    not free-form language
  num_task_types: 'arXiv:2305.12821 Sec IV-A: ''8 different furniture models, each
    modeled after an existing piece of IKEA furniture'' (desk, round_table, cabinet,
    lamp, drawer, square_table, stool, chair)'
  urdf_available: https://github.com/clvrai/furniture-bench/tree/main/furniture_bench/assets/franka_description_ros/franka_description
    (vendored Franka Panda arm URDF) and https://github.com/clvrai/furniture-bench/tree/main/furniture_bench/assets/furniture/urdf
    (custom URDF files for each of the 8 furniture part models)
  urdf_source: Both the robot-arm URDF and the furniture-part URDFs are shipped directly
    inside the FurnitureBench GitHub repository itself (furniture_bench/assets/franka_description_ros/
    and furniture_bench/assets/furniture/urdf/), rather than requiring an external
    manufacturer/community reference, so 'dataset_repo' was recorded
  expected_size_gb: 'https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html
    ''Dataset Size'' table: per-furniture, per-randomness-level sizes of raw .pkl
    files sum to Total row low=457GB + med=499GB + high=223GB = 1179 GB'
  expected_num_episodes: 'https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html:
    ''219.6 hours of 5100 successful demonstrations''; matches https://huggingface.co/api/datasets/IPEC-COMMUNITY/furniture_bench_dataset_lerobot
    meta/info.json ''total_episodes'': 5100'
suggested_new_enum_values:
  camera_views: wrist (generic, non-handed) - FurnitureBench's Franka Panda is a single,
    non-handed arm with one wrist-mounted RealSense camera ('color_image1'); the existing
    left_wrist/right_wrist options force an incorrect handedness label onto a robot
    with no left/right arm distinction, so 'other' was used instead as a stand-in
    (same gap already noted in this repo's configs/calvin.yaml, configs/libero.yaml,
    configs/libero_plus.yaml, configs/mimicgen.yaml, configs/robocasa.yaml, configs/roboset.yaml).
