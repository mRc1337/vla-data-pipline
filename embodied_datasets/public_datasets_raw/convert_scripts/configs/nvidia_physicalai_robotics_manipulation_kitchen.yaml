id: nvidia_physicalai_robotics_manipulation_kitchen
name: NVIDIA PhysicalAI-Robotics-Manipulation-Kitchen
source_url: https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Kitchen
license: CC-BY-4.0
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: mobile_manipulator
robot_platform: kinova_gen3
num_arms: 2
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: true
action_space: joint_position
action_frame: absolute
state_dim: 13
action_dim: 34
fps: 50.0
fps_variable: false
num_camera_views: 5
camera_views:
- third_person
- third_person
- left_wrist
- right_wrist
- head
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities:
- semantic_segmentation
has_language_instruction: false
num_task_types: 8
urdf_available: true
urdf_source: manufacturer_official
expected_size_gb: 11.4
expected_num_episodes: 874
expected_duration_hours: 2.25
review_status: pending_human_review
field_sources:
  source_url: HF dataset page https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Kitchen
    -- verified reachable via HF datasets API (https://huggingface.co/api/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Kitchen)
    and README.md fetched from the raw file path. Unchanged (already pre-filled).
  license: 'README.md front-matter (`license: cc-by-4.0`) and body text: ''License/Terms
    of Use: cc-by-4.0'' -- https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Kitchen/raw/main/README.md.'
  raw_format: 'README.md ''Intended Usage'': ''This dataset is provided in LeRobot
    format and is intended for training robot policies...''; ''Dataset Format'' section:
    ''Within the collection, there are eight datasets in LeRobot format''. Confirmed
    by meta/info.json ''codebase_version'': ''v2.1'' fetched for each of the eight
    sub-datasets (open_cabinet, close_cabinet, open_dishwasher, close_dishwasher,
    open_fridge, close_fridge, open_drawer, close_drawer).'
  release_type: The repo ships eight pre-recorded, fixed-size LeRobot sub-datasets
    (open/close x cabinet/dishwasher/fridge/drawer), each with a fixed total_episodes
    count per meta/info.json -- a released, static artifact, not a generation framework/scene
    platform/RL env a user runs themselves. Same convention applied to the sibling
    configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml.
  collection_method: 'README.md main description: ''a dataset of automatically generated
    motions of robots... generated in IsaacSim leveraging reasoning algorithms and
    optimization-based motion planning to find solutions to the tasks automatically'';
    ''Dataset Characterization / Data Collection Method'': ''Automated'', ''Automatic/Sensors'',
    ''Synthetic''. No human teleoperation is involved anywhere -> simulation, matching
    the registry convention (see configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml,
    configs/robotwin.yaml) that reserves `simulation` for automated/scripted/motion-planning-generated
    sim data.'
  secondary_collection_methods: README.md Data Collection Method section describes
    only automated reasoning + optimization-based motion-planning generation (PDDLStream/CuRobo
    + procedural scene_synthesizer scene generation, same technique stack as the singlearm
    sibling); no human teleoperation, autonomous learned policy, or other secondary
    method is mentioned. Left empty.
  is_multi_embodiment: 'All eight sub-dataset meta/info.json files report `"robot_type":
    null`, but README.md describes one consistent design throughout: ''The dataset
    includes a bimanual manipulator built with Kinova Gen3 arms''. No other embodiment
    appears anywhere in the collection.'
  embodiment_class: 'README.md: ''a bimanual manipulator built with Kinova Gen3 arms''
    (two arms) mounted on a wheeled/torso-lift/pan-tilt-head base -- meta/info.json
    `action.names` for every sub-dataset confirm `front_rocker`, four wheel joints,
    `ewellix_torso_joint`, `pan_joint`/`tilt_joint` in addition to `left_arm_joint_1..7`
    and `right_arm_joint_1..7` -- a bimanual arm set on a mobile base, matching EmbodimentClass.MOBILE_MANIPULATOR
    (same convention as configs/mobile_aloha.yaml, which also sets mobile_manipulator
    with num_arms=2 for a bimanual-arms-on-wheeled-base platform, rather than dual_arm).'
  robot_platform: 'README.md explicitly names ''Kinova Gen3 arms'' -- exact match
    to RobotPlatform.KINOVA_GEN3. (Note: this covers the two Kinova Gen3 arms only;
    the wheeled mobile base/torso-lift/pan-tilt head is a custom research platform
    not covered by this enum value.)'
  num_arms: meta/info.json `action.names` for all eight sub-datasets enumerate exactly
    one `left_arm_joint_1..7` set and one `right_arm_joint_1..7` set (plus matching
    per-arm gripper joints) -- exactly two manipulator arms, confirming README's 'bimanual
    manipulator'.
  dof_per_arm: meta/info.json `action.names` for all eight sub-datasets list exactly
    `left_arm_joint_1` through `left_arm_joint_7` and `right_arm_joint_1` through
    `right_arm_joint_7` -- 7 arm joints per side, consistent with the Kinova Gen3's
    standard 7-DOF design.
  gripper_type: meta/info.json `action.names` for every sub-dataset include, per arm,
    `<side>_arm_finger_joint`, `<side>_arm_left_inner_finger_joint`, `<side>_arm_left_inner_knuckle_joint`,
    `<side>_arm_right_outer_knuckle_joint`, `<side>_arm_right_inner_finger_joint`,
    `<side>_arm_right_inner_knuckle_joint` -- the canonical 6-mimic-joint naming of
    a Robotiq 2F-85-style two-finger adaptive gripper, i.e. a parallel-jaw gripper
    (matches the same joint-naming convention as the Robotiq 2F-85 URDF).
  has_mobile_base: meta/info.json `action.names` for all eight sub-datasets begin
    with `front_rocker`, `front_left_wheel`, `front_right_wheel`, `rear_left_wheel`,
    `rear_right_wheel` -- a 4-wheel base with a steering/rocker joint, confirming
    a wheeled mobile base is present and actuated.
  action_space: 'README.md ''Dataset Format'': ''action modality: 34D which includes
    joint states for the two arms, gripper joints, pan and tilt joints, torso joint,
    and front and back wheels'' -- explicitly described as uniform joint-state values
    across the whole 34D vector (no end-effector Cartesian pose target anywhere),
    matching ActionSpace.JOINT_POSITION. meta/info.json `action.shape` = [34] for
    all eight sub-datasets confirms the dimensionality. Note: the 5 base/wheel dimensions
    could plausibly be velocity-controlled in the underlying sim rather than true
    positions, but the README''s own text uniformly labels the whole vector ''joint
    states'', so joint_position (rather than mixed) is used per the literal source
    wording.'
  action_frame: meta/info.json `action.names` for all eight sub-datasets use plain
    joint names with no 'delta' qualifier (unlike the singlearm sibling, which explicitly
    names delta fields e.g. `panda_jointN_delta_pos`); README.md describes the action
    as 'joint states', consistent with absolute joint-position targets rather than
    incremental deltas.
  state_dim: 'meta/info.json `observation.state.shape` = [13] identically for all
    eight sub-datasets (open_cabinet, close_cabinet, open_dishwasher, close_dishwasher,
    open_fridge, close_fridge, open_drawer, close_drawer), confirmed by README.md:
    ''observation.state: 13D where the first 12D are the vectorized transform matrix
    of the ''object of interest''. The 13th entry is the joint value for the articulated
    object of interest''.'
  action_dim: 'meta/info.json `action.shape` = [34] identically for all eight sub-datasets,
    confirmed by README.md ''action modality: 34D...''.'
  fps: 'meta/info.json `"fps": 50.0` confirmed identically for all eight sub-datasets
    fetched individually.'
  fps_variable: 'Same meta/info.json check across all eight sub-datasets: every one
    reports fps: 50.0 with zero variation.'
  num_camera_views: 'meta/info.json `features` block for open_cabinet (and confirmed
    identical camera-key set across the collection) lists exactly five distinct camera
    keys: `world__world_camera`, `external_camera`, `world__robot__right_arm_camera_color_frame__right_hand_camera`,
    `world__robot__left_arm_camera_color_frame__left_hand_camera`, `world__robot__camera_link__head_camera`
    (each shipped as .rgb, .distance_to_image_plane, and .semantic_segmentation video
    streams). README.md ''Dataset Format'' lists the same five `observation.image.*`
    entries.'
  camera_views: 'Mapped from the five camera keys: `world__world_camera` (fixed external
    overview of the kitchen scene) and `external_camera` (a second external/environment
    view) both mapped to third_person, since neither is body- or wrist-mounted and
    the enum has no way to distinguish two distinct external viewpoints; `world__robot__right_arm_camera_color_frame__right_hand_camera`
    -> right_wrist; `world__robot__left_arm_camera_color_frame__left_hand_camera`
    -> left_wrist; `world__robot__camera_link__head_camera` -> head (mounted at the
    robot''s head/pan-tilt camera_link per its feature-key path).'
  has_synchronized_multiview_rig: 'Inferred, not an explicit README statement: all
    five cameras (world, external, both wrist cameras, head) are rendered from the
    same IsaacSim simulation state at each recorded frame/timestep (same reasoning
    applied to the singlearm sibling and other IsaacSim sim datasets in this corpus,
    e.g. configs/maniskill3.yaml, configs/mimicgen.yaml), so all views are synchronized
    by construction.'
  has_camera_calibration: 'Inferred: camera placement/intrinsics for all five cameras
    are deterministically defined by the IsaacSim scene/rig setup used to generate
    every episode (simulation), so calibration parameters are always derivable, even
    though no separate calibration file is shipped in the HF repo file listing. Same
    reasoning as the singlearm sibling and configs/libero.yaml, configs/maniskill3.yaml
    for simulator-generated datasets.'
  depth_coverage: 'meta/info.json `features` block confirms every one of the five
    camera keys has a matching `.distance_to_image_plane` depth-video feature, for
    all eight sub-datasets. README.md ''Dataset Quantification'' video counts corroborate
    this exactly, e.g. open_cabinet: ''78 episodes... number of videos: 1170 (390
    RGB videos, 390 depth videos, 390 semantic segmentation videos)'' where 390 =
    78 episodes x 5 cameras for each of the three video kinds -- depth is present
    for every camera, in every episode, across all eight sub-datasets -> DepthCoverage.FULL.'
  additional_modalities: 'Checked meta/info.json `features` blocks for all eight sub-datasets:
    only RGB video, depth video, semantic-segmentation video, state, action, and timestamp/frame/episode/task
    index keys exist. No force_torque, tactile, audio, or eye_gaze feature anywhere
    -> left empty. Note: every one of the five cameras also ships a `.semantic_segmentation`
    video stream (see README.md ''Dataset Quantification'' video counts, e.g. ''390
    semantic segmentation videos'' for open_cabinet) -- this is a genuinely present
    per-camera modality that has no matching SensorModality enum value; see suggested_new_enum_values.'
  has_language_instruction: 'Checked meta/tasks.jsonl for open_cabinet and close_drawer
    (representative sample): each episode gets its own task entry, but the `task`
    string is a procedural template ID, not a natural-language description of the
    episode, e.g. `{"task_index": 0, "task": "procedural_kitchen_open_cabinet_143363-cf5bbfa"}`,
    `{"task_index": 0, "task": "procedural_kitchen_close_drawer_273521-cf5bbfa"}`.
    No other language-instruction field is present anywhere. Set false.'
  num_task_types: 'README.md ''Dataset Format'' section lists exactly eight named
    sub-datasets/tasks: open_cabinet, close_cabinet, open_dishwasher, close_dishwasher,
    open_fridge, close_fridge, open_drawer, close_drawer.'
  urdf_available: 'Kinova''s official kortex_description ROS package (https://github.com/Kinovarobotics/ros_kortex,
    kortex_description/arms/gen3/7dof) ships the Gen3 7-DOF arm URDF used in this
    dataset. Same precedent as configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml
    for the Franka Panda arm. Note: this covers the Kinova Gen3 arm itself; no public
    URDF was found for the specific custom wheeled-base/torso-lift/pan-tilt-head mobile
    platform as a whole.'
  urdf_source: https://github.com/Kinovarobotics/ros_kortex kortex_description package
    is the manufacturer's (Kinova Robotics) official URDF for the Gen3 arm -- not
    shipped inside this specific HF dataset repo itself.
  expected_size_gb: 'README.md ''Dataset Quantification'': ''Total storage: 11.4 GB''
    (stated directly for the full eight-sub-dataset collection).'
  expected_num_episodes: 'README.md ''Dataset Quantification / Record Count'' per
    sub-dataset: 78 (open_cabinet) + 205 (close_cabinet) + 72 (open_dishwasher) +
    74 (close_dishwasher) + 193 (open_fridge) + 76 (close_fridge) + 99 (open_drawer)
    + 77 (close_drawer) = 874 episodes, summed exactly across all eight sub-datasets.'
  expected_duration_hours: 'Computed from README.md ''Dataset Quantification'' per-sub-dataset
    frame counts: 39292 + 99555 + 28123 + 36078 + 93854 + 41894 + 37214 + 28998 =
    405,008 total frames, divided by the confirmed uniform fps of 50.0 (meta/info.json,
    all eight sub-datasets) and by 3600: 405008 / 50 / 3600 = 2.2500 hours, rounded
    to 2.25.'
  num_subjects: 'Checked README.md in full: data collection is fully automated (IsaacSim
    + reasoning/optimization-based motion planning), no human operators/teleoperators/subjects
    are involved or mentioned anywhere. Left blank rather than report a non-applicable
    human-subject count.'
  num_scenes: 'README.md: ''The environments are kitchen scenes where the furniture
    and appliances were procedurally generated'' -- procedurally randomized per episode,
    with no discrete stated count of distinct scenes/layouts. Left blank rather than
    fabricate.'
  num_objects: 'README.md and meta/info.json state-feature names: `observation.state``s
    12D transform matrix + 1D joint value describes a single ''object of interest''
    (the articulated cabinet/drawer/dishwasher/fridge door) per episode, but no explicit
    inventory/count of distinct procedurally-generated furniture/appliance assets
    is stated anywhere on the HF page. Left blank rather than fabricate.'
  paper_url: 'Checked README.md ''Reference(s)'' section in full: it cites three supporting-technique
    papers ([1] PDDLStream, [2] scene_synthesizer, [3] CuRobo) used to build the generation
    pipeline (same three references as the singlearm sibling), but none of them is
    a paper describing this dataset itself, and no other dataset-specific paper/citation
    is given anywhere on the HF page. Left blank rather than cite an unrelated method
    paper as ''the'' paper_url.'
suggested_new_enum_values:
  additional_modalities: A `semantic_segmentation` value would help for datasets like
    this one where every camera ships a per-pixel semantic-segmentation video stream
    in addition to RGB and depth (meta/info.json `observation.image.*.semantic_segmentation`
    features, confirmed for all five cameras across all eight sub-datasets; README.md
    'Dataset Quantification' explicitly counts 'semantic segmentation videos' alongside
    RGB and depth videos for every sub-dataset). Currently no SensorModality value
    (force_torque/tactile/audio/eye_gaze) covers this camera-derived per-pixel label
    modality, so it was left out of additional_modalities instead of mis-mapping it
    to an unrelated value.
