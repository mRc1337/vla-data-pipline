services:
  api:
    build: .
    command: uvicorn vla_platform.api:app --host 0.0.0.0 --port 8000
    environment:
      VLA_DATA_ROOT: /data/public_datasets_staging
      VLA_CURATION_ROOT: /data/public_datasets_staging/data_curation
    volumes:
      - /mnt/data/embodied_datasets/public_datasets_staging:/data/public_datasets_staging
    ports: ["8000:8000"]
    depends_on: [redis, postgres]
  worker:
    build: .
    command: celery -A vla_platform.celery_app.celery_app worker --loglevel=INFO --queues=cpu
    environment:
      VLA_DATA_ROOT: /data/public_datasets_staging
    volumes:
      - /mnt/data/embodied_datasets/public_datasets_staging:/data/public_datasets_staging
    depends_on: [redis, postgres]
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vla
      POSTGRES_USER: vla
      POSTGRES_PASSWORD: vla-local-only
  web:
    image: nginx:1.27-alpine
    ports: ["5173:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
