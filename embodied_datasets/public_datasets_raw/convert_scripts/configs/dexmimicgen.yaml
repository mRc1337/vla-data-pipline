id: dexmimicgen
name: DexMimicGen
source_url: https://dexmimicgen.github.io/
paper_url: https://arxiv.org/abs/2410.24185
license: CC-BY-NC-SA-4.0
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: human_to_robot_synthesis
secondary_collection_methods: []
is_multi_embodiment: true
embodiment_class: dual_arm
robot_platform: franka_panda
num_arms: 2
dof_per_hand: 6
gripper_type: dexterous_hand
hand_pose_representation: joint_angles
has_mobile_base: false
action_space: mixed
action_frame: both
rotation_representation: mixed
fps: 20.0
fps_variable: false
num_camera_views: 3
camera_views:
- third_person
- left_wrist
- right_wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: false
num_task_types: 9
urdf_available: true
urdf_source: community_repo
expected_size_gb: 59.9
expected_num_episodes: 21000
expected_duration_hours: 155.6
num_scenes: 9
review_status: pending_human_review
field_sources:
  source_url: 'https://github.com/NVlabs/dexmimicgen README.md: "Website: https://dexmimicgen.github.io"
    -- re-verified 2026-07-10 by re-fetching the GitHub README directly; stub source_url
    confirmed correct, no change needed.'
  paper_url: 'https://arxiv.org/abs/2410.24185 -- ICRA 2025 paper "DexMimicGen: Automated
    Data Generation for Bimanual Dexterous Manipulation via Imitation Learning"; confirmed
    via both the GitHub README ("Paper: https://arxiv.org/abs/2410.24185") and the
    arXiv abstract page itself. New field, filled 2026-07-10.'
  license: 'CORRECTED from CC-BY-4.0 to CC-BY-NC-SA-4.0. The GitHub README (https://github.com/NVlabs/dexmimicgen#license)
    states "the datasets are released under CC-BY 4.0", but this is contradicted by
    the actual license shipped with the released data itself: the Hugging Face dataset
    repo https://huggingface.co/datasets/MimicGen/dexmimicgen_datasets README.md frontmatter
    declares "license: cc-by-nc-sa-4.0" (confirmed via HF API cardData.license = "cc-by-nc-sa-4.0"),
    and the repo''s own LICENSE file (https://huggingface.co/datasets/MimicGen/dexmimicgen_datasets/raw/main/LICENSE)
    is an "NVIDIA License" whose Sec. 3.3 Use Limitation states the Work "only may
    be used or intended for use non-commercially... for research or evaluation purposes
    only". The HF dataset repo is the authoritative direct distribution point for
    the raw HDF5 files this pipeline ingests, so its shipped LICENSE/README take precedence
    over the (apparently stale) GitHub README claim.'
  raw_format: 'https://github.com/NVlabs/dexmimicgen README.md: datasets distributed
    as .hdf5 files (robomimic/MimicGen HDF5 format), played back via scripts/playback_datasets.py.
    Re-verified 2026-07-10 against the live README; unchanged.'
  release_type: 'Confirmed fixed_episode_dataset: a concrete, versioned 21,000-episode
    / 59.9 GB dataset is released at https://huggingface.co/datasets/MimicGen/dexmimicgen_datasets
    (9 fixed generated/*.hdf5 files, one per task). Although DexMimicGen the *system*
    is a data-generation framework, this registry entry tracks the fixed released
    dataset, per docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    Sec.4B, which classifies dexmimicgen among the "55 已确认是有固定episode数据发布的 真实数据集"
    (confirmed fixed-episode datasets), distinct from robogen/gensim2 (generation_framework)
    and grutopia/humanoidbench.'
  collection_method: 'CORRECTED from simulation to human_to_robot_synthesis. arXiv:2410.24185
    abstract: "we introduce DexMimicGen, a large-scale automated data generation system
    that synthesizes trajectories from a handful of human demonstrations for humanoid
    robots with dexterous hands... We generate 21K demos across these tasks from just
    60 source human demos." Only 60 of the ~21,060 total demos (~0.3%) are genuine
    human teleoperation (collected via an iPhone/RoboTurk interface for parallel-jaw
    tasks and an Apple Vision Pro + OmniH2O retargeting system for dexterous-hand/humanoid
    tasks, per Sec. V "Teleoperation System"); the remaining ~99.7% are algorithmically
    synthesized via object-centric segmentation + transformation + replay in physics
    simulation (Sec. IV), the same MimicGen-family technique already classified as
    human_to_robot_synthesis in configs/mimicgen.yaml for consistency (that entry:
    "only 120 of ~50,120 demos are human teleop... matching the ''human_to_robot_synthesis''
    semantics"). Plain "simulation" undersells that the entire pipeline is seeded
    from and designed to reproduce specific human demonstrations, not scripted/RL-generated
    data.'
  secondary_collection_methods: 'Left empty (confirmed, not a gap): the human-teleop
    seed step (60 source demos) is already captured by collection_method=human_to_robot_synthesis
    itself, matching the precedent in configs/mimicgen.yaml which also leaves this
    list empty despite an analogous small-teleop-seed-set origin.'
  is_multi_embodiment: 'New field, filled true. arXiv:2410.24185 Sec. V "System Design":
    "We focus on three embodiments: (1) bimanual Panda arms equipped with parallel-jaw
    grippers, (2) bimanual Panda arms with dexterous hands, and (3) a GR-1 humanoid
    equipped with dexterous hands." Also confirmed via https://raw.githubusercontent.com/NVlabs/dexmimicgen/main/environments.md,
    which lists the 9 environments with their "suggested embodiments" split 3/3/3
    across exactly these three embodiments.'
  embodiment_class: New field, filled dual_arm (majority-of-tasks representative,
    following the same convention as configs/humanoidbench.yaml / configs/yubi.yaml
    for is_multi_embodiment=true entries). 6 of 9 task environments (TwoArmThreading,
    TwoArmThreePieceAssembly, TwoArmTransport, TwoArmDrawerCleanup, TwoArmBoxCleanup,
    TwoArmLiftTray -- per environments.md) use non-humanoid bimanual Panda arms (dual_arm);
    the remaining 3 (TwoArmCoffee, TwoArmPouring, TwoArmCanSortRandom) use the GR-1
    humanoid embodiment instead. The humanoid minority is captured via is_multi_embodiment=true
    rather than by picking humanoid arbitrarily as the single scalar value.
  robot_platform: 'New field, filled franka_panda (majority-of-tasks representative:
    6 of 9 task environments use bimanual Franka Panda arms, per environments.md and
    arXiv Sec. V). The remaining 3 tasks (Coffee, Pouring, Can Sorting) plus the real-world
    deployment use a Fourier GR-1 humanoid (arXiv Sec. VI-D "Hardware Setup": "We
    use a Fourier GR1 robot equipped with two 6-DoF Inspire dexterous hands") -- this
    is exactly the dataset that motivated adding RobotPlatform.FOURIER_GR1 to schema.py
    (per docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md Sec.3.2
    table, row "RobotPlatform | FOURIER_GR1 | fourier_gr1 | dexmimicgen"). That enum
    gap is now resolved (fourier_gr1 exists in schema.py), so the previous suggested_new_enum_values
    entry for it has been removed; franka_panda is recorded here as the majority platform
    and fourier_gr1 as the secondary one via is_multi_embodiment=true, rather than
    picking the newly-added value just because it was the reason the enum was extended.'
  num_arms: 'arXiv:2410.24185 title and Sec. V: "bimanual dexterous manipulation"
    across all 3 embodiments (two Panda arms, or GR-1''s two arms). Re-verified 2026-07-10;
    unchanged.'
  dof_per_hand: 'New field, filled 6. arXiv:2410.24185 Sec. VI-D "Hardware Setup":
    "We use a Fourier GR1 robot equipped with two 6-DoF Inspire dexterous hands."
    Also Sec. III Assumption A1 describes the dexterous-hand action as a "6-D joint
    command". Applies to the 6 of 9 tasks that use Inspire dexterous hands (Panda+dexterous-hand
    tasks and the 3 GR-1 humanoid tasks); the remaining 3 tasks use simple parallel-jaw
    grippers with no multi-fingered hand DoF.'
  gripper_type: 'New field, filled dexterous_hand (majority-of-tasks representative:
    6 of 9 task environments use Inspire dexterous hands -- TwoArmDrawerCleanup, TwoArmBoxCleanup,
    TwoArmLiftTray with Panda arms, plus the 3 GR-1 humanoid tasks -- per environments.md
    "suggested embodiments" and arXiv Sec. V). The remaining 3 tasks (Threading, ThreePieceAssembly,
    Transport) use plain parallel-jaw grippers on Panda arms instead.'
  hand_pose_representation: 'New field, filled joint_angles. arXiv:2410.24185 Sec.
    V "Controller Design": "For finger control, we directly use joint position control."
    Also Sec. III Assumption A1: dexterous-hand action = "6-D joint command". Finger/hand
    shape is commanded and represented as joint angles, not MANO parameters or 3D
    keypoints.'
  has_mobile_base: 'arXiv:2410.24185 Sec. V "System Design": fixed-base bimanual Panda
    arms and a stationary tabletop GR-1 humanoid setup; no mobile base described in
    any of the 9 released tasks. Re-verified 2026-07-10: note the project''s website
    (https://dexmimicgen.github.io/) also shows separate demos generated for the BiGym
    simulator ("Dishwasher Load Plates", "Flip Cup", "Put Cups") which do involve
    mobile bimanual manipulation, but these BiGym demos are NOT part of the released
    HDF5 dataset tracked by this config (the HF repo''s generated/ folder contains
    exactly the 9 Robosuite task files, no BiGym files) -- so has_mobile_base=false
    remains correct for the dataset this entry describes.'
  action_space: 'arXiv:2410.24185 Sec. III "Prerequisites" (Assumption A1): action
    consists of an end-effector pose command plus a hand/gripper actuation command
    (1-D for parallel-jaw, 6-D joint command for dexterous hand). Re-verified 2026-07-10;
    unchanged.'
  action_frame: 'https://raw.githubusercontent.com/NVlabs/dexmimicgen/main/scripts/generate_training_config.py
    (re-fetched and inspected directly 2026-07-10): panda_action_config() sets train.action_keys
    to .../right_rel_pos + .../right_rel_rot_axis_angle (and left_*) -- relative/delta
    position+rotation; humanoid_action_config() sets .../right_abs_pos + .../right_abs_rot_6d
    (and left_*) -- absolute position+rotation. Panda tasks use delta, humanoid tasks
    use absolute, so "both" (the dataset as a whole contains both conventions, in
    disjoint per-embodiment subsets) is correct and distinct from "mixed_delta_absolute"
    (which denotes delta-translation + absolute-rotation mixed within a single action
    vector, e.g. configs/omniumi.yaml) -- confirmed NOT applicable here since each
    embodiment''s action is internally consistent (fully delta or fully absolute,
    in both position and rotation).'
  rotation_representation: 'Left blank; no single enum value fits. Same generate_training_config.py
    evidence as action_frame: Panda tasks use rot_axis_angle (format: "rot_axis_angle"
    on the rel_rot_axis_angle key) -> axis_angle; GR-1 humanoid tasks use rot_6d (format:
    "rot_6d" on the abs_rot_6d key) -> rotation_6d. RotationRepresentation has no
    "mixed across embodiments" member, so this is left blank per instructions rather
    than picking one embodiment''s value arbitrarily; see suggested_new_enum_values.'
  fps: 'https://github.com/NVlabs/dexmimicgen/tree/main/dexmimicgen/environments (re-fetched
    two_arm_threading.py, two_arm_transport.py, two_arm_coffee.py, two_arm_can_sort.py
    directly 2026-07-10): control_freq=20 set identically in all inspected task environment
    files. Re-verified; unchanged.'
  fps_variable: same control_freq=20 constant across all inspected environment files,
    see fps source. Re-verified 2026-07-10; unchanged.
  num_camera_views: 'https://raw.githubusercontent.com/NVlabs/dexmimicgen/main/scripts/generate_training_config.py
    (re-fetched and inspected directly 2026-07-10): image_keys for most tasks = [agentview_image,
    robot0_eye_in_hand_image / robot0_eye_in_left_hand_image, robot1_eye_in_hand_image
    / robot0_eye_in_right_hand_image] (3 views); TwoArmTransport additionally logs
    2 shouldercamera views (5 total for that one task only). Re-verified; unchanged.'
  camera_views: Same generate_training_config.py image_keys lists (agentview_image
    -> third_person; robotX_eye_in_hand_image / robot0_eye_in_left/right_hand_image
    -> left_wrist/right_wrist). Re-verified 2026-07-10; unchanged.
  has_synchronized_multiview_rig: New field, filled true. All camera views for a given
    task (agentview + wrist/shoulder cameras) are robosuite/MuJoCo-rendered observations
    captured from the same simulation timestep in a single env.step() call, per the
    image_keys structure in generate_training_config.py -- i.e. the multi-camera array
    is inherently frame-synchronized by construction (simulated cameras sharing one
    physics/render step), unlike an asynchronous multi-camera setup.
  has_camera_calibration: 'New field, filled true. Same reasoning as configs/mimicgen.yaml
    (built on the identical robosuite/robomimic HDF5 format, confirmed by dexmimicgen''s
    own README: "datasets distributed as .hdf5 files (robomimic/MimicGen HDF5 format)"):
    camera poses are fixed/known values defined in the robosuite MJCF scene, and robomimic
    HDF5s store the exact per-episode model_file (including camera definitions), so
    intrinsics/extrinsics are exactly recoverable.'
  depth_coverage: 'https://github.com/NVlabs/dexmimicgen/tree/main/dexmimicgen/environments
    (re-fetched directly 2026-07-10): camera_depths=False set as default in all inspected
    task environment configs. Re-verified; unchanged.'
  additional_modalities: 'Left empty (confirmed, not a gap): searched the full arXiv:2410.24185
    text for force/torque, tactile, audio, and eye-gaze sensing -- no mentions of
    any of these as recorded observation modalities in the dataset (the paper''s only
    "torque" mention is the OSC controller''s internal joint-torque command output,
    not a logged sensor reading). No evidence found for any SensorModality member;
    left blank per instructions.'
  has_language_instruction: 'https://raw.githubusercontent.com/NVlabs/dexmimicgen/main/scripts/generate_training_config.py
    (re-fetched 2026-07-10): observation key lists (image_keys/low_dim_keys) contain
    no language field; paper''s BC/BC-RNN/Diffusion Policy training setup (Sec. VI)
    uses only image + low-dim state, no language conditioning. Re-verified; unchanged.'
  num_task_types: 'arXiv:2410.24185 Sec. V and Conclusion: "a collection of nine simulation
    environments across three embodiments" (Threading, Piece Assembly, Transport,
    Box Cleanup, Drawer Cleanup, Tray Lift, Pouring, Coffee, Can Sorting); confirmed
    again via environments.md''s list of exactly 9 named environments. Re-verified
    2026-07-10; unchanged.'
  urdf_available: https://github.com/ARISE-Initiative/robosuite/tree/main/robosuite/models/assets/robots
    contains a 'gr1' model directory plus native Franka Panda support; DexMimicGen
    builds directly on robosuite for all simulation environments. Re-verified 2026-07-10;
    unchanged.
  urdf_source: Same robosuite robots asset directory as above -- models ship in the
    robosuite community simulation-framework repo (ARISE-Initiative/robosuite), not
    in dexmimicgen's own repo nor an official manufacturer release. Re-verified 2026-07-10;
    unchanged.
  expected_size_gb: 'Recomputed 2026-07-10 directly from the Hugging Face API file
    listing (https://huggingface.co/api/datasets/MimicGen/dexmimicgen_datasets/tree/main/generated?recursive=true):
    summing the 9 generated/*.hdf5 file sizes (5,166,694,082 + 4,429,800,651 + 5,747,386,080
    + 5,092,903,986 + 9,763,944,466 + 6,315,139,413 + 3,913,396,274 + 4,322,918,683
    + 15,177,869,792 bytes) = 59,930,053,427 bytes = 59.93 GB (decimal GB). This confirms
    the existing 59.9 GB value is accurate (the HF repo-level "usedStorage" API field
    of ~64.76 GB includes non-generated repo overhead/LFS metadata and is not the
    right figure to use).'
  expected_num_episodes: 'arXiv:2410.24185 abstract: "We generate 21K demos across
    these tasks from just 60 source human demos." Re-verified 2026-07-10; unchanged.'
  expected_duration_hours: 'New field, filled as an approximate evidence-based estimate
    (155.6 hours) -- NOT a directly-reported statistic, flagged here for human review.
    Derived from https://raw.githubusercontent.com/NVlabs/dexmimicgen/main/scripts/generate_training_config.py
    (re-fetched 2026-07-10), which specifies an official per-task rollout "horizon"
    (in 20 Hz control steps) used for each task''s released BC-RNN/DP training config:
    box_cleanup=400, lift_tray=750, drawer_cleanup=550, three_piece_assembly=300,
    transport=1200, threading=400, pouring=400, coffee=400, can_sort=400. Average
    horizon = 4800/9 = 533.3 steps -> 26.67 s/episode at 20 Hz. Assuming the 21,000
    released episodes are spread roughly evenly across the 9 tasks (not independently
    confirmed), total duration = 21000 x 26.67 s / 3600 = ~155.6 hours. This horizon
    is the training-time rollout length, not a directly measured average demo length,
    so the estimate carries real uncertainty -- contributes to review_status remaining
    pending_human_review.'
  num_scenes: 'New field, filled 9. arXiv:2410.24185 Sec. V: "a collection of nine
    simulation environments" -- unlike configs/calvin.yaml or configs/behavior_1k.yaml
    where many tasks share a smaller pool of physical scenes, DexMimicGen''s 9 tasks
    each have their own dedicated, non-interchangeable simulation environment/scene
    (Threading, Piece Assembly, Transport, Box Cleanup, Drawer Cleanup, Tray Lift,
    Pouring, Coffee, Can Sorting), i.e. a 1:1 task-to-scene mapping, per environments.md.'
  source_url_confirmation: 'https://github.com/NVlabs/dexmimicgen README.md "Website:
    https://dexmimicgen.github.io" -- re-confirms stub source_url is correct, no change
    needed (re-verified 2026-07-10).'
suggested_new_enum_values:
  rotation_representation: mixed_by_embodiment -- Panda-arm tasks use axis-angle delta
    rotation (rot_axis_angle) while GR-1 humanoid tasks use 6D absolute rotation (rot_6d),
    per generate_training_config.py's panda_action_config/ humanoid_action_config.
    No existing RotationRepresentation member covers "different representation per
    embodiment within one dataset" (analogous to the gap ActionFrame.MIXED_DELTA_ABSOLUTE
    fills for action_frame, but across embodiments rather than within one action vector).
