field_sources:
  source_url: https://github.com/haosulab/ManiSkill (official code+docs repo; website
    https://www.maniskill.ai/, paper https://arxiv.org/abs/2410.00425); re-verified
    2026-07-10, unchanged
  license: https://github.com/haosulab/ManiSkill/blob/main/LICENSE (Apache-2.0 for
    code); README.md License section notes environment code is Apache-2.0 while imported
    3D assets are CC-BY-NC-4.0 (https://raw.githubusercontent.com/haosulab/ManiSkill/main/README.md);
    HF dataset card haosulab/ManiSkill_Demonstrations tags license:apache-2.0; re-verified
    2026-07-10, unchanged
  raw_format: https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html
    ('All demonstrations for a task are saved in the HDF5 format openable by h5py');
    re-verified 2026-07-10, unchanged
  collection_method: 'arXiv:2410.00425 (ManiSkill3 paper), Section on Demonstration
    Datasets: ''ManiSkill3 sources large-scale demonstrations through a combination
    of different methods'' -- motion planning, RL rollouts, and teleoperation, all
    executed inside the GPU simulator; overall category is simulation-generated data;
    re-verified 2026-07-10, unchanged as the primary/umbrella method -- see secondary_collection_methods
    for the specific in-sim techniques also directly evidenced in the released HF
    dataset repo directory structure.'
  embodiment_class: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    (default single-arm Panda agent used as default robot_uids for most tabletop tasks,
    e.g. pick_cube.py); re-verified 2026-07-10, unchanged (kept as the majority/default
    tabletop embodiment -- see is_multi_embodiment=true for the full picture)
  robot_platform: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/envs/tasks/tabletop/pick_cube.py
    (robot_uids='panda' is the default robot for the majority of tabletop tasks);
    re-verified 2026-07-10, unchanged
  num_arms: same Panda agent source; single 7-DOF arm + parallel gripper; re-verified
    2026-07-10, unchanged
  dof_per_arm: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    (arm_joint_names lists 7 joints: panda_joint1..7); re-verified 2026-07-10, unchanged'
  gripper_type: 'same Panda source (gripper_joint_names: panda_finger_joint1/2, a
    mimic parallel 2-finger gripper); re-verified 2026-07-10, unchanged'
  has_mobile_base: Panda (default/representative robot) has no mobile base; note ManiSkill3
    separately supports mobile manipulators (e.g. Fetch, seen as SUPPORTED_ROBOTS
    in pick_cube.py) and quadruped/humanoid embodiments; re-verified 2026-07-10, unchanged
  action_space: 'https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html:
    raw/original trajectory.h5 files are generated by the pd_joint_pos (PD Joint Position)
    controller by default; re-verified 2026-07-10, unchanged'
  action_frame: 'Corrected 2026-07-10 from ''absolute'' to ''both''. Evidence: https://huggingface.co/api/datasets/haosulab/ManiSkill_Demonstrations?full=true
    directory listing shows released trajectory files use DIFFERENT controllers across
    tasks -- e.g. demos/AnymalC-Reach-v1/rl/trajectory.none.pd_joint_delta_pos...
    and demos/LiftPegUpright-v1/rl/trajectory.none.pd_ee_delta_pose.../trajectory.none.pd_joint_delta_pos...
    are DELTA-only (no absolute variant published for these tasks), while demos/PickCube-v1/motionplanning/trajectory.h5,
    demos/DrawTriangle-v1/motionplanning/trajectory.h5, demos/PegInsertionSide-v1/motionplanning/trajectory.h5
    and demos/PlugCharger-v1/motionplanning/trajectory.h5 are the default trajectory.none.pd_joint_pos...
    (ABSOLUTE joint position, per https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html).
    PickCube-v1 additionally ships BOTH an absolute motion-planning trajectory and
    delta-controller RL trajectories (pd_ee_delta_pos/pd_ee_delta_pose/pd_joint_delta_pos)
    side by side in the same HF repo. Since the released dataset genuinely mixes absolute-
    and delta-frame trajectories across tasks/collection-methods (not just theoretically-supported-but-unused
    controllers), ''both'' is more accurate than picking either exclusively.'
  rotation_representation: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    controller_configs: default pd_joint_pos controller acts purely in joint space,
    no explicit end-effector rotation representation is used; re-verified 2026-07-10,
    unchanged for the default/majority pd_joint_pos (pure joint-space, no explicit
    orientation encoding) trajectories. Caveat: the pd_ee_delta_pose controller variant
    also present in the released dataset (see action_frame correction) does include
    a delta end-effector rotation component; its exact rotation encoding was not confirmed
    from documentation found, so ''none'' should be read as applying to the majority/default
    subset only, not asserted dataset-wide.'
  action_dim: 'Panda controller_configs: arm_pd_joint_pos covers 7 arm joints + gripper_pd_joint_pos
    (mimic-controlled 2-finger gripper as 1 actuated dim) = 8-dim action, matching
    well-known ManiSkill Panda action space; re-verified 2026-07-10, unchanged for
    the default pd_joint_pos Panda controller (7 arm joints + 1 mimic-gripper dim
    = 8). Caveat: alternate controller variants also present in the released dataset
    (pd_ee_delta_pos / pd_ee_delta_pose, see action_frame correction) have a different
    action_dim; 8 represents the default/majority controller only.'
  fps: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/utils/structs/types.py
    SimConfig defaults: sim_freq=100, control_freq=20 (control_freq is the effective
    per-step/demonstration fps); re-verified 2026-07-10, unchanged'
  fps_variable: arXiv:2410.00425 Figure 4 benchmark uses sim_freq=120/control_freq=60
    for some tasks, and the sim2real experiment (Section VIII-B) uses a 30Hz control
    frequency, showing fps differs by task from the SimConfig default of 20Hz; re-verified
    2026-07-10, unchanged
  num_camera_views: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/envs/tasks/tabletop/pick_cube.py
    _default_sensor_configs returns a single CameraConfig('base_camera', ...) for
    the default policy-observation camera; re-verified 2026-07-10, unchanged
  camera_views: 'same pick_cube.py source: single ''base_camera'' positioned via look_at()
    as a third-person table-top view; paper Figure 29 also references ''hand_camera''
    (wrist) and ''left/right_shoulder_camera'' as optional multi-view additions in
    some tasks; re-verified 2026-07-10, unchanged'
  has_camera_calibration: cameras are procedurally placed with exactly known pose/intrinsics
    in SAPIEN/ManiSkill (CameraConfig pose + fov + near/far), so calibration parameters
    are always exactly known by construction; re-verified 2026-07-10, unchanged
  depth_coverage: 'https://maniskill.readthedocs.io/en/latest/user_guide/concepts/sensors.html:
    every shader preset (minimal/default/rt/rt-med/rt-fast) supports a ''depth'' texture
    output for every camera; re-verified 2026-07-10, unchanged'
  has_language_instruction: https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html
    Meta Information (JSON) schema lists env_info/episodes/episode_id/reset_kwargs/control_mode/elapsed_steps/info
    with no per-episode language-instruction field; arXiv:2410.00425 Section X-B notes
    text descriptions were only hard-coded ad hoc for the PerAct baseline, not stored
    as part of the demonstration dataset itself; re-verified 2026-07-10, unchanged
  num_task_types: 'arXiv:2410.00425 abstract/Section VII: ''the most comprehensive
    range of GPU parallelized environments/tasks spanning 12 distinct domains'' (table-top
    manipulation, mobile manipulation, room-scale scenes, quadruped/humanoid locomotion,
    humanoid/bi-manual manipulation, multi-agent robotics, drawing/cleaning, dextrous
    manipulation, vision-tactile manipulation, classic control, digital twins, external
    benchmarks); note individual task/environment IDs (e.g. PickCube-v1, StackCube-v1,
    ...) number well over 50 across these 12 domains per https://maniskill.readthedocs.io/en/latest/tasks/index.html
    category pages; re-verified 2026-07-10, unchanged'
  urdf_available: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    urdf_path points to a bundled panda_v2.urdf inside PACKAGE_ASSET_DIR; re-verified
    2026-07-10, unchanged
  urdf_source: 'same source: robot URDFs (Panda and other supported robots) ship inside
    the mani_skill package/repo itself; re-verified 2026-07-10, unchanged'
  expected_size_gb: https://huggingface.co/api/datasets/haosulab/ManiSkill_Demonstrations?full=true
    field 'usedStorage'=9058933081 bytes (~9.06 GB) for the full haosulab/ManiSkill_Demonstrations
    HF dataset repo referenced by the official download_demo tool; re-verified 2026-07-10
    via https://huggingface.co/api/datasets/haosulab/ManiSkill_Demonstrations?full=true
    field usedStorage=9058933081 bytes = 9.058933081 GB, unchanged
  paper_url: 'https://arxiv.org/abs/2410.00425 ("ManiSkill3: GPU Parallelized Robotics
    Simulation for Generalizable Embodied AI", NeurIPS 2024 Datasets & Benchmarks
    track; new field, previously only referenced parenthetically inside source_url''s
    field_sources note)'
  release_type: Corrected 2026-07-10 from 'fixed_episode_dataset' to 'rl_benchmark_env'.
    arXiv:2410.00425 abstract/title ("GPU Parallelized Robotics Simulation for Generalizable
    Embodied AI") and Section IV (RL + imitation-learning baselines) plus https://maniskill.readthedocs.io/en/latest/tasks/index.html
    ("ManiSkill features a number of built-in rigid-body tasks, all GPU parallelized")
    show ManiSkill3 is fundamentally a GPU-parallelized RL/IL benchmark-environment
    suite spanning 12 task domains, not a fixed pre-collected episode dataset; the
    downloadable HDF5 demonstrations (haosulab/ManiSkill_Demonstrations) are a secondary
    artifact generated from these benchmark environments via motion planning/RL/teleop.
    Matches the classification precedent for humanoidbench in docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    sec 4B (a same-shaped RL benchmark suite).
  secondary_collection_methods: 'https://huggingface.co/api/datasets/haosulab/ManiSkill_Demonstrations?full=true
    directory listing (siblings): per-task subfolders ''motionplanning/'', ''rl/'',
    ''teleop/'', e.g. demos/PickCube-v1/{motionplanning,rl,teleop}/trajectory*.h5;
    https://maniskill.readthedocs.io/en/latest/user_guide/data_collection/index.html
    ("via programmed motion planning solutions, [and] a variety [of] teleoperation
    systems"); arXiv:2410.00425 Sec III-G ("ManiSkill3 sources large-scale demonstrations
    through a combination of different methods... motion planning and rewards for
    RL are used... For more complex tasks, we collect demonstration data... via teleoperation
    tools. Then, we use RFCL... to run fast online imitation learning and generate
    data from converged policies"). teleop = human VR teleoperation in sim; autonomous_policy
    = RL-policy-rollout-generated trajectories (RFCL/RL checkpoints, e.g. rl/ppo_*_ckpt.pt
    files present in the HF repo); motion-planning-generated trajectories are folded
    into the primary ''simulation'' collection_method tag since there is no dedicated
    enum value for scripted motion planning.'
  is_multi_embodiment: 'arXiv:2410.00425 abstract/Sec I: "We further support 20+ different
    robot embodiments out of the box such as quadrupeds, floating grippers, humanoids,
    and dextrous hands"; https://maniskill.readthedocs.io/en/latest/robots/index.html
    lists 30+ modelled robots (Anymal C quadruped, Allegro/Inspire dexterous hands,
    Fetch mobile manipulator, Unitree G1/H1 humanoids, Franka Panda, UR10e, WidowX,
    XArm6/7, etc). robot_platform/embodiment_class are kept as franka_panda/single_arm
    (the majority/default embodiment for tabletop tasks) per the same convention applied
    to humanoidbench/yubi in docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    sec 4.'
  hand_pose_representation: 'Franka Panda (the representative/default embodiment)
    uses a parallel_jaw gripper_type, not a dexterous multi-finger hand, so no finger/hand-shape
    encoding (MANO/keypoints/joint-angles) applies -> hand_pose_representation=none,
    analogous to rotation_representation=none for the pure joint-space controller.
    https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py.
    Note: ManiSkill3 does include genuine dexterous-hand tasks (Allegro Hand, Inspire
    Hand -- https://maniskill.readthedocs.io/en/latest/robots/index.html, and the
    ''Dextrous Hand Tasks'' category in https://maniskill.readthedocs.io/en/latest/tasks/index.html)
    but the specific hand-shape encoding used for those tasks'' action/observation
    space was not documented in the sources checked, so ''none'' is asserted only
    for the representative Panda embodiment, not dataset-wide.'
  has_synchronized_multiview_rig: 'arXiv:2410.00425 multi-view voxelized-observation
    experiments (Figs 28-29, Table V): "Default-view RGBD observations. Cameras from
    left to right: hand_camera, base_camera" vs "Multi-view RGBD observations" additionally
    using a left shoulder camera and right shoulder camera together with the wrist/hand
    camera and base camera simultaneously for StackCube-v1 -- i.e. several synchronized
    cameras captured together within the same episode/experiment, not just alternative
    single-camera configs. Table V lists the camera set used per experiment.'
  additional_modalities: 'arXiv:2410.00425 abstract & Sec VII-I "Vision Tactile Manipulation"
    (one of the 12 task domains): "Tactile sensing is further provided in environments
    via touch sensors placed on the dextrous hand at various points"; Sec VII-I describes
    a key-insertion task requiring tactile inputs due to visual occlusions, simulated
    via a silicone soft-body tactile sensor, with feedback data shown in Figure 23.
    https://maniskill.readthedocs.io/en/latest/robots/index.html also lists an ''Allegro
    Hand Right with Touch Sensing'' robot model. Scope caveat: tactile sensing applies
    specifically to the vision-tactile-manipulation task subset (e.g. peg/key insertion),
    not to the majority of tabletop Panda tasks represented by the other scalar fields
    in this config.'
suggested_new_enum_values: {}
