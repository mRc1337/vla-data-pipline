id: nvidia_physicalai_robotics_manipulation_objects
name: NVIDIA PhysicalAI-Robotics-Manipulation-Objects
source_url: https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Objects
license: custom_research_eula
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: mobile_manipulator
robot_platform: kinova_gen3
num_arms: 2
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: true
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 13
action_dim: 34
fps: 50.0
fps_variable: false
num_camera_views: 5
camera_views:
- third_person
- third_person
- head
- left_wrist
- right_wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities:
- semantic_segmentation
has_language_instruction: false
num_task_types: 3
urdf_available: true
urdf_source: manufacturer_official
expected_size_gb: 4.0
expected_num_episodes: 540
expected_duration_hours: 0.72
review_status: pending_human_review
field_sources:
  source_url: HF dataset page https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Objects
    -- verified reachable via HF datasets API (https://huggingface.co/api/datasets/nvidia/PhysicalAI-Robotics-Manipulation-Objects)
    and README.md fetched from the raw file path. Unchanged (already pre-filled).
  license: 'README.md ''License/Terms of Use'': ''[Nvidia Non-Commercial License](./NVIDIA%20OneWay%20Noncommercial%20License.pdf)''
    -- the repo ships a custom NVIDIA-authored PDF EULA (''NVIDIA OneWay Noncommercial
    License.pdf''), not a standard Creative Commons license. No LicenseEnum value
    exactly represents this custom NVIDIA non-commercial EULA (it is legally distinct
    from CC-BY-NC-4.0/-SA/-ND, which are standardized Creative Commons terms), so
    the closest existing fit -- Proprietary (custom, restrictive, non-open license)
    -- was used. See suggested_new_enum_values.'
  raw_format: 'README.md ''Intended Usage'': ''This dataset is provided in LeRobot
    format and is intended for training robot policies and foundation models.'' Confirmed
    by meta/info.json ''codebase_version'': ''v2.1'' fetched for all three sub-datasets
    (pick, place_bench, place_cabinet).'
  release_type: The repo ships three pre-recorded, fixed-size LeRobot sub-datasets
    (pick, place_bench, place_cabinet), each with a fixed total_episodes count per
    meta/info.json -- a released, static artifact generated once via IsaacSim, not
    a generation framework/scene platform/RL env a user runs themselves. Same convention
    as configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml (sibling NVIDIA
    IsaacSim-generated dataset) and configs/robotwin.yaml/configs/libero.yaml for
    TAMP/simulator-generated fixed releases.
  collection_method: 'README.md ''Dataset Description'' and ''Dataset Characterization
    / Data Collection Method'': ''Automated'', ''Automatic/Sensors'', ''Synthetic'':
    ''The dataset was generated in IsaacSim leveraging reasoning algorithms and optimization-based
    motion planning to find solutions to the tasks automatically... The environments
    are kitchen scenes where the furniture and appliances were procedurally generated.''
    No human teleoperation is involved anywhere -> simulation, matching the same registry
    convention used for the singlearm sibling config (configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml)
    and configs/robotwin.yaml, configs/maniskill3.yaml (automated/scripted/motion-planning-generated
    sim data, as opposed to human-teleop-in-sim, which is `teleop`).'
  secondary_collection_methods: README.md Data Collection Method section describes
    only automated reasoning/motion-planning generation (PDDLStream + scene_synthesizer
    procedural scenes + CuRobo motion planning, same three references as the singlearm
    sibling); no human teleoperation, autonomous learned policy, or other secondary
    method is mentioned. Left empty.
  is_multi_embodiment: README.md describes a single bimanual mobile-manipulator platform
    ('a bimanual manipulator built with Kinova Gen3 arms') used throughout; confirmed
    by identical 34-dim action feature names (wheels/torso/pan-tilt/two 7-DOF Kinova
    arms/grippers) and identical 13-dim observation.state schema across all three
    sub-datasets' meta/info.json (pick, place_bench, place_cabinet). No other embodiment
    appears.
  embodiment_class: 'README.md ''Dataset Description'': ''The dataset includes a bimanual
    manipulator built with Kinova Gen3 arms.'' meta/info.json `action.names` (identical
    across all 3 sub-datasets) additionally list front/rear wheel joints (front_rocker,
    front_left_wheel, front_right_wheel, rear_left_wheel, rear_right_wheel) and an
    ewellix_torso_joint -- i.e. two arms mounted on a wheeled mobile base with an
    actuated torso/pan-tilt head. Two arms + wheeled base = mobile_manipulator, matching
    the same registry convention used for other wheeled bimanual/mobile platforms
    (configs/mobile_aloha.yaml, configs/behavior_robot_suite.yaml, configs/galaxea_open_world_dataset.yaml,
    configs/robocasa.yaml), not dual_arm (which is reserved for fixed-base bimanual
    rigs).'
  robot_platform: 'README.md ''Dataset Description'': ''a bimanual manipulator built
    with Kinova Gen3 arms'' -- exact match to RobotPlatform.KINOVA_GEN3.'
  num_arms: meta/info.json `action.names` (identical across all three sub-datasets)
    contain two disjoint 7-joint arm chains, `left_arm_joint_1..7` and `right_arm_joint_1..7`,
    each with its own finger/gripper joints -- confirms exactly two manipulator arms
    (bimanual), matching README 'bimanual manipulator'.
  dof_per_arm: meta/info.json `action.names` for all three sub-datasets enumerate
    exactly `left_arm_joint_1` through `left_arm_joint_7` and `right_arm_joint_1`
    through `right_arm_joint_7` -- 7 revolute joints per arm, the manufacturer-standard
    DOF count for the Kinova Gen3.
  gripper_type: meta/info.json `action.names` include, per arm, a driven `*_finger_joint`
    plus mechanically-coupled `*_left_inner_finger_joint`/`*_left_inner_knuckle_joint`/`*_right_outer_knuckle_joint`/`*_right_inner_finger_joint`/`*_right_inner_knuckle_joint`
    entries -- the classic linkage of a Robotiq-style adaptive 2-finger gripper (the
    standard Kinova Gen3 end effector), which closes/opens as a single parallel-jaw
    motion despite the multiple linked joint names; matches GripperType.PARALLEL_JAW,
    consistent with how other Robotiq-gripper datasets in this registry (e.g. configs/galaxea_open_world_dataset.yaml)
    are classified.
  has_mobile_base: meta/info.json `action.names` (identical across all three sub-datasets)
    include `front_rocker`, `front_left_wheel`, `front_right_wheel`, `rear_left_wheel`,
    `rear_right_wheel` -- a 4-wheel (plus rocker/suspension joint) mobile base under
    the bimanual arm assembly.
  action_space: 'Verified empirically by downloading and inspecting pick/data/chunk-000/episode_000000.parquet
    (HF resolve URL) with pandas/pyarrow: every one of the 34 action dimensions holds
    physically-meaningful, joint-limit-scale radian values (e.g. left_arm_joint_1
    ranges roughly -2.83 to -0.79 rad, tilt_joint 0.03 to 1.05 rad) that stay constant
    across several consecutive frames before stepping to a new held value -- the signature
    of joint-position waypoint/motion-plan targets, not velocities or torques or an
    eef-pose parameterization (no eef position/orientation dims exist in the 34-dim
    action at all, only joint names). Matches ActionSpace.JOINT_POSITION for the whole
    34-dim vector, including the (in this pick/place task, stationary/zero) wheel-joint
    entries.'
  action_frame: 'Same parquet inspection as action_space: values are absolute joint
    angles within physical joint-limit ranges (not small per-step deltas), and hold
    steady at a fixed absolute value across multiple consecutive frames -- confirms
    ActionFrame.ABSOLUTE, not delta.'
  rotation_representation: 'README.md ''Dataset Format'': observation.state''s 12
    rotation-adjacent dims (`r_xx..r_zz`) encode ''the vectorized transform matrix
    of the ''object of interest''''s'' orientation, not the robot wrist/end-effector''s
    orientation -- and the 34-dim action space is pure joint-space (no eef pose dimensions
    at all, per the action_space finding above). Since this field''s intended semantics
    are specifically the wrist/eef orientation encoding, and no eef/wrist orientation
    is represented anywhere in this dataset''s action or state, RotationRepresentation.NONE
    applies (same reasoning/precedent as configs/mobile_aloha.yaml and configs/galaxea_open_world_dataset.yaml
    for pure joint-space action datasets).'
  state_dim: 'README.md ''Dataset Format'': ''observation.state: 13D where the first
    12D are the vectorized transform matrix of the \"object of interest\"... The 13th
    entry is the joint value for the articulated object of interest.'' Confirmed by
    meta/info.json `observation.state.shape: [13]` identically across all three sub-datasets.
    Note this is an object-pose state, not robot proprioception.'
  action_dim: 'meta/info.json `action.shape: [34]` confirmed identically across all
    three sub-datasets (pick, place_bench, place_cabinet); README.md ''action modality:
    34D which includes joint states for the two arms, gripper joints, pan and tilt
    joints, torso joint, and front and back wheels.'''
  fps: 'meta/info.json `"fps": 50.0` confirmed identically for all three sub-datasets
    (pick, place_bench, place_cabinet) fetched individually.'
  fps_variable: 'Same meta/info.json check across all three sub-datasets: every one
    reports fps: 50.0 with zero variation.'
  num_camera_views: README.md 'Dataset Format' lists exactly five observation.image
    keys (world__world_camera, external_camera, world__robot__right_arm_camera_color_frame__right_hand_camera,
    world__robot__left_arm_camera_color_frame__left_hand_camera, world__robot__camera_link__head_camera),
    each confirmed as its own set of `.rgb`/`.distance_to_image_plane`/`.semantic_segmentation`
    video features in meta/info.json for all three sub-datasets -- 5 distinct camera
    viewpoints (each rendered in 3 modalities).
  camera_views: '`world__world_camera` and `external_camera` are both fixed, world-frame
    scene-overview cameras (README: general kitchen-scene renderings, not robot-mounted)
    -> mapped to third_person (twice, one per fixed exterior viewpoint, same convention
    as configs/robocasa.yaml mapping two agentview cameras to third_person); `world__robot__camera_link__head_camera`
    is mounted on the robot''s pan/tilt head -> head; `world__robot__left_arm_camera_color_frame__left_hand_camera`
    and `world__robot__right_arm_camera_color_frame__right_hand_camera` are each arm''s
    wrist-mounted camera -> left_wrist / right_wrist respectively.'
  has_synchronized_multiview_rig: 'Inferred, not an explicit README statement: all
    five camera views (and their rgb/depth/segmentation modalities) are rendered from
    the same IsaacSim simulation state at each recorded frame/timestep (same reasoning
    applied to other IsaacSim/simulator sim datasets in this corpus, e.g. configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml,
    configs/maniskill3.yaml, configs/mimicgen.yaml), so all views are synchronized
    by construction.'
  has_camera_calibration: 'Inferred: camera placement/intrinsics for all five camera
    views are deterministically defined by the IsaacSim scene/rig setup used to generate
    every episode (simulation), so calibration parameters are always derivable, even
    though no separate calibration file is shipped in the HF repo file listing. Same
    reasoning as configs/nvidia_physicalai_robotics_manipulation_singlearm.yaml, configs/libero.yaml,
    configs/maniskill3.yaml for simulator-generated datasets.'
  depth_coverage: meta/info.json `features` block for all three sub-datasets lists
    a `.distance_to_image_plane` depth-video feature for every one of the 5 camera
    views (world_camera, external_camera, right_hand_camera, left_hand_camera, head_camera)
    -- depth is present for 100% of camera views -> DepthCoverage.FULL.
  additional_modalities: 'Checked README.md and meta/info.json `features` blocks for
    all three sub-datasets: beyond RGB video, every camera view also ships a `.semantic_segmentation`
    video feature (confirmed by README ''illustrate the different camera modalities''
    section and the assets/episode_000057_semantic.gif example) -- but SensorModality
    only defines force_torque/tactile/audio/eye_gaze, none of which apply, and no
    force_torque, tactile, audio, or eye_gaze feature exists anywhere. additional_modalities
    left empty per the current enum, but see suggested_new_enum_values: this dataset
    genuinely ships dense per-camera semantic segmentation as a first-class modality
    that the current SensorModality enum cannot represent.'
  has_language_instruction: 'Checked meta/tasks.jsonl for all three sub-datasets:
    each entry''s `task` string is a procedurally-generated scene/episode identifier
    (e.g. `{"task_index": 0, "task": "procedural_kitchen_pick_288015-d820a30"}`),
    not a descriptive natural-language instruction of the episode content. No other
    language-instruction field is present anywhere. Set false.'
  num_task_types: 'README.md ''Dataset Format'' section names exactly three sub-datasets/task
    types: `pick` (''The robot picks an object from the bench top''), `place_bench`
    (''places it on the kitchen''s bench top''), and `place_cabinet` (''places it
    inside an opened cabinet'').'
  urdf_available: https://github.com/Kinovarobotics/ros_kortex (kortex_description
    package) ships the official Kinova Gen3 arm URDF/xacro files for the Kinova Gen3
    arms used in this dataset. Same precedent as configs/galaxea_open_world_dataset.yaml
    and other Kinova/manufacturer-arm datasets in this registry.
  urdf_source: https://github.com/Kinovarobotics/ros_kortex kortex_description package
    is Kinova Robotics' own official URDF for the Gen3 arm -- not shipped inside this
    specific HF dataset repo itself (the full mobile bimanual platform with custom
    base/torso/head is not known to have a single combined manufacturer URDF, so this
    reflects the arm component only, same caveat as configs/robocasa.yaml for its
    Franka-arm-on-mobile-base platform).
  expected_size_gb: 'README.md ''Dataset Quantification'': ''Total storage: 4.0 GB''
    (stated directly for the full three-sub-dataset collection).'
  expected_num_episodes: 'README.md ''Dataset Quantification / Record Count'' per
    sub-dataset: 272 (pick) + 142 (place bench) + 126 (place cabinet) = 540 episodes,
    summed exactly across all three sub-datasets; also matches `total_episodes` in
    each sub-dataset''s meta/info.json.'
  expected_duration_hours: 'Computed from README.md ''Dataset Quantification'' per-sub-dataset
    frame counts: 69726 (pick) + 29728 (place bench) + 30322 (place cabinet) = 129776
    total frames, divided by the confirmed uniform fps of 50.0 (meta/info.json, all
    three sub-datasets) and by 3600: 129776 / 50 / 3600 = 0.72098 hours, rounded to
    0.72.'
  num_subjects: 'Checked README.md in full: data collection is fully automated (IsaacSim
    reasoning + optimization-based motion planning), no human operators/teleoperators/subjects
    are involved or mentioned anywhere. Left blank rather than report a non-applicable
    human-subject count.'
  num_scenes: 'README.md: ''The environments are kitchen scenes where the furniture
    and appliances were procedurally generated'' -- procedurally randomized per episode
    (confirmed by the per-episode unique procedural_kitchen_*_<seed>-<hash> task identifiers
    in meta/tasks.jsonl), with no discrete stated count of distinct scenes/layouts.
    Left blank rather than fabricate.'
  num_objects: 'Checked README.md and meta/info.json state-feature names in full:
    observation.state tracks a single, per-episode ''object of interest'' pose (12D
    transform + 1D articulation joint value) with no inventory/count of distinct object
    categories or instances given anywhere on the HF page. Left blank rather than
    fabricate.'
  paper_url: 'Checked README.md ''Reference(s)'' section in full: it cites the same
    three supporting-technique papers as the singlearm sibling ([1] PDDLStream, [2]
    scene_synthesizer, [3] CuRobo) used to build the generation pipeline, but none
    of them is a paper describing this dataset itself, and no other dataset-specific
    paper/citation is given anywhere on the HF page. Left blank rather than cite an
    unrelated method paper as ''the'' paper_url.'
suggested_new_enum_values:
  license: NVIDIA ships this dataset under a custom 'NVIDIA OneWay Noncommercial License'
    PDF EULA (distinct from any standard Creative Commons license), also used for
    other NVIDIA PhysicalAI research releases. A dedicated LicenseEnum value (e.g.
    `NVIDIA_ONEWAY_NC`) would let this be recorded precisely instead of approximated
    as Proprietary.
  additional_modalities: A SEMANTIC_SEGMENTATION (or generic SEGMENTATION) SensorModality
    value would help for datasets like this one that ship dense per-camera semantic-segmentation
    video as a first-class rendered modality (5 camera views x semantic_segmentation
    video, confirmed in meta/info.json feature blocks and README asset GIFs) alongside
    RGB/depth. Currently no SensorModality value (force_torque/tactile/audio/eye_gaze)
    covers this, so additional_modalities was left empty instead of misrepresenting
    the dataset as lacking this modality.
