field_sources:
  license: 'RE-VERIFIED 2026-07-10, unchanged: https://assembly-101.github.io/ License
    section verbatim: ''Assembly101 is licensed by us under a Creative Commons Attribution-NonCommercial
    4.0 International License''; identical wording confirmed in github.com/assembly-101/assembly101-download-scripts
    README and github.com/assembly-101/assembly101-annotations README; HuggingFace
    dataset card (huggingface.co/datasets/cvml-nus/assembly101) cardData.license=cc-by-nc-4.0'
  raw_format: 'RE-VERIFIED 2026-07-10, unchanged: github.com/assembly-101/assembly101-download-scripts
    README folder-structure listing - recordings are per-view .mp4 files (e.g. C10095_rgb.mp4,
    HMC_*_mono10bit.mp4) organized per-sequence folder (nusar-2021_action_both_...),
    plus separate CSV/txt annotation files and AssemblyPoses.zip; no RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord
    container, so mapped to Custom'
  release_type: 'RE-VERIFIED 2026-07-10, unchanged: fixed set of 362 pre-recorded
    sequences released once (plus later annotation updates), not a generator/framework/platform/RL
    env - fits fixed_episode_dataset'
  collection_method: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712 abstract
    ''Assembly101 is the first multi-view action dataset, with simultaneous static
    (8) and egocentric (4) recordings'' of human participants (no robot involved).
    No better-fitting enum value exists (see suggested_new_enum_values) so egocentric_human
