id: gensim2
name: GenSim2
source_url: https://gensim2.github.io/
license: MIT
raw_format: Custom
release_type: generation_framework
collection_method: simulation
secondary_collection_methods: []
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: false
action_space: eef_pose
action_frame: absolute
rotation_representation: quaternion
state_dim: 15
action_dim: 8
num_camera_views: 4
camera_views:
- front
- side
- wrist
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: true
num_task_types: 50
urdf_available: true
urdf_source: dataset_repo
review_status: pending_human_review
field_sources:
  source_url: https://gensim2.github.io/ (verified reachable; links to paper, code,
    and tutorial)
  license: https://github.com/GenSim2/GenSim2 README badge and GitHub API license
    field (MIT), https://github.com/GenSim2/GenSim2/blob/master/README.md
  raw_format: https://github.com/GenSim2/GenSim2/blob/master/gensim2/agent/dataset/sim_traj_dataset.py
    -- trajectories stored via a custom zarr-based ReplayBuffer (not RLDS/HDF5/LeRobot/TFRecord/ROS_bag),
    hence Custom
  collection_method: arXiv:2410.03645 Section 3.2 (Demonstration Generation via keypoint-based
    motion planning and RL solvers run in SAPIEN simulation); bulk of released demonstrations
    are simulation-generated. A small supplementary set (10 real-world demos/task)
    was collected via teleoperation for co-training, per Section 5.1
  embodiment_class: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- single fixed-base Franka arm
  robot_platform: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent(robot='panda') default, loading ASSET_ROOT/robot/panda/panda_newgripper.urdf;
    an alternate 'fr3' (Franka Research 3) option also exists in the same function,
    and the real-robot experiments in arXiv:2410.03645 Section 5.1 used a Franka Research
    3 arm
  num_arms: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- one arm agent per environment
  dof_per_arm: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    setup() -- init_qpos has 7 arm joint values (plus 2 gripper finger joints)
  gripper_type: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    (panda_leftfinger/panda_rightfinger parallel gripper links); arXiv:2410.03645
    Sec. 5.1 describes a modified parallel (TPU) gripper on the real robot
  has_mobile_base: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- fixed base_link_name ('panda_link0'/'fr3_link0'), no mobile base
    code path
  action_space: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() -- action encodes a target end-effector pose (position + rotation)
    plus gripper command, passed to a motion planner
  action_frame: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() -- action pose is used directly as the planner's target pose (absolute),
    not as a delta from current pose
  rotation_representation: 'https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() (accepts an euler or quaternion rotation block) and https://github.com/GenSim2/GenSim2/blob/master/gensim2/agent/experiments/configs/env/gensim2.yaml
    (default `domains: real_data_11task_10eps_quat_10240` dataset name indicates quaternion
    action representation is the one actually used)'
  state_dim: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    get_robot_state() -- concatenates ee position (3) + ee quaternion (4) + arm qpos
    (8), commented '# 15'
  action_dim: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() -- position(3) + quaternion(4) + gripper(1) = 8, consistent with
    the '..._quat_...' dataset naming in gensim2/agent/experiments/configs/env/gensim2.yaml
  num_camera_views: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_task.py
    -- self.camera_names = ['wrist', 'left', 'right', 'default'] (4 cameras set up
    per task); consistent with arXiv:2410.03645 Sec. 5.1 describing 3 RealSense D435
    cameras (1 wrist-mounted + 2 external) on the real robot rig
  camera_views: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/task_setting.py
    CAMERA_CONFIG -- 'default' is a static external camera facing the scene (mapped
    to front); 'left'/'right' are static external cameras on either side of the workspace
    (mapped to side). The 'wrist' camera (mounted on the gripper) is intentionally
    omitted here -- see suggested_new_enum_values
  has_camera_calibration: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/env.py
    get_camera_params() returns extrinsic_cv/intrinsic_cv/cam2world_gl for every camera,
    used to fuse multi-camera point clouds
  depth_coverage: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/env.py
    get_pcds_from_cameras() converts per-camera depth (z-buffer) into point clouds
    for all cameras; arXiv:2410.03645 Sec. 5.1 confirms RealSense D435 RGB-D cameras
    on the real rig
  has_language_instruction: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_task.py
    (self.task_description per task) and the policy's 'language' modality stem (TextEncoder)
    in gensim2/agent/experiments/configs/env/gensim2.yaml
  num_task_types: 'https://github.com/GenSim2/GenSim2/blob/master/doc/env.md -- registered
    task list: 7 original + 21 primitive + 22 long-horizon = 50 task classes in the
    released repo. Note: arXiv:2410.03645 abstract separately claims the *pipeline*
    can scale to generate ''up to 100 articulated tasks with 200 objects'' -- that
    is a generation-capacity claim, not the count of tasks shipped in the current
    repo'
  urdf_available: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    -- loads bundled robot URDFs (ASSET_ROOT/robot/panda/panda_newgripper.urdf, ASSET_ROOT/robot/fr3/fr3_nogripper.urdf)
    and object URDFs (.../mobility.urdf per articulated object instance)
  urdf_source: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    -- URDFs are bundled/modified inside the project's own asset directory (e.g. 'panda_newgripper.urdf'
    is a custom-modified gripper variant), not fetched from the manufacturer
suggested_new_enum_values:
  camera_views: wrist -- GenSim2's task setup (gensim2/env/base/base_task.py, CAMERA_CONFIG['wrist'])
    and the real-robot rig (arXiv:2410.03645 Sec. 5.1) each use a single wrist-mounted
    camera on one arm. The existing enum only offers left_wrist/right_wrist, which
    imply a per-arm wrist camera in a bimanual setup; a generic single-arm 'wrist'
    value would avoid misclassifying this as bimanual.
