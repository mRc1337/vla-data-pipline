id: agibot_digital_world
name: AgiBot Digital World
source_url: https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld
license: CC-BY-NC-SA-4.0
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods:
- human_to_robot_synthesis
- scene_asset_curation
is_multi_embodiment: false
embodiment_class: dual_arm
robot_platform: agibot_g1
num_arms: 2
dof_per_arm: 7
dof_per_hand: 2
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: true
action_space: joint_position
action_frame: delta
rotation_representation: none
state_dim: 22
action_dim: 22
fps: 30.0
fps_variable: false
num_camera_views: 8
camera_views:
- head
- left_wrist
- right_wrist
- other
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: partial
additional_modalities: []
has_language_instruction: true
num_task_types: 8
expected_size_gb: 7635.47
expected_num_episodes: 48984
num_scenes: 5
num_objects: 180
review_status: pending_human_review
field_sources:
  source_url: Re-verified reachable (HF API HTTP 200, id agibot-world/AgiBotDigitalWorld,
    lastModified 2025-02-27) -- https://huggingface.co/api/datasets/agibot-world/AgiBotDigitalWorld
  paper_url: 'Checked the HF README''s own BibTeX citation block (only self-cites
    the project page, no journal/arXiv entry: howpublished={\url{https://agibot-digitalworld.com/}}),
    and the linked project page badge. No arXiv/paper describing this specific digital-twin
    release was found, so left blank to avoid misattributing the separate AgiBot World
    Colosseo paper (arXiv:2503.06669), which describes the real-world Alpha/Beta release,
    not this simulation companion -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  license: 'README "License and Citation" section: "All the data and code within this
    repo are under CC BY-NC-SA 4.0" -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  raw_format: 'README "Dataset Structure" section: raw data is organized as observations/<task_id>/<episode_uuid>/{depth,video}
    (PNG depth + per-camera MP4) plus meta_info/<task_id>/<episode_uuid>/{task_info.json,proprio_meta_info.h5,camera_parameter.json}
    -- a bespoke folder layout, not RLDS/HDF5-only/LeRobot/TFRecord. The repo ships
    scripts/convert_to_lerobot.py specifically to convert this raw layout into LeRobot
    v2.0, confirming the raw format itself is not LeRobot -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  release_type: Repo is a static collection of pre-recorded episode tar archives (meta_info/digitaltwin_0..7.tar,
    observations/digitaltwin_0..7/<uuid> folders) with no in-repo tooling to generate
    new episodes on demand -- https://huggingface.co/api/datasets/agibot-world/AgiBotDigitalWorld/tree/main?recursive=false
  collection_method: 'README Key Features: "1 million+ steps of enhanced digital twins
    of long-horizon real-world tasks from AgiBot World" plus "500,000+ steps of atomic
    tasks automatically generated by agents" -- both halves of the dataset are produced
    in simulation (digital-twin reconstruction / agent-driven generation), not live
    teleoperation -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  secondary_collection_methods: 'human_to_robot_synthesis: the "digital twins" are
    simulation reconstructions of real human-teleoperated long-horizon tasks originally
    captured in AgiBot World (README: "enhanced digital twins of long-horizon real-world
    tasks from AgiBot World"). scene_asset_curation: sample task_info.json label_info.objects
    entries reference a curated external 3D object asset bank (e.g. "omni6DPose_toy_motorcycle_023",
    "omni6DPose_book_000", "genie_storage_box_002"), confirmed by downloading and
    inspecting task_info.json files extracted via HTTP range requests against sample_dataset.zip''s
    central directory -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md,
    https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/resolve/main/sample_dataset.zip'
  is_multi_embodiment: False. All 8 task shards (digitaltwin_0..7) use the same joint-name
    schema (head/body/arm/effector) in scripts/convert_to_lerobot.py and the same
    34-DoF proprioceptive layout documented in the README; no second robot platform
    is referenced anywhere -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  embodiment_class: Kept consistent with the sibling agibot_world / agibot_world_2026
    registry entries (same AgiBot platform family), which classify it as dual_arm
    (mobility captured separately via has_mobile_base) rather than humanoid -- configs/agibot_world.yaml,
    configs/agibot_world_2026.yaml
  robot_platform: 'README terminology section: 34 total joint DoF = 2 head + 2 waist
    + 7-per-arm x2 + gripper-per-hand x2, matching the AGIBOT G1 platform used for
    the original AgiBot World Alpha/Beta release (whose real-world long-horizon tasks
    this dataset digital-twins). This dataset predates (Feb 2025) and is architecturally
    distinct from the newer AGIBOT G2 platform used by the 2026 agibot_world_2026
    release -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  num_arms: 'README proprioceptive schema: /state/end/position and /state/end/orientation
    have shape [N, 2, ...] documented as "left [:, 0], right [:, 1]"; convert_to_lerobot.py
    arm_joint_names lists 7 joints x2 suffixed _l/_r -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md,
    https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  dof_per_arm: 'scripts/convert_to_lerobot.py arm_joint_names: Joint1_l/r through
    Joint7_l/r -- exactly 7 joints per arm -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  dof_per_hand: scripts/convert_to_lerobot.py effector_joint_names lists exactly 2
    joints per hand (e.g. left_Left_1_Joint, left_Right_1_Joint). This is the figure
    actually used to build the released state/action vectors, so it is trusted over
    the README's generic terminology-section prose ("8 Dof each gripper"), which appears
    to describe a different/fuller hardware DOF budget not exposed in this dataset's
    recorded data -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
    (used value); https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
    (conflicting prose, not used)
  gripper_type: 'Revised from an initial "dexterous_hand" guess after finding concrete
    evidence: effector_joint_names in convert_to_lerobot.py names exactly 2 opposing
    joints per hand (*_Left_1_Joint, *_Right_1_Joint), matching a 2-actuator parallel-jaw-style
    gripper rather than a multi-fingered dexterous hand -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  hand_pose_representation: Left as none -- the effector state/action is a single
    aggregate open-range value per hand (2 joint positions, not per-finger keypoints/MANO/joint-angle
    hand-shape encoding) -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  has_mobile_base: True. README proprioceptive schema documents /state/robot/position
    (xyz, "z is always 0 in meters") and /action/robot/velocity ("vel along x axis,
    yaw rate") -- i.e. a wheeled/planar mobile base with velocity control, independent
    of the simplified 22-dim LeRobot conversion which omits base state -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  action_space: scripts/convert_to_lerobot.py builds the released "action" feature
    (shape [22]) purely from head/body/arm/effector JOINT POSITION arrays (state_joint
    indexed by joint name) -- no end-effector pose or base velocity is included in
    this canonical action vector -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  action_frame: 'scripts/convert_to_lerobot.py computes action arrays explicitly as
    consecutive-frame differences: "action_arm = state_arm[1:] - state_arm[:-1]" (same
    pattern for head/body/effector), i.e. delta joint positions between frames --
    https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  rotation_representation: Left as none for the canonical released state/action (hstack
    of head+body+arm+effector joint positions only) -- no wrist/end-effector orientation
    component (quaternion etc.) is part of the 22-dim state or action vectors actually
    produced by the conversion script, even though the raw h5 separately stores /state/end/orientation
    as wxyz quaternions (unused by this conversion) -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  state_dim: 'scripts/convert_to_lerobot.py LeRobot feature dict: "observation.state":
    {"shape": [22]} -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  action_dim: 'scripts/convert_to_lerobot.py LeRobot feature dict: "action": {"shape":
    [22]} -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  fps: 'scripts/convert_to_lerobot.py: every video feature declares "video.fps": 30.0,
    and process_video() re-encodes with ffmpeg "-r 30"; visualize call also uses fps=30
    -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py'
  fps_variable: False -- fps is declared as a fixed 30.0 for every one of the 8 documented
    camera video streams, with no per-episode/per-camera variation noted -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  num_camera_views: 'Confirmed two independent ways: (1) scripts/convert_to_lerobot.py
    LeRobot feature dict lists 8 distinct video keys (top_head, hand_left, hand_right,
    head_center_fisheye, head_left_fisheye, head_right_fisheye, back_left_fisheye,
    back_right_fisheye) plus 1 depth-only key (cam_top_depth, same physical camera
    as top_head); (2) sample_dataset.zip video/ folder contains 8 distinct *.mp4 basenames
    (head, hand_left, hand_right, head_front_fisheye, head_left_fisheye, head_right_fisheye,
    back_left_fisheye, back_right_fisheye) -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py,
    https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/resolve/main/sample_dataset.zip'
  camera_views: 'Mapped from the 8 raw camera names: head/head_front_fisheye/head_left_fisheye/head_right_fisheye
    -> head; hand_left -> left_wrist; hand_right -> right_wrist; back_left_fisheye/back_right_fisheye
    (rear-facing, no matching enum category) -> other -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/resolve/main/sample_dataset.zip'
  has_synchronized_multiview_rig: True -- scripts/convert_to_lerobot.py assembles
    all 8 camera video keys plus depth into a single per-frame LeRobot record keyed
    by the same frame index, i.e. rendered/captured in lockstep by construction of
    the simulator -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/scripts/convert_to_lerobot.py
  has_camera_calibration: True -- README documents a per-episode camera_parameter.json
    containing "all cameras' intrinsic and extrinsic parameters" -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  depth_coverage: 'Partial -- directly confirmed by inspecting sample_dataset.zip:
    the depth/<frame>/ folders contain exactly 3 PNGs (head.png, hand_left.png, hand_right.png)
    out of the 8 total documented camera views, so depth is available for head + both
    wrist cameras only, not the 4 fisheye or 2 back cameras -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/resolve/main/sample_dataset.zip'
  additional_modalities: Checked, left empty. No mention of force/torque, tactile,
    audio, or eye-gaze sensing in the README or conversion scripts; the h5 wrench/effort
    fields are explicitly marked "Not available for now" -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  has_language_instruction: True -- README states each action_config slice in task_info.json
    "includes a start and end time, the corresponding atomic skill, and the language
    instruction"; sample task_info.json files (fetched via range requests) show action_text/skill
    fields per action slice, though the specific sampled example instances have empty-string
    text values -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  num_task_types: 'Directly confirmed by fetching and decompressing all 8 task_info.json
    files bundled in sample_dataset.zip (one per task shard, via HTTP range requests
    against the zip''s central directory): digitaltwin_0..7 map 1:1 to 8 distinct
    task_name values -- place_trash_into_ground_dustbin, place_objects_into_drawer,
    insert_pen, place_objects_into_handbag, pick_fruits_from_basket_into_dish, pick_toys_into_box,
    pick_fruits_place_dish, place_trash_into_table_dustbin_dual_arm -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/resolve/main/sample_dataset.zip'
  urdf_available: Checked HF README and repo file tree; no URDF file or link is provided
    in this dataset repo. Left blank rather than guessing at an external AgiBot-World
    GitHub URDF, since a GitHub API rate limit prevented verification -- https://huggingface.co/api/datasets/agibot-world/AgiBotDigitalWorld/tree/main?recursive=false
  urdf_source: Left blank -- see urdf_available.
  expected_size_gb: 'HF API dataset info usedStorage field: 7,635,467,064,099 bytes
    = 7635.47 GB -- https://huggingface.co/api/datasets/agibot-world/AgiBotDigitalWorld?expand[]=usedStorage'
  expected_num_episodes: 'Directly counted by paginating the HF tree API (recursive=false,
    following Link: rel="next" cursors) over each of the 8 observations/digitaltwin_N
    folders and summing episode-uuid subfolder counts: 7794 + 8876 + 8842 + 6380 +
    6943 + 9968 + 78 + 103 = 48984 episodes total. Note: this measured total implies
    a much higher steps/episode ratio than a naive read of the README''s headline
    "1M+ / 500K+ steps" figures would suggest, so that headline may reflect an earlier/partial
    snapshot rather than the currently fully-published corpus -- flagged for human
    awareness -- https://huggingface.co/api/datasets/agibot-world/AgiBotDigitalWorld/tree/main/observations/digitaltwin_0?recursive=false
    (and digitaltwin_1..7 analogously)'
  expected_duration_hours: Checked, left blank. No total duration/hours figure is
    stated on the card or README, and computing it would require decoding every episode
    video (not attempted) -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  num_subjects: Checked, left blank. This dataset's own collection process is simulation
    (digital-twin reconstruction / agent-generated atomic tasks), not live human teleoperation,
    so a "subject count" for this release specifically is not documented and not clearly
    applicable -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md
  num_scenes: 'README Key Features: "5 classes of scenes" (exact, not a lower bound)
    -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
  num_objects: 'README Key Features: "180+ classes of objects" -- recorded as 180;
    note the source states this as a lower bound ("180+"), not a precise exact count
    -- https://huggingface.co/datasets/agibot-world/AgiBotDigitalWorld/raw/main/README.md'
suggested_new_enum_values: {}
