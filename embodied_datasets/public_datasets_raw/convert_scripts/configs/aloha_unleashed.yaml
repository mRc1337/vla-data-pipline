field_sources:
  source_url: 'Re-verified 2026-07-10 via curl: https://aloha-unleashed.github.io/
    is still live and is the official Google DeepMind project page (author list: Tony
    Z. Zhao, Jonathan Tompson, Danny Driess, Pete Florence, Kamyar Ghasemipour, Chelsea
    Finn, Ayzaan Wahid; hosts the paper PDF and links to it as "this http URL" from
    the arXiv abstract). Cross-checked against arXiv:2410.13126.'
  paper_url: 'arXiv:2410.13126, "ALOHA Unleashed: A Simple Recipe for Robot Dexterity"
    (Zhao, Tompson, Driess, Florence, Ghasemipour, Finn, Wahid; Google DeepMind).
    Confirmed live at https://arxiv.org/abs/2410.13126 and PDF fetched directly for
    this re-verification pass.'
  license: No public dataset release found as of this re-check (2026-07-10, ~21 months
    after the Oct 2024 paper). Only the paper (arXiv:2410.13126), project page videos,
    and task protocol PDFs are public; GitHub search for aloha_unleashed/aloha-unleashed
    turns up only the static project-page source repo (github.com/aloha-unleashed/aloha-unleashed.github.io),
    and the HuggingFace Datasets API search for "aloha_unleashed"/"aloha-unleashed"
    returns zero results. No license is attached to any downloadable data because
    none is published.
  release_type: Paper describes collection of a fixed count of demonstrations (26,241
    real + several thousand simulated) for a closed set of 8 tasks, not a generative/procedural
    environment or a standing RL benchmark suite -- conceptually a fixed_episode_dataset
    methodology even though no matching data blob has actually been published (see
    license note above).
  collection_method: 'Paper Sec 3.2 ''Data Collection'': ''ALOHA allows bimanual teleoperation
    via a puppeteering interface, which allows a human teleoperator to backdrive two
    smaller leader arms, whose joints are synchronized with two larger follower arms.''
    Re-confirmed by re-reading full PDF text on 2026-07-10.'
  secondary_collection_methods: 'Paper Sec 4.3 ''Simulation experiments'': ''We teleoperate
    the simulated environments... using the MuJoCo Menagerie [53][54] model from ALOHA
    2... to collect human demonstrations for each task'' for the 3 simulated tasks
    (SingleInsertion: 522 demos, DoubleInsertion: 201 demos, MugOnPlate: 550 demos
    per Table 3). This is still teleoperation in mechanism, but the platform is a
    simulated (not physical) embodiment, so it is logged as a secondary collection
    method distinct from the primary real-robot teleop.'
  embodiment_class: 'Paper Sec 3 / project page and ALOHA 2 hardware report (arXiv:2405.02292,
    p.2): ''ALOHA 2 ... consists of a bimanual parallel-jaw gripper workcell with
    two ViperX 6-DoF arms.'''
  robot_platform: 'Paper Sec 3.1: ''The policy outputs 12 absolute joint positions,
    6 for each 6-dof ViperX arm.'' ALOHA 2 follower arms are Trossen/Interbotix ViperX
    300 6-DoF (confirmed via ALOHA 2 hardware report arXiv:2405.02292 p.2: ''two ViperX
    6-DoF arms (the follower), along with 2 smaller WidowX arms (the leader)''; the
    action/state space is built from the follower ViperX arms). Also cross-checked
    via MuJoCo Menagerie ALOHA 2 model, derived from trossen_vx300s.'
  is_multi_embodiment: No evidence of any embodiment other than the ALOHA 2 dual-ViperX-arm
    workcell (real) / its MuJoCo Menagerie mirror (sim) anywhere in the paper; all
    8 tasks (5 real + 3 sim) use the same platform.
  num_arms: 'Paper Sec 3: ''two 6-DoF arms'' (bimanual workcell). Re-confirmed.'
  dof_per_arm: 'Paper Sec 3.1: ''6-dof ViperX arm.'' Re-confirmed.'
  gripper_type: 'Paper Sec 3 / project page: ''bimanual parallel-jaw gripper workcell.''
    Re-confirmed; also matches ALOHA 2 hardware report''s "Leader/Follower Grippers"
    sections which only describe parallel-jaw finger designs.'
  hand_pose_representation: 'Not applicable / none: gripper_type is parallel_jaw (simple
    2-finger gripper actuated by a single continuous open/close value per arm), not
    a dexterous multi-finger hand, so no MANO/keypoints/joint-angle hand-shape encoding
    is used anywhere in the paper.'
  has_mobile_base: Paper and ALOHA 2 hardware report both describe ALOHA 2 as a stationary
    'workcell' mounted on a 48x30" table with a fixed aluminum frame; no mobile base
    component is mentioned anywhere (contrast with 'Mobile ALOHA', a different, unrelated
    system).
  action_space: 'Paper Sec 3.1: ''The policy outputs 12 absolute joint positions,
    6 for each 6-dof ViperX arm, and a continuous value for gripper position for each
    of the two grippers.'' Re-confirmed.'
  action_frame: 'Paper Sec 3.1: ''The policy outputs 12 absolute joint positions...''
    Re-confirmed.'
  rotation_representation: Action/state space is pure joint-space (14-dim joint positions
    + gripper), no Cartesian/orientation representation is used; paper Sec 3.1. Re-confirmed.
  state_dim: 'CORRECTED reasoning (value unchanged at 14): the paper does not directly
    state a raw proprioceptive vector length in numerals. Sec 3.1 says the proprioceptive
    state ''consists of the joint positions and gripper values for each of the arms''
    and that after projection it contributes 1 of ''a total of 1201 latent feature
    dimensions'' (1200 image-patch tokens + 1 proprioception token) -- that 1201 figure
    describes transformer *token* count, not the raw state dimensionality, and the
    prior field_sources entry conflated the two. state_dim=14 is inferred by symmetry
    with the explicitly-stated 14-dim action tensor (6 joints + 1 gripper value per
    arm x 2 arms), matching the standard ALOHA/ACT proprioception convention, but
    is not itself a directly-quoted number in this paper -- flagged as a soft inference
    for human review.'
  action_dim: 'Paper Sec 3.1: ''policy outputs a tensor of shape (50, 14)'' i.e. 14-dim
    action per timestep (12 joint positions + 2 gripper values). Re-confirmed.'
  fps: 'Paper Sec 3.1: ''we are able to surpass our target frequency of 50Hz''; action
    chunk of 50 actions = ''a trajectory spanning 1 second'' implies 50Hz nominal
    control/recording rate. Also directly confirmed in ALOHA 2 hardware report (arXiv:2405.02292)
    Sec ''Teleoperation'': ''We record leader and follower joint data at 50Hz.'''
  fps_variable: 'Inferred from paper Sec 3.1 and ALOHA 2 hardware report: system is
    described around a fixed 50Hz target/logging rate, not a variable-rate recording
    scheme.'
  num_camera_views: 'Paper Sec 3.1: ''multimodal inputs (4 images from different viewpoints...)''
    and ''Each of the 4 RGB images is resized to 480x640x3...''. Re-confirmed.'
  camera_views: 'CORRECTED: previous list had 5 entries (top, left_wrist, right_wrist,
    other, worms_eye) despite num_camera_views=4 -- "other" was a leftover placeholder
    for the worms-eye camera from before "worms_eye" was added as its own enum value,
    and was never removed, causing a duplicate/count mismatch. Fixed to the correct
    4 entries. Exact camera layout confirmed directly from the ALOHA 2 hardware report
    (arXiv:2405.02292) Sec ''Cameras''/''Frame'': "We design new camera mounts for
    both the wrist cameras, as well as the overhead and worms-eye views" and Fig.
    1 labels: "overhead camera", "worms-eye camera", plus left/right wrist cameras
    (matches Figure 2 of the Unleashed paper''s multi-view CNN inputs). Also cross-checked
    against MuJoCo Menagerie ALOHA 2 README: "Added 4 cameras: overhead camera, worms-eye
    camera and left and right wrist cameras." Mapped: overhead->top, worms-eye->worms_eye
    (now a valid enum value; no longer needs "other"), left/right wrist->left_wrist/right_wrist.'
  has_synchronized_multiview_rig: Paper Sec 3.1 describes the policy consuming "multimodal
    inputs (4 images from different viewpoints...)" as one synchronized observation
    per control step (each of the 4 ResNet50 towers processes a same-timestep frame
    from its camera, fused via the transformer encoder). The ALOHA 2 hardware report
    describes all 4 cameras as frame-mounted on one rigid teleoperation workcell and
    logged together through the same ROS2 sensor-stream pipeline at recording time,
    consistent with a synchronized multi-view rig (not independently-timed cameras).
  has_camera_calibration: 'Paper Sec 4.2: ''Robots in our ALOHA 2 fleet are uncalibrated
    and may have differences in robot and camera mounting positions.'' Re-confirmed.'
  depth_coverage: 'Paper consistently refers only to RGB cameras/images (e.g. ''4
    RGB images''); no depth sensor is mentioned anywhere in the Unleashed paper. Note:
    the underlying ALOHA 2 hardware (arXiv:2405.02292, Sec ''Cameras'') uses Intel
    RealSense D405 cameras which are depth-capable ("these cameras enable high resolution
    RGB and depth... although depth ... were not necessary for the results demonstrated
    on the first ALOHA system, they might be considered a nice to have"), but the
    ALOHA Unleashed paper itself only describes and uses 4 RGB images as policy input/dataset
    modality, with no depth channel reported as part of this dataset -- kept as none.'
  additional_modalities: No force/torque, tactile, audio, or eye-gaze sensing is described
    anywhere in the paper; Sec 4.2 explicitly notes the policies succeed "despite
    low-precision robotic arms and lack of force-torque feedback," confirming no force/torque
    modality is present.
  has_language_instruction: 'Paper Sec 3.1/4.1: a separate policy is trained per task
    (''We train a separate Diffusion Policy for each task''); no language-conditioning
    or instruction input is described anywhere in the paper. Re-confirmed.'
  num_task_types: 'Paper abstract/Sec 3: ''5 challenging real-world and 3 simulated
    tasks'' = 8 total distinct task types (Shirt, Lace, FingerReplace, GearInsert,
    RandomKitchen real; SingleInsertion, DoubleInsertion, MugOnPlate simulated). Re-confirmed;
    ShirtEasy/ShirtMessy and LaceEasy/LaceMessy are initialization variants of the
    same Shirt/Lace task, not separate task types, so they are not double-counted.'
  urdf_available: ALOHA 2's follower arm is the Trossen/Interbotix ViperX 300 6-DoF,
    whose URDF/xacro is officially published by Interbotix, e.g. https://github.com/Interbotix/interbotix_ros_manipulators/blob/main/interbotix_ros_xsarms/interbotix_xsarm_descriptions/urdf/vx300s.urdf.xacro.
    Google DeepMind also documents URDF -> MJCF derivation steps for the ALOHA 2 assembly
    (derived from trossen_vx300s) in the MuJoCo Menagerie README, re-verified live
    on 2026-07-10.
  urdf_source: Base arm URDF is published by Interbotix/Trossen Robotics (arm manufacturer),
    see https://github.com/Interbotix/interbotix_ros_manipulators/tree/main/interbotix_ros_xsarms/interbotix_xsarm_descriptions/urdf;
    re-verified reachable 2026-07-10.
  expected_num_episodes: 'Paper Table 1 demonstration counts sum to 8658 (Shirt) +
    5133 (Lace) + 5247 (FingerReplace) + 4005 (GearInsert) + 3198 (RandomKitchen)
    = 26241, matching the paper''s own statement (Sec 3.2): ''we collect over 26k
    episodes for 5 real tasks, on 10 different robots in 2 different buildings over
    the course of 8 months.'' Re-summed and re-confirmed. Note this count covers only
    the 5 real-world tasks; the 3 simulated tasks add a further ~1,273-2,000+ demonstrations
    (abstract/intro says "over 2,000"; Table 3 sim Num Demos column sums to 522+201+550=1,273)
    which are NOT included in this figure since no combined real+sim total is stated
    by the paper and no unified public dataset exists.'
  num_subjects: 'Paper Sec 3.2: ''we create a protocol that allows continuous data
    collection by a pool of 35 operators without oversight by researchers''; and ''Collecting
    data from 35 different operators results in a large amount of variance in behaviors.''
    Interpreted as num_subjects = number of human teleoperators.'
  no_public_release_note: 'Re-checked 2026-07-10: project page (https://aloha-unleashed.github.io/,
    still live), its GitHub source repo (github.com/aloha-unleashed/aloha-unleashed.github.io,
    contains only the static site/paper/protocol PDFs), GitHub repo search for "aloha_unleashed"
    (1 result: the site repo, no dataset), and HuggingFace Datasets API search for
    "aloha_unleashed"/"aloha-unleashed" (0 results). No dataset download link, no
    HuggingFace/RLDS/GCS bucket reference, and no code or data release for the ALOHA
    Unleashed demonstration data itself as of this recheck. Only the paper (arXiv:2410.13126),
    videos, and task protocol PDFs are public. (The separately open-sourced items
    are ALOHA 2 *hardware* designs/MuJoCo model at github.com/google-deepmind/mujoco_menagerie
    and the ALOHA 2 hardware report arXiv:2405.02292, not the Unleashed demonstration
    dataset.)'
  not_found_fields_note: 'dof_per_hand: left blank -- not applicable, gripper is a
    simple parallel-jaw (not a dexterous multi-finger hand), so there is no separate
    per-hand DoF distinct from the arm/gripper actuation already captured by dof_per_arm
    + action_dim. expected_duration_hours: left blank -- paper gives per-episode *timeout*
    caps (120s ShirtMessy, 80s other tasks) but not actual average episode duration
    or a total dataset-hours figure, and the "8 months" mentioned is calendar collection
    time, not robot-execution hours; computing this would require fabricating an average
    duration not stated anywhere. num_scenes: left blank -- paper states "10 different
    robots in 2 different buildings" but never defines/counts distinct "scenes" (backgrounds/environments)
    as a single number; mapping this to either 10 or 2 would be a guess. num_objects:
    left blank -- individual tasks involve different physical objects (shirts, shoes,
    robot finger parts, gears, kitchen bowls/cups/utensils) but the paper never gives
    a total distinct-object count across or within tasks.'
