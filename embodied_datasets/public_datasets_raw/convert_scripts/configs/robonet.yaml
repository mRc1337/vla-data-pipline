id: robonet
name: RoboNet
source_url: https://www.robonet.wiki/
paper_url: https://arxiv.org/abs/1910.11215
license: CC-BY-4.0
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: autonomous_policy
secondary_collection_methods: []
is_multi_embodiment: true
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
action_frame: delta
camera_views:
- third_person
has_synchronized_multiview_rig: true
has_camera_calibration: false
depth_coverage: none
additional_modalities: []
has_language_instruction: false
urdf_available: false
urdf_source: not_found
expected_size_gb: 36.0
expected_num_episodes: 162000
review_status: pending_human_review
field_sources:
  source_url: Stub recorded a TensorFlow-Datasets mirror page (tensorflow.google.cn/datasets/catalog/robonet).
    Corrected to the dataset's own canonical project webpage http://www.robonet.wiki/, which
    is the site cited as 'the project webpage' throughout the paper (arXiv:1910.11215, footnotes
    1 and 3) and linked from the GitHub repo README (https://github.com/SudeepDasari/RoboNet/blob/master/README.md)
  license: 'https://github.com/SudeepDasari/RoboNet/blob/master/README.md: ''All data is provided
    under the Creative Commons BY 4.0 license.'' Confirmed by the presence of a separate LICENSE_DATASET
    file in the repo root (https://github.com/SudeepDasari/RoboNet)'
  raw_format: GitHub wiki 'Getting Started' page (https://github.com/SudeepDasari/RoboNet/wiki/Getting-Started)
    and repo code (robonet/datasets/util/hdf5_loader.py, robonet/datasets/robonet_dataset.py)
    load the dataset from a folder of .hdf5 files via h5py, with per-trajectory RGB frames
    stored as mp4/jpg-encoded groups (env/cam{i}_video) inside each hdf5 file, plus env/state
    and policy/actions arrays
  collection_method: 'arXiv:1910.11215 sec 4.1 ''Data Collection Process'': ''the dataset
    is collected autonomously with minimal human intervention, in a self-supervised manner''
    and ''trajectories are collected by applying actions drawn at random from simple hand-engineered
    distributions. We most commonly use a diagonal Gaussian combined [with] the automatic
    grasping primitive'''
  gripper_type: 'arXiv:1910.11215 Table 1 lists gripper types used: Weiss Robotics WSG-50,
    Robotiq, WidowX, Baxter, Franka, and Kuka stock grippers — all of these are standard two-finger
    parallel-jaw end-effectors (WSG-50 and Robotiq 2-finger grippers, and the stock two-finger
    grippers shipped with the WidowX/Baxter/Franka Panda/Kuka LBR iiwa arms), none are suction,
    dexterous/multi-finger hands, or bare arms'
  action_space: 'arXiv:1910.11215 sec 4.1: ''All trajectories in RoboNet share a similar action
    space, which consists of deltas in position and rotation to the robot end-effector, with
    one additional dimension of the action vector reserved for the gripper joint... We chose
    an action parametrization in end-effector space rather than joint-space'''
  action_frame: 'arXiv:1910.11215 sec 4.1: ''the action space...consists of deltas in position
    and rotation to the robot end-effector'' — explicitly a delta/relative action, not absolute
    joint or pose commands'
  camera_views: 'arXiv:1910.11215 Table 1 (''Camera configuration: 113'') and sec 5.2 (''we
    attempt...tasks from two views...compare a model trained on 90 different viewpoints...The
    arrangement of the cameras is shown in Appendix D'') describe many distinct external camera
    placements/angles around the workspace; the paper and repo code (ncam-indexed env/cam{i}_video
    groups) never mention any robot-mounted/wrist camera, so all camera views are external
    third-person viewpoints, just varying in position/angle across the 113 configurations'
  has_camera_calibration: 'arXiv:1910.11215 sec 4.1: ''The frame of reference is the root
    link of the robot, which need not coincide with the camera pose. This avoids the need
    to calibrate the camera, but requires any model to infer the relative positioning between
    the camera and the robots'' reference frames from a history of context frames.'' — explicitly
    states cameras are uncalibrated'
  depth_coverage: 'arXiv:1910.11215 sec 4.2: ''In theory, one could add any type (depth, tactile,
    audio, etc.) of sensor data to RoboNet, but we stick to consumer RGB video cameras for
    the purposes of this project.'' — no depth sensing is collected'
  has_language_instruction: No language/task annotations are mentioned anywhere in arXiv:1910.11215
    or the RoboNet repo/wiki (https://github.com/SudeepDasari/RoboNet); data is collected
    via undirected random/autonomous exploration (sec 4.1) with only image, state, and action
    tensors stored per trajectory (robonet/datasets/util/hdf5_loader.py), with no text/task
    field in the hdf5 schema
  urdf_available: https://github.com/SudeepDasari/RoboNet top-level repo contents (.gitignore,
    LICENSE, LICENSE_DATASET, README.md, launch_configs, requirements.txt, robonet, robonet_experiments,
    scripts, setup.py) contain no URDF files or URDF-related directory, and none of the wiki
    pages reference URDFs
  urdf_source: Same as urdf_available — no URDF files found in the dataset repo (https://github.com/SudeepDasari/RoboNet)
    or wiki
  expected_size_gb: 'GitHub wiki ''Getting Started'' page (https://github.com/SudeepDasari/RoboNet/wiki/Getting-Started):
    ''RoboNet is a large dataset: currently it is a 36GB download'' (referring to the robonet_v3.tar.gz
    full release)'
  expected_num_episodes: 'arXiv:1910.11215 abstract and sec 4.2: ''a dataset containing roughly
    162,000 trajectories...from 7 robots''; Table 1 breakdown sums to ~161.7k (Sawyer 68k
    + Baxter 18k + WidowX 5k + Franka 7.9k + Kuka 1.8k + Fetch 5k + GoogleRobot 56k)'
  paper_url: 'Cited throughout repo/wiki as ''the RoboNet paper''; CoRL 2019 paper, Dasari
    et al. ''RoboNet: Large-Scale Multi-Robot Learning'', arXiv:1910.11215.'
  is_multi_embodiment: 'arXiv:1910.11215 abstract + Table 1: dataset combines 7 distinct robot
    platforms (Sawyer, Baxter, WidowX, Franka, Kuka, Fetch, GoogleRobot) from 4 institutions
    -- an intentional multi-robot collection, not single-embodiment.'
  has_mobile_base: 'arXiv:1910.11215 Appendix B.1: state/action space for all 7 robots is
    restricted to end-effector XYZ + yaw + gripper joint; no base-motion dimension defined
    for any robot, and all tasks are stationary tabletop object-relocation tasks.'
  hand_pose_representation: Table 1 lists only 2-finger parallel-jaw grippers (WSG-50, Robotiq,
    WidowX/Baxter/Franka/Kuka stock grippers); Appendix B.1 records only a single binarized
    gripper joint-angle value, no dexterous-hand or bare-hand pose data -- 'none' applies.
  has_synchronized_multiview_rig: GitHub wiki Getting-Started page (github.com/SudeepDasari/RoboNet/wiki/Getting-Started)
    TF-loading example shows image batches shaped (B, T, N_VIEWS, H, W, C) -- multiple camera
    views recorded together per trajectory in the hdf5 files (env/cam{i}_video groups).
  expected_duration_hours: 'Investigated and left blank: arXiv:1910.11215 (Dasari et al.,
    RoboNet) gives no total-hours statement anywhere in the main text or appendices, and no
    per-trajectory horizon/step-count or camera fps is stated in the paper, GitHub README
    (github.com/SudeepDasari/RoboNet), or the wiki ''Getting Started'' page (only per-robot
    trajectory counts in Table 1 and a 36GB total download-size figure). robonet/datasets/util/hdf5_loader.py
    exposes a per-file ''img_T'' step count but no dataset-wide average step count or fps
    is published anywhere, and RoboNet is not present in the TFDS catalog (tensorflow.org/datasets/catalog/robonet
    returns 404), so no duration could be found or derived without fabricating an fps/horizon
    figure.'
suggested_new_enum_values:
  robot_platform: RoboNet is an intentionally multi-embodiment collection spanning 7 distinct
    robot platforms (Sawyer, Baxter, WidowX, Franka Panda, Kuka LBR iiwa, Fetch, and a Google
    robot arm — arXiv:1910.11215 Table 1), several of which (baxter, kuka_lbr_iiwa, fetch,
    google_robot) have no matching value in the current single-select robot_platform enum,
    and the field itself has no 'multi_platform'/'heterogeneous' option to represent a dataset
    spanning many robots at once. Left blank here rather than forcing one dominant robot (e.g.
    'sawyer', which is only ~42% of trajectories) or the lossy 'other' catch-all.
  embodiment_class: 6 of the 7 constituent robots (Sawyer, WidowX, Franka, Kuka, Fetch, GoogleRobot)
    are single_arm, but Baxter (~18k/162k trajectories, ~11%) is a dual-arm platform, so no
    single embodiment_class value accurately describes the whole collection; a 'mixed'/'multi_embodiment'
    enum value would let per-source-heterogeneous collections like RoboNet be tagged honestly
    instead of leaving the field blank.
  num_arms: 'Same heterogeneity as embodiment_class: Baxter contributes 2-arm data while the
    other 6 platforms are single-arm, so no single integer value is accurate for the collection
    as a whole.'
  dof_per_arm: DoF varies by constituent robot (e.g. 7-DoF Sawyer/Franka/Kuka/Baxter arms
    vs. the lower-cost WidowX arm, which has fewer joints), so no single integer accurately
    represents the whole multi-robot collection.
  state_dim / action_dim: Per arXiv:1910.11215 sec 4.1, 'The action space can also be a subset
    of the listed dimensions' — state and action dimensionality (sdim/adim in the dataset's
    own metadata schema) genuinely varies per constituent robot/source file rather than being
    fixed dataset-wide, so no single state_dim/action_dim integer is accurate for the collection
    as a whole.
  rotation_representation: Most RoboNet robots (excluding Google R3) restrict orientation
    to a single yaw angle (roll/pitch locked, gripper always pointing downward) per arXiv:1910.11215
    Appendix B.1's R5 state definition (XYZ + yaw + gripper). This is not a full 3-axis euler_xyz,
    quaternion, 6D, or axis_angle representation; left blank rather than forcing a full-orientation
    enum value. A 'yaw_only'/'single_axis_angle' enum option would represent this restricted-rotation
    convention precisely.
