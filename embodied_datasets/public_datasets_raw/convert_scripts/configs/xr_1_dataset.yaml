id: xr_1_dataset
name: XR-1 Dataset
source_url: https://huggingface.co/datasets/X-Humanoid/XR-1-Dataset-Sample
paper_url: https://arxiv.org/abs/2511.02776
license: Apache-2.0
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods:
- egocentric_human
is_multi_embodiment: true
dof_per_hand: 1
gripper_type: parallel_jaw
hand_pose_representation: joint_angles
has_mobile_base: false
action_space: mixed
action_frame: absolute
rotation_representation: mixed
fps: 30.0
fps_variable: false
camera_views:
- front
- top
- side
- left_wrist
- right_wrist
- other
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: true
num_task_types: 4
urdf_available: false
urdf_source: not_found
expected_size_gb: 1.13
expected_num_episodes: 60
expected_duration_hours: 0.23
review_status: pending_human_review
field_sources:
  source_url: Reconfirmed via HF Hub API https://huggingface.co/api/datasets/X-Humanoid/XR-1-Dataset-Sample
    (200 OK, id matches).
  paper_url: 'GitHub README (Open-X-Humanoid/XR-1) arXiv badge and HF dataset card
    [Paper] link both point to arxiv.org/abs/2511.02776; title/abstract fetched from
    that URL match ''XR-1: Towards Versatile Vision-Language-Action Models via Learning
    Unified Vision-Motion Representations'' (ICML 2026). Caveat: the HF dataset card''s
    own README body, tags, and bibtex all cite arXiv:2411.02776 -- fetched that URL
    and it resolves to an unrelated paper on Bouc-Wen model parameter estimation.
    This is a digit-transposition typo in X-Humanoid''s own HF metadata; 2511.02776
    is the correct id per GitHub and the matching abstract text.'
  license: 'HF API cardData.license=apache-2.0, and raw GitHub LICENSE file (Open-X-Humanoid/XR-1)
    text begins ''Licensed under the Apache License, Version 2.0''. Caveat: the HF
    dataset card body text says ''released under the MIT License'' while linking to
    this same Apache LICENSE file -- confirmed this is an error in X-Humanoid''s own
    README, not a real MIT grant.'
  raw_format: 'Re-fetched meta/info.json for all 5 robot subsets (DUAL_ARM_AGX/FRANKA/TIEN_KUNG2/UR,
    SINGLE_ARM_UR): all report ''codebase_version'': ''v2.1'' with standard LeRobot
    data/videos/meta layout. EGO4D subset is plain mp4 clips + action_clips_new_info.json,
    not LeRobot format -- excluded from this field''s scope.'
  release_type: HF repo is a static collection of parquet/mp4 files at a fixed commit
    (no simulator, scene-generation code, or RL env shipped in this dataset repo)
    -- matches ReleaseType.FIXED_EPISODE_DATASET.
  collection_method: 'arXiv:2511.02776 real-robot setup section: ''we design 20 tasks
    and collect expert demonstrations via teleoperation, recording synchronized multi-view
    RGB streams and proprioceptive states''.'
  secondary_collection_methods: EGO4D/action_clips_new_info.json lists 10 clips (241
    frames @30fps each) drawn from Ego4D first-person human activity video -- no robot
    or teleoperation involved for this subset, matching CollectionMethod.EGOCENTRIC_HUMAN
    as a secondary method alongside the primary teleop-collected robot subsets.
  is_multi_embodiment: 'HF file listing top-level dirs: DUAL_ARM_AGX, DUAL_ARM_FRANKA,
    DUAL_ARM_TIEN_KUNG2, DUAL_ARM_UR, SINGLE_ARM_UR, EGO4D -- 5 distinct robot platforms
    plus non-robot human video bundled in one release; arXiv:2511.02776 abstract states
    real-world validation spans ''six heterogeneous robot embodiments''.'
  gripper_type: 'arXiv:2511.02776: ''All robots are equipped with parallel grippers
    and multiple cameras from complementary viewpoints.'''
  dof_per_hand: 'meta/info.json ''hand_joint_position'' feature present in 4 of 5
    robot subsets: shape=[2] for dual-arm subsets (DUAL_ARM_FRANKA, DUAL_ARM_TIEN_KUNG2,
    DUAL_ARM_UR) = 1 DoF x 2 hands; shape=[1] for SINGLE_ARM_UR = 1 DoF x 1 hand.
    Verified parquet value ranges (Franka action.hand_joint_position in [0, 0.96])
    consistent with a single open/close scalar per gripper. DUAL_ARM_AGX is the only
    subset without a separate hand_joint_position channel (its gripper state is folded
    into the 12-dim ''end_effector'' feature instead).'
  hand_pose_representation: 'Same ''hand_joint_position'' channel described above
    is a literal joint-angle scalar per gripper (open/close), present in 4/5 robot
    subsets -- maps to HandPoseRepresentation.JOINT_ANGLES. Caveat: all grippers here
    are simple 1-DoF parallel jaws (gripper_type=parallel_jaw), not dexterous multi-finger
    hands, so this is a minimal instance of the enum rather than a rich hand-shape
    encoding -- flagged for human review.'
  has_mobile_base: meta/info.json feature lists for every subset (including the DUAL_ARM_TIEN_KUNG2
    humanoid) contain only arm_joint_position/hand_joint_position/end_effector channels
    -- no base, leg, or torso state/action channels recorded anywhere in the sample.
  action_space: 'meta/info.json feature lists (re-fetched for all 5 subsets): action.arm_joint_position
    present in every subset; action.end_effector present in DUAL_ARM_AGX/FRANKA/UR
    and SINGLE_ARM_UR but absent in DUAL_ARM_TIEN_KUNG2 (joint-position only) -- overall
    a mixed joint+eef action representation.'
  action_frame: 'Downloaded and inspected sample episode_000000.parquet files (pyarrow)
    for DUAL_ARM_AGX, DUAL_ARM_FRANKA, DUAL_ARM_UR: action.arm_joint_position values
    are physically-scaled absolute joint angles (range roughly [-3.14, 3.14] rad matching
    real arm limits) and action.end_effector values are absolute robot-frame poses
    (positions ~0.4-0.65 m matching tabletop workspace, gripper opening bounded [0,
    ~0.96]) that persist/drift smoothly frame-to-frame rather than reading as small
    delta increments -- consistent with ActionFrame.ABSOLUTE.'
  fps: 'meta/info.json ''fps'': 30 confirmed by direct re-fetch for all 5 robot subsets
    plus EGO4D/action_clips_new_info.json (''fps'': 30.0).'
  fps_variable: Same info.json files show a single constant fps value (30) with no
    per-episode variation field.
  camera_views: 'meta/modality.json + info.json camera keys re-verified for all 5
    subsets: camera_front->front, camera_top->top, unqualified camera_left/camera_right->side,
    camera_wrist_left/camera_wrist_right->left_wrist/right_wrist, single unqualified
    camera_wrist on SINGLE_ARM_UR (side not specified)->other.'
  has_synchronized_multiview_rig: 'arXiv:2511.02776: ''collect expert demonstrations
    via teleoperation, recording synchronized multi-view RGB streams and proprioceptive
    states''; corroborated by meta/info.json listing multiple camera_* video features
    recorded at the same fps in every subset.'
  has_camera_calibration: 'arXiv:2511.02776: ''calibrated multi-view cameras''. Calibration
    files/intrinsics are not themselves bundled in the public HF sample repo (verified
    via full file listing) -- reflects the paper''s hardware-setup claim, not an artifact
    shipped in the sample.'
  depth_coverage: 'Re-fetched meta/info.json for all 5 robot subsets: every RGB camera
    key (observation.rgb_images.*) has a matching observation.depth_images.* entry
    in each. EGO4D human egocentric clips in the same release are RGB-only with no
    depth.'
  additional_modalities: Checked meta/info.json feature lists for all 5 robot subsets
    (re-fetched directly) -- only rgb_images/depth_images/arm_joint_position/hand_joint_position/end_effector/timestamp
    channels present; no force_torque, tactile, audio (video info explicitly states
    has_audio:false for every camera), or eye_gaze channels found anywhere in the
    sample.
  has_language_instruction: meta/tasks.jsonl re-fetched for all 5 robot subsets (e.g.
    'put the blue bowl in the middle of the table and stack the green bowl on the
    blue bowl.') plus meta/modality.json 'human.action.task_description' annotation
    field.
  num_task_types: 'meta/tasks.jsonl re-fetched for all 5 robot task folders in the
    public sample: 4 distinct task descriptions (DUAL_ARM_UR and SINGLE_ARM_UR share
    the identical ''find out packaging tape into the other basket'' task text). Caveat:
    arXiv:2511.02776 states the full internal XR-D training corpus covers 20 tasks
    x 6 embodiments (120-123 tasks total) -- this public sample only illustrates 4
    of those tasks.'
  urdf_available: Complete HF file listing (423 siblings, re-fetched via HF API) contains
    no .urdf/.xacro files, and none are referenced in the GitHub repo https://github.com/Open-X-Humanoid/XR-1.
  urdf_source: Same as urdf_available -- no URDF is bundled with or linked from this
    specific dataset release.
  expected_size_gb: 'HF Hub API ''usedStorage'': 1214594654 bytes = 1.131 GB (rounded
    1.13), reconfirmed via fresh API fetch.'
  expected_num_episodes: Reconfirmed via meta/episodes.jsonl for all 5 robot subsets
    (10 entries each = 50) plus EGO4D/action_clips_new/ file listing (10 mp4 clips,
    matching action_clips_new_info.json) = 60 total data instances in the sample.
  expected_duration_hours: 'Computed from meta/episodes.jsonl per-episode ''length''
    fields (fetched for all 5 robot subsets: AGX=14301, Franka=2642, TienKung2=3087,
    DUAL_ARM_UR=1529, SINGLE_ARM_UR=1035 frames = 22594 robot frames) plus EGO4D/action_clips_new_info.json
    (10 clips x 241 frames = 2410 frames); total 25004 frames / 30 fps = ~833 s =
    ~0.23 h. Caveat: meta/info.json''s own ''total_frames'' field is ~27x inflated
    relative to the true per-episode sum in episodes.jsonl (verified for AGX: info.json
    says 385802 vs episodes.jsonl sum 14301) and must not be used for duration.'
  num_subjects: Not stated anywhere findable for this specific public sample release
    (no teleoperator/subject count given in the paper, README, or HF metadata) --
    left blank rather than guessed.
  num_scenes: Not stated anywhere findable for this specific public sample release
    -- left blank rather than guessed.
  num_objects: Not stated anywhere findable for this specific public sample release
    -- left blank rather than guessed.
  embodiment_class: 'Left blank: release bundles dual_arm (AGX, Franka, UR), single_arm
    (UR), and humanoid dual-arm (Tien Kung 2.0) robot data plus non-robot human egocentric
    video in one dataset -- no single enum value applies to the release as a whole.
    See suggested_new_enum_values.'
  robot_platform: 'Left blank: release bundles agilex_cobot_magic, franka_panda, tien_kung,
    and ur5e/ur5 subsets in parallel -- schema only supports one value per entry.
    See suggested_new_enum_values.'
  num_arms: 'Left blank: varies by subset (1 arm for SINGLE_ARM_UR, 2 arms for the
    other 4 robot subsets) -- no single value applies across this heterogeneous release.'
  dof_per_arm: 'Left blank: meta/info.json arm_joint_position shapes vary by platform
    (14 total /2=7 for AGX, 16/2=8 for Franka, 14/2=7 for TienKung2, 12/2=6 for DUAL_ARM_UR,
    6 for SINGLE_ARM_UR) -- genuinely heterogeneous across the release, not a single
    value.'
  rotation_representation: 'Left blank: downloaded and inspected sample episode_000000.parquet
    files (pyarrow). DUAL_ARM_FRANKA and DUAL_ARM_UR end_effector actions are 7-dims-per-arm
    (pos3+quat4) with the last 4 values verified to have unit L2 norm (sum-of-squares
    ~= 1.0) -- confirmed RotationRepresentation.QUATERNION for those two subsets.
    DUAL_ARM_AGX and SINGLE_ARM_UR instead use a 3-dim orientation per arm (6 dims
    total: pos3+3) with each component independently spanning roughly [-3.14, 3.14]
    -- consistent with either euler_xyz or a UR-style axis-angle rotation vector,
    and not distinguishable from numeric inspection alone without vendor documentation.
    DUAL_ARM_TIEN_KUNG2 has no end_effector/orientation channel at all (joint-position
    only). Because the representation genuinely differs per platform within this one
    release, no single enum value applies -- see suggested_new_enum_values.'
  state_dim: 'Left blank: total per-frame state dim differs by platform (e.g. AGX
    14+12=26, Franka 16+2+14=32, TienKung2 14+2=16, DUAL_ARM_UR 12+2+14=28, SINGLE_ARM_UR
    6+1+6=13, per meta/info.json feature shapes) -- heterogeneous across the release.'
  action_dim: 'Left blank: same heterogeneity as state_dim (action feature shapes
    mirror the observation.state shapes per subset).'
  num_camera_views: 'Left blank: physical camera count differs by subset (AGX=3, Franka=4,
    TienKung2=1, DUAL_ARM_UR=6, SINGLE_ARM_UR=4, per meta/info.json/modality.json)
    -- heterogeneous across the release; camera_views above lists the union of distinct
    view categories instead.'
suggested_new_enum_values:
  embodiment_class: 'cross_embodiment -- this single public release bundles dual_arm
    (AgileX, Franka, UR), single_arm (UR), and humanoid dual-arm (Tien Kung 2.0) robot
    data, plus non-robot EGO4D human egocentric video, in one dataset. Source: HF
    file listing top-level folders and arXiv:2511.02776 abstract (''six heterogeneous
    embodiments'').'
  robot_platform: 'mixed_multi_platform -- the same release contains agilex_cobot_magic,
    franka_panda, tien_kung, and ur5e/ur5 data as parallel subsets; robot_platform
    only supports one value per entry. Source: HF file listing plus arXiv:2511.02776
    (''Tien Kung 1.0/2.0, single/dual-arm UR-5e, dual-arm Franka, and AgileX Cobot
    Magic 2.0'').'
  rotation_representation: 'mixed_per_platform -- within this one release, DUAL_ARM_FRANKA
    and DUAL_ARM_UR verifiably use quaternion end-effector orientation (unit-norm
    4-vectors confirmed via parquet inspection) while DUAL_ARM_AGX and SINGLE_ARM_UR
    use a different 3-dim orientation encoding (euler_xyz or axis-angle, ambiguous
    without vendor docs), and DUAL_ARM_TIEN_KUNG2 has no orientation channel at all.
    No single existing value captures a release that mixes representations per platform.
    Source: direct pyarrow inspection of sample episode_000000.parquet for DUAL_ARM_FRANKA,
    DUAL_ARM_UR, DUAL_ARM_AGX, SINGLE_ARM_UR.'
