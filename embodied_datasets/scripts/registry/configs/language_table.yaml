num_scenes: 1
num_objects: 8
review_status: pending_human_review
field_sources:
  license: https://github.com/google-research/language-table/blob/main/LICENSE (Apache License
    2.0) - re-verified by fetching the raw LICENSE file directly (2026-07-10); text confirmed
    as Apache License Version 2.0.
  raw_format: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/dataset_info.json
    (fileFormat=tfrecord) and https://github.com/google-deepmind/open_x_embodiment (RLDS episode
    format)
  release_type: dataset_info.json + https://raw.githubusercontent.com/google-research/language-table/main/README.md
    - the 'language_table' id is a static released TFRecord/RLDS collection of a fixed 442,226
    episodes (not a procedural generator, scene platform, or RL benchmark env; those framework/env
    aspects of the repo are separate from this dataset release).
  paper_url: 'https://arxiv.org/abs/2210.06407 - Lynch, Wahid, Tompson et al., "Interactive
    Language: Talking to Robots in Real Time" (Robotics at Google), the paper introducing
    and describing the Language-Table dataset and collection pipeline.'
  collection_method: 'paper arxiv.org/abs/2210.06407 Sec. IV.A "Data Collection" / Fig. 2
    stage 1 ("high-throughput teleoperation + hindsight language relabeling") and Appendix
    B "Real-World-Raw-Collect: ... 11 teleoperators alternating over four robots"; Table II
    reports a training-time snapshot (10 teleoperators, 2.7k collect hours over 16.4k episodes),
    a subset of the full raw collection (23,498 episodes / 3,865 hours per Appendix B). Corrected
    citation: the previous field_sources entry cited "sec III.A", but the paper''s "Data Collection"
    subsection is actually IV.A (Sec. III is "Problem Setup", not data collection) -- fixed
    on re-verification.'
  secondary_collection_methods: https://raw.githubusercontent.com/google-research/language-table/main/README.md
    Summary Table - the 'language_table' row is real/human-controlled/human-labeled (pure
    teleop + human hindsight relabeling); unlike the *_oracle_sim variants (separate dataset
    ids), this release has no scripted-oracle or autonomous-policy contribution.
  is_multi_embodiment: paper Appendix A/B - real-world data spans "four robots" but all are
    identical UFACTORY xArm6 units (single embodiment/platform); README.md confirms every
    Language-Table variant (real and sim) uses the xArm6 platform exclusively.
  embodiment_class: 'paper arxiv.org/abs/2210.06407 Appendix A: single UFACTORY xArm6 arm'
  robot_platform: 'paper arxiv.org/abs/2210.06407 Appendix A: ''Our real-world experiments
    use UFACTORY xArm6 robot arms'' (no exact enum match, see suggested_new_enum_values)'
  num_arms: paper arxiv.org/abs/2210.06407 Appendix A (single xArm6 arm setup)
  dof_per_arm: 'paper arxiv.org/abs/2210.06407 Appendix A: ''UFACTORY xArm6'' and main text
    ''a 6DOF robot ... constrained to move in a 2D plane'''
  gripper_type: 'paper arxiv.org/abs/2210.06407 Appendix A: ''end-effector is made from a
    6 inch long plastic PVC pipe'' (fixed pusher, not a gripper)'
  hand_pose_representation: paper Appendix A - end-effector is a rigid 6-inch PVC pipe pusher
    tool, not a dexterous hand or bare tracked hand, so no finger/hand-shape encoding applies
    (mirrors gripper_type=none).
  has_mobile_base: 'paper arxiv.org/abs/2210.06407 Appendix A / homepage interactive-language.github.io:
    fixed tabletop arm setup'
  action_space: 'https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action field description: ''An action representing a 2D delta cartesian setpoint for the
    robot.'''
  action_frame: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action field description (delta cartesian setpoint)
  rotation_representation: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (action/observation only contain 2D translation fields, no rotation component)
  state_dim: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    observation.effector_translation shape (2,)
  action_dim: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action tensor shape (2,)
  fps: 'paper arxiv.org/abs/2210.06407 Sec. V "Language-Table: Datasets and Environment":
    "we batch collected training and inference data to 5hz observations and actions" (corrected
    quote/citation: previous entry paraphrased this as Appendix A verbatim text, which it
    is not; Appendix A separately corroborates with "batched to psuedo-synchronous 5 Hz pairs
    for training the policy").'
  fps_variable: 'paper arxiv.org/abs/2210.06407 Appendix A: camera logged at 30Hz and robot
    state logged at 100Hz, asynchronous observations/actions batched to psuedo-synchronous
    5hz pairs (camera latency ~80ms accounted for) -- nominal fixed target rate, not variable.'
  num_camera_views: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (single 'rgb' observation field) and paper Appendix A ('Observations are recorded from
    an Intel RealSense D415 camera' - single camera)
  camera_views: 'paper arxiv.org/abs/2210.06407 main text/Fig. 2: ''third person view (line-of-sight
    in real)'''
  has_synchronized_multiview_rig: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (only one 'rgb' field) and paper Appendix A (single Intel RealSense D415 camera, no multi-camera
    rig).
  has_camera_calibration: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (no intrinsics/extrinsics fields present in observation schema)
  depth_coverage: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (only 'rgb' image field, no depth field) and paper Appendix A ('RGB-only images')
  additional_modalities: paper Appendix A - "Policies use 320x180 single-camera RGB-only images,
    with no other observations besides language"; no force/torque, tactile, audio, or eye-gaze
    sensing is present in the released observation schema.
  has_language_instruction: 'https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    ''instruction'' field; README.md google-research/language-table (''language-labeled by:
    human'')'
  urdf_available: https://github.com/xArm-Developer/xarm_ros (UFACTORY's official GitHub org;
    repo tree confirmed to contain xarm_description/urdf/xarm6/xarm6.urdf.xacro and related
    xacro files for the xArm6)
  urdf_source: https://github.com/xArm-Developer/xarm_ros - org page title 'UFACTORY', i.e.
    manufacturer's own GitHub account
  expected_size_gb: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/dataset_info.json
    train split numBytes=428665067806; recomputed directly as 428665067806/1e9 = 428.665...
    GB (~428.67, confirmed on re-verification)
  expected_num_episodes: 'https://raw.githubusercontent.com/google-research/language-table/main/README.md
    (''language_table: 442,226 episodes of real robot relabeled data'') confirmed by recomputing
    sum(dataset_info.json shardLengths) = 442226 exactly (re-verified 2026-07-10)'
  num_subjects: 'paper Appendix B "Language-Table: Datasets" -> "Real-World-Raw-Collect: ...
    11 teleoperators alternating over four robots." Caveat: Table II (a training-time subset
    snapshot covering only 16.4k of the raw episodes) separately reports "Total teleoperators:
    10" for that smaller slice; 11 (the full raw-collection figure from Appendix B) is used
    here as the best-available estimate for the complete collection process. Neither paper
    figure is confirmed to exactly match the final public 442,226-episode release, which appears
    larger than the paper''s own snapshot (414,798 relabeled trajectories in Appendix B vs.
    442,226 in the actual release), so treat num_subjects as an approximate lower bound, not
    an exact count.'
  num_scenes: paper Sec. V "Environment and Benchmark" - the real-world tabletop scenario
    is a single fixed smooth wooden board/rig (no scene variation is described for the real-world
    data collection).
  num_objects: paper Sec. V - "Language-Table's simulated environment resembles our real-world
    tabletop manipulation scenario, which consists of an xArm6 robot ... in front of a smooth
    wooden board with a fixed set of 8 plastic blocks, comprising 4 colors and 6 shapes";
    consistent with Appendix A's "Play22 Baby Blocks Shape Sorter toy kit" as the manipulated
    real-world objects.
  expected_duration_hours: 'arXiv:2210.06407 (Lynch et al., ''Interactive Language: Talking
    to Robots in Real Time'') Appendix B ''Real-World-Raw-Collect'': ''23498 total episodes
    were collected with an average length of 9.9 minutes +/-5.6 seconds, yielding a total
    of 3865 hours of raw data.'' This is the raw real-world teleop footage (four xArm6 robots)
    that Appendix B ''Real-World-Relabeled'' segments via hindsight relabeling into the 414,798-trajectory
    set the paper describes as the source of the public ''language_table'' RLDS release (README.md:
    ''442,226 episodes of real robot relabeled data''); relabeled episodes are hindsight-labeled
    sub-segments of this same raw footage, not additional recording, so 3865 hours is the
    best-documented total physical recording duration underlying the release. Treated as an
    approximation because the release''s exact episode count (442,226) is somewhat larger
    than the paper''s own 414,798-trajectory snapshot, implying collection likely continued
    slightly past the paper''s figures.'
suggested_new_enum_values:
  robot_platform: xarm6 - the real-world data was collected with a UFACTORY xArm6 (6-DOF arm),
    a different physical robot from the existing 'xarm7' enum value (7-DOF); using 'xarm7'
    would misstate the robot's DOF, so 'other' was used instead pending this addition.
