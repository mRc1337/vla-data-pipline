field_sources:
  source_url: 'CORRECTED 2026-07-10 (was arXiv abstract link, moved to paper_url):
    now points to https://github.com/apple/ml-egodex, the official Apple dataset repo
    hosting the download links (part1-5/test/extra zips) and Dataset Structure docs,
    per registry convention that source_url = project/dataset homepage and paper_url
    = the arXiv paper (see droid.yaml, ego4d.yaml, ego_exo4d.yaml for the same pattern).'
  paper_url: 'NEW FIELD, filled: https://arxiv.org/abs/2505.11709 - "EgoDex: Learning
    Dexterous Manipulation from Large-Scale Egocentric Video" (Hoque, Huang, Yoon,
    Sivapurapu, Zhang, 2025). GitHub README explicitly states this repo "accompanies
    the research paper [EgoDex...]" linking to this arXiv URL.'
  license: 'RE-VERIFIED 2026-07-10, unchanged: GitHub apple/ml-egodex README ''License''
    section verbatim: "The dataset is available under CC-by-NC-ND terms." arXiv 2505.11709
    Sec 3.1: "The dataset is publicly available under a CC-by-NC-ND license." Corroborated
    by third-party HF mirror griffinlabs/EgoDex-LeRobot-v3.0, which tags license:cc-by-nc-nd-4.0.
    schema.py now defines LicenseEnum.CC_BY_NC_ND_4_0 = "CC-BY-NC-ND-4.0" (the gap
    previously flagged in suggested_new_enum_values has been closed), so this maps
    cleanly and the stale suggestion was removed.'
  raw_format: 'RE-VERIFIED 2026-07-10, unchanged: GitHub apple/ml-egodex README ''Dataset
    Structure'': each episode is a paired .hdf5 (skeletal pose transforms, per-joint
    confidences, camera intrinsics, llm_description language attrs) + .mp4 (video)
    file with matching numeric index; the structured annotation container is HDF5
    (video is a separate peer file, analogous to how LeRobot/ALOHA-style datasets
    keep video separate from the primary structured container).'
  release_type: 'RE-VERIFIED 2026-07-10, unchanged: fixed_episode_dataset. GitHub
    README ''Dataset Access and Download'': the dataset is a static, versioned set
    of downloadable zip files (5 training parts + test + extra), not a live generation
    framework, interactive scene platform, or RL benchmark environment.'
  collection_method: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3.2
    ''Data Collection'': "All data is collected with Apple Vision Pro running visionOS
    2... Production-grade pose tracking software enables natural demonstration with
    bare hands" -- egocentric human video, no robot involved.'
  secondary_collection_methods: 'RE-VERIFIED 2026-07-10, left as []: all 338,000 episodes
    are collected via the single method described in Sec 3.2 (Apple Vision Pro egocentric
    capture); no teleop, autonomous-policy, simulation, or synthesis step is described
    anywhere in arXiv 2505.11709 or the GitHub README.'
  is_multi_embodiment: 'NEW FIELD, filled false: the entire dataset is captured via
    one embodiment class (bare human hands) on one hardware platform (Apple Vision
    Pro / ARKit). arXiv 2505.11709 abstract and Sec 3.2 describe a single, uniform
    collection setup with no robot or second embodiment class present.'
  embodiment_class: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 provides
    3D SE(3) pose tracking of human head/upper-body/hand joints via ARKit on Apple
    Vision Pro; no robot embodiment present anywhere in the dataset.'
  num_arms: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 4.1: action dimensionality
    is defined as ''2 hands x (3 + 6 + 3x5 fingertips) = 48'', i.e. bimanual (both
    hands) tracked per episode.'
  gripper_type: 'NEW FIELD, filled none: no robot gripper is present anywhere in EgoDex;
    all manipulation is performed with bare human hands (arXiv 2505.11709 Sec 3.2,
    GitHub README). Follows the same convention as sibling bare-hand egocentric datasets
    (ego_exo4d.yaml, assembly101.yaml, hoi4d.yaml, egoexolearn.yaml all use none).'
  hand_pose_representation: 'NEW FIELD, filled keypoints_3d: arXiv 2505.11709 Sec
    3.3 + Appendix A.2 ''Complete List of Skeletal Joints'': each hand is tracked
    as 25 named 3D joint transforms (1 wrist + 24 finger sub-joints per hand: IntermediateBase/IntermediateTip/Knuckle/Metacarpal/Tip
    x4-5 per finger), released as raw SE(3) keypoint transforms in the HDF5 files
    -- not MANO parameters and not a joint-angle/DoF parameterization. (Being-H0,
    a third-party downstream project, separately re-fits MANO to these keypoints,
    but that is not how EgoDex itself represents hand pose.)'
  has_mobile_base: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3 describes
    the dataset as ''active tabletop manipulation'' in a stationary setting, no mobile
    base.'
  action_space: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 4.1 ''Action
    Representation'': action = 3D position of each wrist + 6D orientation of each
    wrist + 3D position of each fingertip -- a mix of position and orientation components,
    not a single joint-angle or single eef-pose vector.'
  action_frame: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 4.1, verbatim
    final sentence: "All poses are represented in the camera frame." -- absolute pose
    per timestep, not a delta relative to the previous frame.'
  rotation_representation: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec
    4.1: "the 6D orientation of each wrist (as suggested by [Zhou et al., continuity
    of rotation representations])" -- 6D rotation used for the wrist-orientation component
    of the action.'
  action_dim: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 4.1, verbatim:
    "each action has a total dimensionality of 2 hands x (3 + 6 + (3 x 5 fingertips))
    = 48."'
  fps: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3.3 modalities: "Egocentric
    RGB video with 1920x1080 resolution at 30 Hz frequency"; GitHub README: "30 Hz
    1080p egocentric video."'
  fps_variable: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3.3: video,
    pose, and camera intrinsics/extrinsics are all captured at a fixed 30 Hz; no mention
    of variable frame rate.'
  num_camera_views: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3.3 +
    GitHub README ''Dataset Structure'': each episode ships exactly one synthesized
    head-mounted egocentric RGB .mp4, despite multiple physical cameras being used
    internally on Vision Pro for SLAM/tracking.'
  camera_views: Same as num_camera_views -- single head-mounted egocentric viewpoint
    (Apple Vision Pro). Re-verified 2026-07-10, unchanged.
  has_synchronized_multiview_rig: 'CORRECTED 2026-07-10 (newly set to false; field
    did not exist in the prior config): GitHub README ''Dataset Structure'' shows
    each episode contains exactly one .hdf5 + one .mp4, with a single camera/intrinsic
    (3x3, "always the same in every file") -- i.e. only one synthesized camera view
    is actually released to users. The README''s visualize_2d.py note further clarifies
    "the RGB video is synthesized from multiple cameras on Vision Pro" -- the multiple
    physical cameras are used internally by ARKit for on-device SLAM/hand-tracking
    (arXiv 2505.11709 Sec 3.2/4.1: "multiple calibrated cameras and on-device SLAM"),
    but are not exposed as separate synchronized video streams in the released data.
    Same reasoning as dexcap.yaml (internal multi-camera rig, single released view
    -> false).'
  has_camera_calibration: 'RE-VERIFIED 2026-07-10, unchanged: GitHub apple/ml-egodex
    README ''Dataset Structure'': HDF5 contains camera/intrinsic (3x3 intrinsics,
    constant per file) and transforms/camera (per-frame SE(3) extrinsics).'
  depth_coverage: 'RE-VERIFIED 2026-07-10, unchanged: no depth modality is listed
    in arXiv 2505.11709 Sec 3.3 modalities (RGB video, camera intrinsics/extrinsics,
    3D joint pose, confidences, language annotation) or in the GitHub README HDF5
    structure.'
  additional_modalities: 'RE-VERIFIED 2026-07-10, left as []: full-text search of
    arXiv 2505.11709 for audio/gaze/tactile/force-torque returns zero hits; the 5
    modalities listed in Sec 3.3 (RGB video, camera intrinsics/extrinsics, 3D joint
    pose, pose confidences, language annotation) do not include any of the SensorModality
    enum values (force_torque, tactile, audio, eye_gaze). Contrast with the sibling
    ego4d.yaml/ego_exo4d.yaml, which do list audio + eye_gaze because those datasets
    explicitly capture them.'
  has_language_instruction: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec
    3.3: "Natural language annotation of the manipulation"; GitHub README: HDF5 attrs
    f.attrs[''llm_description''] / ''llm_description2''.'
  num_task_types: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 abstract and
    Sec 3.1: "194 different tabletop tasks" / "contains 829 hours ... with 338000
    episodes across 194 tasks."'
  urdf_available: 'NEW FIELD, filled false: no robot is present in EgoDex (bare human
    hand dataset), so no URDF exists for this dataset. Same convention as sibling
    bare-hand datasets (ego_exo4d.yaml, hoi4d.yaml, assembly101.yaml).'
  urdf_source: 'NEW FIELD, filled not_found: consistent with urdf_available=false
    -- no robot/URDF applicable.'
  expected_size_gb: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec 3.1:
    "The full dataset takes 2.0 TB of storage on disk" (compressed download zips on
    GitHub README sum to ~1.7 TB across train/test/extra splits).'
  expected_num_episodes: 'RE-VERIFIED 2026-07-10, unchanged: arXiv 2505.11709 Sec
    3.1: "The EgoDex dataset contains 829 hours of 1080p, 30 Hz egocentric video with
    338000 episodes across 194 tasks."'
  expected_duration_hours: 'NEW FIELD, filled 829.0: arXiv 2505.11709 abstract and
    Sec 3.1, verbatim: "EgoDex consists of 829 hours of 30 FPS video..." / "The EgoDex
    dataset contains 829 hours of 1080p, 30 Hz egocentric video." (GitHub README also
    gives the train/test/extra split breakdown: ~725h + ~7h + ~97h = 829h.)'
  dof_per_hand: 'NEW FIELD, checked, left blank: hand pose is released purely as 3D
    keypoint/joint transforms (25 joints/hand per Appendix A.2), not a joint-angle
    or DoF parameterization, so there is no stated per-hand DoF figure anywhere in
    arXiv 2505.11709 or the GitHub README. Same reasoning as ego_exo4d.yaml and assembly101.yaml,
    which left this blank for an analogous keypoints_3d hand representation.'
  num_subjects: 'NEW FIELD, checked, left blank: neither arXiv 2505.11709 nor the
    GitHub README states a total count of human data collectors/participants (Sec
    3.2 ''Data Collection'' only refers to "the collector"/"data collectors" generically,
    with no headcount given).'
  num_scenes: 'NEW FIELD, checked, left blank: arXiv 2505.11709 Sec 3.5 ''Diversity''
    explicitly states "the scene diversity in EgoDex is limited to tabletop environments"
    and that the paper''s focus is behavioral diversity, not scene diversity -- no
    numeric count of distinct scenes/locations is given anywhere in the paper or README.'
  num_objects: 'NEW FIELD, checked, left blank: no page (arXiv 2505.11709 body, Appendix
    A.1 task list, Figure 5 ''Some of the objects used'', GitHub README) states a
    total distinct-object count for the dataset; Figure 3''s object distribution plot
    is qualitative only (clustering suggested by GPT-4), with no dataset-wide object
    taxonomy size reported.'
suggested_new_enum_values: {}
