field_sources:
  source_url: HF dataset page https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm
    -- verified reachable via HF datasets API (https://huggingface.co/api/datasets/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm)
    and README.md fetched from the raw file path. Unchanged (already pre-filled).
  license: 'README.md front-matter (`license: cc-by-4.0`) and body text: ''License/Terms
    of Use: cc-by-4.0'' -- https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-Manipulation-SingleArm/raw/main/README.md.'
  raw_format: 'README.md ''Intended Usage'': ''This dataset is provided in LeRobot
    format...''; ''Dataset Format'' section: ''Within the collection, there are six
    datasets in LeRobot format''. Confirmed by meta/info.json ''codebase_version'':
    ''v2.1'' fetched for each of the six sub-datasets.'
  release_type: The repo ships six pre-recorded, fixed-size LeRobot sub-datasets (panda-stack-wide,
    panda-stack-platforms, panda-stack-platforms-texture, panda-open-cabinet-left,
    panda-open-cabinet-right, panda-open-drawer), each with a fixed total_episodes
    count per meta/info.json -- a released, static artifact, not a generation framework/scene
    platform/RL env a user runs themselves. Same convention as configs/robotwin.yaml
    and configs/libero.yaml for TAMP/simulator-generated fixed releases.
  collection_method: 'README.md ''Dataset Description'' and ''Dataset Characterization
    / Data Collection Method'': ''Automated'', ''Automatic/Sensors'', ''Synthetic'':
    ''The dataset was generated in IsaacSim leveraging task and motion planning algorithms
    to find solutions to the tasks automatically... The environments are table-top
    scenes where the object layouts and asset textures are procedurally generated.''
    No human teleoperation is involved anywhere -> simulation, matching the registry
    convention (see configs/robotwin.yaml) that reserves
    `simulation` for automated/scripted/motion-planning-generated sim data (as opposed
    to human-teleop-in-sim, which is `teleop`).'
  secondary_collection_methods: README.md Data Collection Method section describes
    only automated TAMP generation (PDDLStream/CuRobo motion planning + procedural
    scene_synthesizer scene generation); no human teleoperation, autonomous learned
    policy, or other secondary method is mentioned. Left empty.
  is_multi_embodiment: 'All six sub-dataset meta/info.json files report `"robot_type":
    "panda"`; README describes only the Franka Panda arm throughout. No other embodiment
    appears.'
  embodiment_class: 'README.md ''Dataset Description'': ''...a Franka Panda robot
    performing operations...'' -- single fixed-base manipulator arm, no mobile base
    or second arm.'
  robot_platform: 'README.md and all six meta/info.json files (`"robot_type": "panda"`)
    identify the Franka Emika/Franka Robotics Panda arm -- exact match to RobotPlatform.FRANKA_PANDA.'
  num_arms: README.md and meta/info.json feature names (single set of `panda_joint1..7`
    and one `eef_pos`/`eef_quat` per episode) confirm exactly one manipulator arm
    per episode across all six sub-datasets.
  dof_per_arm: meta/info.json `observation.state`/`action` feature name lists for
    all six sub-datasets enumerate exactly `panda_joint1_pos` through `panda_joint7_pos`
    (and matching `_delta_pos`/`_vel` variants) -- the manufacturer-standard 7 revolute
    joints of the Franka Panda arm.
  gripper_type: meta/info.json feature names include `panda_finger_joint1_pos`/`panda_finger_joint2_pos`
    (state) and a single `gripper` action dimension in every sub-dataset -- the stock
    Franka two-finger parallel-jaw gripper, actuated as one DOF.
  has_mobile_base: README.md describes only table-top manipulation scenes with a fixed-base
    Panda arm; no wheeled/tracked base or locomotion is mentioned or present in any
    feature list.
  action_space: 'README.md ''Dataset Format'' section, cross-checked against meta/info.json
    `action.names` for all six sub-datasets: panda-stack-wide and panda-stack-platforms
    use ''6d relative end-effector motion + 1d gripper action'' (`ee_pos_delta_*`,
    `ee_rot_vec_delta_*`, `gripper`) -> eef_pose; panda-stack-platforms-texture, panda-open-cabinet-left,
    panda-open-cabinet-right, and panda-open-drawer use ''7d joint motion + 1d gripper
    action'' (`panda_jointN_delta_pos`, `gripper`) -> joint_position. The six-dataset
    collection genuinely mixes both action spaces -> ActionSpace.MIXED.'
  action_frame: meta/info.json `action.names` for every one of the six sub-datasets
    use explicitly delta-named fields (`ee_pos_delta_x`/`ee_rot_vec_delta_x` or `panda_jointN_delta_pos`),
    confirming all six use relative/delta action targets, never absolute.
  rotation_representation: 'Left blank -- genuinely inconsistent across the six sub-datasets
    and does not cleanly fit any single enum value: the two eef_pose sub-datasets
    (panda-stack-wide, panda-stack-platforms) encode the action''s wrist-orientation
    delta as a 3-dim rotation vector (`ee_rot_vec_delta_x/y/z`, i.e. axis_angle),
    while the four joint_position sub-datasets encode no wrist rotation in the action
    at all (only 7 joint deltas + gripper); separately, `observation.state` includes
    quaternion-encoded eef/object orientations (`eef_quat_x/y/z/w`, `boxN_quat_*`)
    in every sub-dataset. No single RotationRepresentation value (axis_angle / quaternion
    / none) accurately describes the whole six-dataset collection at once; see suggested_new_enum_values.'
  state_dim: 'Left blank -- varies by sub-dataset per meta/info.json `observation.state.shape`:
    53 (panda-stack-wide), 81 (panda-stack-platforms, panda-stack-platforms-texture),
    25 (panda-open-cabinet-left, panda-open-cabinet-right, panda-open-drawer) -- three
    distinct values, not a single number for the whole collection. Not fabricating
    a single value.'
  action_dim: 'Left blank -- varies by sub-dataset per meta/info.json `action.shape`:
    7 (panda-stack-wide, panda-stack-platforms, both eef_pose) vs 8 (panda-stack-platforms-texture,
    panda-open-cabinet-left, panda-open-cabinet-right, panda-open-drawer, all joint_position
    + 1d gripper). Not a single value for the whole collection.'
  fps: 'meta/info.json `"fps": 30` confirmed identically for all six sub-datasets
    (panda-stack-wide, panda-stack-platforms, panda-stack-platforms-texture, panda-open-cabinet-left,
    panda-open-cabinet-right, panda-open-drawer) fetched individually.'
  fps_variable: 'Same meta/info.json check across all six sub-datasets: every one
    reports fps: 30 with zero variation.'
  num_camera_views: README.md 'Dataset Format' and meta/info.json `features` block
    for every sub-dataset list exactly two video feature keys, `observation.images.world_camera`
    and `observation.images.hand_camera`.
  camera_views: '`observation.images.world_camera` is a fixed external table-top overview
    camera -> mapped to third_person; `observation.images.hand_camera` is a single
    wrist-mounted camera with no left/right distinction (README: ''wrist-mounted camera
    output'') -> mapped to wrist.'
  has_synchronized_multiview_rig: 'Inferred, not an explicit README statement: both
    world_camera and hand_camera are rendered from the same IsaacSim simulation state
    at each recorded frame/timestep (same reasoning applied to other IsaacSim/simulator
    sim datasets in this corpus, e.g. configs/mimicgen.yaml),
    so the two views are synchronized by construction.'
  has_camera_calibration: 'Inferred: camera placement/intrinsics for world_camera
    and hand_camera are deterministically defined by the IsaacSim scene/rig setup
    used to generate every episode (simulation), so calibration parameters are always
    derivable, even though no separate calibration file is shipped in the HF repo
    file listing. Same reasoning as configs/libero.yaml,
    configs/mimicgen.yaml for simulator-generated datasets.'
  depth_coverage: 'README.md ''Dataset Format'': only panda-stack-platforms-texture,
    panda-open-cabinet-left, panda-open-cabinet-right, and panda-open-drawer list
    `observation.depths.world_camera`/`observation.depths.hand_camera` depth-video
    features (confirmed in their meta/info.json feature blocks); panda-stack-wide
    and panda-stack-platforms have no depth features at all. Depth is present in 4
    of 6 sub-datasets -> DepthCoverage.PARTIAL for the collection as a whole.'
  additional_modalities: 'Checked README.md and meta/info.json `features` blocks for
    all six sub-datasets: only RGB video, depth video (where present), state, action,
    timestamp/frame/episode/task index keys exist. No force_torque, tactile, audio,
    or eye_gaze feature anywhere. Left empty. Note: the task brief mentioned ''segmentation''
    as a possible modality, but no segmentation-mask files or feature keys were found
    anywhere in the HF repo''s ~99,781-file sibling listing (checked for ''seg''/''mask''
    substrings) -- this dataset ships RGB + depth only, no segmentation.'
  has_language_instruction: 'Checked meta/tasks.jsonl for all six sub-datasets: each
    contains exactly one task entry whose `task` string is simply the sub-dataset''s
    own name (e.g. `{"task_index": 0, "task": "panda-open-drawer"}`), not a descriptive
    natural-language instruction of the episode content. No other language-instruction
    field is present anywhere. Set false.'
  num_task_types: README.md 'Dataset Format' section lists exactly six named sub-datasets/tasks
    (panda-stack-wide, panda-stack-platforms, panda-stack-platforms-texture, panda-open-cabinet-left,
    panda-open-cabinet-right, panda-open-drawer), each confirmed as its own distinct
    meta/tasks.jsonl task entry.
  urdf_available: https://github.com/frankaemika/franka_ros (develop branch) ships
    franka_description/robots/panda/panda.urdf.xacro for the Franka Panda arm used
    in this dataset. Same precedent as configs/droid.yaml and configs/mimicgen.yaml
    for Franka Panda datasets.
  urdf_source: https://github.com/frankaemika/franka_ros franka_description package
    is the manufacturer's (Franka Emika/Franka Robotics) official URDF for the Panda
    arm -- not shipped inside this specific HF dataset repo itself.
  expected_size_gb: 'README.md ''Dataset Quantification'': ''Total storage: 15.2 GB''
    (stated directly for the full six-sub-dataset collection).'
  expected_num_episodes: 'README.md ''Dataset Quantification / Record Count'' per
    sub-dataset: 10243 + 17629 + 6303 + 1512 + 1426 + 1273 = 38386 episodes, summed
    exactly across all six sub-datasets (panda-stack-wide, panda-stack-platforms,
    panda-stack-platforms-texture, panda-open-cabinet-left, panda-open-cabinet-right,
    panda-open-drawer).'
  expected_duration_hours: 'Computed from README.md ''Dataset Quantification'' per-sub-dataset
    frame counts: 731785 + 1456899 + 551191 + 220038 + 224953 + 154256 = 3,339,122
    total frames, divided by the confirmed uniform fps of 30 (meta/info.json, all
    six sub-datasets) and by 3600: 3339122 / 30 / 3600 = 30.9178 hours, rounded to
    30.92.'
  num_subjects: 'Checked README.md in full: data collection is fully automated (IsaacSim
    + TAMP planners), no human operators/teleoperators/subjects are involved or mentioned
    anywhere. Left blank rather than report a non-applicable human-subject count.'
  num_scenes: 'README.md: ''table-top scenes where the object layouts and asset textures
    are procedurally generated'' -- procedurally randomized per episode, with no discrete
    stated count of distinct scenes/layouts. Left blank rather than fabricate.'
  num_objects: 'Checked README.md and meta/info.json state-feature names: stacking
    sub-datasets track exactly 2 named objects per episode (`box0`, `box1`), while
    the cabinet/drawer sub-datasets manipulate a single procedurally-generated furniture
    asset (cabinet or drawer) with no per-object breakdown given. No single object
    count applies consistently across the whole six-sub-dataset collection, and no
    explicit inventory/count is stated. Left blank rather than fabricate.'
  paper_url: 'Checked README.md ''Reference(s)'' section in full: it cites three supporting-technique
    papers ([1] PDDLStream, [2] scene_synthesizer, [3] CuRobo) used to build the generation
    pipeline, but none of them is a paper describing this dataset itself, and no other
    dataset-specific paper/citation is given anywhere on the HF page. Left blank rather
    than cite an unrelated method paper as ''the'' paper_url.'
suggested_new_enum_values:
  rotation_representation: A MIXED value (parallel to ActionSpace.MIXED) would help
    for collections like this one where different sub-datasets/tasks within the same
    release use different wrist-rotation encodings in their action space (axis_angle
    rotation-vector deltas for the two eef_pose sub-datasets vs no rotation encoding
    at all in the action for the four joint_position sub-datasets), even though state
    orientation (quaternion) happens to be uniform. Currently no single existing value
    (euler_xyz/quaternion/rotation_6d/axis_angle/rotation_matrix/none/unknown) accurately
    represents this specific mixed-action-space situation, so the field was left blank
    instead.
