id: bigym
name: BiGym
source_url: https://chernyadev.github.io/bigym/
paper_url: https://arxiv.org/abs/2407.07788
license: Apache-2.0
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: humanoid
robot_platform: unitree_h1
num_arms: 2
dof_per_arm: 5
gripper_type: parallel_jaw
has_mobile_base: true
action_space: joint_position
action_frame: both
rotation_representation: none
state_dim: 64
action_dim: 16
fps: 500.0
fps_variable: true
num_camera_views: 3
camera_views:
- head
- left_wrist
- right_wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: false
num_task_types: 40
urdf_available: true
urdf_source: community_repo
expected_num_episodes: 2000
num_objects: 46
review_status: pending_human_review
field_sources:
  source_url: https://chernyadev.github.io/bigym/ (official project page; re-verified
    2026-07-10, still resolves and links to code github.com/chernyadev/bigym and paper
    arXiv:2407.07788).
  paper_url: 'https://arxiv.org/abs/2407.07788 -- arXiv page confirms title ''BiGym:
    A Demo-Driven Mobile Bi-Manual Manipulation Benchmark'' (Chernyadev, Backshall,
    Ma et al., Dyson Robot Learning Lab, 2024), matching the citation already given
    in the GitHub README.'
  release_type: 'Re-verified against docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    Sec 4 Table B, which explicitly classifies bigym as ''fixed_episode_dataset''
    (part of the 55 datasets confirmed to have a fixed released episode count). Independently
    corroborated by the paper (Sec 3.3 ''BiGym Human Demonstration Datasets''): ''One
    of the key design choices in BiGym is to provide a fixed number of human-collected
    demonstrations for each task'' (50/task x 40 tasks = 2000, fixed and enumerable)
    -- even though the surrounding codebase also doubles as a Gymnasium-API RL/IL
    benchmark environment, the *released* artifact we ingest is the fixed demonstration
    set, not a generation framework or scene platform.'
  license: 'https://github.com/chernyadev/bigym README.md ''Licenses'' section: ''BiGym
    License (Apache 2.0) - This repository''. (Third-party MuJoCo Menagerie robot/gripper
    models are also Apache 2.0; 3D assets are separately CC0/CC-BY-4.0/CC-BY-NC-4.0,
    but the dataset/code license itself is Apache-2.0.)'
  raw_format: 'github.com/chernyadev/bigym demonstrations/demo_store.py and demonstrations/utils.py:
    demos are serialized/cached using the `safetensors` library (`from safetensors
    import safe_open`, `SAFETENSORS_SUFFIX` constant) as ''lightweight'' action-only
    files, not RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord; mapped to Custom.'
  collection_method: 'arXiv:2407.07788 paper Sec 3.3 ''Demo Collection Pipeline'':
    ''We use VR (Valve Index VR headset, two controllers and two base stations) to
    collect demonstrations by virtually tele-operating the H1 robot in simulation.''
    Human teleoperation performed inside a MuJoCo simulator -> closest enum match
    is teleop (same mapping used for other ''human teleoperation in simulation'' datasets
    in this corpus, e.g. gr00t_teleop_sim.yaml).'
  secondary_collection_methods: Re-checked paper Sec 3.3 and GitHub README/tools --
    the entire released 2000-demo dataset is produced by a single method (VR teleoperation,
    see collection_method above). No autonomous-policy rollouts, motion-planner-generated
    (RLBench-style) trajectories, or other secondary collection pipeline are shipped
    with BiGym; confirmed empty list is accurate, not an oversight.
  is_multi_embodiment: 'Re-checked paper Sec 3.2 ''Humanoid Body Configurations''
    and Sec 3.2 ''Action Modes'': BiGym implements exactly one physical embodiment
    (Unitree H1 + 2x Robotiq 2F-85), exposed through two alternative *action-mode*
    configurations (whole-body vs. bi-manual) of the same robot -- not multiple distinct
    robot embodiments. False, in contrast to humanoidbench/yubi in this corpus which
    genuinely span several different robot platforms.'
  embodiment_class: 'Paper Sec 1/3: ''Built upon the humanoid embodiment of Unitree
    H1 robot'' -- a legged bipedal humanoid with two arms, matching the humanoid enum
    value.'
  robot_platform: 'Paper Sec 3.2 ''Humanoid Body Configurations'': ''We implement
    the platform with the Unitree H1 robot given its publicly available model'' (footnote
    linking github.com/google-deepmind/mujoco_menagerie/tree/main/unitree_h1), with
    2x Robotiq 2F-85 grippers attached. Re-verified 2026-07-10: correct, unchanged.
    The RobotPlatform enum in common/schema.py already contains UNITREE_H1 = ''unitree_h1''
    (added per docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    Sec 4 Table A, which explicitly lists bigym as the source dataset for this enum
    addition), so no enum gap remains here; the stale suggested_new_enum_values entry
    recommending this addition has been removed as resolved.'
  num_arms: 'Paper Sec 3.2/Fig 2: ''BiGym builds upon Unitree H1 robot with 3 RGB-D
    cameras at the head, left wrist, and right wrist'' and describes bi-manual (two-arm)
    control throughout (action space includes A_arms for both arms).'
  dof_per_arm: 'Re-verified with stronger primary-source evidence than the prior pass:
    paper Appendix A ''Action Spaces'' gives the whole-body action space as A_wb in
    R^23 = {A_arms, A_legs, A_torso, A_grip}, where ''A_arms in R^10 controls both
    arms'' -- 10 / 2 arms = 5 DoF per arm, unchanged from the previously recorded
    value. This is corroborated by the earlier joint-counting derivation (Sec 3.2:
    base Unitree H1 arm has 4 native joints per mujoco_menagerie/unitree_h1 h1.xml,
    plus ''an additional Robotiq 2F-85 gripper with an actuated wrist joint to each
    arm'' = 4 + 1 = 5).'
  dof_per_hand: Not applicable -- BiGym uses a 1-DoF Robotiq 2F-85 parallel-jaw gripper
    per arm (open/close only, captured in the 2-dim A_grip action component and gripper_type=parallel_jaw),
    not a multi-finger dexterous hand. Left blank rather than filled, since this field
    is specifically for dexterous-hand DoF per the schema design doc (2026-07-10 registry-schema-refinement-design.md
    Sec 3.3), which does not apply here.
  gripper_type: 'Paper Sec 3.2: ''we attach an additional Robotiq 2F-85 gripper with
    an actuated wrist joint to each arm'' -- the Robotiq 2F-85 is a two-finger parallel-jaw
    gripper.'
  has_mobile_base: 'Paper title/abstract: ''mobile bi-manual manipulation''; Sec 3.2
    describes a ''whole-body mode'' (full leg control) and ''bi-manual mode'' (legs
    replaced by an omni-directional floating base) -- the embodiment is mobile (able
    to navigate the scene), unlike a fixed-base manipulator.'
  hand_pose_representation: Not applicable, for the same reason as dof_per_hand above
    -- no dexterous hand or bare-hand tracking is used (only a 1-DoF parallel gripper).
    This field is complementary to rotation_representation (which IS applicable and
    set to ''none'' below) but is reserved for finger/hand-shape encoding, which BiGym
    does not have. Left blank rather than set to the HandPoseRepresentation.NONE enum
    member, to keep it distinguishable from "has a hand but no pose encoding recorded"
    cases.
  action_space: 'Paper Table 1 comparison row for BiGym: action mode = ''J / J+FB''
    (Joint position action mode, optionally with Floating Base). README.md ''Working
    with demonstrations'' warning: released demos only cover `JointPositionActionMode(floating_base=True,
    absolute=True/False)` -- joint-position control.'
  action_frame: 'README.md warning: ''The current dataset includes demonstrations
    for the following action modes only: JointPositionActionMode(floating_base=True,
    absolute=True) - JointPositionActionMode(floating_base=True, absolute=False)''
    -- both absolute and delta (absolute=False) joint-position targets are present
    in the released dataset.'
  rotation_representation: Action space is joint-position control (arms + floating
    base + gripper opening), per paper Sec 3.2 equations for A_bm; there is no explicit
    Cartesian end-effector orientation representation encoded in the action vector.
  state_dim: 'Re-verified via paper Appendix A ''Observation Spaces'': bi-manual/floating-base
    proprioceptive state s_proprio^bm in R^64 = {s_qpos^bm, s_qvel^bm, s_base, s_grip},
    where s_qpos^bm, s_qvel^bm in R^29 each, s_base in R^4, s_grip in R^2 (29+29+4+2=64)
    -- matches the floating_base=True configuration used for the publicly released
    demonstrations. Value unchanged, citation strengthened with the exact per-component
    breakdown found in Appendix A.'
  action_dim: 'Re-verified via paper Appendix A ''Action Spaces'': bi-manual mode
    action space A_bm in R^16 = {A_arms, A_base, A_grip}, where A_arms in R^10 (shared
    with whole-body mode), A_base in R^4 (delta x/y/z/theta of floating base), A_grip
    in R^2 (10+4+2=16) -- matching the floating_base=True JointPositionActionMode
    variants that make up the released demo dataset (the alternative whole-body mode
    uses A_wb in R^23, not the released config). Value unchanged, citation strengthened.'
  fps: 'github.com/chernyadev/bigym bigym/bigym_env.py: ''CONTROL_FREQUENCY_MAX =
    500'' with control_frequency defaulting to CONTROL_FREQUENCY_MAX and docstring
    ''Control loop frequency, 500 Hz by default.''; demonstrations/demo_store.py DemoStore.get_demos()
    also defaults `frequency: int = CONTROL_FREQUENCY_MAX` (500). Independently corroborated
    by paper Sec 3.3 ''Down-Sampling Demonstrations'': ''we capture demonstrations
    at the frequency of physics calculation (500Hz)''. Re-verified against current
    repo code 2026-07-10, unchanged.'
  fps_variable: 'Paper Sec 3.3 ''Down-Sampling Demonstrations'': ''we capture demonstrations
    at the frequency of physics calculation (500Hz) and provide the functionality
    to down-sample the demonstrations to a desired frequency (20-500Hz)''; bigym_env.py
    defines CONTROL_FREQUENCY_MIN=20 / CONTROL_FREQUENCY_MAX=500 and asserts requested
    frequency falls in that range. Re-verified against current repo code 2026-07-10,
    unchanged.'
  num_camera_views: 'Paper Sec 3.2 ''Observation Spaces'': ''we mount three cameras
    on the robot: the forehead, the left wrist, and the right wrist.'''
  camera_views: 'Paper Fig 2 caption: ''Unitree H1 robot with 3 RGB-D cameras at the
    head, left wrist, and right wrist'' -- mapped to head/left_wrist/right_wrist enum
    values.'
  has_synchronized_multiview_rig: All 3 cameras (head, left_wrist, right_wrist) are
    rendered from the same MuJoCo simulation state at each timestep (paper Appendix
    A ''Observation Spaces'' / Sec 3.2 observation-space definition O = {I_head, I_left,
    I_right, D_head, D_left, D_right, s_proprio}), so by construction of the simulator
    all views are frame-synchronized -- true, unlike real-world rigs where this must
    be independently verified.
  has_camera_calibration: github.com/chernyadev/bigym README.md usage example shows
    cameras configured via `CameraConfig(name=..., rgb=..., depth=..., resolution=...)`
    attached to fixed robot sites (head/left wrist/right wrist) in the MJCF model;
    since this is a MuJoCo simulation, exact camera intrinsics/extrinsics are fully
    known/derivable from the scene definition rather than estimated.
  depth_coverage: 'Paper abstract/Sec 3.2: ''Each camera can generate both RGB and
    depth observations'' for all 3 cameras -> full depth coverage.'
  additional_modalities: Re-checked paper Appendix A ''Observation Spaces'' and README/ObservationConfig
    API -- observations are limited to RGB, depth, and proprioceptive state (joint
    positions/velocities, base pose, gripper opening). No force/torque, tactile, audio,
    or eye-gaze sensing is described anywhere; confirmed empty list is accurate.
  has_language_instruction: No natural-language task instructions, language-conditioning,
    or text annotations are described anywhere in the paper or README; tasks are selected
    via discrete named Gym-style environment classes (e.g. ReachTarget, DishwasherOpen),
    not free-form language.
  num_task_types: 'Paper abstract/Sec 3: ''BiGym features 40 diverse tasks set in
    home environments''; README.md ''Tasks'' table also enumerates exactly 40 task
    classes.'
  urdf_available: Paper Sec 3.2 footnote cites the publicly available MJCF robot model
    at github.com/google-deepmind/mujoco_menagerie/tree/main/unitree_h1, used as the
    base H1 model with an added Robotiq 2F-85 gripper model; a machine-readable robot
    description is available (MJCF, not URDF proper, but functionally equivalent and
    shipped/referenced in the codebase).
  urdf_source: Paper Sec 3.2 footnote 2 links directly to github.com/google-deepmind/mujoco_menagerie/tree/main/unitree_h1
    -- a third-party/community-maintained (Google DeepMind) curated model repository,
    not Unitree's own manufacturer repo, so mapped to community_repo. (Corrected footnote
    number from 1 to 2 during re-verification; enum value itself confirmed unchanged.)
  expected_num_episodes: 'Paper Sec 3 (Introduction): ''we provide for each task only
    sparse rewards but with 50 demonstrations''; Paper Sec 3/abstract confirms 40
    tasks total -> 50 x 40 = 2000 human-collected demonstrations.'
  expected_duration_hours: Not found -- no explicit total recording-time or average
    episode-duration figure is stated in the paper, README, or code (only a control-frequency
    and a generic ENV_TIME_LIMIT placeholder constant with no disclosed numeric value
    per task). Computing this from episode step-limits would require assumptions not
    grounded in a citable source, so left blank rather than estimated.
  num_subjects: Not found -- neither the paper (main text, Sec 3.3 Demo Collection
    Pipeline, or Acknowledgements) nor the GitHub README/VR README state how many
    human operators performed the VR teleoperation used to collect the 2000 demonstrations.
    Left blank rather than guessed.
  num_scenes: Not found as a distinct, unambiguous count -- the paper describes a
    single customisable MuJoCo kitchen/home scene built from swappable modules (Sec
    3.2 ''Scenes''), with per-task object/layout variation, but never states a discrete
    "number of scenes" figure separate from num_task_types (40). Left blank rather
    than conflating it with the task count.
  num_objects: 'Paper Sec 3.2 ''Scenes'': ''Currently, BiGym provides 46 high-quality
    assets that could be reused to facilitate the creation of new environments. In
    addition to rigid object models, BiGym offers a set of articulated models, such
    as a dishwasher and customisable kitchen modules.'' This counts distinct 3D asset/object
    models (rigid + articulated) provided by the codebase, not a per-episode manipulable-object
    tally, so treat with some caution as an approximation of "num_objects".'
suggested_new_enum_values:
  expected_size_gb: 'No documented fixed dataset size found: BiGym distributes ''lightweight''
    action-only safetensors demonstrations (per demonstrations/demo_store.py) that
    are re-rendered locally into full RGB-D observations on demand at user-chosen
    resolution/frequency, so there is no single canonical on-disk size to report;
    leaving this field blank rather than guessing is preferred to fabricating a number.'
