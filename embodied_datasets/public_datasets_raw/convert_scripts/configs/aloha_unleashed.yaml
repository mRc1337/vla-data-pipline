id: aloha_unleashed
name: ALOHA Unleashed
source_url: https://aloha-unleashed.github.io/
license: Unknown
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: dual_arm
robot_platform: viperx
num_arms: 2
dof_per_arm: 6
gripper_type: parallel_jaw
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 14
action_dim: 14
fps: 50.0
fps_variable: false
num_camera_views: 4
camera_views:
- top
