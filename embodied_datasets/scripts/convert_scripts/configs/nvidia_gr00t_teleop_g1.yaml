num_task_types: 4
expected_size_gb: 0.4
expected_num_episodes: 1095
expected_duration_hours: 1.72
num_objects: 4
review_status: pending_human_review
field_sources:
  source_url: 'Confirmed via HF datasets API (api/datasets/nvidia/PhysicalAI-Robotics-GR00T-Teleop-G1):
    title "Unitree G1 Fruits Pick and Place 1K Dataset", real-robot Unitree G1 teleop
    data. This is a DISTINCT dataset from the sibling config gr00t_teleop_sim.yaml
    (nvidia/PhysicalAI-Robotics-GR00T-Teleop-Sim), which is a SIMULATED Fourier GR1
    dataset -- confirmed by gr00t_teleop_sim.yaml''s own field_sources notes, which
    already flagged Teleop-G1 as a separate real-robot/Unitree-G1/cc-by-4.0 (non-NC)
    repo during its own re-verification pass. No duplicate/overlap risk.'
  license: 'HF API cardData: "license": "cc-by-4.0"; README.md "License/Terms of Use"
    section: "This dataset is licensed under the Creative Commons Attribution 4.0
    International License (CC BY 4.0)." Matches LicenseEnum.CC_BY_4_0 exactly (note:
    NOT NC, unlike the sibling gr00t_teleop_sim which is CC-BY-NC-4.0).'
  raw_format: 'DETERMINED FROM ACTUAL FILE LISTING, OVERRIDING README TEXT: HF API
    siblings listing (2212 files) shows exactly 1095 *.parquet files under data/chunk-000/episode_*.parquet
    and 1095 *.mp4 files under videos/chunk-000/{video_key}/episode_*.mp4, plus per-task
    meta/info.json (codebase_version "v2.1"), meta/modality.json, meta/tasks.jsonl,
    meta/episodes.jsonl, meta/stats.json -- this is the standard LeRobot v2.1 dataset
    layout. Zero .hdf5 files exist anywhere in the repo (grepped all 2212 siblings).
    NOTE FOR HUMAN REVIEW: README.md''s own "Dataset Format" section says "MP4 and
    HDF5 files" and "Dataset Quantification" says "1000 HDF5 files for actions" --
    this text is stale/inaccurate (no HDF5 present); the actual shipped format is
    LeRobot v2.1 parquet+mp4. Chose raw_format=LeRobot to match the files that actually
    exist, not the README''s stale description.'
  release_type: Fixed, already-recorded release of 1095 episodes across 4 fruit-pick
    tasks (verified exact file counts, see expected_num_episodes note); not a generation
    framework, scene platform, or RL benchmark env.
  collection_method: 'README.md Dataset Description: "...consists of 1000 teleoperation
    trajectories of real robot data using Unitree G1..."; dataset name itself is "GR00T-Teleop-G1";
    README "Dataset Characterization / Data Collection Method: [Human]" confirms human-driven
    teleoperation of a REAL (not simulated) robot. Maps to teleop per this registry''s
    convention (mechanism = human-driven), matching the same convention already applied
    to the sibling gr00t_teleop_sim.yaml.'
  secondary_collection_methods: 'Left empty: README describes 100% real-robot teleoperation
    across all 4 fruit-pick task folders, no simulated or autonomous-policy portion
    mentioned anywhere.'
  is_multi_embodiment: 'Verified false: all 4 task folders (g1-pick-apple, g1-pick-pear,
    g1-pick-grapes, g1-pick-starfruit) use the identical Unitree G1 + Dex3-style tri-finger
    hands embodiment -- same 43-dim state/action feature schema (identical joint names)
    across all 4 meta/info.json files. No other embodiment appears.'
  embodiment_class: 'README.md: "...real robot data using Unitree G1, with upper body
    control..."; Unitree G1 is a full bipedal humanoid platform -> humanoid. The state/action
    vector also includes left_leg/right_leg joint dims (see robot_platform note),
    consistent with a full humanoid embodiment even though the task itself only requires
    upper-body motion.'
  robot_platform: README.md title "Unitree G1 Fruits Pick and Place 1K Dataset" and
    body text "...real robot data using Unitree G1..." -> RobotPlatform.UNITREE_G1.
    Confirmed by meta/info.json observation.state/action joint names (left_hip_pitch_joint,
    left_knee_joint, waist_yaw_joint, left_shoulder_pitch_joint, left_hand_thumb_2_joint,
    etc.) which are the canonical Unitree G1 URDF joint names.
  num_arms: meta/modality.json (g1-pick-apple) explicitly slices the 43-dim state/action
    vector into left_arm (dims 15-22) and right_arm (dims 29-36) -- exactly two arms.
  dof_per_arm: meta/modality.json left_arm slice is dims [15,22) = 7 dims, right_arm
    [29,36) = 7 dims -- 7 dof per arm (shoulder_pitch/roll/yaw, elbow, wrist_roll/pitch/yaw
    per meta/info.json feature names).
  dof_per_hand: 'meta/modality.json left_hand slice is dims [22,29) = 7 dims, right_hand
    [36,43) = 7 dims -- 7 dof per hand. Feature names per hand: index_0, index_1,
    middle_0, middle_1, thumb_0, thumb_1, thumb_2 (2+2+3=7), matching the Unitree
    Dex3-1 three-fingered dexterous hand''s published 7-DOF spec.'
  gripper_type: 'README.md: "...a pair of Unitree G1 Tri-fingers hand." The 7 independently
    named per-finger joints per hand (index 2-dof, middle 2-dof, thumb 3-dof, all
    individually actuated per meta/info.json feature names) match Unitree''s Dex3-1
    dexterous hand product (marketed by Unitree as a dexterous/anthropomorphic hand,
    not an underactuated 3-jaw mechanical gripper) -> GripperType.DEXTEROUS_HAND rather
    than three_jaw.'
  hand_pose_representation: The 7-dim left_hand/right_hand slices in meta/modality.json
    are part of the same joint-position state/action vector as the rest of the 43-dim
    vector (action_space=joint_position) -- hand shape is encoded as actuated finger-joint
    angles, not MANO parameters or 3D keypoints -> joint_angles.
  has_mobile_base: README.md describes only "upper body control" for a tabletop fruit
    pick-and-place task; images show the G1 standing in front of a table. The state/action
    vector does include left_leg/right_leg dims (6 each, likely held near-fixed for
    standing balance, same leg-dims-present-but-task-is-stationary pattern already
    seen and flagged in the sibling gr00t_teleop_sim.yaml for the Fourier GR1). No
    wheeled/tracked mobile base is mentioned or implied anywhere -> false.
  action_space: 'README.md "Modality" section: "Action: 43 dim of vectorized action
    (joint positions of full body + hands)" -- explicit joint-position control, confirmed
    by meta/modality.json which slices the action vector entirely into joint-space
    body-part groups (legs/waist/arms/hands), no Cartesian/eef pose fields.'
  action_frame: 'Inferred, not explicitly labeled "absolute" or "delta" in the README:
    the action feature is described as raw "joint positions" (same phrasing pattern
    as the sibling gr00t_teleop_sim.yaml, which used identical reasoning to conclude
    absolute). No delta/relative language anywhere in README or meta files. Flagged
    as inferred rather than explicitly stated; a human should double check by inspecting
    raw parquet action values if higher confidence is needed.'
  rotation_representation: Both observation.state and action are joint-position vectors
    per meta/modality.json (legs/waist/arms/hands all as joint angles), not end-effector
    Cartesian/orientation representations -> none.
  state_dim: meta/info.json (all 4 task folders) observation.state feature shape [43],
    with 43 named joints listed identically in every folder.
  action_dim: meta/info.json (all 4 task folders) action feature shape [43], same
    43 named joints as state.
  fps: 'meta/info.json for all 4 task folders (g1-pick-apple, g1-pick-pear, g1-pick-grapes,
    g1-pick-starfruit) each report "fps": 20 with zero variation; README.md "Modality"
    section also states "RGB video, 640x480 resolution, 20fps".'
  fps_variable: 'All 4 meta/info.json files report fps: 20 uniformly, no per-task
    or per-episode variation.'
  num_camera_views: 'meta/info.json "features" block for every task folder lists exactly
    one video feature key, "observation.images.ego_view" (aliased "rs_view" in meta/modality.json);
    README.md: "The robot is equipped with the default realsense camera" (singular).'
  camera_views: meta/modality.json maps the single video feature to alias "rs_view"
    with original_key "observation.images.ego_view" -- an egocentric camera fixed
    to the robot itself (identical feature-key naming convention, "ego_view", already
    mapped to the head enum value in the sibling gr00t_teleop_sim.yaml), so mapped
    to head here too. Not independently confirmed to be head- vs chest-mounted from
    README text alone; flagged as a reasonable but not 100%-certain placement.
  has_synchronized_multiview_rig: Only a single camera (observation.images.ego_view
    / rs_view) exists per meta/info.json, so there is no multi-camera rig to synchronize.
  has_camera_calibration: Grepped all 2212 files in the HF API siblings listing for
    any "calib" filename -- none found in any of the 4 task folders. No calibration
    files ship with this dataset -> false.
  depth_coverage: 'meta/info.json video feature info block: "video.is_depth_map":
    false for the single ego_view/rs_view camera in every task folder; README only
    describes "RGB video" -> none.'
  additional_modalities: 'Left empty (verified, not just defaulted): meta/info.json
    "features" block (checked g1-pick-apple) only contains observation.images.ego_view,
    observation.state, action, observation.img_state_delta (a sync-flag scalar, not
    a sensor modality), timestamp, frame_index, episode_index, index, task_index.
    No force_torque, tactile, audio, or eye_gaze feature present anywhere.'
  has_language_instruction: 'README.md "Modality" section explicitly lists 4 "Language
    Instruction" example strings (one per fruit); meta/tasks.jsonl confirms 4 distinct
    task strings ("Pick up the yellow pear and place it on the plate", "Pick up the
    red apple and place it on the plate", "Pick up the green grapes and place it on
    the plate", "Pick up the yellow starfruit and place it on the plate"), and meta/modality.json
    has an explicit "annotation": {"human.task_description": ...} field mapping task_index
    to these language strings.'
  num_task_types: 'README.md: "A total of 4 fruits are used: Apple, Pear, Starfruit,
    Grape" -- exactly 4 distinct language-instruction/task types, one per top-level
    folder (g1-pick-apple, g1-pick-pear, g1-pick-grapes, g1-pick-starfruit); each
    folder''s meta/info.json reports total_tasks: 1 (single task type per folder),
    and meta/tasks.jsonl lists the 4 distinct task strings across the dataset.'
  expected_size_gb: 'README.md "Dataset Quantification": "Total data storage: ~400MB".
    Converted to GB as 0.4 (approximate, as stated in README with a "~" prefix).'
  expected_num_episodes: 'MEASURED EXACTLY, DIFFERS FROM README''S ROUNDED "1000"
    FIGURE: summed total_episodes across all 4 meta/info.json files -- g1-pick-apple=311,
    g1-pick-pear=264, g1-pick-grapes=233, g1-pick-starfruit=287, total=1095. Independently
    cross-checked against the HF API siblings listing: exactly 1095 *.parquet data
    files and exactly 1095 *.mp4 video files exist in the repo, confirming 1095 is
    the true physical episode count (not an artifact of miscounting). README.md''s
    "1000 teleoperation trajectories" / "1000 videos" / "1000 HDF5 files" figures
    are therefore an approximate/nominal "~1K" branding figure, not the exact count;
    some per-task folders also list discarded_episode_indices (e.g. grapes: 11 discarded,
    starfruit: 8, apple: 2, pear: 0) that are seemingly still counted within total_episodes
    rather than excluded. Recorded the exact, independently-verified 1095 figure rather
    than the README''s rounded "1000".'
  expected_duration_hours: Summed total_frames across all 4 meta/info.json files (29864+32319+26970+34640
    = 123793 frames), divided by the confirmed uniform fps of 20.0 and by 3600 ->
    123793 / 20 / 3600 = 1.7193 hours, rounded to 1.72. This is an exact sum over
    the full dataset (all 4 task folders), not an extrapolation from a sample.
  num_objects: 'README.md Dataset Description: "A total of 4 fruits are used: Apple,
    Pear, Starfruit, Grape." -- an explicit stated count, unlike the sibling gr00t_teleop_sim.yaml
    where a comparable count had to be left blank for lack of an explicit statement.'
  num_subjects: 'Checked README.md in full: no mention anywhere of the number of human
    teleoperators who produced the demonstrations. Left blank rather than fabricate.'
  num_scenes: 'Checked README.md: describes a single tabletop fruit pick-and-place
    setup per folder (4 folders total), but never states a discrete count of distinct
    scenes/environment layouts (e.g. whether background/lighting varied across episodes).
    Left blank rather than fabricate.'
  paper_url: Searched README.md (fetched in full) for a citation/BibTeX/paper section
    -- none present. README only links to the general Isaac-GR00T GitHub finetuning
    guide (https://github.com/NVIDIA/Isaac-GR00T/blob/main/getting_started/3_0_new_embodiment_finetuning.md),
    not a paper. WebSearch tool errored out in this sandbox (Bedrock tool-not-found
    error); could not perform an additional external search pass. No paper found to
    cite -- left blank rather than assert an inferred-only link, consistent with the
    same blank-paper_url decision already made for the sibling gr00t_teleop_sim.yaml.
suggested_new_enum_values: {}
