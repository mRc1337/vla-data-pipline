id: gensim2
name: GenSim2
source_url: https://gensim2.github.io/
paper_url: https://arxiv.org/abs/2410.03645
license: MIT
raw_format: Custom
release_type: generation_framework
collection_method: simulation
secondary_collection_methods:
- teleop
is_multi_embodiment: true
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
action_frame: absolute
rotation_representation: quaternion
state_dim: 15
action_dim: 8
num_camera_views: 4
camera_views:
- front
- side
- wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: true
num_task_types: 50
urdf_available: true
urdf_source: dataset_repo
review_status: pending_human_review
field_sources:
  source_url: https://gensim2.github.io/ (verified reachable; links to paper, code,
    and tutorial)
  license: re-verified 2026-07-10 -- confirmed via GitHub API (api.github.com/repos/GenSim2/GenSim2
    license.spdx_id == 'MIT') and raw LICENSE file (MIT License, Copyright (c) 2024
    GenSim2)
  raw_format: https://github.com/GenSim2/GenSim2/blob/master/gensim2/agent/dataset/sim_traj_dataset.py
    -- trajectories stored via a custom zarr-based ReplayBuffer (not RLDS/HDF5/LeRobot/TFRecord/ROS_bag),
    hence Custom
  collection_method: arXiv:2410.03645 Section 3.2 (Demonstration Generation via keypoint-based
    motion planning and RL solvers run in SAPIEN simulation); bulk of released demonstrations
    are simulation-generated. A small supplementary set (10 real-world demos/task)
    was collected via teleoperation for co-training, per Section 5.1
  embodiment_class: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- single fixed-base Franka arm
  robot_platform: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent(robot='panda') default, loading ASSET_ROOT/robot/panda/panda_newgripper.urdf;
    an alternate 'fr3' (Franka Research 3) option also exists in the same function,
    and the real-robot experiments in arXiv:2410.03645 Section 5.1 used a Franka Research
    3 arm
  num_arms: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- one arm agent per environment
  dof_per_arm: re-verified 2026-07-10 -- confirmed still correct via base_env.py setup()
    init_qpos (7 arm joint values + 2 gripper finger joints, panda/fr3 both 7-DOF
    arms)
  gripper_type: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    (panda_leftfinger/panda_rightfinger parallel gripper links); arXiv:2410.03645
    Sec. 5.1 describes a modified parallel (TPU) gripper on the real robot
  has_mobile_base: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent() -- fixed base_link_name ('panda_link0'/'fr3_link0'), no mobile base
    code path
  action_space: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() -- action encodes a target end-effector pose (position + rotation)
    plus gripper command, passed to a motion planner
  action_frame: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() -- action pose is used directly as the planner's target pose (absolute),
    not as a delta from current pose
  rotation_representation: 'https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_env.py
    move_to_pose() (accepts an euler or quaternion rotation block) and https://github.com/GenSim2/GenSim2/blob/master/gensim2/agent/experiments/configs/env/gensim2.yaml
    (default `domains: real_data_11task_10eps_quat_10240` dataset name indicates quaternion
    action representation is the one actually used)'
  state_dim: re-verified 2026-07-10 -- confirmed still correct via base_env.py get_robot_state()
    -- ee position (3) + ee quaternion (4) + robot_qpos[:-1] (8, i.e. 7 arm joints
    + 1 gripper finger value since qpos is 9-dim and only the last redundant finger
    entry is dropped) = 15, matching the in-code comment '# 15'
  action_dim: re-verified 2026-07-10 -- confirmed still correct via base_env.py move_to_pose()
    -- when action.shape[0] != 7 (the quaternion-action branch actually used per the
    'real_data_11task_10eps_quat_10240' dataset name), pose[3:] = action[3:7] (quaternion)
    and open_gripper = action[-1] = action[7], i.e. position(3) + quaternion(4) +
    gripper(1) = 8
  num_camera_views: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_task.py
    -- self.camera_names = ['wrist', 'left', 'right', 'default'] (4 cameras set up
    per task); consistent with arXiv:2410.03645 Sec. 5.1 describing 3 RealSense D435
    cameras (1 wrist-mounted + 2 external) on the real robot rig
  camera_views: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/task_setting.py
    CAMERA_CONFIG -- 'default' is a static external camera facing the scene (mapped
    to front); 'left'/'right' are static external cameras on either side of the workspace
    (mapped to side, single generic value since CameraView has no distinct left/right
    enum); 'wrist' camera has mount_actor_name='panda_hand' (gripper-mounted) and
    now maps directly to the CameraView.WRIST enum value added in the schema refinement
    -- re-verified 2026-07-10, no longer needs a suggested_new_enum_values entry
  has_camera_calibration: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/env.py
    get_camera_params() returns extrinsic_cv/intrinsic_cv/cam2world_gl for every camera,
    used to fuse multi-camera point clouds
  depth_coverage: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/env.py
    get_pcds_from_cameras() converts per-camera depth (z-buffer) into point clouds
    for all cameras; arXiv:2410.03645 Sec. 5.1 confirms RealSense D435 RGB-D cameras
    on the real rig
  has_language_instruction: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/base/base_task.py
    (self.task_description per task) and the policy's 'language' modality stem (TextEncoder)
    in gensim2/agent/experiments/configs/env/gensim2.yaml
  num_task_types: re-verified 2026-07-10 -- confirmed still correct via doc/env.md
    (7 original + 21 primitive + 22 long-horizon = 50)
  urdf_available: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    -- loads bundled robot URDFs (ASSET_ROOT/robot/panda/panda_newgripper.urdf, ASSET_ROOT/robot/fr3/fr3_nogripper.urdf)
    and object URDFs (.../mobility.urdf per articulated object instance)
  urdf_source: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    -- URDFs are bundled/modified inside the project's own asset directory (e.g. 'panda_newgripper.urdf'
    is a custom-modified gripper variant), not fetched from the manufacturer
  paper_url: 'https://arxiv.org/abs/2410.03645 -- title ''GenSim2: Scaling Robot Data
    Generation with Multi-modal and Reasoning LLMs'' (verified title/abstract match,
    arXiv:2410.03645v1, 4 Oct 2024)'
  release_type: 're-verified 2026-07-10 -- confirmed still correct. GenSim2 is a scalable
    LLM-driven task/data *generation pipeline* (arXiv:2410.03645 abstract: ''a scalable
    framework... for complex and realistic simulation task creation''), not a fixed-episode
    release; matches the design doc''s explicit classification table (docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    Section 4.B -- ''robogen, gensim2 -> generation_framework'')'
  secondary_collection_methods: arXiv:2410.03645 Sec. 5.2 -- 'an additional 10 real-world
    demonstrations via teleoperation' per task, collected on the physical Franka Research
    3 rig for sim-to-real co-training experiments, secondary to the primary simulation-based
    generation pipeline
  is_multi_embodiment: 'https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/sim.py
    setup_agent(robot=...) explicitly supports two distinct, differently-named robot
    configurations selectable by parameter -- ''panda'' (ASSET_ROOT/robot/panda/panda_newgripper.urdf,
    tcp/ee link ''panda_hand'') and ''fr3'' (ASSET_ROOT/robot/fr3/fr3_nogripper.urdf,
    tcp/ee link ''fr3_hand''), each with its own URDF/link names; the real-robot experiments
    in arXiv:2410.03645 Sec. 5.2/Appendix C used the fr3 arm while the released simulation
    pipeline defaults to panda. Judgment call, analogous to the yubi precedent in
    docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md Section
    4.A (deployed across UR/Franka/ELEY -> is_multi_embodiment: true) -- flagging
    for human review since panda/fr3 are both single-arm Franka-family arms rather
    than cross-manufacturer platforms like the yubi case'
  has_synchronized_multiview_rig: https://github.com/GenSim2/GenSim2/blob/master/gensim2/env/sapien/env.py
    get_pcds_from_cameras() fuses point clouds from all cameras captured at the same
    simulation step; arXiv:2410.03645 Appendix C confirms the real rig 'parallelized
    and synchronized point cloud processing from 3 Intel Realsense D435 cameras'
  hand_pose_representation: gripper_type is parallel_jaw (not dexterous_hand or bare-hand
    tracking), so no MANO/keypoint/joint-angle hand-shape encoding applies -- set
    to 'none', consistent with other parallel-gripper configs in this registry (e.g.
    droid.yaml, bridgedata_v2.yaml, functional_manipulation_benchmark_fmb.yaml)
suggested_new_enum_values:
  robot_platform: fr3 (Franka Research 3) -- gensim2/env/sapien/sim.py setup_agent()
    supports an 'fr3' robot option (ASSET_ROOT/robot/fr3/fr3_nogripper.urdf, ee link
    'fr3_hand') distinct from 'panda', and the real-robot sim-to-real experiments
    in arXiv:2410.03645 Sec. 5.2/Appendix C were run on this FR3 arm rather than the
    panda default. The current RobotPlatform enum only has franka_panda, with no separate
    FR3 entry, so robot_platform is kept as franka_panda (the sim default/majority
    configuration) pending a dedicated enum value.
