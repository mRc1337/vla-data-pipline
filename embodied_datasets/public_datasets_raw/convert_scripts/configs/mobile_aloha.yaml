    (linked from https://github.com/MarkFzp/mobile-aloha README), were not independently
    measured and may differ in size).'
  expected_num_episodes: 'Sum of ''total_episodes'' from meta/info.json across the
    6 lerobot/aloha_mobile_* mirrors: wipe_wine=50, shrimp=18, wash_pan=50, cabinet=85,
    chair=55, elevator=20 => 278 RE-VERIFIED unchanged: wipe_wine=50, elevator=20,
    cabinet=85, shrimp=18, wash_pan=50, chair=55 (sum=278) from each mirror''s meta/info.json
    ''total_episodes''.'
  expected_duration_hours: 'Computed: sum of ''total_frames'' across the 6 lerobot/aloha_mobile_*
    meta/info.json files (wipe_wine=65000, elevator=45000, cabinet=127500, shrimp=67500,
    wash_pan=55000, chair=110000 => 470000 total frames) divided by fps=50 => 9400s
    = 2.61 hours. Reflects only the 6 publicly released tasks (278 episodes), not
    the unreleased 7th task (High Five, 20 demos).'
  num_subjects: 'arXiv 2401.02117, Conclusion/Limitations: ''the Mobile ALOHA demonstrations
    are collected by two expert operators.'' (Distinct from the separate 8-person
    user study in Sec 8, which evaluates teleoperation learning curves and is not
    part of the released dataset''s own demonstrations.)'
  paper_url: 'https://arxiv.org/abs/2401.02117 (Mobile ALOHA: Learning Bimanual Mobile
    Manipulation with Low-Cost Whole-Body Teleoperation, Fu, Zhao, Finn, Stanford)'
  secondary_collection_methods: 'RE-VERIFIED unchanged (empty): all episodes collected
    via the same whole-body leader-follower teleoperation system described in arXiv
    2401.02117 Sec 3; no secondary collection method (e.g. autonomous rollouts, simulation)
    used for the released episodes themselves. (The paper''s co-training with the
    separate static-ALOHA dataset is a training-time technique, not a second collection
    method used to produce Mobile ALOHA''s own episodes.)'
