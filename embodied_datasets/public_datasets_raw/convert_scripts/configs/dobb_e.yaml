field_sources:
  source_url: Stub's recorded name 'Dobb-E' resolved to the project's official homepage
    https://dobb-e.com (confirmed via arXiv:2311.16098 abstract, which links to https://dobb-e.com
    as the official open-source release site); GitHub code repo is https://github.com/notmahi/dobb-e
    and paper is https://arxiv.org/abs/2311.16098. Re-verified 2026-07-10 by re-fetching
    both the arXiv abstract page and the live dobb-e.com homepage; no change.
  paper_url: Newly filled (was blank). arXiv:2311.16098, 'On Bringing Robots Home'
    (Shafiullah, Rai, Etukuru, Liu, Misra, Chintala, Pinto, 2023) - linked directly
    from dobb-e.com 'Read the paper' button and matches the paper cited throughout
    this config's other field_sources entries.
  license: 're-verified 2026-07-10: https://github.com/notmahi/dobb-e/blob/main/LICENSE
    (raw-fetched) confirms the code repo is MIT, and the HuggingFace model card (huggingface.co/notmahi/dobb-e,
    via API) also tags license:mit, but both cover only code/model weights, not the
    raw HoNY video/action dataset files themselves (hosted separately at dl.dobb-e.com
    / Google Drive per dobb-e.com/#dataset). dobb-e.com footer HTML (raw-fetched,
    line ~865-866) literally reads: ''The source code is licensed MIT. The website
    content is licensed <a href="http://creativecommons.org/licenses/by-nc-sa/4.0/">CC
    ANS 4.0</a>'' - the link target confirms this is CC-BY-NC-SA-4.0 (the visible
    ''CC ANS 4.0'' label appears to be a garbled/boilerplate academic-page-template
    string), but the sentence explicitly scopes this to ''website content'', not the
    downloadable dataset archives. CC-BY-NC-SA-4.0 is now a valid LicenseEnum value
    (schema was extended since the last pass), so the enum-gap that previously justified
    recording Unknown no longer exists, but the underlying ambiguity (does this boilerplate
    clause even apply to the dataset files?) is unresolved, so license is still recorded
    as Unknown rather than guessed. A third-party LeRobot re-upload (huggingface.co/datasets/IPEC-COMMUNITY/dobbe_lerobot)
    tags license:apache-2.0, but that is the re-packager''s own relicensing choice,
    not an authoritative statement from the original Dobb-E authors, so it was not
    used.'
  raw_format: 'arXiv:2311.16098 sec ''Dataset Format'' (p.9): dataset is exported
    RGB+depth video plus a custom per-frame action/pose annotation format (via Record3D
    R3D export processed by stick-data-collection code), not RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord.
    Re-verified 2026-07-10 against downloaded PDF text; unchanged.'
  release_type: Newly filled (was already set but unsourced; now documented). HoNY
    is a fixed, one-time-collected corpus of 5620 pre-recorded demonstrations (arXiv:2311.16098
    sec 2.2, dobb-e.com/#dataset), not a procedural generation framework, simulated
    scene/asset platform, or an RL benchmark environment, so fixed_episode_dataset
    is the correct ReleaseType enum value.
  collection_method: 'arXiv:2311.16098 sec 2.1 ''The Stick'': demonstrations are collected
    with a handheld reacher-grabber stick with a mounted iPhone (visual+inertial odometry
    via ARKit) standing in for the robot gripper, i.e. a UMI-style (Universal Manipulation
    Interface) handheld-device collection method, not teleoperation of the physical
    robot. Re-verified 2026-07-10; unchanged.'
  secondary_collection_methods: 'Newly filled (was already empty; now documented).
    arXiv:2311.16098 sec 2.1/2.2 and sec 4.4: both the HoNY pretraining corpus and
    the few-shot fine-tuning demonstrations used at deployment time are collected
    with the same Stick tool; direct teleoperation of the physical Stretch robot is
    only raised as unrealized future work (sec 4.4: ''Some of these tasks may be possible
    while teleoperating the robot directly rather than using the Stick''), not something
    actually used to produce released data. No secondary collection method found.'
  is_multi_embodiment: 'Newly filled. arXiv:2311.16098 sec 2.1.3 ''Camera Mounts'':
    the Stick and the Hello Robot Stretch arm use matching iPhone mounts specifically
    so that ''the Stick gripper and the robot gripper looks identical'' from the camera''s
    point of view, i.e. the Stick is a proxy/facsimile for a single embodiment (the
    Stretch end-effector), not a second independently-varying embodiment. All released
    demonstration data (HoNY + fine-tuning demos) is collected via this one proxy
    tool, so recorded as false.'
  embodiment_class: 'arXiv:2311.16098 sec 2.1.3 ''Robot Platform'': ''All of our systems
    are deployed on the Hello Robot Stretch, which is a single-arm mobile manipulator
    robot'''
  robot_platform: 'arXiv:2311.16098 sec 2.1.3: robot is the Hello Robot Stretch (RE1);
    not present in the given enum, so mapped to ''other'' (see suggested_new_enum_values)'
  num_arms: 'arXiv:2311.16098 sec 2.1.3: Hello Robot Stretch is explicitly described
    as ''single-arm'''
  dof_per_arm: 'arXiv:2311.16098 sec 2.1.3: ''We use the Stretch RE1 version in all
    of our experiments, with the dexterous wrist attachment that confers 6D movement
    abilities on the robot'''
  gripper_type: 'arXiv:2311.16098 sec 2.1 / 2.1.5 ''Gripper Tips'': Stick and Stretch
    both use a two-finger reacher-grabber style parallel-jaw gripper (with modified
    cylindrical gripper tips)'
  hand_pose_representation: 'Newly filled. Recorded as ''none'': the gripper on both
    the Stick and the Stretch is a simple two-finger parallel-jaw gripper with a single
    continuous opening-angle value (arXiv:2311.16098 sec 2.2 ''Gripper Data'': a trained
    ConvNet predicts ''the distance between the gripper tips as a normalized number
    between 0 and 1''), not a multi-fingered dexterous hand or bare-hand tracking
    setup, so MANO / 3D-keypoints / joint-angle hand-pose encodings do not apply.'
  has_mobile_base: 'arXiv:2311.16098 sec 2.1.3: Hello Robot Stretch is a ''mobile
    manipulator robot'' with a wheeled mobile base'
  action_space: 'arXiv:2311.16098 sec 2.2 ''Learning Details'': policy output space
    is a 7-dimensional vector of relative translation, relative rotation, and gripper
    opening — i.e. end-effector pose (+ gripper), not joint-space'
  action_frame: 'arXiv:2311.16098 sec 2.2 ''Dataset Format'' (p.9): ''we store the
    absolute 6D poses of the iPhone at 30 Hz. During model training or fine-tuning,
    we calculate the relative pose change as the action at the desired frequency during
    runtime'''
  rotation_representation: 'arXiv:2311.16098 sec 2.2 ''Learning Details'': ''the output
    space is a 7-dimensional vector, where the first 3 dimensions are relative translations,
    next 3 dimensions are relative rotations (in axis angle representation), and the
    final dimension is a gripper value'''
  action_dim: 'arXiv:2311.16098 sec 2.2 ''Learning Details'': explicit 7-dimensional
    action vector (3 translation + 3 axis-angle rotation + 1 gripper)'
  fps: 'arXiv:2311.16098 sec 2.1.4 ''Data Collection'': ''We record this data at 30
    FPS onto the phone''; also dobb-e.com dataset section: ''RGB and depth videos
    at 30 fps'''
  fps_variable: arXiv:2311.16098 sec 2.1.4 and dobb-e.com dataset section consistently
    state a fixed 30 FPS/Hz recording rate, no mention of variable frame rate
  num_camera_views: 'arXiv:2311.16098 sec 2.1.3 ''Camera Mounts'': ''our setup operates
    with only one robot mounted camera'' (the iPhone on the Stick/wrist mount)'
  camera_views: 'CORRECTED 2026-07-10: was [other], now [wrist]. arXiv:2311.16098
    sec 2.1.3 ''Camera Mounts'': single iPhone camera mounted at the gripper/wrist,
    with matching mounts on the Stick and the single-arm Stretch (no left/right distinction).
    The schema was extended since the last pass to add CameraView.WRIST as a generic
    non-handed wrist-camera value, which now fits this dataset exactly, so the previous
    ''other'' workaround (and its associated suggested_new_enum_values entry) is no
    longer needed and was removed.'
  has_synchronized_multiview_rig: 'Newly filled. arXiv:2311.16098 sec 2.1.3 ''Camera
    Mounts'': ''our setup operates with only one robot mounted camera'' - a single-camera
    setup cannot be a synchronized multi-view rig, so recorded as false.'
  has_camera_calibration: 'Newly filled. arXiv:2311.16098 sec 2.1.3 ''Camera Mounts'':
    ''since our setup operates with only one robot mounted camera, we don''t have
    to worry about having and calibrating a third-person, environment mounted camera,
    which makes our setup robust to general camera calibration issues'' - the paper
    explicitly states no camera calibration step is used/needed, so recorded as false.'
  depth_coverage: 'dobb-e.com dataset section: ''The dataset contains RGB and depth
    videos at 30 fps''; arXiv:2311.16098 sec 2.1.4: depth captured from the iPhone
    LiDAR at every frame alongside RGB'
  additional_modalities: 'Newly filled (was already empty; now documented). arXiv:2311.16098
    sec 4.3 ''Improving Sensors and Sensory Representations'' explicitly states this
    as a limitation: ''one of the modality that our Stick is missing is having tactile
    and force sensors on the gripper'' - confirms no force_torque/tactile sensing
    exists in the released data. No mention anywhere of audio or eye-gaze capture
    either, so the list remains empty.'
  has_language_instruction: Newly filled. No natural-language instruction annotation
    is described anywhere in arXiv:2311.16098's dataset-format description (sec 2.1.4/2.2)
    or on dobb-e.com/#dataset; demonstrations are only grouped into 8 broad task classes
    (folder/category labels), not annotated with free-text instructions, so recorded
    as false.
  num_task_types: 'arXiv:2311.16098 sec 2.1.2 ''Pretraining Dataset'': ''eight total
    defined broad classes of tasks: switching button, door opening, door closing,
    drawer opening, drawer closing, pick and place, handle grasping, and play data'''
  urdf_available: https://github.com/hello-robot/stretch_urdf - Hello Robot's official
    'URDFs for the Stretch mobile manipulators from Hello Robot Inc.' repository,
    distributed as the hello-robot-stretch-urdf PyPI package
  urdf_source: https://github.com/hello-robot/stretch_urdf - official manufacturer
    (Hello Robot Inc.) repository, not the Dobb-E dataset repo itself
  expected_size_gb: 'https://dobb-e.com/#dataset: two downloadable versions offered,
    ''RGB + actions dataset (814 MB)'' and ''RGB-D + actions dataset (77 GB)''; recorded
    the larger/full RGB-D+actions release (77 GB) since it is the complete raw modality
    set; also stated in arXiv:2311.16098 sec 3 ''Discussion/Artifacts'' as ''a 814
    MB version ... and an 77 GB version with RGB, depth, and the actions'''
  expected_num_episodes: 'arXiv:2311.16098 sec 2.1.2 ''Pretraining Dataset'' and sec
    2.1.4: ''The HoNY dataset ... contains 5620 demonstrations in 13 hours of total
    recording time''; also shown on dobb-e.com dataset section as ''5620 trajectories'''
  expected_duration_hours: 'Newly filled. arXiv:2311.16098 abstract and sec 2.1.2/2.1.4:
    ''13 hours of total recording time''; dobb-e.com/#dataset stat block confirms
    ''22 homes / 216 environments / 5620 trajectories / 13 hours / 1.5 million frames''.'
  num_scenes: 'Newly filled. dobb-e.com/#dataset stat block: ''22 homes, 216 environments,
    5620 trajectories, 13 hours, 1.5 million frames''. arXiv:2311.16098 sec 2.2 explicitly
    equates the paper''s own terminology: ''roughly 10 minutes to collect demonstrations
    in each ''environment'' or scene in their household'' - so the 216 figure (not
    the 22-homes figure) is the correct value for num_scenes, since ''environment''
    is the paper''s own synonym for ''scene''.'
  num_subjects: Investigated, left blank. arXiv:2311.16098 sec 2.1.2 repeatedly refers
    to 'some volunteers' / 'the volunteers' collecting HoNY data across 22 homes,
    and sec 3.3.1 discusses 'novice collector 1' and 'collector 2' anecdotally, but
    no exact count of distinct human demonstrators/volunteers is stated anywhere in
    the paper or on dobb-e.com, so this is left blank rather than guessed.
  num_objects: Investigated, left blank. No aggregate count of distinct manipulated
    objects is given in arXiv:2311.16098 or on dobb-e.com/#dataset (only per-task
    examples like 'plastic plate', 'flowers', etc. in Table/Figure breakdowns, and
    household object categories discussed qualitatively), so left blank rather than
    guessed.
  state_dim: 'Investigated, left blank. arXiv:2311.16098 describes the action space
    (7-dim: 3 translation + 3 axis-angle rotation + 1 gripper) in detail but does
    not describe a separate proprioceptive/state observation vector distinct from
    the RGB(-D) visual input and the 6D iPhone pose used to derive actions, so left
    blank rather than guessed.'
  dof_per_hand: Investigated, left blank / not applicable. gripper_type is parallel_jaw
    (a simple two-finger reacher-grabber gripper with one continuous opening-angle
    value, arXiv:2311.16098 sec 2.2 'Gripper Data'), not a multi-fingered dexterous
    hand, so a per-hand DOF count does not meaningfully apply here and was left blank.
suggested_new_enum_values:
  robot_platform: hello_robot_stretch - Dobb-E (and other home-robot datasets) deploy
    on the Hello Robot Stretch RE1, a widely-used commercially-available single-arm
    mobile manipulator with a dexterous wrist; it does not match any manufacturer-specific
    value in the current enum, so 'other' was used as a fallback here. Re-checked
    2026-07-10, RobotPlatform enum still has no Hello Robot Stretch entry, so this
    suggestion still stands.
