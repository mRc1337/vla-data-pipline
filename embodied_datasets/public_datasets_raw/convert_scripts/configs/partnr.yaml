id: partnr
name: PARTNR
source_url: https://aihabitat.org/partnr/
paper_url: https://arxiv.org/abs/2411.00081
license: CC-BY-NC-4.0
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods: []
is_multi_embodiment: true
embodiment_class: mobile_manipulator
robot_platform: boston_dynamics_spot
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: true
action_space: mixed
num_camera_views: 4
camera_views:
- third_person
- head
- wrist
- gripper_jaw
has_synchronized_multiview_rig: true
depth_coverage: partial
additional_modalities: []
has_language_instruction: true
num_task_types: 4
urdf_available: true
urdf_source: dataset_repo
expected_num_episodes: 112652
num_scenes: 60
num_objects: 5819
review_status: pending_human_review
field_sources:
  paper_url: arXiv:2411.00081 abstract page (Chang et al., PARTNR, ICLR 2025)
  license: HuggingFace dataset card ai-habitat/partnr_episodes -- cardData.license
    = cc-by-nc-4.0
  raw_format: 'github.com/facebookresearch/partnr-planner README + dataset_generation
    pipeline: episodes are custom gzipped JSON files (e.g. data/datasets/partnr_episodes/v0_0/val_mini.json.gz),
    not RLDS/HDF5/LeRobot'
  release_type: HF dataset card lists fixed named splits (train, train_2k, train_mini,
    val, val_mini, ci) of pre-generated episode+evaluation-function specs, downloaded
    as-is rather than collected per-user; matches a fixed episode/task-specification
    release
  collection_method: 'Paper Sec 3.1 ''Simulation-in-the-loop task instruction generation'':
    tasks/episodes are generated by an LLM grounded via simulation-in-the-loop filtering
    in the Habitat 3.0 simulator (HSSD scenes); no teleoperation involved'
  is_multi_embodiment: 'Paper Fig 1 / abstract: PARTNR studies human-robot collaboration;
    habitat_llm Agent abstraction ''represents the robot or human'' -- each episode
    involves two collaborating agents'
  embodiment_class: 'habitat-lab habitat/articulated_agents/robots/spot_robot.py +
    habitat_llm/conf/habitat_conf/oracle_spot_kinematic.yaml: articulated_agent_type=SpotRobot,
    a legged mobile base with a mounted arm (articulated_agent_urdf=hab_spot_arm.urdf)'
  num_arms: habitat-lab spot_robot.py SpotRobot params define a single arm chain (robot_platform
    has one manipulator arm)
  dof_per_arm: 'habitat-lab spot_robot.py: arm_joints=list(range(0, 7)) -> 7-DOF arm;
    arm_init_params has 7 elements'
  gripper_type: 'habitat-lab spot_robot.py: gripper_joints=[7], a single actuated
    jaw gripper; closest available schema enum is parallel_jaw (no dedicated single-jaw/underactuated
    category exists)'
  hand_pose_representation: Spot uses a simple gripper (gripper_joints=[7]), not a
    dexterous hand, so no hand-pose encoding applies
  has_mobile_base: 'habitat_llm/conf/habitat_conf/oracle_spot_kinematic.yaml: SpotRobot
    is a mobile legged-base robot that navigates the house (kinematic_mode, radius,
    etc.)'
  action_space: 'Paper Table 1 (benchmark comparison): PARTNR Action Space column
    = ''LL+HL'' -- baselines mix low-level continuous NN skill control (nn_rearrange_agent.yaml)
    and high-level discrete oracle skill calls (oracle_rearrange_agent.yaml)'
  num_camera_views: 'habitat_llm/conf/habitat_conf/habitat_agent/rgbd_head_rgbd_arm_rgbd_jaw_agent_vis.yaml:
    defines head_rgb/head_depth, arm_rgb/arm_depth(+panoptic), jaw_rgb/jaw_depth(+panoptic),
    and third_rgb sensors = 4 distinct camera viewpoints'
  camera_views: 'Same config file: head_rgb/head_depth -> head; arm+jaw RGBD sensors
    mounted on/near the manipulator -> mapped to wrist (closest existing enum, see
    suggested_new_enum_values); third_rgb -> third_person'
  has_synchronized_multiview_rig: All camera sensors are rendered from the same Habitat
    simulator timestep on one articulated robot body, so they are inherently frame-synchronized
  depth_coverage: 'rgbd_head_rgbd_arm_rgbd_jaw_agent_vis.yaml: head/arm/jaw each have
    a paired depth sensor, but third_rgb (third-person visualization camera) has no
    matching depth sensor -> partial coverage across all defined views'
  has_language_instruction: 'Paper abstract: ''PARTNR ... comprising 100,000 natural
    language tasks'''
  num_task_types: 'Paper Sec 1 / Table 1: four task types -- constraint-free, spatial,
    temporal, and heterogeneous (Task Types = CSTH)'
  urdf_available: 'INSTALLATION.md: `python -m habitat_sim.utils.datasets_download
    --uids ... hab_spot_arm ...` downloads the robot URDF used by episodes'
  urdf_source: hab_spot_arm.urdf is distributed via the official AI Habitat asset
    downloader tied to this benchmark's install pipeline (INSTALLATION.md), i.e. bundled
    with the dataset/benchmark ecosystem rather than a separate manufacturer or community
    repo
  expected_num_episodes: 'HuggingFace dataset card ai-habitat/partnr_episodes: ''train
    has the subset that are verified by HITL (111652 episodes)'' + ''val has 1000
    episodes in a separate set of scenes'' = 112,652. (train_2k/train_mini/val_mini
    are subsets of train/val, not additional episodes; a separate unverified train_132k_unverified
    set of 131,991 raw LLM-generated episodes exists but is not the primary curated
    release.) Note this exceeds the paper''s headline ''100,000 tasks'' figure, which
    described an earlier/aggregate generation count.'
  num_scenes: 'Paper abstract: ''spanning 60 houses'''
  num_objects: 'Paper abstract: ''5,819 unique objects'' (OVMM object set, per Fig.
    4 caption)'
suggested_new_enum_values:
  robot_platform: boston_dynamics_spot -- PARTNR's robot agent is a (simulated) Boston
    Dynamics Spot quadruped with a 7-DOF arm (hab_spot_arm.urdf in habitat-lab/habitat-sim);
    no current RobotPlatform value covers this mobile-manipulator platform, so the
    field was left blank rather than forced into an approximate match
  camera_views: gripper_jaw -- PARTNR/Habitat's Spot robot has a distinct jaw/gripper-mounted
    RGBD(+panoptic) camera in addition to a separate arm-mounted RGBD(+panoptic) camera;
    both currently had to collapse onto 'wrist', losing this distinction
