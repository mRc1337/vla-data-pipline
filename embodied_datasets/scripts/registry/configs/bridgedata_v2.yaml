  expected_size_gb: 'https://rail.eecs.berkeley.edu/datasets/bridge_release/data/
    (directory listing): demos_8_17.zip = 411G, scripted_6_18.zip = 30G, total raw
    release ~441 GB - re-verified 2026-07-10 by re-fetching the directory listing
    directly, unchanged'
  expected_num_episodes: 'https://rail-berkeley.github.io/bridgedata/ and https://arxiv.org/abs/2308.12952
    abstract: ''60,096 trajectories collected across 24 environments'' (50,365 teleop
    + 9,731 scripted) - re-verified 2026-07-10, unchanged'
  expected_duration_hours: 'Derived from https://rail-berkeley.github.io/bridgedata/
    (System Setup): ''The control frequency is 5 Hz and the average trajectory length
    is 38 timesteps'' -> 38/5 = 7.6 s/trajectory * 60,096 trajectories = 456,729.6
    s = 126.87 h; not directly stated as a total, but computed from official per-trajectory
    figures, so flagged here as a derived estimate; newly filled'
  num_subjects: 'https://rail-berkeley.github.io/bridgedata/ (Contributors section):
    ''We also thank Abraham Lee, Mia Galatis, Caroline Johnson, Christian Avina, Samantha
    Huang, and Nicholas Lofrese for collecting data'' - 6 named human data collectors/teleoperators;
    newly filled. Note: paper/site does not explicitly label this count as "subjects"
    so treat as a reasonable but indirect reading of the acknowledgments'
  num_scenes: 'https://rail-berkeley.github.io/bridgedata/ (Dataset Composition /
    Environments): ''24 environments'' grouped into 4 categories (7 toy kitchens plus
    tabletops, standalone sinks, a toy laundry machine, etc.); newly filled'
