field_sources:
  source_url: https://huggingface.co/IPEC-COMMUNITY/FastUMI-Data (confirmed live dataset
    page via HF API https://huggingface.co/api/datasets/IPEC-COMMUNITY/FastUMI-Data,
    re-checked 2026-07-10).
  paper_url: 'https://arxiv.org/abs/2409.19499 (FastUMI: A Scalable and Hardware-Independent
    Universal Manipulation Interface with Dataset, Zhaxizhuoma et al., arXiv:2409.19499v2).'
  license: 'HF API https://huggingface.co/api/datasets/IPEC-COMMUNITY/FastUMI-Data
    tags include ''license:mit'', cardData.license=''mit'' (re-verified 2026-07-10);
    GitHub zxzm-zak/FastUMI_Data LICENSE file: ''MIT License / Copyright (c) 2024
    Shanghai Artificial Intelligence Laboratory''. Confirmed unchanged.'
  raw_format: 'GitHub zxzm-zak/FastUMI_Data README.md Sec 4.2 ''Data Structure'':
    dataset distributed as per-episode ''episode_<idx>.hdf5'' files with observations/images,
    observations/qpos and action HDF5 datasets; cross-checked against config/config.json
    (state_dim/action_dim=7 used by the same pipeline). Confirmed unchanged.'
  release_type: 'arXiv:2409.19499 Sec V-A/Appendix B: ''Our dataset is composed of
    more than 10000 demonstrations from 22 daily tasks... split into smaller parts''
    -- a fixed, pre-collected set of released episodes, not a procedural generation
    framework, scene platform, or RL benchmark env. Confirmed unchanged.'
  collection_method: 'arXiv:2409.19499 abstract/Sec I: FastUMI is ''a substantial
    redesign of the Universal Manipulation Interface (UMI) system'' -- a handheld-gripper,
    interface-mediated data-collection method; Sec V-A confirms the released 10,000+
    demonstrations were collected via the handheld device. collection_method: umi.
    Confirmed unchanged.'
  secondary_collection_methods: 'No secondary method found: arXiv:2409.19499 Sec V-A/V-B
    describe the released ~10,000-trajectory dataset as collected exclusively via
    the FastUMI handheld device by five operators; the only other data-collection
    mention in the paper (Sec VI-D, 50 teleoperation demos for a camera-comparison
    ablation) is a separate evaluation experiment, not documented as part of the released
    HF dataset. Left empty (re-verified).'
  is_multi_embodiment: 'arXiv:2409.19499 Sec V-A/V-B: the released dataset''s 10,000+
    demonstrations were all captured with ''three FastUMI devices'' operated by five
    human operators (the same handheld interface for every episode), not across differing
    robot embodiments; the robot-mounted device (deployed on xArm/Franka/Flexiv/Z1
    arms per Fig. 1) is used only for downstream policy inference/evaluation, not
    for collecting the released trajectory data. Newly filled: false.'
  embodiment_class: arXiv:2409.19499 Sec II 'Robot-Mounted Device Design' and Fig.
    1 (single robotic arm executing learned policies); the handheld device records
    a single end-effector/gripper trajectory intended for transfer to single-arm robots.
    GitHub data_collection.py config['device_settings']['robot_type'] is a single
    configurable robot arm (e.g. XARM6), not bimanual/humanoid/mobile. Kept consistent
    with sibling config umi_datasets.yaml. Confirmed unchanged after recheck.
  robot_platform: 'arXiv:2409.19499 Sec II ''Decoupled Design Philosophy'': fingertip
    extensions compatible with ''five customized fingertip attachments (e.g., the
    xArm gripper and Robotiq 2f-85)... covering over 90% of the grippers'' in Open
    X-Embodiment, and Fig. 1 shows the same hardware deployed on Flexiv, Franka, and
    Z1 arms -- the system is explicitly hardware/platform-agnostic by design, so no
    single RobotPlatform enum value applies. config/config.json''s ''robot_type'':
    ''XARM6'' is only a user-editable default for the optional IK/joint-conversion
    tool, not a fixed platform for the released trajectory data. Confirmed unchanged
    (other).'
  num_arms: 'arXiv:2409.19499 Fig. 1/Fig. 5 and GitHub README: system records a single
    handheld gripper trajectory (one end-effector stream per episode); no bimanual/dual-arm
    setup is described. Confirmed unchanged.'
  gripper_type: 'arXiv:2409.19499 Sec II-C (direct quote): ''our handheld device is
    a parallel-motion gripper''; fingertip extensions are also compatible with parallel-jaw
    grippers such as the xArm gripper and Robotiq 2F-85. Confirmed unchanged, now
    backed by a direct paper quote rather than only inference from the marker-based
    width tracking.'
  hand_pose_representation: Left blank -- FastUMI's end effector is a parallel-jaw
    mechanical gripper (see gripper_type), not a dexterous hand or bare-hand/MANO
    tracking target; the MANO/keypoints_3d/joint_angles/none enum choices describe
    hand-shape encodings that don't apply here, and no source discusses a hand-pose
    representation for this dataset. Left blank rather than guessing 'none'.
  has_mobile_base: 'arXiv:2409.19499 Secs II-III: system consists of a handheld device
    (human-operated) and a robot-mounted device attached to a stationary robotic arm;
    no mobile base is described anywhere in the paper, README, or config.json. Confirmed
    unchanged.'
  action_space: 'GitHub README.md Sec 4.2 and config/config.json (''action_dim'':
    7): ''action'' HDF5 dataset shape (num_timesteps, 7), columns [Pos X, Pos Y, Pos
    Z, Q_X, Q_Y, Q_Z, Q_W] -- an end-effector pose (position + orientation), i.e.
    eef_pose. Confirmed unchanged.'
  action_frame: 'GitHub README.md Sec 4.2: ''In this script, actions mirror the qpos
    data'', where qpos is the directly-observed absolute T265-derived TCP pose at
    each timestep (not a delta) -- absolute. Note: arXiv:2409.19499 Sec III-C also
    describes an optional downstream-computed ''Relative TCP trajectory'' variant
    for certain imitation-learning algorithms, but this is a derived/processed output
    (via data_processing_to_tcp.py), not what is stored in the primary released action/qpos
    HDF5 datasets. Confirmed unchanged, with this nuance now documented.'
  rotation_representation: 'GitHub README.md Sec 4.2 and config/config.json: qpos/action
    columns are [Pos X, Pos Y, Pos Z, Q_X, Q_Y, Q_Z, Q_W] -- quaternion orientation.
    Confirmed unchanged.'
  state_dim: 'config/config.json ''task_config'': {''state_dim'': 7, ...}, matching
    GitHub README.md Sec 4.2 observations/qpos shape (num_timesteps, 7) = 3 position
    + 4 quaternion. Confirmed unchanged, now cross-checked directly against config.json
    rather than README alone.'
  action_dim: 'config/config.json ''task_config'': {''action_dim'': 7, ...}, matching
    README Sec 4.2 action dataset shape (num_timesteps, 7). Confirmed unchanged, now
    cross-checked directly against config.json. Note: the optional post-processing
    script data_processing_to_tcp.py (GitHub zxzm-zak/FastUMI_Data) appends a computed
    gripper-width column to produce an 8-dim derived output for ACT/DP training, but
    this is a downstream artifact users generate by running the script locally, not
    the dimensionality of the primary released per-episode HDF5 files.'
  fps: 'GitHub zxzm-zak/FastUMI_Data data_collection.py: comment ''Video writer parameters
    for 60 Hz recording'' plus the actual code ''cv2.VideoWriter(..., fourcc, 60,
    (frame_width, frame_height))'' hard-codes 60 fps for the released GoPro video/HDF5
    image frames; the RealSense T265 pose stream is captured separately at 200 Hz
    per the same file''s comment. Confirmed unchanged. UNRESOLVED DISCREPANCY: arXiv:2409.19499
    Sec III-A''s architecture description states the system sub-samples ''both streams
    at 20 Hz... the greatest common frequency between 200 Hz and 60 Hz'' for a unified-clock
    synchronization scheme, which conflicts with data_collection.py''s literal 60
    fps VideoWriter and config.json''s implicit 60 Hz camera setting. This may describe
    a more general/idealized pipeline variant rather than the actual script that produced
    the publicly released HDF5 files, so 60 (matching the code that generated the
    release) was kept as the primary value, but this contradiction between paper text
    and released code could not be fully resolved -- see review_status.'
  fps_variable: 'Same data_collection.py source as fps: the GoPro capture is hard-coded
    to a fixed 60 fps VideoWriter rather than a variable/adaptive rate. Confirmed
    unchanged.'
  num_camera_views: 'GitHub README.md Sec 4.2 and config/config.json (''camera_names'':
    [''front'']): observations/images/ contains exactly one dataset, named ''front''.
    Confirmed unchanged.'
  camera_views: 'arXiv:2409.19499 directly and repeatedly describes the GoPro as a
    ''wrist-mounted'' camera (Sec IV-B: "FastUMI''s wrist- or handheld-mounted viewpoints";
    Sec VII: ''its wrist-mounted gopro camera records high-resolution visual data'';
    Sec VIII: ''aligning video observation of wrist-mounted cameras on both the hand-held
    device and the on-robot device''). This directly supports the side-agnostic CameraView.WRIST
    enum value (now present in schema.py) and matches the value already set in this
    config from a prior backfill pass. Re-verified and confirmed as still correct
    -- this field_sources text was rewritten because the previous wording (''mapped
    to other'' + a suggested new enum value) was stale: ''wrist'' is now an official
    schema enum value, and suggested_new_enum_values.camera_views has been removed
    accordingly.'
  has_camera_calibration: config/config.json 'data_process_config' stores only 'offset'
    (T265-to-TCP transform) and 'distances' (marker_max/marker_min/gripper_max/flange_to_tcp)
    for trajectory/gripper-width post-processing; no camera intrinsic/extrinsic calibration
    matrix or distortion-coefficient field is present anywhere in config.json or documented
    in README Sec 4.2. Confirmed unchanged, now cross-checked directly against config.json.
  depth_coverage: 'arXiv:2409.19499 Secs II-III: only a GoPro RGB fisheye camera and
    a RealSense T265 (used purely for 6-DoF pose tracking, not depth output) are used;
    Sec IV-D explicitly motivates ''Depth-Enhanced DP'' precisely because the base
    system has no native depth channel, instead applying a post-hoc monocular depth
    estimator (Depth Anything V2) to the RGB frames rather than recording depth from
    a sensor. Confirmed unchanged (none).'
  additional_modalities: 'arXiv:2409.19499 Sec VII ''Limitations'', item 1 ''Limited
    Sensing Modalities'': ''FastUMI currently relies on visual data, which may prove
    insufficient for tasks requiring precise force or tactile feedback'' -- an explicit
    statement that no force/torque, tactile, audio, or eye-gaze modality is captured.
    Left empty, now backed by an explicit confirming citation (previously inferred
    only from the absence of fields in the HDF5 schema).'
  has_synchronized_multiview_rig: 'Follows directly from num_camera_views=1 / camera_views=[wrist]:
    GitHub README.md Sec 4.2 and config.json (''camera_names'': [''front'']) document
    exactly one camera stream per episode, so there is no multi-camera synchronized
    rig. Newly filled: false.'
  has_language_instruction: GitHub README.md Sec 4.2 fully enumerates the HDF5 schema
    (observations/images, observations/qpos, action, attributes/sim) and states.csv/temp_trajectory.csv
    columns; no language/text-instruction field is present anywhere in the documented
    data structure or in config.json. Confirmed unchanged.
  num_task_types: 'HF API https://huggingface.co/api/datasets/IPEC-COMMUNITY/FastUMI-Data
    siblings list contains 22 distinct task archive names (clean_table, close_ricecooker,
    cover_beef, fold_towel, hotdog_in_rice_cooker, hotdog_in_roaster, open_container,
    open_drawer, open_ricecooker, open_roaster, open_suitcase, pick_bear, pick_bread,
    pick_cup, pick_lid, pick_pen, place_plate, place_pot, pour_coke, rearrange_coke,
    sweep_trash, unplug_charger), matching arXiv:2409.19499 Sec V-A: ''The dataset
    covers 22 tasks, 19 object categories, and 12 distinct manipulation skills.''
    Confirmed unchanged.'
  urdf_available: CORRECTED from false to true. GitHub zxzm-zak/FastUMI_Data repository
    contains 'assets/xarm6_robot.urdf' (317-line xacro-generated URDF for the UFactory
    xArm6, referenced by config.json's 'data_process_config.urdf_path' and used by
    data_processing_to_joint.py for the optional IK/absolute-joint-trajectory conversion).
    The prior pass's claim that 'the repository file listing... contain[s] no .urdf
    files' was incorrect -- the repo had moved from YdingTeam/FastUMI_Data to zxzm-zak/FastUMI_Data
    and this file was apparently not checked.
  urdf_source: 'CORRECTED from not_found to dataset_repo. Same evidence as urdf_available:
    ''assets/xarm6_robot.urdf'' is committed directly inside the dataset''s own GitHub
    repository (zxzm-zak/FastUMI_Data), so it is classified as dataset_repo rather
    than not_found.'
  expected_size_gb: 'HF API https://huggingface.co/api/datasets/IPEC-COMMUNITY/FastUMI-Data
    field ''usedStorage'': 2372241848227 bytes = 2372.24 GB (re-verified 2026-07-10,
    byte count unchanged since prior pass). The dataset card''s own ''size_categories:
    ["1G < size <10G"]'' tag is still present and still appears to be a stale/default
    placeholder, contradicted by the much larger measured usedStorage figure. Confirmed
    unchanged.'
  expected_num_episodes: 'arXiv:2409.19499 abstract and Sec V-A/Appendix B: ''we have
    open-sourced a high-quality dataset of over 10,000 real-world demonstration trajectories''
    / ''more than 10000 demonstrations from 22 daily tasks.'' Recorded as the published
    approximate/lower-bound figure (10000); exact per-task episode counts were not
    accessible via the HF datasets-server info/size API (gated/no-access error). Confirmed
    unchanged.'
  expected_duration_hours: 'arXiv:2409.19499 Sec V-A: ''each demonstration lasting
    approximately 6-12 seconds, where most demonstrations are 9 seconds'', combined
    with the >10,000-episode count (same section). Estimated as 10,000 episodes x
    ~9s / 3600 = 25.0 hours; true value could range roughly 16.7-33.3 hours depending
    on the true per-episode duration distribution within the stated 6-12s range. Newly
    filled -- an approximation, not an exact published total.'
  num_subjects: 'arXiv:2409.19499 Sec V-B ''Dataset Acquisition Process'': ''The dataset
    is collected by five operators using three FastUMI devices, ensuring diversity
    in user interactions and environmental contexts.'' Newly filled (5).'
  num_scenes: Not filled -- no source found that states an explicit count of distinct
    scenes/environments. arXiv:2409.19499 Sec V-A mentions only that Fig. 8 shows
    'representative frames from selected collection environments' without giving a
    total count, and Sec V-B states backgrounds are 'randomized' per task without
    quantifying distinct scenes. Left blank.
  num_objects: 'arXiv:2409.19499 Sec V-A: ''The dataset covers 22 tasks, 19 object
    categories, and 12 distinct manipulation skills.'' Newly filled (19).'
