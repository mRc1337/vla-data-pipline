[project]
name = "vla-data-pipeline"
version = "0.1.0"
description = "VLA robotics dataset registry, onboarding, conversion, and cleaning/alignment pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "embodied_datasets/scripts/process_scripts",
    "embodied_datasets/scripts/convert_scripts",
    "embodied_datasets/scripts/inspect_tool",
]
testpaths = [
    "embodied_datasets/scripts/process_scripts/tests",
    "embodied_datasets/scripts/convert_scripts/tests",
    "embodied_datasets/scripts/inspect_tool/tests",
]
