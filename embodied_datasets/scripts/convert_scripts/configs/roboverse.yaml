field_sources:
  source_url: 'Official project homepage https://roboverseorg.github.io (''RoboVerse:
    Towards a Unified Platform, Dataset and Benchmark...''); cross-checked against
    GitHub org github.com/RoboVerseOrg/RoboVerse and roboverse.wiki. Re-confirmed
    unchanged.'
  paper_url: 'arXiv:2504.18904 ''RoboVerse: Towards a Unified Platform, Dataset and
    Benchmark for Scalable and Generalizable Robot Learning'' -- newly added; HF dataset
    card also tags arxiv:2504.18904.'
  license: 'Re-confirmed via GitHub API repos/RoboVerseOrg/RoboVerse -> license.spdx_id=''Apache-2.0'',
    and HF API datasets/RoboVerseOrg/roboverse_data -> tags include ''license:apache-2.0''.
    Note: bundled third-party robot/scene assets under robots/*, scenes/*/ carry their
    own separate LICENSE files that may differ from the Apache-2.0 code/dataset license.'
  raw_format: 'Re-confirmed via HF API file listing: trajectories stored as Python
    pickle (.pkl/.pkl.gz) files plus per-task initial_state_v2.json and .npy annotation
    arrays -- bespoke format, not RLDS/HDF5/LeRobot.'
  release_type: CORRECTED from fixed_episode_dataset to generation_framework. arXiv:2504.18904
    abstract self-describes RoboVerse as 'a comprehensive framework comprising a simulation
    platform, a synthetic dataset, and unified benchmarks' built around MetaSim, a
    cross-simulator infrastructure for migrating/generating trajectories via motion
    planning, RL rollout, teleoperation, and generative task creation (Sec III, IV-A-C);
    the 510.5k-trajectory HF release is an evolving snapshot ('we will continue to
    maintain and expand it'), not a closed fixed collection. See suggested_new_enum_values
    for caveat.
  collection_method: 'arXiv:2504.18904 Sec IV-B/IV-C: trajectories obtained via direct
    migration from existing sim benchmarks, motion planning + RL rollout, teleoperation,
    and generative task creation, all performed inside simulators -- overarching method
    is simulation. Re-confirmed unchanged.'
  secondary_collection_methods: 'arXiv:2504.18904 Sec IV-C: ''Teleoperation System
    for Trajectory Collection'' via keyboard/phone/mocap/VR (-> teleop); ''Motion
    Planning and RL Rollout'' used to generate complete trajectories from partial
    data (-> autonomous_policy); Sec XIV ''Real2Sim Toolset for Asset and Task Generation''
    reconstructs real-world objects/scenes into sim assets via Gaussian splatting/mesh
    reconstruction (-> scene_asset_curation).'
  is_multi_embodiment: 'Newly filled true. Same Table I evidence as embodiment_class
    plus Sec IV-E1: manipulation dataset (single-arm, dominant) coexists with a bimanual
    dexterous ShadowHand subset (trajs/bidex/), a Navigation dataset (Unitree Dog
    + JetBot, mobile), and a Humanoid dataset (Unitree H1 + dual Shadow Hands, HumanoidBench/Humanoid-X/SkillBlender)
    -- genuinely multi-embodiment at the platform level.'
  embodiment_class: 'arXiv:2504.18904 Table I: 276 task categories / 510.5k trajectories
    / 5.5k assets sourced from 15 tabletop manipulation benchmarks (ManiSkill, RLBench,
    CALVIN, Meta-World, RoboSuite/MimicGen, GAPartNet, Open6DOR, ARNOLD, LIBERO, Simpler,
    RLAfford, GraspNet, GarmentLab, UniDoorManip, GAPartManip), all single fixed-base-arm
    -- dominant/majority mode (~94% of released manipulation trajectories) recorded
    here; platform is multi-embodiment overall (see is_multi_embodiment).'
  num_arms: 'Same Table I evidence: dominant single-arm manipulation subset (510.5k
    trajectories) uses exactly one manipulator arm; smaller bidex bimanual subset
    uses two. Re-confirmed unchanged.'
  dof_per_hand: 'Newly filled. The bidex subset (trajs/bidex/ShadowHand* in HF dataset
    repo, per raw_format evidence) uses the Shadow Dexterous Hand. Shadow Robot Company
    official spec (shadowrobot.com/dexterous-hand-series) and Wikipedia ''Shadow Dexterous
    Hand'': 24 total joints, 20 actuated degrees of freedom (4 further under-actuated
    movements). Recorded as the dominant/documented dexterous-hand platform in RoboVerse''s
    bidex subset; not derived from the RoboVerse paper itself.'
  gripper_type: Same Table I source benchmarks predominantly use parallel two-finger
    grippers (Franka/Sawyer/UR5-class parallel grippers) -- dominant mode. bidex ShadowHand
    subset and h1_hand/shadow_hand/unitree_dex3-1 robot assets use dexterous_hand
    end-effectors instead; parallel_jaw recorded as dominant/majority mode only. Re-confirmed
    unchanged.
  hand_pose_representation: Newly filled joint_angles (with caveat). Not explicitly
    stated per-bidex-subset in the paper; inferred from (1) arXiv:2504.18904 Sec XI-N/general
    trajectory format description that 'DoF position information of objects and robots
    is recorded in the trajectories', and (2) RoboVerse's entire pipeline represents
    robot state via URDF/MJCF joint hierarchies (Sec IX-X asset conversion), including
    the ShadowHand assets shipped as URDF/MJCF in the dataset repo -- no MANO mesh
    or 3D-keypoint hand representation found anywhere in the paper or repo.
  has_mobile_base: 'Newly filled false, dominant-mode only (mirrors embodiment_class
    convention): manipulation dataset (510.5k trajectories, Table I) uses fixed-base
    tabletop arms. The separate Navigation dataset (Unitree Dog, JetBot) and Humanoid
    dataset (Unitree H1) do use mobile/legged bases, but are excluded from the dominant-mode
    figure per the same convention used for embodiment_class/gripper_type.'
  action_space: 'arXiv:2504.18904 Sec VI-E/App XIX-C: ''action conditions (gripper
    states with either Cartesian position plus orientation or joint position)'' --
    confirms both eef_pose and joint_position representations are used, matching ''mixed''.
    Re-confirmed unchanged.'
  action_frame: 'Newly filled both. arXiv:2504.18904 Sec VI-B-2 Implementation Details:
    ''the action is pre-processed into delta end-effector position space from absolute
    end-effector position space'' -- raw eef actions stored in absolute frame, delta
    derived for generalist-model (OpenVLA/Octo) training; both frames coexist in the
    dataset ecosystem, analogous to the existing ''mixed'' action_space heterogeneity.'
  has_camera_calibration: 'RoboVerse cameras are synthetic and fully specified via
    MetaSim''s declarative config system (roboverse.wiki/metasim -- ''Configure Declaratively:
    Define robots, scenes, cameras...''), so intrinsics/extrinsics are exactly known
    by construction. Re-confirmed unchanged.'
  additional_modalities: Investigated, left blank. arXiv:2504.18904 Table VI (Sec
    VIII 'Simulators Overview') lists RGBD/Force/Contact/Tactile/IMU sensor CAPABILITIES
    of the underlying simulator engines (SAPIEN, PyBullet, MuJoCo, Genesis, etc.),
    but no statement found that RoboVerse's released HF trajectory files (trajs/*.pkl)
    actually persist force-torque, tactile, audio, or eye-gaze channels -- Table VI
    describes engine capability, not confirmed recorded modalities, so left blank
    rather than inferred.
  has_language_instruction: 'arXiv:2504.18904: many migrated benchmarks carry per-task
    language instructions (Sec IV Navigation ''off-the-shelf instructions from R2R/RxR'';
    AI-assisted task generation gives ''a short, human-readable instruction''; GraspNet
    subset has ''diverse and challenging language instructions''). Re-confirmed unchanged.'
  urdf_available: 'Re-confirmed via HF API file listing: 177 .urdf files plus MJCF/USD
    robot descriptions under robots/ (franka/, Kinova_Gen3/, Interbotix_WidowX_250/,
    h1_hand/, unitree_dex3-1/, etc).'
  urdf_source: Same HF dataset repo (RoboVerseOrg/roboverse_data) ships URDF/MJCF/USD
    files directly under robots/ within its own repo, each with a bundled LICENSE
    file -- dataset_repo. Re-confirmed unchanged.
  num_task_types: 'arXiv:2504.18904 Table I total row: ''276 510.5k 5.5k'' (task categories,
    trajectories, assets) across migrated manipulation benchmarks; excludes the separate
    Navigation (VLN-CE) and Humanoid datasets. Re-confirmed unchanged.'
  expected_size_gb: HF Hub API datasets/RoboVerseOrg/roboverse_data?expand=usedStorage
    reports usedStorage = 44869086705 bytes (~44.9 GB) as of re-check (repo lastModified
    2026-06-08). Re-confirmed unchanged.
  expected_num_episodes: 'arXiv:2504.18904 Table I total row and Sec IV-E1: ''this
    migration results in 276 task categories, 510.5k trajectories, and 5.5k assets''
    for the manipulation dataset; excludes Navigation (30k episodes) and Humanoid
    datasets. Re-confirmed unchanged.'
  num_objects: 'Newly filled 5500 (~5.5k). arXiv:2504.18904 Table I total row: ''#
    Assets'' column sums to 5.5k across the 15 migrated manipulation benchmarks. Caveat:
    ''assets'' as tabulated may include some non-graspable scene/articulated-furniture
    props alongside pure manipulable objects, so this is the closest available proxy
    for num_objects, not a strictly object-only count.'
  expected_duration_hours: 'Investigated, left blank: neither the RoboVerse project
    page, arXiv:2504.18904 (Table I dataset-statistics, abstract, or full text), nor
    the HF dataset card (RoboVerseOrg/roboverse_data README) states a total recording/playback
    duration in hours. Per-episode length is not fixed either -- the 510.5k trajectories
    are migrated from 15 heterogeneous source simulators/benchmarks (ManiSkill, RLBench,
    CALVIN, Meta-World, RoboSuite/MimicGen, etc.) each with its own native control
    frequency, and the paper''s only frame-count figure found (in the real2sim task-generation
    section: ''we adjust the control frequency so that most episodes span 20 to 60
    frames'') describes one specific reconstruction sub-method, not a dataset-wide
    fps/episode-length statistic, so no reliable total_frames/fps derivation is possible;
    left blank rather than guess.'
suggested_new_enum_values:
  robot_platform: multi_platform -- HF dataset repo's robots/ directory ships dozens
    of distinct robot descriptions (Franka, Kinova Gen3, Interbotix WidowX 250, KUKA
    LBR IIWA14, ARX L5, UFactory Lite6, Unitree Z1, UR5e/UR10e, Siasun SO-ARM100,
    Unitree H1, Shadow Hand, Unitree Dex3-1, etc.) migrated from 15+ source benchmarks;
    no single enum value or 'other' can honestly represent this, so left blank.
  rotation_representation: mixed -- source benchmarks migrated into RoboVerse (RLBench,
    CALVIN, LIBERO, ManiSkill, Meta-World, etc.) each natively use different orientation
    encodings (quaternion/euler/rotation matrix depending on origin simulator); no
    single dataset-wide value confirmed. A 'mixed' option analogous to the existing
    action_space 'mixed' value would let this be recorded honestly instead of left
    blank.
  release_type: hybrid_platform_dataset_benchmark -- RoboVerse is simultaneously (1)
    a cross-simulator generation framework (MetaSim), (2) a static ~510.5k-trajectory
    dataset snapshot released on HuggingFace, and (3) a unified IL+RL benchmark suite
    (Sec V). None of the four current release_type values individually captures all
    three; generation_framework was chosen as the closest single fit since the framework/unification
    aspect is the paper's core contribution, but a hybrid label would be more precise
    for platforms like this.
