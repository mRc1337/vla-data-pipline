field_sources:
  source_url: Reconfirmed reachable, on-topic (RSS 2024 project page for THE COLOSSEUM),
    links to arXiv:2402.08191 and github.com/robot-colosseum/robot-colosseum.
  paper_url: arxiv.org/abs/2402.08191 -- official paper link, also linked from project
    site and HF dataset card.
  license: 'CORRECTED from Unknown. huggingface.co/datasets/colosseum/colosseum-challenge
    dataset card metadata declares license: mit (tag license:mit, cardData.license=mit).
    Note: the benchmark CODE repo (github.com/robot-colosseum/robot-colosseum) still
    has no LICENSE file (GitHub API license=null) -- MIT applies specifically to the
    released dataset, which is what this field tracks.'
  raw_format: 'Confirmed via readthedocs quickstart AND huggingface.co/datasets/colosseum/colosseum-challenge
    README: per-episode folders with per-camera PNG rgb/depth images plus RLBench
    pickle files (low_dim_obs.pkl, variation_description.pkl) packaged as per-task
    tar.gz -- custom RLBench layout, not RLDS/HDF5/LeRobot.'
  release_type: 'Confirmed via huggingface.co/datasets/colosseum/colosseum-challenge:
    a canonical fixed corpus is published (train: 100 demos x 20 tasks; test: 25 demos
    x 20 tasks x applicable perturbations), distributed as downloadable tar.gz files
    -- a real fixed release, not just a generation framework.'
  collection_method: 'arXiv:2402.08191 Sec III: demonstrations generated by RLBench
    scripted motion planners navigating manually defined waypoints in simulation (PyRep/CoppeliaSim)
    -- fully simulated, non-human-teleoperated.'
  is_multi_embodiment: 'arXiv:2402.08191 Sec II-A, III, and Appendix X-A (real-world):
    single Franka Panda arm with parallel gripper used throughout both simulation
    and the real-world replica; no other embodiment mentioned anywhere.'
  embodiment_class: 'Reconfirmed: arXiv:2402.08191 Sec II-A/III -- single 7-DoF Franka
    Panda arm, no mobile base or second arm.'
  robot_platform: 'Reconfirmed: arXiv:2402.08191 Sec II-A/III/Appendix X-A -- Franka
    Panda used in both sim (RLBench default) and real-world replica.'
  num_arms: 'Reconfirmed: single Franka Panda arm throughout (arXiv:2402.08191).'
  dof_per_arm: 'Reconfirmed: PyRep pyrep/robots/arms/panda.py -- Franka Panda is a
    7-DoF arm.'
  gripper_type: 'Reconfirmed: arXiv:2402.08191 Sec II-A/Appendix X-A -- stock Franka
    parallel-jaw gripper.'
  has_mobile_base: 'Reconfirmed: no mobile base mentioned in paper or docs; fixed
    tabletop mount in sim and real-world replica.'
  action_space: 'Reconfirmed: arXiv:2402.08191 Sec IV-A/IV-B.1 -- keypoint-based end-effector
    pose targets (PerAct/RVT baselines), not joint-space commands.'
  action_frame: 'Reconfirmed: RLBench Observation.gripper_pose is an absolute world-frame
    pose used as the keyframe target by PerAct/RVT baselines evaluated on this benchmark.'
  rotation_representation: 'Reconfirmed: RLBench backend/observation.py gripper_pose
    = 3 position + 4 quaternion.'
  action_dim: 'Reconfirmed: 7-DoF pose (3 pos + 4 quat) + 1 binary gripper state =
    8 (arXiv:2402.08191 Sec IV-B.1).'
  num_camera_views: 'CORRECTED from 5 to 4. huggingface.co/datasets/colosseum/colosseum-challenge
    README states the released train/test dataset captures exactly 4 camera views:
    front, left shoulder, right shoulder, wrist (no overhead/top). The readthedocs
    quickstart lists overhead as a 5th *optional* camera slot in the general data-collection
    tool config, but it is NOT one of the 4 views actually included in the released
    HF corpus, so the released-dataset figure (4) is used.'
  camera_views: 'CORRECTED: removed top (overhead), which quickstart config exposes
    as an optional camera slot but which the actually-released HF dataset (huggingface.co/datasets/colosseum/colosseum-challenge
    README, camera-views figure) does not include. Released dataset uses front->front,
    left_shoulder+right_shoulder->third_person, wrist->wrist (CameraView.WRIST enum
    value used directly; no longer mapped to other -- confirming the prior backfill
    pass correctly added the wrist literal).'
  has_synchronized_multiview_rig: 'Simulation-derived: RLBench (github.com/stepjam/RLBench
    backend/scene.py) renders all enabled camera views from the same CoppeliaSim physics
    timestep on each get_observation() call, so all views are inherently frame-synchronized
    (no hardware sync issue applicable to a simulator).'
  has_camera_calibration: 'Reconfirmed: RLBench backend/scene.py stores per-camera
    extrinsics/intrinsics/near/far for every camera name each frame.'
  depth_coverage: 'Reconfirmed and refined: huggingface.co/datasets/colosseum/colosseum-challenge
    README states RGB+Depth is collected for all 4 released camera views.'
  has_language_instruction: 'Reconfirmed: arXiv:2402.08191 Sec IV-A -- template-generated
    English instruction per trajectory; HF README variation_description.pkl stores
    per-task language instructions.'
  num_task_types: 'Reconfirmed: arXiv:2402.08191 abstract/Sec III and project site
    -- 20 diverse manipulation tasks.'
  urdf_available: 'Reconfirmed: stock Franka Emika Panda; manufacturer publishes official
    URDF (github.com/frankaemika/franka_ros franka_description).'
  urdf_source: 'Reconfirmed: Colosseum/RLBench ship CoppeliaSim .ttm models, not a
    bundled URDF; manufacturer_official (franka_ros) is the applicable source.'
  expected_size_gb: 'NEW. Computed from huggingface.co/api/datasets/colosseum/colosseum-challenge/tree/main
    (recursive): sum of all task test tar.gz files plus training_dataset/train.tar.gz_part00+01
    = ~280.6 GB total across the full released corpus (train+test).'
  expected_num_episodes: 'Reconfirmed: arXiv:2402.08191 Sec III/IV-D and HF dataset
    card -- standard training set = 100 demos x 20 tasks = 2000 episodes. Test set
    (25 demos x 20 tasks x applicable perturbations) is additional and not folded
    into this single figure.'
  expected_duration_hours: 'CHECKED, LEFT BLANK: neither arXiv:2402.08191 nor the
    HF dataset card (huggingface.co/datasets/colosseum/colosseum-challenge) nor the
    GitHub README/readthedocs docs (robot-colosseum.readthedocs.io) state a total
    recording duration, per-episode length in seconds, or a simulation/data fps for
    the released RLBench-based demonstrations (the only fps figure in the paper, 30Hz,
    describes the real-world Kinect-2 camera used in the separate real-robot validation
    experiments, Appendix X-A, not this simulated dataset). With no stated duration
    and no citable per-episode-length x fps basis to derive one, left blank rather
    than guessed.'
suggested_new_enum_values: {}
