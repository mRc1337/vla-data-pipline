id: assembly101
name: Assembly101
source_url: https://assembly-101.github.io/
license: CC-BY-NC-4.0
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: egocentric_human
secondary_collection_methods: []
embodiment_class: human_hand
num_arms: 2
gripper_type: none
has_mobile_base: false
fps: 60.0
fps_variable: false
num_camera_views: 12
camera_views:
- head
- top
- side
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: true
num_task_types: 101
urdf_available: false
expected_num_episodes: 4321
review_status: pending_human_review
field_sources:
  license: 'https://assembly-101.github.io/ (License section: CC BY-NC 4.0); confirmed
    on https://github.com/assembly-101/assembly101-download-scripts and HuggingFace
    dataset card cardData.license=cc-by-nc-4.0'
  raw_format: https://github.com/assembly-101/assembly101-download-scripts - recordings
    are per-view .mp4 files (e.g. C10095_rgb.mp4, HMC_*_mono10bit.mp4) organized per-sequence
    folder, plus separate CSV/txt annotation files; no RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord
    container, so mapped to Custom
  collection_method: 'https://assembly-101.github.io/ abstract: ''Assembly101 is the
    first multi-view action dataset, with simultaneous static (8) and egocentric (4)
    recordings'' of human participants (no robot involved)'
  embodiment_class: 'arXiv paper (2203.14712) sec 3.1/3.2: dataset records human participants''
    hands assembling/disassembling toys; 18M 3D hand pose annotations; no robot embodiment'
  num_arms: 'arXiv paper (2203.14712) sec 1.2/3.2: 53 adult participants use both
    hands (bimanual) to assemble/disassemble toys; hand pose annotations cover both
    hands'
  gripper_type: No robot gripper; task performed with bare human hands per arXiv paper
    (2203.14712) and project page abstract
  has_mobile_base: 'Recording rig is a fixed desk-based rig (arXiv 2203.14712 sec
    3.1: ''We built a desk rig equipped with eight RGB cameras...''); participants,
    not the rig, move'
  fps: 'https://github.com/assembly-101/assembly101-annotations README: ''Raw videos
    are 60fps but the frame numbers in all the annotations are provided after extracting
    them from the raw video at 30fps.'''
  fps_variable: Same source as fps - raw capture rate stated as a fixed 60fps for
    all cameras/recordings
  num_camera_views: 'arXiv paper (2203.14712) abstract/sec 3.1: 8 static RGB cameras
    (1920x1080) + 4 egocentric monochrome cameras (640x480) = 12 synchronized views
    per sequence; confirmed by assembly101-download-scripts README (''12 views per
    recording - 8 fixed and 4 egocentric'')'
  camera_views: 'arXiv paper (2203.14712) sec 3.1: ''The RGB cameras are mounted on
    a scaffold around the desk with 5 overhead and 3 on the side'' (mapped to top/side)
    and ''four monochrome cameras ... placed on the four corners of a custom-built
    headset worn by the participants'' (mapped to head, egocentric)'
  has_camera_calibration: 'arXiv paper (2203.14712) sec 3.1: ''All cameras are synchronized
    with SMPTE timecode and geometrically calibrated with a fiducial to sub-pixel
    accuracies''; project page news [Apr 2023]: camera extrinsics released in AssemblyPoses.zip'
  depth_coverage: 'arXiv paper (2203.14712) sec 3.1: recording rig described as 8
    RGB + 4 monochrome cameras only; no depth sensor is mentioned anywhere in the
    paper or download scripts'
  has_language_instruction: 'arXiv paper (2203.14712): fine-grained/coarse action
    segments are annotated with verb+object+tool text labels (1380 fine-grained /
    202 coarse action label classes), and participants verbally described their actions
    during recording (sec 3.2 annotation interface description)'
  num_task_types: 'https://assembly-101.github.io/ abstract and arXiv paper (2203.14712)
    sec 3.2: ''The sequences feature 101 unique toys from 15 categories'' - each toy
    assembly/disassembly is a distinct task (dataset name itself derives from these
    101 toys/tasks)'
  urdf_available: No robot/URDF involved; dataset captures only human hands and toy
    objects (arXiv 2203.14712)
  expected_num_episodes: 'https://assembly-101.github.io/ abstract: ''4321 videos
    of people assembling and disassembling 101 take-apart toy vehicles''; confirmed
    by assembly101-annotations README and HuggingFace dataset card description'
suggested_new_enum_values:
  collection_method: Assembly101 simultaneously records 8 static/exocentric cameras
    AND 4 egocentric head-mounted cameras per sequence (synchronized ego+exo capture
    of unassisted human activity). Existing 'egocentric_human' only captures the egocentric
    half; consider adding a value like 'ego_exo_human' or 'multiview_human' for datasets
    that jointly capture synchronized first-person + third-person human views.
  camera_views: The 8 static cameras form a fixed multi-camera rig (5 overhead + 3
    side, all simultaneous) rather than a single top/side/front camera, and the 4
    egocentric cameras are a 4-camera head-mounted array (not a single 'head' camera).
    The current enum (third_person/head/left_wrist/right_wrist/top/front/side/other)
    has no way to express 'N-camera synchronized exocentric rig' or 'multi-camera
    head-mounted egocentric array'; consider adding values such as 'exocentric_rig'
    and 'head_multi' to distinguish rig-style multi-view capture from a single camera
    per position.
