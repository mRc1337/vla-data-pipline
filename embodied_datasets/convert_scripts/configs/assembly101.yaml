  has_synchronized_multiview_rig: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712
    sec 3.1 confirms all 12 cameras (8 static + 4 egocentric) are synchronized via
    SMPTE timecode and geometrically calibrated together, i.e. a single synchronized
    12-camera rig (8 static + 4 egocentric) per sequence - value true is correct.'
  has_camera_calibration: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712 sec
    3.1: ''All cameras are synchronized with SMPTE timecode and geometrically calibrated
    with a fiducial to sub-pixel accuracies''; project page news [Apr 2023]: camera
    extrinsics released in AssemblyPoses.zip'
  depth_coverage: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712 sec 3.1: recording
    rig described as 8 RGB + 4 monochrome cameras only; no depth sensor is mentioned
    anywhere in the paper, GitHub download/annotation READMEs, or HuggingFace dataset
    card'
  additional_modalities: 'RE-VERIFIED 2026-07-10: full-text search of arXiv:2203.14712
    PDF for audio/microphone/sound/gaze/eye-track/force/torque/tactile/IMU found no
    matches (participants narrate actions out loud during recording per sec 3.3, but
    this speech is used only to assist human annotators - no audio track/modality
    is distributed with the dataset); left empty.'
  has_language_instruction: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712:
    fine-grained/coarse action segments are annotated with verb+object+tool text labels
    (1380 fine-grained / 202 coarse action label classes), and participants verbally
    described their actions during recording (sec 3.3 annotation interface description,
    e.g. ''I am flipping the truck over and putting the right front wheel on the truck'')'
  num_task_types: 'RE-VERIFIED 2026-07-10, unchanged: https://assembly-101.github.io/
    abstract and arXiv:2203.14712 sec 3.2: ''The sequences feature 101 unique toys
    from 15 categories'' - each toy assembly/disassembly is a distinct task (dataset
    name itself derives from these 101 toys/tasks)'
  urdf_available: 'RE-VERIFIED 2026-07-10, unchanged: no robot/URDF involved; dataset
    captures only human hands and toy objects (arXiv:2203.14712)'
  expected_num_episodes: 'CORRECTED 2026-07-10 from 4321 to 362. arXiv:2203.14712
    sec 4.1 (Recording statistics), verbatim: ''Assembly101 features 362 disassembly-assembly
    sequences; each sequence is recorded from 12 viewpoints, totalling 4321 videos
    and 513 hours of footage.'' 4321 is the count of individual per-camera-view .mp4
    files (362 sequences x 12 views, minus a handful of missing/corrupted views);
    confirmed independently by the download-scripts/HuggingFace README stating ''recordings:
    containing all 362 recordings (12 views per recording - 8 fixed and 4 egocentric)''
    and ''recording_names.txt: .txt file containing names of all the 362 videos''.
    362 is the correct episode count (one synchronized multi-view recording = one
    episode), consistent with how expected_num_episodes is used for other multi-camera
    datasets in this registry (e.g. droid counts distinct demonstrations,
    not per-camera files). The original value of 4321 conflated per-camera video files
    with episodes.'
  expected_duration_hours: 'arXiv:2203.14712 sec 4.1, Table 1 and Table 2 (Assembly101
    row): ''513.0'' total hours, 4,321 videos, avg. 7.1 min/video. CAVEAT for human
    review: this 513 hours is the sum of footage across all 4,321 individual camera-view
    files (i.e. camera-hours across the 12-view rig), consistent with the paper''s
    own headline comparisons (''6.7x more hours of footage than Breakfast''). If this
    field is intended to mean wall-clock/episode duration (consistent with the corrected
    362-episode count above) rather than summed multi-camera footage, the equivalent
    figure is approximately 362 sequences x 7.1 min avg / 60 ~= 42.8 hours (derived,
    not directly stated by the source). Reported 513.0 here as the only number the
    source states directly; flagging the definitional ambiguity for human_review.'
  num_subjects: 'arXiv:2203.14712 sec 1.2/3.2, verbatim: ''We recruited 53 adult participants
    (28 males, 25 females) to record approximately one-hour sessions over the course
    of 18 consecutive days.'''
  num_scenes: 'Inferred from arXiv:2203.14712 sec 3.1: the paper describes a single
    ''desk rig'' (''We built a desk rig equipped with eight RGB cameras...''); no
    other recording location, room, or environment is mentioned anywhere in the paper,
    GitHub READMEs, or HuggingFace dataset card - all 362 sequences appear to have
    been captured at one fixed physical location/rig. Not an explicit numeric statement
    in the source (no sentence says "1 scene"), so flagged for human confirmation.'
  num_objects: 'arXiv:2203.14712 abstract/sec 3.2: ''101 unique toys from 15 categories''
    - the 101 toy vehicles are the physical objects manipulated in every sequence.
    CAVEAT for human review: the paper separately defines a fine-grained annotation
    vocabulary of ''90 unique objects'' (sec 4.2, e.g. wheel, chassis, screw, plus
    the tool ''hand'') used for verb-object action labels - this is a different, non-redundant
    count (interactable parts/tools rather than whole toys). Reported 101 (the toy
    count) here since it maps cleanly to num_task_types and to "distinct physical
    objects manipulated"; the 90-object annotation vocabulary is noted here in case
    downstream usage expects that definition instead.'
  paper_url: https://arxiv.org/abs/2203.14712 - CVPR 2022 paper, linked from the project
    page (https://assembly-101.github.io/) "Paper" button and from the GitHub org
    README.
suggested_new_enum_values:
  collection_method: Assembly101 simultaneously records 8 static/exocentric cameras
    AND 4 egocentric head-mounted cameras per sequence (synchronized ego+exo capture
    of unassisted human activity). Existing 'egocentric_human' only captures the egocentric
    half; consider adding a value like 'ego_exo_human' or 'multiview_human' for datasets
    that jointly capture synchronized first-person + third-person human views. Corroborating
    evidence found on re-verification - the dataset's own HuggingFace tags (huggingface.co/datasets/cvml-nus/assembly101)
    literally include an "ego-exo" tag, suggesting the dataset's maintainers themselves
    use this terminology for the capture modality.
  camera_views: The 8 static cameras form a fixed multi-camera rig (5 overhead + 3
    side, all simultaneous) rather than a single top/side/front camera, and the 4
    egocentric cameras are a 4-camera head-mounted array (not a single 'head' camera).
    The current enum (third_person/head/left_wrist/right_wrist/top/front/side/other)
    has no way to express 'N-camera synchronized exocentric rig' or 'multi-camera
    head-mounted egocentric array'; consider adding values such as 'exocentric_rig'
    and 'head_multi' to distinguish rig-style multi-view capture from a single camera
    per position.
