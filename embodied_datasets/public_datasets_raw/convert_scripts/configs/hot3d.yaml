id: hot3d
name: HOT3D
source_url: https://facebookresearch.github.io/hot3d/
paper_url: https://arxiv.org/abs/2411.19167
raw_format: VRS
release_type: fixed_episode_dataset
collection_method: egocentric_human
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: human_hand
gripper_type: none
hand_pose_representation: mano
fps: 30.0
fps_variable: false
camera_views:
- head
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: none
additional_modalities:
- eye_gaze
- point_cloud_3d_scan
has_language_instruction: false
num_task_types: 4
urdf_available: false
expected_num_episodes: 3832
expected_duration_hours: 13.88
num_subjects: 19
num_scenes: 4
num_objects: 33
review_status: pending_human_review
field_sources:
  source_url: https://facebookresearch.github.io/hot3d/ (official project page) --
    re-verified, still the live official landing page for the dataset.
  paper_url: 'https://arxiv.org/abs/2411.19167 -- "HOT3D: Hand and Object Tracking
    in 3D from Egocentric Multi-View Videos" (Banerjee, Shkodrani, Moulon, Hampali,
    Han, Zhang, Zhang, Fountain, Miller, Basol, Newcombe, Wang, Engel, Hodan; CVPR
    2025). Newly filled -- field did not exist / was blank in the prior onboarding
    pass.'
  collection_method: 'https://facebookresearch.github.io/hot3d/ -- re-verified: dataset
    recorded with two head-mounted devices (Project Aria glasses, Quest 3 headset)
    capturing egocentric multi-view streams of human subjects; no robot involved.
    Unchanged from prior pass.'
  secondary_collection_methods: Re-checked project page and arXiv abstract -- only
    one capture paradigm (egocentric human head-mounted recording) is described; no
    teleop/simulation/synthesis component present. Left empty, confirmed correct.
  is_multi_embodiment: Newly filled (false). https://facebookresearch.github.io/hot3d/
    and arXiv:2411.19167 abstract -- every recording is a bare human hand interacting
    with objects; the two capture devices (Aria, Quest 3) are sensor rigs, not different
    embodiments. A single embodiment_class (human_hand) applies uniformly, so per
    the schema-refinement design doc's convention (scalar embodiment_class suffices
    for the 99% single-embodiment case), is_multi_embodiment is set to false rather
    than left blank.
  embodiment_class: 'https://facebookresearch.github.io/hot3d/ -- re-verified: ground
    truth is 3D hand poses/shapes of human hands (UmeTrack/MANO formats), not a robot
    embodiment. Unchanged from prior pass.'
  gripper_type: No robot end-effector exists in this dataset (bare human hands only);
    re-verified against arXiv abstract and project page, still set to 'none' per onboarding
    instructions for non-robot datasets.
  hand_pose_representation: Newly filled (mano). https://github.com/facebookresearch/hot3d
    (README, "Using hand annotations" section) and https://github.com/facebookresearch/hand_tracking_toolkit
    -- HOT3D provides hand annotations in BOTH the MANO and UmeTrack formats simultaneously
    (not either/or). MANO maps cleanly to the mano enum value. UmeTrack is a proprietary
    Meta skeletal format whose pose is literally stored as a "joint_angles" tensor
    (see hand_tracking_toolkit/hand_models/umetrack_hand_model.py, UmeTrackHandPose
    dataclass), which would map to the joint_angles enum value instead. Since this
    schema field is a single scalar, mano was chosen as the primary value because
    it is the widely-adopted community format; the co-equal UmeTrack/joint_angles
    representation is documented here for transparency -- see suggested_new_enum_values
    for a proposal to make this field a list.
  dof_per_hand: 'Newly filled (15). Derived from official Meta source code (not directly
    stated as "DoF" in the paper text, so the derivation is documented explicitly):
    (1) https://github.com/facebookresearch/hand_tracking_toolkit/blob/main/hand_tracking_toolkit/hand_models/mano_hand_model.py
    -- MANOHandModel.num_pose_coeffs = 15 (PCA pose components per hand, excluding
    global wrist orientation/translation which is handled by a separate wrist_xform).
    (2) https://github.com/facebookresearch/hand_tracking_toolkit/blob/main/hand_tracking_toolkit/hand_models/umetrack_hand_model.py
    -- NUM_JOINT_FRAMES = 1 (root) + 1 (wrist) + 3*5 (finger frames, 3 per finger
    x 5 fingers = 15), i.e. 15 finger-articulation frames once the root/wrist frames
    are excluded. Both hand-pose backends used by HOT3D converge on 15 as the per-hand
    finger-articulation DoF count (wrist global 6-DoF orientation is tracked separately
    via wrist_xform in both models, so it is not counted here). Flagged as inferred-from-code
    rather than paper-stated; moderate confidence.'
  fps: 'https://facebookresearch.github.io/hot3d/ (Dataset properties section) --
    re-verified: "1.5M multi-view frames (3.7M+ images) recorded at 30 FPS with Project
    Aria and Quest 3." Unchanged from prior pass.'
  fps_variable: Same source as fps -- re-verified, 30 FPS is stated as a fixed capture
    rate for both devices, no mention of variable frame rate. Unchanged from prior
    pass.
  camera_views: 'https://facebookresearch.github.io/hot3d/ and https://github.com/facebookresearch/hot3d/blob/main/hot3d/clips/README.md
    -- re-verified: all image streams originate from head-mounted devices (Aria glasses
    / Quest 3 headset); egocentric head-mounted cameras only, mapped to CameraView.HEAD
    (no wrist/third-person/top views exist in this dataset). Unchanged from prior
    pass.'
  has_synchronized_multiview_rig: Newly filled (true). arXiv:2411.19167 abstract --
    "The recordings include multiple synchronized data streams containing egocentric
    multi-view RGB/monochrome images, eye gaze signal, scene point clouds, and 3D
    poses of cameras, hands, and objects." Also https://facebookresearch.github.io/hot3d/
    section heading "833 minutes of egocentric, multi-view, synchronized recordings,"
    and per-frame *.cameras.json calibration covering multiple simultaneous streams
    per device (1 RGB + 2 mono for Aria; 2 mono for Quest 3). This is a rigidly-mounted,
    calibrated, synchronized multi-camera rig (head-worn rather than room-mounted),
    distinct from the camera_views/HEAD label which only records viewpoint category.
  has_camera_calibration: 'https://github.com/facebookresearch/hot3d/blob/main/hot3d/clips/README.md
    -- re-verified: each frame ships a <FRAME-ID>.cameras.json with per-stream intrinsic
    calibration (projection_model_type, projection_params) and extrinsics (T_device_from_camera,
    T_world_from_camera). Unchanged from prior pass.'
  depth_coverage: 'https://facebookresearch.github.io/hot3d/ and arXiv:2411.19167
    abstract -- re-verified: no dedicated depth-camera stream is provided for either
    device; Aria recordings additionally include sparse 3D SLAM scene point clouds
    (not dense depth maps), which is a distinct modality, so mapped to DepthCoverage.NONE
    rather than partial/full depth-map coverage. Unchanged from prior pass.'
  additional_modalities: 'CORRECTED from [] to [eye_gaze]. The prior pass left this
    empty; independent re-check of the primary sources shows this was a discrepancy.
    https://facebookresearch.github.io/hot3d/ (Dataset properties section): "Aria
    recordings also include 3D scene point clouds from SLAM and eye gaze signal."
    Confirmed independently by arXiv:2411.19167 abstract: "The recordings include
    multiple synchronized data streams containing egocentric multi-view RGB/monochrome
    images, eye gaze signal, scene point clouds, and 3D poses of cameras, hands, and
    objects." Only Aria (not Quest 3) recordings carry the eye-gaze signal, but since
    the field is dataset-level and no partial-coverage flag exists, eye_gaze is added
    as present. SLAM point clouds are not represented by any current SensorModality
    enum value (force_torque/tactile/audio/eye_gaze) and are not a camera/depth stream,
    so left unmapped -- see suggested_new_enum_values.'
  has_language_instruction: 'https://facebookresearch.github.io/hot3d/, https://github.com/facebookresearch/hot3d,
    and arXiv:2411.19167 abstract -- re-verified: no natural-language task/instruction
    annotations are described anywhere on the project page, paper abstract, or toolkit
    README; only 3D pose/shape ground truth is provided. Unchanged from prior pass.'
  num_task_types: 'https://facebookresearch.github.io/hot3d/ (Dataset properties section,
    "19 subjects, 4 everyday scenarios") -- re-verified: recordings cover simple pick-up/observe/put-down
    interactions plus kitchen, office, and living-room scenarios (4 scenario categories
    total). Unchanged from prior pass.'
  urdf_available: No robot embodiment is present in this dataset, so no URDF applies.
    Re-verified, unchanged from prior pass.
  expected_num_episodes: 'https://facebookresearch.github.io/hot3d/ (HOT3D-Clips section)
    -- re-verified with current page text: "There are 3832 clips in total, with 1983
    extracted from Aria recordings and 1849 extracted from Quest3 recordings." This
    is consistent with the prior pass''s figure sourced from the clips README (2804
    train / 1028 test = 3832 total) -- same grand total of 3832, just cross-tabulated
    by a different split (Aria/Quest3 device vs train/test). Note: this counts the
    curated HOT3D-Clips (150-frame / 5s clips); the full VRS-format dataset is instead
    organized as longer (~2 minute) per-subject recordings whose exact current count
    was not confirmed from a live, non-stale source.'
  expected_duration_hours: Newly filled (13.88). arXiv:2411.19167 abstract and https://facebookresearch.github.io/hot3d/
    (Dataset properties section) both state "833 minutes ... of recordings." 833 /
    60 = 13.883..., rounded to 13.88 hours. This is the full-recordings duration (not
    just the curated HOT3D-Clips subset).
  num_subjects: 'Newly filled (19). https://facebookresearch.github.io/hot3d/ (Dataset
    properties section): "19 subjects, 4 everyday scenarios ... we recruited 19 participants
    with different hand shapes and nationalities." Confirmed independently by arXiv:2411.19167
    abstract: "recordings that feature 19 subjects interacting with 33 diverse rigid
    objects."'
  num_scenes: 'Newly filled (4), with a documented caveat. https://facebookresearch.github.io/hot3d/
    (Dataset properties section): "In addition to simple pick-up/observe/put-down
    actions, recordings show scenarios resembling typical actions in a kitchen, office,
    and living room" (4 scenario types total, same count as num_task_types). Caveat:
    the same source also states "All scenarios were captured in the same lab with
    scenario-specific furniture and regularly randomized decorative elements and lighting"
    -- i.e. physically a single lab space reconfigured 4 ways, not 4 separate physical
    locations. 4 was chosen as the best-supported reading of "number of distinct recorded
    scene/scenario configurations," but this could alternatively be read as 1 (single
    physical lab). Flagged as a genuine ambiguity for human review.'
  num_objects: 'Newly filled (33). https://facebookresearch.github.io/hot3d/ (Dataset
    properties section): "High-fidelity 3D object models -- HOT3D includes high-fidelity
    3D models of 33 rigid objects." Confirmed independently by arXiv:2411.19167 abstract:
    "19 subjects interacting with 33 diverse rigid objects."'
  release_type: Confirmed via docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    section 4B, which explicitly classifies hot3d in the "already-confirmed fixed-episode
    real dataset" bucket mapped to fixed_episode_dataset (a fixed, already-collected
    set of recordings/clips, not a generation framework, scene platform, or RL benchmark
    env). Unchanged from prior pass.
  raw_format: 'https://github.com/facebookresearch/hot3d (README) -- re-verified:
    "An API for downloading and using the full HOT3D dataset provided in a VRS-based
    format." HOT3D-Clips subset is instead distributed via WebDataset (tar shards)
    on Hugging Face. VRS is now a first-class RawFormat enum value (added in the 2026-07-10
    schema refinement per docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md
    section 3.2, citing hot3d as the motivating dataset), so this value is confirmed
    correct and no longer needs the ''Custom'' fallback used in an earlier onboarding
    pass.'
suggested_new_enum_values:
  license: 'Dataset license is a custom multi-part CC agreement per https://www.projectaria.com/datasets/hot3d/license/:
    Sequence data (images/poses from Aria & Quest devices, excluding hand annotations)
    is CC BY-SA 4.0; Hand annotations are CC BY-NC-SA 4.0; 3D object models are CC
    BY-SA 4.0 with an added no-resale clause. None of the existing LicenseEnum values
    (CC-BY-4.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0, etc.) include the plain ShareAlike
    (SA, non-NC) clause, and the license is split across data subtypes rather than
    being a single uniform grant, so this field is left blank rather than forced into
    an approximate value. This matches the explicit, already-documented limitation
    in docs/superpowers/specs/2026-07-10-registry-schema-refinement-design.md section
    3.5, which declined to add a plain CC-BY-SA-4.0 value for this exact reason. Suggest
    adding CC-BY-SA-4.0 and/or a MIXED/CUSTOM value for datasets with per-component
    licensing.'
  hand_pose_representation: HOT3D natively ships two hand-pose formats simultaneously
    (MANO and UmeTrack/joint_angles), not one. Since this schema field is a single
    scalar, only one value (mano) could be recorded here. Suggest either converting
    hand_pose_representation to a List[HandPoseRepresentation] (mirroring additional_modalities/camera_views)
    or adding a documented convention for "both provided" cases, so the UmeTrack/joint_angles
    representation is not silently dropped from the record.
  additional_modalities: HOT3D's Aria recordings also include dense 3D SLAM scene
    point clouds (in addition to eye_gaze, which was mapped to the existing enum value).
    Scene point clouds are neither a depth-camera stream (depth_coverage covers that)
    nor any current SensorModality value (force_torque, tactile, audio, eye_gaze).
    Suggest adding a SCENE_POINT_CLOUD / SLAM_POINT_CLOUD SensorModality enum value
    for datasets like HOT3D that ship SLAM-derived sparse 3D maps alongside images.
