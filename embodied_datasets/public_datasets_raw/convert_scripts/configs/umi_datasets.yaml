id: umi_datasets
name: UMI datasets
source_url: https://umi-gripper.github.io
license: MIT
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: umi
secondary_collection_methods: []
embodiment_class: single_arm
robot_platform: other
num_arms: 1
gripper_type: parallel_jaw
has_mobile_base: false
action_space: eef_pose
rotation_representation: rotation_6d
state_dim: 10
action_dim: 10
fps: 59.94
fps_variable: true
num_camera_views: 1
camera_views:
- other
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: false
num_task_types: 4
urdf_available: false
urdf_source: not_found
