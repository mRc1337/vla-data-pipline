field_sources:
  license: 'hd-epic.github.io/site ''Copyright'' section: ''published under the Creative
    Commons Attribution-NonCommercial 4.0 International License'''
  raw_format: Data is MP4 video (+ optional raw VRS sensor files) with pkl/csv/json
    annotation files (hd-epic-annotations GitHub README); no listed RawFormat enum
    (RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord) matches, so classified as Custom
  collection_method: 'arXiv:2502.04144 Sec.3: unscripted egocentric video recorded
    by human participants wearing Project Aria glasses (no robot) -> egocentric_human'
  embodiment_class: Dataset annotates human hand interactions (7.7M hand masks per
    arXiv:2502.04144 Sec.4.2 / hd-epic.github.io/site); no robot embodiment -> human_hand
  num_arms: Both hands (left/right) are tracked and annotated throughout ('hands'
    column in HD_EPIC_Narrations.pkl per hd-epic-annotations README; 7.7M hand masks
    for both hands per arXiv:2502.04144) -> 2
  gripper_type: No gripper; human hands only (no robot end-effector) -> none, per
    task instructions for non-robot fields
  fps: 'arXiv:2502.04144 Supp. B.2: ''We collected 30 FPS RGB videos at 1408x1408
    resolution... (Profile 28)'''
  fps_variable: Fixed 30 FPS RGB capture stated explicitly (Profile 28), no mention
    of variable frame rate -> false
  num_camera_views: 'arXiv:2502.04144 Sec.3/Supp B.2: Project Aria glasses have ''3
    forward facing cameras (1 RGB and 2 SLAM)'''
  camera_views: Head-mounted egocentric device (Project Aria glasses) -> head
  has_camera_calibration: 'hd-epic.github.io/site News (Jan 2026) + hd-epic-annotations
    README: ''Per-video static device calibration (cameras and sensors), including
    sensor to device transforms'' released -> true'
  depth_coverage: 'arXiv:2502.04144 Sec.4.2 ''Masks to 3D'': dense depth estimates
    (via Depth Anything + sparse MPS correspondences) are used only to lift the ~37K
    annotated object masks to 3D, not released as full per-frame depth maps for all
    video -> partial'
  has_language_instruction: 'arXiv:2502.04144 abstract/Sec.4.1: 59,454 dense fine-grained
    action narrations plus recipe steps provide language descriptions of activity
    -> true'
  urdf_available: No robot embodiment in this dataset -> false
  expected_size_gb: 'hd-epic.github.io/site Download section lists component sizes:
    Audio-HDF5 27GB + Digital-Twin 1.35GB + Hands-Masks 1.95GB + SLAM-and-Gaze 349GB
    + VRS 1.9TB(1900GB) + Videos(mp4) 115.5GB; summed = ~2394.8GB total (VRS raw sensor
    files are the bulk and are optional/skippable per the site)'
  expected_num_episodes: 'arXiv:2502.04144 Supp. B.2: ''we collected a total of 156
    videos, with an average length of 15.9 (+/-14.5) mins... totalling 41.3 hours
    (4.46M frames)'''
suggested_new_enum_values: {}
