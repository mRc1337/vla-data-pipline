field_sources:
  source_url: 'Verified reachable (HTTP 200 via curl) https://meituan.github.io/LIBERO-X/
    -- official project page confirming title "LIBERO-X: Robustness Litmus for Vision-Language-Action
    Models" by Guodong Wang et al. (Meituan), with links to GitHub (github.com/meituan/LIBERO-X)
    and arXiv:2602.06556. Unchanged.'
  paper_url: 'https://meituan.github.io/LIBERO-X/ links "arXiv" -> https://www.arxiv.org/abs/2602.06556;
    confirmed via arXiv abstract page (fetched directly): "LIBERO-X: Robustness Litmus
    for Vision-Language-Action Models", submitted 6 Feb 2026, cs.CV/cs.AI/cs.RO. Newly
    filled.'
  license: 'https://github.com/meituan/LIBERO-X README.md (raw.githubusercontent.com,
    fetched directly) License table: "Datasets: Creative Commons Attribution 4.0 International
    (CC BY 4.0)" (Codebase is separately MIT). Cross-confirmed by HuggingFace dataset
    card https://huggingface.co/api/datasets/meituan/LIBERO-X `cardData.license: cc-by-4.0`.
    Recorded the dataset license, not the codebase''s MIT, matching configs/libero.yaml
    convention.'
  raw_format: 'HuggingFace dataset README (huggingface.co/datasets/meituan/LIBERO-X/raw/main/README.md,
    fetched directly): "This dataset was created using LeRobot (commit 12f5263)" and
    meta/info.json `"codebase_version": "v2.1"` with parquet data files + mp4 video
    paths -- the released artifact is natively in LeRobot v2.1 format (unlike original
    LIBERO which ships HDF5).'
  release_type: 'GitHub README (github.com/meituan/LIBERO-X) TODO list: "[x] Release
    LIBERO-X training data" -- a fixed, pre-recorded set of 2,520 human-teleoperated
    demonstration episodes hosted on HuggingFace as static parquet/mp4 files, even
    though the repo also ships an `eval_template.py` multi-level evaluation harness
    (BDDL scenes, procedural perturbation levels) that is a separate testing framework,
    not part of the ingested training artifact. Classified by the artifact actually
    ingested for VLA training, same convention as configs/libero.yaml.'
  collection_method: 'arXiv:2602.06556 Section III.A.1 "Training Trajectory Collection"
    (PDF text extracted directly): "The trajectories were collected via VR teleoperation
    using a Meta Quest 3 in MuJoCo, facilitated by LeRobot." Confirmed verbatim in
    the HuggingFace dataset README: "All trajectories were human-collected via VR
    teleoperation using a Meta Quest 3." No closer CollectionMethod enum value than
    `teleop` exists for VR-controller-driven human teleoperation -- see suggested_new_enum_values.'
  secondary_collection_methods: 'Same arXiv:2602.06556 Section III.A full-text check:
    only VR teleoperation is described for the released training trajectories (images
    are then re-rendered by rolling out the recorded action sequences in MuJoCo, which
    is a rendering step, not a distinct secondary collection method). Left empty.'
  is_multi_embodiment: 'HuggingFace meta/info.json (huggingface.co/datasets/meituan/LIBERO-X,
    fetched directly): `"robot_type": "panda"` used uniformly; arXiv:2602.06556 does
    not mention any other robot embodiment -- LIBERO-X reuses the same single-Panda-arm
    MuJoCo setup as the original LIBERO (BDDL scene format, `libero/libero_x/bddl`
    root referenced in GitHub README installation section).'
  embodiment_class: 'Same meta/info.json `"robot_type": "panda"` (single robot arm),
    consistent with arXiv:2602.06556''s description of the MuJoCo/Panda-based simulation
    inherited from LIBERO.'
  robot_platform: 'HuggingFace meta/info.json `"robot_type": "panda"` -> Franka Emika
    Panda arm, the same robot platform as the original LIBERO benchmark this dataset
    extends.'
  num_arms: 'Single `"robot_type": "panda"` entry in meta/info.json, no dual-arm or
    multi-robot indication anywhere in the paper or README -> 1 arm.'
  dof_per_arm: 'Franka Emika Panda arm (meta/info.json `robot_type: panda`) has the
    manufacturer-standard 7 revolute joints, same as configs/libero.yaml (same robot
    platform, same underlying MuJoCo/robosuite-derived simulation).'
  gripper_type: 'arXiv:2602.06556 Section III.A.1: "the state included the 6D Cartesian
    pose of the end effector and the gripper open/close status" -- a simple binary/continuous
    open-close gripper, matching the original LIBERO Panda''s stock two-finger parallel-jaw
    gripper (no dexterous/multi-finger hand described anywhere).'
  has_mobile_base: arXiv:2602.06556 and the GitHub README describe a fixed-base Panda
    arm operating on tabletop Kitchen/Study scenes (inherited from LIBERO's env setup);
    no mobile base or locomotion component mentioned.
  action_space: 'arXiv:2602.06556 Section III.A.1: "actions consisted of Cartesian
    increments and gripper commands" -- end-effector Cartesian pose control, i.e.
    eef_pose (consistent with meta/info.json `actions` feature shape [7] = 6-DoF pose
    delta + 1 gripper command).'
  action_frame: 'arXiv:2602.06556 Section III.A.1, verbatim: "actions consisted of
    Cartesian increments and gripper commands" -- increments = delta actions relative
    to the current end-effector pose, not absolute.'
  state_dim: 'HuggingFace meta/info.json (fetched directly) `features.state.shape
    = [8]`. Note: arXiv:2602.06556 describes the state qualitatively as "the 6D Cartesian
    pose of the end effector and the gripper open/close status" without giving an
    exact dimension breakdown; the released feature shape (8) is taken as authoritative
    since it is the actual data the pipeline will ingest.'
  action_dim: HuggingFace meta/info.json (fetched directly) `features.actions.shape
    = [7]`, consistent with the paper's "Cartesian increments and gripper commands"
    description (6-DoF delta pose + 1 gripper).
  fps: 'HuggingFace meta/info.json (fetched directly): `"fps": 10`. Note a discrepancy
    for human review: arXiv:2602.06556 Section III.A.1 states teleoperation "state-action
    sequences were recorded at 20 Hz" during VR data collection, but the released/shipped
    LeRobot dataset''s meta/info.json -- which is what the ingestion pipeline actually
    reads -- reports fps=10. This is plausibly because "Multi-view images ... were
    rendered by rolling out these recorded actions" as a separate post-hoc rendering
    pass at a different (lower) frame rate than the original 20 Hz VR recording. Recorded
    the shipped value (10.0).'
  fps_variable: 'Single uniform `"fps": 10` value applies to the entire released dataset
    in meta/info.json; no per-episode override found.'
  num_camera_views: 'HuggingFace meta/info.json `features` block lists exactly two
    image keys: `image` and `wrist_image` (both 256x256x3), matching arXiv:2602.06556
    Section III.A.1: "Multi-view images (third-person and hand-eye)".'
  camera_views: 'meta/info.json `image` key (paper: "third-person") -> third_person;
    `wrist_image` key (paper: "hand-eye") -> a single wrist-mounted camera with no
    left/right distinction -> mapped to CameraView.WRIST, same convention as configs/libero.yaml
    and configs/calvin.yaml for a single non-handed wrist camera.'
  has_synchronized_multiview_rig: 'Inferred, not an explicit paper statement: arXiv:2602.06556
    Section III.A.1 states multi-view images "were rendered by rolling out these recorded
    [teleoperated] actions" in MuJoCo -- both camera views are rendered from the same
    simulation state at each replayed timestep, so they are synchronized by construction
    in this simulated benchmark. Same reasoning as configs/libero.yaml.'
  has_camera_calibration: Camera intrinsics/extrinsics for a MuJoCo-simulated scene
    (inherited from LIBERO's env/camera setup, per GitHub README's shared BDDL scene
    format) are deterministically defined in the simulator config, so exact calibration
    is always derivable, same reasoning as configs/libero.yaml and configs/calvin.yaml.
  depth_coverage: HuggingFace meta/info.json `features` block only defines `image`
    and `wrist_image` as RGB image dtype entries -- no depth-channel feature is present
    anywhere in the schema. Re-confirmed no depth mention in arXiv:2602.06556 full-text
    search.
  additional_modalities: 'arXiv:2602.06556 full-text search and HuggingFace meta/info.json
    feature list: no force/torque, tactile, audio, or eye-gaze sensing fields present
    for the released training data. Left empty.'
  has_language_instruction: 'arXiv:2602.06556 and GitHub/HuggingFace READMEs consistently
    describe every demonstration as tied to a natural-language task instruction (e.g.
    Fig. 4 examples: "Place the right black book into the desk caddy''s left compartment.");
    meta/info.json includes a `task_index` feature mapping episodes to language task
    descriptions.'
  num_task_types: 'GitHub README (github.com/meituan/LIBERO-X), HuggingFace dataset
    README, and arXiv:2602.06556 abstract/Section III.A.2 all consistently state:
    "2,520 demonstrations, 600 tasks, and 100 scenes". Flagging a discrepancy for
    human review: HuggingFace meta/info.json instead reports `"total_tasks": 428`
    for this same release -- likely a different counting convention (e.g. de-duplicated
    task-description strings used for the LeRobot `task_index` mapping) rather than
    the paper''s task-design count. Recorded the paper/README-stated figure (600)
    since it is the authors'' explicit, repeatedly-stated characterization of the
    training set''s task diversity.'
  urdf_available: 'GitHub README installation section references `libero/libero_x/bddl`
    (BDDL scene format) built directly on the original LIBERO/robosuite MuJoCo Panda
    model. Same check as configs/libero.yaml: robosuite bundles only an MJCF (MuJoCo
    XML) Panda model, no standalone URDF file, and LIBERO-X inherits this same simulation
    asset rather than introducing a new robot model.'
  urdf_source: Same reasoning as urdf_available -- no .urdf file located; LIBERO-X
    reuses LIBERO/robosuite's MJCF-only Panda model -> not_found.
  expected_size_gb: 'HuggingFace API (huggingface.co/api/datasets/meituan/LIBERO-X?full=true&files_metadata=true,
    fetched directly): `usedStorage` field = 101,453,611,763 bytes = 101.45 GB for
    the full repository (parquet episode data + mp4 videos + metadata).'
  expected_num_episodes: 'Cross-validated: HuggingFace meta/info.json `"total_episodes":
    2520`; GitHub README and HuggingFace dataset README both state "2,520 demonstrations";
    arXiv:2602.06556 abstract states "2,520 demonstrations". All three sources agree
    exactly.'
  expected_duration_hours: 'Computed directly from HuggingFace meta/info.json (fetched
    directly): `total_frames = 889277`, `fps = 10` -> 889277 / 10 / 3600 = 24.6910
    hours, rounded to 24.7.'
  num_scenes: 'arXiv:2602.06556 Section III.A.2: "we created 100 scenarios encompassing
    600 distinct tasks"; GitHub/HuggingFace READMEs both state "100 scenes". Consistent
    across all sources.'
suggested_new_enum_values:
  collection_method: Consider adding a more specific `vr_teleop` value distinct from
    the generic `teleop`. LIBERO-X's human demonstrations were collected via immersive
    VR controller teleoperation (Meta Quest 3 in MuJoCo, per arXiv:2602.06556 Sec
    III.A.1), which has materially different fidelity/latency/embodiment-mapping characteristics
    than tool-based teleop devices already covered by the same `teleop` value in configs/libero.yaml
    (3Dconnexion Spacemouse) or master-slave leader-follower arms used elsewhere in
    this registry. Currently mapped to `teleop` since no closer enum value exists.
