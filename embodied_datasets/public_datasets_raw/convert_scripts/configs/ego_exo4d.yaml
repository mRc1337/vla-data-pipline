  num_objects: 'NEW FIELD, checked, left blank: no page (overview, data/*, annotations/*,
    homepage, arXiv:2311.18259 abstract) states a total distinct-object count for
    the dataset (unlike e.g. Assembly101''s explicit "101 unique toys"). The Relations
    annotation schema (docs.ego-exo4d-data.org/annotations/relations/) tracks per-take
    "active objects" by name/track_id but no dataset-wide object taxonomy size is
    published.'
  dof_per_arm: 'NEW FIELD, checked, left blank: EgoPose annotations provide only 3D/2D
    keypoint positions (docs.ego-exo4d-data.org/annotations/ego_pose/), not joint-angle
    or MANO-parameter encodings, so there is no stated per-arm DoF figure (same reasoning
    as sibling assembly101.yaml, which also left this blank for an identical 21-keypoint-per-hand
    representation).'
  dof_per_hand: 'NEW FIELD, checked, left blank: same reasoning as dof_per_arm - hand
    pose is released purely as 3D keypoint coordinates (21 joints/hand), not a DoF/joint-angle
    parameterization; no dof figure is stated anywhere in the docs.'
  action_space: 'NEW FIELD, checked, left blank: Ego-Exo4D is a human-activity video+annotation
    dataset with no robot control action vector (no joint/eef position/velocity/torque
    action is defined or distributed anywhere in docs.ego-exo4d-data.org); none of
    the ActionSpace enum values apply.'
  action_frame: 'NEW FIELD, checked, left blank: same reasoning as action_space -
    no action representation of any frame (delta/absolute/etc.) exists for this dataset.'
  rotation_representation: 'NEW FIELD, checked, left blank: EgoPose hand/body annotations
    are 3D keypoint positions only (x,y,z per joint), with no per-joint or per-limb
    rotation encoding published; camera_extrinsics matrices exist per camera (docs.ego-exo4d-data.org/annotations/ego_pose/)
    but that encodes camera pose, not the tracked human''s orientation, so left blank
    rather than conflated with camera rotation.'
  state_dim: 'NEW FIELD, checked, left blank: although 21 joints x 2 hands x 3 coords
    = 126 numeric values per frame could be derived (the same arithmetic sibling h2o.yaml
    used to fill state_dim=126), Ego-Exo4D''s docs never frame this keypoint annotation
    as a robot/agent "state" vector (there is also a separate 17-keypoint body annotation
