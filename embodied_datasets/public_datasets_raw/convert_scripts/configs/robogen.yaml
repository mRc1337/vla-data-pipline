id: robogen
name: RoboGen
source_url: https://robogen-ai.github.io/
paper_url: https://arxiv.org/abs/2311.01455
license: Apache-2.0
raw_format: Custom
release_type: generation_framework
collection_method: simulation
secondary_collection_methods:
- autonomous_policy
is_multi_embodiment: true
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: suction
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
action_frame: delta
rotation_representation: axis_angle
action_dim: 7
fps_variable: true
num_camera_views: 1
camera_views:
- third_person
has_synchronized_multiview_rig: false
has_camera_calibration: false
depth_coverage: full
additional_modalities: []
has_language_instruction: true
urdf_available: true
urdf_source: community_repo
review_status: pending_human_review
field_sources:
  license: github.com/Genesis-Embodied-AI/RoboGen LICENSE file (Apache License 2.0,
    verified full text)
  raw_format: github.com/Genesis-Embodied-AI/RoboGen execute.py/execute_locomotion.py
    (saves env.pkl/result.pkl pickle state dumps, meta_info.json, .gif/.mp4 renders;
    no RLDS/HDF5/LeRobot/TFRecord export in the repo)
  release_type: robogen-ai.github.io and arXiv:2311.01455 abstract/intro (a 'generative
    robotic agent' with a self-guided propose-generate-learn cycle producing 'an endless
    stream' of tasks/skills on repeated query -- a generation framework, not a fixed
    episode set)
  collection_method: robogen-ai.github.io and arXiv:2311.01455 (tasks, scenes and
    skills are proposed/generated/solved entirely inside a PyBullet-based physics
    simulator; no teleop or real robot)
  secondary_collection_methods: 'readme.md ''Learn skills'' section + execute.py/execute_locomotion.py:
    substeps are solved autonomously via RL (SAC/Ray-RLlib), motion-planning primitives
    (OMPL), or trajectory optimization/CEM -- no human teleoperation found anywhere
    in the repo (grep for ''teleop'' returns nothing) -- so autonomous_policy is a
    fitting secondary method alongside simulation'
  is_multi_embodiment: 'github.com/Genesis-Embodied-AI/RoboGen repo layout: manipulation/
    (panda.py/sawyer.py/ur5.py single-arm robots) and locomotion/ subfolders a1/,
    anymal/ (quadrupeds) and atlas/ (humanoid) are separate, roughly co-equal modules'
  embodiment_class: Left blank on this re-verification pass (previously set to single_arm).
    manipulation/ covers single_arm robots while locomotion/a1, locomotion/anymal
    (quadruped) and locomotion/atlas (humanoid) are separate co-equal modules with
    no single representative embodiment; forcing one value would misrepresent the
    multi-embodiment framework (see suggested_new_enum_values for a possible mixed/composite
    value)
  robot_platform: arXiv:2311.01455 methodology section explicitly frames the manipulation
    module around Franka ('we explain details of RoboGen in the context of a robotic
    arm (e.g., Franka)'; GPT-4 prompts say 'You can think of the robotic arm as a
    Franka Panda robot'). Note manipulation/sim.py load_robot() actually randomly
    samples panda/sawyer/ur5 at runtime (manipulation/utils.py default_config has
    no fixed robot_name), and locomotion/ targets Unitree A1, ANYmal and Atlas which
    have no robot_platform enum entry -- franka_panda is kept as the paper's canonical
    illustrative default, see suggested_new_enum_values
  num_arms: manipulation/panda.py (single right_end_effector arm; right_arm_joint_indices
    has 7 entries)
  dof_per_arm: manipulation/panda.py (right_arm_joint_indices = [0,1,2,3,4,5,6], 7
    controllable arm joints)
  gripper_type: 'CORRECTED from parallel_jaw to suction. manipulation/utils.py default_config
    sets use_suction: True (the default used to load every example task, none of the
    95 example_tasks/*.yaml override it); manipulation/sim.py grasp_action_mag = 0.06
    if not use_suction else 1, and activate_suction()/deactivate_suction() create
    a pybullet constraint at the gripper-object contact point when action[6] >= 0.
    The physical Franka/Sawyer/UR5 gripper mesh has 2 actuated finger joints (panda.py
    right_gripper_indices), but the DEFAULT simulated grasping behavior used across
    the released code/examples is the suction abstraction, not finger actuation'
  hand_pose_representation: New field, filled none. The end effector is either the
    suction abstraction or a 2-finger parallel gripper (see gripper_type); no dexterous/articulated
    hand or bare-hand tracking is used anywhere in the manipulation or locomotion
    modules
  has_mobile_base: manipulation/sim.py load_robot() calls self.robot.init(..., fixed_base=True,
    ...) -- fixed tabletop manipulation setup in the manipulation module (locomotion
    module legged robots are categorized as quadruped/humanoid embodiment, not a wheeled/tracked
    mobile base)
  action_space: 'manipulation/sim.py (self.action_low/self.action_high are 7-dim:
    delta end-effector translation+rotation plus a suction/gripper action)'
  action_frame: manipulation/sim.py (translation_mode default is 'delta-translation')
  rotation_representation: manipulation/sim.py / manipulation/utils.py default_config
    (rotation_mode default is 'delta-axis-angle-local')
  action_dim: 'manipulation/sim.py (7-element action_low/action_high arrays: 3 translation
    + 3 rotation + 1 suction/gripper)'
  fps_variable: manipulation/sim.py (dt=0.01, frameskip=2 defaults, both user-configurable
    constructor params) and locomotion/sim.py (dt=0.01, frameskip=10 defaults) give
    different effective control rates per module/config; GIF/MP4 exports additionally
    use their own fixed export fps (10/60) unrelated to the sim control rate -- no
    single fixed dataset-wide fps
  num_camera_views: manipulation/sim.py and locomotion/sim.py both call setup_camera()/setup_camera_rpy()
    exactly once, configuring a single fixed external render viewpoint
  camera_views: manipulation/sim.py and locomotion/sim.py (single fixed external/third-person
    viewpoint defined by camera_eye/camera_target or yaw-pitch-roll, not head- or
    wrist-mounted)
  has_synchronized_multiview_rig: New field, filled false. Only one camera viewpoint
    is ever configured per env (see num_camera_views/camera_views sources) -- no multi-camera
    synchronized rig
  has_camera_calibration: manipulation/sim.py (camera pose/FOV are hardcoded constructor
    constants, not exported as per-episode calibration files)
  depth_coverage: manipulation/sim.py and locomotion/sim.py render() both return rgb
    img and depth from p.getCameraImage on every call
  additional_modalities: Checked manipulation/{sim,panda,sawyer,ur5,robot}.py and
    locomotion/sim.py for force/torque sensing, tactile, audio, or eye-gaze -- none
    found; observations are limited to rgb/depth images and simulator joint/pose state
  has_language_instruction: example_tasks/ task_config yaml files contain GPT-4-generated
    task_name/task_description natural-language fields, e.g. Change_Lamp_Direction
    example (verified via GitHub raw file)
  urdf_available: 'readme.md Dataset section: a parsed PartNet-Mobility URDF dataset
    is provided via a Google Drive download link'
  urdf_source: readme.md (object URDFs come from PartNet-Mobility, a third-party academic
    asset collection accessed via sapien.ucsd.edu, plus Objaverse assets; not authored
    in this repo nor official manufacturer CAD)
  source_url: https://robogen-ai.github.io/ (verified HTTP 200; matches the official
    project page linked from arXiv:2311.01455 and the GitHub repo README)
  paper_url: 'https://arxiv.org/abs/2311.01455 (verified HTTP 200; RoboGen: Towards
    Unleashing Infinite Data for Automated Robot Learning via Generative Simulation,
    ICML 2024)'
suggested_new_enum_values:
  robot_platform: unitree_a1, anymal, atlas -- RoboGen's locomotion module (locomotion/a1,
    locomotion/anymal, locomotion/atlas) targets these three legged/humanoid robots,
    none of which map to an existing robot_platform value (unitree_g1/unitree_h1 are
    different bipedal robots)
  embodiment_class: no single new literal proposed; RoboGen is a case where is_multi_embodiment=true
    but no embodiment is clearly primary (single_arm manipulation vs. quadruped/humanoid
    locomotion modules are co-equal). A composite/'mixed' embodiment_class value could
    let future multi-embodiment frameworks like this avoid leaving the field blank
