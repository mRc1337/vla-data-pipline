field_sources:
  source_url: https://epic-kitchens.github.io/ (official project homepage; re-verified
    live 2026-07-10 via curl, HTTP 200, content unchanged in substance from prior
    pass).
  paper_url: https://arxiv.org/abs/2006.13256 - "Rescaling Egocentric Vision" (Damen
    et al., IJCV 2022), the primary EPIC-KITCHENS-100 paper. Field was blank in the
    prior pass even though field_sources already cited this arXiv ID throughout; now
    recorded explicitly. The homepage also lists a companion 2018 ECCV paper and a
    2021 TPAMI paper describing EPIC-KITCHENS-55, but 2006.13256 is the one that introduces
    EPIC-KITCHENS-100 itself.
  license: 'RE-VERIFIED AND STRENGTHENED, kept at CC-BY-NC-4.0 as closest enum fit,
    but the underlying discrepancy is now CONFIRMED rather than inferred: (1) https://epic-kitchens.github.io/
    2026 footer states "All datasets and benchmarks on this page are copyright by
    us and published under the Creative Commons Attribution-NonCommercial 4.0 International
    License." (2) Fetched directly the actual data repository page https://doi.org/10.5523/bris.2g1n6qdydwa9u22shpxqzp0t8m
    (data.bris "EPIC-KITCHENS-100" record) on 2026-07-10: its "Licence" field literally
    reads "Non-Commercial Government Licence for public sector information" - a distinct,
    named UK government licence, not textually CC-BY-NC-4.0. Both are non-commercial/attribution
    licences but they are not the same instrument. CC-BY-NC-4.0 is retained as the
    closest-fitting enum value per instructions; the exact data.bris licence text
    is recorded in suggested_new_enum_values.'
  raw_format: https://github.com/epic-kitchens/epic-kitchens-download-scripts (re-verified
    reachable, HTTP 200) - dataset is distributed as raw MP4 videos plus tarred RGB/optical-flow
    frame folders, GoPro metadata, and custom CSV/pickle annotation files (see also
    EPIC-KITCHENS-100-annotations repo, HTTP 200); not RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord/VRS.
  release_type: Re-verified unchanged. arXiv:2006.13256 describes a fixed collection
    of 700 pre-recorded, pre-annotated videos (not a generation framework, scene platform,
    or RL benchmark env) - fixed_episode_dataset is correct.
  collection_method: 'Re-verified via full-text fetch of ar5iv.labs.arxiv.org/html/2006.13256
    Sec.2 "Data Collection": footage captured with participant-worn head-mounted GoPro
    cameras (GoPro Hero7 Black for the extension; GoPro Hero5/similar for the original
    EPIC-KITCHENS-55 subset per arXiv:1804.02748 Sec.3.1) during unscripted daily
    kitchen activity - egocentric_human confirmed correct.'
  embodiment_class: 'Re-verified: arXiv:2006.13256 and arXiv:1804.02748 (EPIC-KITCHENS-55
    origin paper) both describe capturing human hand-object interactions from a human
    wearer''s point of view; no robot embodiment involved - human_hand confirmed correct.'
  is_multi_embodiment: 'arXiv:2006.13256 and https://epic-kitchens.github.io/: the
    entire dataset (both the original EPIC-KITCHENS-55 subset and the EPIC-KITCHENS-100
    extension) uses a single embodiment type - a human hand/wearer with a head-mounted
    egocentric camera. No robot or additional embodiment types are involved anywhere
    in the collection. Newly filled: false.'
  hand_pose_representation: 'arXiv:2006.13256 (automatic annotations section, citing
    Shan2020Understanding for hand-object detection and He et al. Mask R-CNN for object
    masks) and https://epic-kitchens.github.io/ Downloads ("Automatic annotations
    (masks, hands and objects)"): the dataset''s hand-related automatic annotations
    are 2D bounding-box detections and segmentation masks, not a 3D/parametric hand-pose
    encoding. No MANO fits, 3D keypoints, or joint-angle annotations are provided
    as part of EPIC-KITCHENS-100 itself. Newly filled: none.'
  fps: 'RE-VERIFIED with concrete numbers (previous pass had only an "implying" inference).
    arXiv:2006.13256 Appendix B "Camera Settings for Collection": "Head mounted GoPro
    Hero 7 was used for data collection filming at 50fps with video stabilisation.
    Our choice of 50 fps avoids overhead light flickering visible in [EPIC-KITCHENS-55]
    that occurs due to the difference between frame rates and the national grid frequency."
    This 50fps applies to the 45.4h newly-collected extension only. The value is retained
    as the single scalar fps because it is the dataset''s current/most-recently-stated
    capture standard; see fps_variable for the mixed-rate caveat.'
  fps_variable: 'RE-VERIFIED and substantially strengthened with hard numbers. arXiv:1804.02748
    (original EPIC-KITCHENS-55 paper) Sec.3.1: "The camera was set to linear field
    of view, 59.94 fps and Full HD resolution of 1920x1080, however some subjects
    made minor changes... Also, 1% at 30 fps, 1% at 48 fps and 0.2% at 90 fps." This
    54.6h original subset therefore used ~59.94fps for the vast majority of footage
    (with small full pct at 30/48/90fps), while the 45.4h extension subset (arXiv:2006.13256
    Appendix B) used 50fps uniformly. Frame-rate is therefore genuinely non-constant
    across the full EPIC-KITCHENS-100 corpus - fps_variable=true confirmed correct
    with much stronger evidence than the prior pass.'
  num_camera_views: 'Re-verified: arXiv:2006.13256 Sec.2 and https://epic-kitchens.github.io/
    "Characteristics" list ("Head-mounted camera"): single head-mounted camera per
    recording, no secondary/wrist/third-person camera. No mention anywhere of a synchronized
    multi-camera rig.'
  camera_views: 'Re-verified: https://epic-kitchens.github.io/ "Characteristics: ...
    Head-mounted camera"; arXiv:2006.13256 and arXiv:1804.02748 both describe a single
    head-mounted GoPro.'
  has_synchronized_multiview_rig: 'No mention in arXiv:2006.13256, arXiv:1804.02748,
    or https://epic-kitchens.github.io/ of any second/synchronized camera - every
    recording uses exactly one head-mounted GoPro. Newly filled: false.'
  has_camera_calibration: Re-verified - no intrinsics/extrinsics are published with
    EPIC-KITCHENS-100 itself; camera pose/calibration was only later derived by the
    separate EPIC-Fields project (https://epic-kitchens.github.io/epic-fields/site,
    re-verified reachable HTTP 200), confirming the base dataset ships without calibration.
  depth_coverage: 'Re-verified: https://epic-kitchens.github.io/ and arXiv:2006.13256
    describe RGB video plus derived optical flow and audio only; no depth sensor was
    used in either the original or extension collection.'
  additional_modalities: 'CORRECTED from [] (empty) to [audio], with evidence: https://epic-kitchens.github.io/
    describes the dataset as "audio-visual" recordings, and the GoPro Hero5/Hero7
    cameras record a synchronized audio track alongside video; this audio track is
    reused directly by the official EPIC-SOUNDS derivative dataset for audio-based
    interaction recognition (linked from the EPIC-KITCHENS-100 homepage Annotations
    section). Note: part of the corpus (the 45.4h extension only) also ships gyroscope+accelerometer
    (IMU) telemetry per the Downloads section ("Extended Sequences (+RGB Frames, Flow
    Frames, Gyroscope + accelerometer data)"), but SensorModality has no IMU enum
    value - see suggested_new_enum_values.'
  has_language_instruction: 'Re-verified: arXiv:2006.13256 Sec.2 "Narrator"/"Pause-and-Talk"
    pipeline and https://epic-kitchens.github.io/ stats ("Multi-language narrations",
    "20K unique narrations"): every action segment has an associated free-form language
    narration/caption.'
  urdf_available: Re-verified - dataset records human hands/egocentric video, not
    a robot platform, so no URDF exists for it (confirmed via arXiv:2006.13256, arXiv:1804.02748,
    and project homepage, none of which describe any robot hardware).
  urdf_source: Same reasoning as urdf_available - no robot embodiment, so no URDF
    source applies.
  expected_size_gb: 'Re-verified directly against live Downloads section text (https://epic-kitchens.github.io/,
    fetched 2026-07-10): "Extended Sequences (+RGB Frames, Flow Frames, Gyroscope
    + accelerometer data): ... (740GB zipped)", "Original Sequences (+RGB and Flow
    Frames): ... (1.1TB zipped)", "Automatic annotations (masks, hands and objects):
    ... (10 GB)". 740 + 1100 + 10 = 1850GB total downloadable size - value confirmed
    unchanged.'
  expected_num_episodes: 'Re-verified: arXiv:2006.13256 abstract - "100 hours, 20M
    frames, 90K actions in 700 variable-length videos" - and https://epic-kitchens.github.io/
    stats both state 700 videos. Value confirmed unchanged.'
  expected_duration_hours: 'arXiv:2006.13256 abstract: "a collection of 100 hours,
    20M frames, 90K actions in 700 variable-length videos"; matches https://epic-kitchens.github.io/
    "100 hours of recording". Newly filled: 100.0.'
  num_subjects: 'arXiv:2006.13256 Sec.2 "Data Collection": "Of the 32 participants
    in [EPIC-KITCHENS-55], 16 subjects expressed interest in participating... We also
    recruited 5 additional subjects, increasing the total number of subjects and kitchen
    environments to 37 and 45 respectively." Newly filled: 37 (total distinct participants
    across the full EPIC-KITCHENS-100 corpus, i.e. the original 32 plus 5 newly recruited).'
  num_scenes: 'Same citation as num_subjects (arXiv:2006.13256 Sec.2): "... increasing
    the total number of subjects and kitchen environments to 37 and 45 respectively."
    Also matches https://epic-kitchens.github.io/ "Characteristics: 45 kitchens -
    4 cities". Newly filled: 45 (distinct kitchen environments).'
  num_objects: 'arXiv:2006.13256 Fig.5/Sec.3: "we show the frequency of verb (97)
    and noun (300) classes in the dataset." Newly filled: 300, representing the number
    of distinct noun/object category classes in the annotation taxonomy (not raw object-instance/bounding-box
    count, which is far larger and not stated as a single dataset-wide figure for
    EPIC-KITCHENS-100).'
suggested_new_enum_values:
  license: Non-Commercial Government Licence for public sector information - this
    is the literal licence name shown on the primary raw-data repository record (https://doi.org/10.5523/bris.2g1n6qdydwa9u22shpxqzp0t8m,
    data.bris "EPIC-KITCHENS-100"), which governs the actual videos/frames/metadata
    download. It is a distinct UK government open-licence instrument from CC-BY-NC-4.0
    (which the project homepage cites for the website/annotations as a whole), though
    both are non-commercial/attribution style. LicenseEnum currently has no close
    match for UK Non-Commercial Government Licences; CC-BY-NC-4.0 was used in the
    license field as the nearest available enum value.
  additional_modalities: 'imu - the 45.4h EPIC-KITCHENS-100 extension subset ships
    gyroscope + accelerometer telemetry alongside RGB/flow frames (per https://epic-kitchens.github.io/
    Downloads section: "Extended Sequences (+RGB Frames, Flow Frames, Gyroscope +
    accelerometer data)"), but the SensorModality enum (force_torque, tactile, audio,
    eye_gaze) has no IMU option to record this.'
