id: maniskill3
name: ManiSkill3
source_url: https://github.com/haosulab/ManiSkill
license: Apache-2.0
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods: []
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
action_dim: 8
fps: 20.0
fps_variable: true
num_camera_views: 1
camera_views:
- third_person
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: false
num_task_types: 12
urdf_available: true
urdf_source: dataset_repo
expected_size_gb: 9.06
review_status: pending_human_review
field_sources:
  source_url: https://github.com/haosulab/ManiSkill (official code+docs repo; website
    https://www.maniskill.ai/, paper https://arxiv.org/abs/2410.00425)
  license: https://github.com/haosulab/ManiSkill/blob/main/LICENSE (Apache-2.0 for
    code); README.md License section notes environment code is Apache-2.0 while imported
    3D assets are CC-BY-NC-4.0 (https://raw.githubusercontent.com/haosulab/ManiSkill/main/README.md);
    HF dataset card haosulab/ManiSkill_Demonstrations tags license:apache-2.0
  raw_format: https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html
    ('All demonstrations for a task are saved in the HDF5 format openable by h5py')
  collection_method: 'arXiv:2410.00425 (ManiSkill3 paper), Section on Demonstration
    Datasets: ''ManiSkill3 sources large-scale demonstrations through a combination
    of different methods'' -- motion planning, RL rollouts, and teleoperation, all
    executed inside the GPU simulator; overall category is simulation-generated data'
  embodiment_class: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    (default single-arm Panda agent used as default robot_uids for most tabletop tasks,
    e.g. pick_cube.py)
  robot_platform: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/envs/tasks/tabletop/pick_cube.py
    (robot_uids='panda' is the default robot for the majority of tabletop tasks)
  num_arms: same Panda agent source; single 7-DOF arm + parallel gripper
  dof_per_arm: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    (arm_joint_names lists 7 joints: panda_joint1..7)'
  gripper_type: 'same Panda source (gripper_joint_names: panda_finger_joint1/2, a
    mimic parallel 2-finger gripper)'
  has_mobile_base: Panda (default/representative robot) has no mobile base; note ManiSkill3
    separately supports mobile manipulators (e.g. Fetch, seen as SUPPORTED_ROBOTS
    in pick_cube.py) and quadruped/humanoid embodiments
  action_space: 'https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html:
    raw/original trajectory.h5 files are generated by the pd_joint_pos (PD Joint Position)
    controller by default'
  action_frame: 'same source: default demo controller is ''pd_joint_pos'' (absolute
    joint position target), distinct from the delta variant ''pd_joint_delta_pos''
    also supported'
  rotation_representation: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    controller_configs: default pd_joint_pos controller acts purely in joint space,
    no explicit end-effector rotation representation is used'
  action_dim: 'Panda controller_configs: arm_pd_joint_pos covers 7 arm joints + gripper_pd_joint_pos
    (mimic-controlled 2-finger gripper as 1 actuated dim) = 8-dim action, matching
    well-known ManiSkill Panda action space'
  fps: 'https://github.com/haosulab/ManiSkill/blob/main/mani_skill/utils/structs/types.py
    SimConfig defaults: sim_freq=100, control_freq=20 (control_freq is the effective
    per-step/demonstration fps)'
  fps_variable: arXiv:2410.00425 Figure 4 benchmark uses sim_freq=120/control_freq=60
    for some tasks, and the sim2real experiment (Section VIII-B) uses a 30Hz control
    frequency, showing fps differs by task from the SimConfig default of 20Hz
  num_camera_views: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/envs/tasks/tabletop/pick_cube.py
    _default_sensor_configs returns a single CameraConfig('base_camera', ...) for
    the default policy-observation camera
  camera_views: 'same pick_cube.py source: single ''base_camera'' positioned via look_at()
    as a third-person table-top view; paper Figure 29 also references ''hand_camera''
    (wrist) and ''left/right_shoulder_camera'' as optional multi-view additions in
    some tasks'
  has_camera_calibration: cameras are procedurally placed with exactly known pose/intrinsics
    in SAPIEN/ManiSkill (CameraConfig pose + fov + near/far), so calibration parameters
    are always exactly known by construction
  depth_coverage: 'https://maniskill.readthedocs.io/en/latest/user_guide/concepts/sensors.html:
    every shader preset (minimal/default/rt/rt-med/rt-fast) supports a ''depth'' texture
    output for every camera'
  has_language_instruction: https://maniskill.readthedocs.io/en/latest/user_guide/datasets/demos.html
    Meta Information (JSON) schema lists env_info/episodes/episode_id/reset_kwargs/control_mode/elapsed_steps/info
    with no per-episode language-instruction field; arXiv:2410.00425 Section X-B notes
    text descriptions were only hard-coded ad hoc for the PerAct baseline, not stored
    as part of the demonstration dataset itself
  num_task_types: 'arXiv:2410.00425 abstract/Section VII: ''the most comprehensive
    range of GPU parallelized environments/tasks spanning 12 distinct domains'' (table-top
    manipulation, mobile manipulation, room-scale scenes, quadruped/humanoid locomotion,
    humanoid/bi-manual manipulation, multi-agent robotics, drawing/cleaning, dextrous
    manipulation, vision-tactile manipulation, classic control, digital twins, external
    benchmarks); note individual task/environment IDs (e.g. PickCube-v1, StackCube-v1,
    ...) number well over 50 across these 12 domains per https://maniskill.readthedocs.io/en/latest/tasks/index.html
    category pages'
  urdf_available: https://github.com/haosulab/ManiSkill/blob/main/mani_skill/agents/robots/panda/panda.py
    urdf_path points to a bundled panda_v2.urdf inside PACKAGE_ASSET_DIR
  urdf_source: 'same source: robot URDFs (Panda and other supported robots) ship inside
    the mani_skill package/repo itself'
  expected_size_gb: https://huggingface.co/api/datasets/haosulab/ManiSkill_Demonstrations?full=true
    field 'usedStorage'=9058933081 bytes (~9.06 GB) for the full haosulab/ManiSkill_Demonstrations
    HF dataset repo referenced by the official download_demo tool
suggested_new_enum_values:
  embodiment_class: quadruped -- ManiSkill3 includes quadruped/legged locomotion tasks
    (e.g. AnymalC-Reach-v1, AntRun-v1/AntWalk-v1 control tasks per https://maniskill.readthedocs.io/en/latest/tasks/control/index.html
    and .../quadruped/index.html) that do not fit single_arm/dual_arm/humanoid/mobile_manipulator/human_hand
