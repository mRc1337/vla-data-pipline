field_sources:
  source_url: HF dataset page https://huggingface.co/datasets/omarrayyann/mv-umi;
    HF API (https://huggingface.co/api/datasets/omarrayyann/mv-umi) confirms tags=[arxiv:2509.18757,
    region:us]. Re-checked, confirmed unchanged.
  paper_url: 'arXiv:2509.18757 ''MV-UMI: A Scalable Multi-View Interface for Cross-Embodiment
    Learning'' (Rayyan et al., NYU Abu Dhabi), matching the HF API arxiv tag. Newly
    filled (field did not exist in prior schema).'
  license: HF API and full HF dataset page HTML contain no license tag or section;
    GitHub mv-umi/MV-UMI repo has no LICENSE file (repo size=0, README is only '#
    MV-UMI'); the project page's CC-BY-SA-4.0 notice covers only the website template,
    not the dataset. Re-confirmed Unknown.
  raw_format: 'CORRECTED citation detail (enum value unchanged, Custom): direct inspection
    via fsspec+zipfile HTTP range requests shows the 4 HF siblings are NOT uniformly
    Zarr. bottles_rack_data.zarr.zip and markers_placement_data(_raw).zarr.zip are
    Zarr v2 stores, but cans_shelf_placement.zip actually contains raw GoPro episode
    videos (e.g. GX010114.mp4) plus per-episode third-person ''_third_background.mp4''
    clips, not a Zarr store. Still best classified overall as Custom since no single
    RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord format covers this mixed raw-video + Zarr
    release.'
  release_type: HF repo is a fixed set of 4 static per-task archives with directly-verified
    episode counts (see expected_num_episodes), not a procedural generation framework,
    scene platform, or RL benchmark env. Confirmed unchanged.
  collection_method: 'arXiv:2509.18757 abstract and Sec III-B4: actions are extracted
    directly from egocentric handheld-gripper footage ''in a similar fashion to UMI'',
    the handheld-gripper data-collection paradigm. Confirmed unchanged.'
  secondary_collection_methods: 'No secondary method found: all 3 tasks'' released
    files are captured solely via the handheld MV-UMI device (arXiv:2509.18757 Sec
    III-A/B); confirmed via direct inspection of the released zarr array keys (only
    eef_pos/rot/gripper_width + camera streams, no teleop or scripted-policy markers).
    Confirmed unchanged (empty).'
  is_multi_embodiment: 'arXiv:2509.18757 describes exactly one data-collection embodiment
    (the handheld MV-UMI gripper) across all 3 released tasks; deployment/evaluation
    uses one robot platform (Franka, see robot_platform), not multiple differing embodiments
    for data collection. Newly filled: false.'
  embodiment_class: mv-umi.github.io 'Mechanical Design' section and arXiv:2509.18757
    describe a single handheld gripper device with no bimanual/dual-gripper setup
    and no mobile base. Confirmed unchanged.
  robot_platform: 'mv-umi.github.io hosts static/images/franka.jpg (alt=''Franka-mounted
    MV-UMI''); downloaded and visually inspected the image directly: it shows the
    custom three-jaw gripper mounted on an arm bearing the ''FRANKA EMIKA'' logo.
    Caveat: this image''s containing HTML block is currently wrapped in an HTML comment
    on the live page (not rendered to browser visitors), though the image file itself
    is still hosted unchanged and no other robot platform is named anywhere in the
    paper or site. Confirmed with this caveat noted.'
  num_arms: 'Same basis as embodiment_class/robot_platform: single handheld gripper,
    single-arm Franka deployment; no bimanual configuration described anywhere in
    arXiv:2509.18757. Confirmed unchanged.'
  dof_per_arm: 'Newly filled: 7. Franka Panda is a fixed 7-DOF arm (manufacturer spec);
    filled by convention with sibling franka_panda configs in this repo (e.g. droid.yaml,
    calvin.yaml) since MV-UMI''s own paper does not separately restate the arm''s
    joint count.'
  gripper_type: 'arXiv:2509.18757 Sec III-E ''Proposed Three-Jawed gripper'': two
    compliant TPU-95A jaws plus one rigid jaw. ''three_jaw'' is now an official schema
    enum value (previously flagged via suggested_new_enum_values in an earlier pass);
    re-confirmed unchanged and the now-stale suggested-enum entry removed.'
  has_mobile_base: mv-umi.github.io deployment description and arXiv:2509.18757 Sec
    IV-1 describe a stationary tabletop setup for all 3 tasks; no mobile base is mentioned
    anywhere. Confirmed unchanged.
  action_space: 'arXiv:2509.18757 Sec III-A: a_t = (T_t, w_t), end-effector pose plus
    gripper width. Directly confirmed by the released zarr arrays robot0_eef_pos (N,3),
    robot0_eef_rot_axis_angle (N,3), robot0_gripper_width (N,1). Confirmed unchanged.'
  action_frame: 'arXiv:2509.18757 Sec III-B4: ORB-SLAM3-estimated poses are computed
    ''relative to the starting pose'' of each episode. ''relative_trajectory'' is
    now an official schema enum value (previously flagged via suggested_new_enum_values);
    re-confirmed unchanged and the now-stale suggested-enum entry removed.'
  rotation_representation: 'Newly filled via direct data inspection: the released
    zarr stores (bottles_rack_data.zarr.zip, markers_placement_data(_raw).zarr.zip)
    contain an array literally named ''robot0_eef_rot_axis_angle'' (shape (N,3), float32),
    i.e. axis-angle rotation -- matches the AXIS_ANGLE enum exactly.'
  state_dim: 'Newly filled via direct data inspection: robot0_eef_pos (N,3) + robot0_eef_rot_axis_angle
    (N,3) + robot0_gripper_width (N,1) = 7, matching the UMI-family convention (see
    umi_datasets.yaml/fastumi.yaml) where the same pose+gripper-width array serves
    as both observation history and action target.'
  action_dim: 'Newly filled via direct data inspection: same 7-dim array set as state_dim
    (eef_pos 3 + eef_rot_axis_angle 3 + gripper_width 1), matching arXiv:2509.18757
    Sec III-A''s a_t=(T_t,w_t) definition.'
  fps: 'Newly filled: downloaded and probed (OpenCV) an actual raw episode GoPro video
    from cans_shelf_placement.zip (GX010114.mp4): 655 frames / 10.928s = 59.94 fps,
    matching the GoPro Hero-10''s standard capture rate and identical to sibling umi_datasets.yaml''s
    fps=59.94. The companion third-person RealSense clip for the same episode reports
    60.0 fps (640x480, same frame count/duration) -- functionally the same rate, a
    minor codec-declared rounding difference.'
  fps_variable: 'Newly filled: false. Both probed camera streams (wrist GoPro and
    third-person RealSense) report a constant nominal fps across their full clip;
    no adaptive/variable frame-rate behavior is described in the paper or observed
    in the probed sample.'
  num_camera_views: 'arXiv:2509.18757 Sec IV-1: GoPro Hero-10 (wrist) + Intel RealSense
    D455 (third-person). Directly confirmed: the released zarr stores contain exactly
    two per-frame image arrays, camera0_rgb and camera1_rgb. Confirmed unchanged.'
  camera_views: 'Same Sec IV-1 citation: one wrist-mounted GoPro (egocentric) + one
    third-person RealSense D455, directly confirmed by the camera0_rgb/camera1_rgb
    zarr arrays. ''wrist'' is now an official, side-agnostic schema enum value (previously
    flagged via suggested_new_enum_values); re-confirmed unchanged and the now-stale
    suggested-enum entry removed.'
  has_synchronized_multiview_rig: 'Newly filled: false. arXiv:2509.18757 Sec III-A
    states the third-person camera placement is not formally calibrated across environments,
    and Sec III-B3 ''Time Synchronization'' describes only a soft, code-scan-based
    timestamp initialization with each egocentric frame matched to the closest-in-time
    third-person frame post-hoc (''minor frame-to-frame offsets can still occur'')
    -- not a hardware-synchronized common-clock rig.'
  has_camera_calibration: 'arXiv:2509.18757 Sec III-A: ''We do not formally calibrate
    the third-person camera placement across different environments.'' No calibration
    procedure for either camera is described anywhere else in the paper. Confirmed
    unchanged.'
  depth_coverage: 'arXiv:2509.18757 Sec III-A formally defines state as RGB image
    streams only. Directly confirmed: the released zarr data group contains no depth
    array, only camera0_rgb/camera1_rgb RGB image arrays. Confirmed unchanged.'
  additional_modalities: 'Directly confirmed: the released zarr data group contains
    only camera0_rgb, camera1_rgb, robot0_eef_pos, robot0_eef_rot_axis_angle, robot0_gripper_width,
    robot0_demo_start_pose, robot0_demo_end_pose -- no force_torque/tactile/audio/eye_gaze
    array. Confirmed unchanged (empty).'
  has_language_instruction: arXiv:2509.18757 Sec III-A's state/action schema has no
    language field; directly confirmed by the released zarr data-array key list (no
    text/instruction array present). Confirmed unchanged.
  num_task_types: arXiv:2509.18757 abstract/Fig. 5 names exactly 3 tasks (Bottles-Rack-Inserter,
    Marker-Cup-Placer, Cans-Shelf-Placer), matching the 3 task-named archives on the
    HF repo. Confirmed unchanged.
  urdf_available: 'mv-umi.github.io ''Hardware Repository'' section still states ''(coming
    soon!)''; the linked GitHub repo mv-umi/MV-UMI is empty (size=0 bytes, only a
    one-line README ''# MV-UMI'', no LICENSE/CAD/URDF files). Re-confirmed unchanged:
    false.'
  urdf_source: 'Same basis as urdf_available: no URDF currently published anywhere
    for this hardware. Re-confirmed unchanged: not_found.'
  expected_size_gb: 'HF API https://huggingface.co/api/datasets/omarrayyann/mv-umi
    field ''usedStorage'': 58604131435 bytes = 58.6 GB. Re-checked, confirmed unchanged.'
  expected_num_episodes: 'Newly filled (approximate aggregate, not an exact published
    figure): direct inspection of each released file''s internal structure via fsspec+zipfile
    HTTP range requests. bottles_rack_data.zarr.zip: meta/episode_ends array shape=(199,)
    -> 199 episodes. markers_placement_data.zarr.zip: episode_ends shape=(454,) ->
    454 episodes (markers_placement_raw_data.zarr.zip is an alternate unprocessed
    representation of the same underlying task and independently shows 453 -- not
    summed, since it is the same demonstrations, not additional ones). cans_shelf_placement.zip:
    529 total .mp4/.MP4 files, minus 263 ''_third_background'' companion clips, minus
    3 utility videos (background_segment.mp4, mapping.mp4, gripper_calibration.mp4)
    = 263 raw GoPro episode videos. Total = 199 + 454 + 263 = 916.'
  expected_duration_hours: 'Newly filled (approximate): bottles_rack_data.zarr.zip
    camera0_rgb shape (164614, ...) / 59.94 fps = 0.76h; markers_placement_data.zarr.zip
    camera0_rgb shape (185589, ...) / 59.94 fps = 0.86h; cans_shelf_placement estimated
    from 2 sampled raw episode videos (~10.92s avg duration) x 263 episodes = ~0.80h.
    Total ~2.4 hours; the cans figure extrapolates from a 2-video sample (of 263),
    not an exact per-episode duration census, so this total is an approximation.'
  num_subjects: 'Left blank: the number of human operators/demonstrators is not stated
    anywhere in arXiv:2509.18757, the HF dataset card, or the project page.'
  num_scenes: 'Left blank: no explicit total scene/environment count is given. arXiv:2509.18757
    Fig. 3 caption says only ''Portion of environments used with MV-UMI'' (implying
    more exist than shown); the project page''s ''in-the-wild'' demo video slider
    tags 6 illustrative scene labels (outdoors, kitchen, c3, b2, bottles, cans) but
    these are example clips for a website widget, not a stated total scene count for
    the full dataset.'
  num_objects: 'Left blank: no explicit object-category count is stated anywhere (unlike
    e.g. FastUMI''s stated ''19 object categories''); the 3 task names imply object
    types (bottles, markers/cups, cans) but no numeric tally is given.'
  dof_per_hand: 'Left blank: MV-UMI''s end effector is the custom three-jaw mechanical
    gripper (see gripper_type), not a dexterous multi-finger hand; the dof_per_hand
    concept does not cleanly apply here, consistent with the same decision made for
    other gripper-based UMI-family datasets in this pipeline (e.g. fastumi.yaml).'
  hand_pose_representation: 'Left blank: no MANO/3D-keypoint/joint-angle hand-pose
    tracking is used anywhere in this dataset; the gripper''s single actuation parameter
    (gripping width) is measured via ArUco markers (Sec III-B4), not a hand-pose representation.
    Consistent with fastumi.yaml''s precedent of leaving this blank for gripper-only
    (non-dexterous-hand) datasets.'
suggested_new_enum_values: {}
