id: robotwin
name: RoboTwin
source_url: https://huggingface.co/datasets/TianxingChen/RoboTwin2.0/tree/main/dataset
license: MIT
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: simulation
secondary_collection_methods: []
embodiment_class: dual_arm
robot_platform: agilex_aloha
num_arms: 2
dof_per_arm: 6
gripper_type: parallel_jaw
has_mobile_base: false
action_space: mixed
action_frame: absolute
rotation_representation: quaternion
num_camera_views: 3
camera_views:
- head
- left_wrist
- right_wrist
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: true
num_task_types: 50
urdf_available: true
urdf_source: dataset_repo
expected_size_gb: 1360.0
expected_num_episodes: 100000
review_status: pending_human_review
field_sources:
  source_url: 'https://huggingface.co/datasets/TianxingChen/RoboTwin2.0/tree/main/dataset
    - the stub''s ''TianxingChen/RoboTwin2.0 at main'' was a pasted Hugging Face dataset
    page title (not GitHub); code repo mirror is https://github.com/RoboTwin-Platform/RoboTwin
    (paper: https://arxiv.org/abs/2506.18088)'
  license: 'https://github.com/RoboTwin-Platform/RoboTwin (repo license = MIT, and
    README.md ''License'' section: ''This repository is released under the MIT license'');
    https://huggingface.co/datasets/TianxingChen/RoboTwin2.0 lists ''License: mit'''
  raw_format: 'https://robotwin-platform.github.io/doc/usage/configurations.html:
    ''An episode''s data will be stored in one HDF5 file''; confirmed in https://robotwin-platform.github.io/doc/usage/collect-data.html'
  collection_method: 'arXiv:2506.18088 abstract/title: ''RoboTwin 2.0, a scalable
    simulation framework'' generating expert trajectories entirely via simulated dual-arm
    data synthesis (no teleoperation)'
  embodiment_class: arXiv:2506.18088 title ('Robust Bimanual Robotic Manipulation')
    and Figure 5 'Five RoboTwin 2.0 Embodiments' (all dual-arm task setups)
  robot_platform: 'README.md minimal config example uses embodiment: [aloha-agilex];
    arXiv:2506.18088 Table 5/Section 4.5 benchmark: ''Evaluations are conducted on
    all 50 benchmark tasks using the Aloha AgileX dual-arm embodiment.'' This is the
    flagship/default of 5 supported platforms (see suggested_new_enum_values for the
    others).'
  num_arms: arXiv:2506.18088 title/abstract (bimanual = 2 arms); Table 2 shows all
    5 embodiments (Aloha-AgileX, Piper, Franka, UR5, ARX-X5) benchmarked as dual-arm
    pairs on the same 50 tasks
  dof_per_arm: 'arXiv:2506.18088 Section 4.2: ''lower-DoF platforms such as Aloha-AgileX,
    Piper, and ARX-X5 (6-DoF)'' vs ''high-DoF arms such as Franka and UR5 (7-DoF)'';
    value given here (6) is for the default Aloha-AgileX embodiment'
  gripper_type: 'arXiv:2506.18088 Appendix E: ''multiple gripper types, including
    the Panda gripper and WSG gripper'' (both parallel-jaw grippers); Figure 6 grasp
    illustrations'
  has_mobile_base: arXiv:2506.18088 Figure 5/6 and task descriptions show all 5 embodiments
    as stationary tabletop dual-arm rigs; no mobile base is described anywhere in
    the paper or docs
  action_space: 'https://robotwin-platform.github.io/doc/usage/control-robot.html:
    take_action supports both ''qpos'' (joint position) mode and ''ee'' (end-effector
    pose) mode, and the collected data_type fields (endpose + qpos) in configurations.html
    save both simultaneously'
  action_frame: 'https://robotwin-platform.github.io/doc/usage/configurations.html
    and control-robot.html: qpos = absolute joint angles, endpose = ''end-effector
    pose in the world coordinate frame'' (absolute, not delta)'
  rotation_representation: 'https://robotwin-platform.github.io/doc/usage/configurations.html:
    endpose is ''a list of 7 elements ... following the order x, y, z, qw, qx, qy,
    qz'''
  num_camera_views: 'GitHub raw envs/_base_task.py: self.robot.left_camera / right_camera
    (wrist) plus head_camera; task_config/demo_clean.yml camera section (head_camera_type,
    wrist_camera_type, collect_head_camera, collect_wrist_camera)'
  camera_views: GitHub raw envs/_base_task.py (left_camera, right_camera, head_camera
    attributes) and task_config/demo_clean.yml
  has_camera_calibration: Simulation environment (SAPIEN) - camera intrinsics/extrinsics
    for head/wrist cameras are exactly defined in task_config/_camera_config.yml (fovy,
    resolution) rather than estimated
  depth_coverage: 'https://raw.githubusercontent.com/RoboTwin-Platform/RoboTwin/main/task_config/demo_clean.yml:
    data_type.depth: false (default collection config does not save depth maps)'
  has_language_instruction: README.md ('language_num' config field, 'Trajectory-Level
    Diverse Language Instructions'); arXiv:2506.18088 Section 2.2 describes MLLM-generated
    diverse per-trajectory language instructions
  num_task_types: 'arXiv:2506.18088 abstract/Section 3.2: ''a collection of over 100,000
    expert trajectories spanning 50 tasks''; https://robotwin-platform.github.io/doc/tasks/index.html
    lists the 50 tasks'
  urdf_available: README.md Install & Download step 4 (bash script/_download_assets.sh
    downloads assets/embodiments/<name>/config.yml + meshes for simulation); task_config/_embodiment_config.yml
    lists file_path per embodiment
  urdf_source: Same as urdf_available - embodiment URDF/mesh assets are bundled/distributed
    as part of the RoboTwin project's own asset release (assets/embodiments/), not
    a third-party manufacturer file
  expected_size_gb: https://huggingface.co/datasets/TianxingChen/RoboTwin2.0/tree/main/dataset
    - dataset folder listed as '1.36 TB'
  expected_num_episodes: 'arXiv:2506.18088 abstract/Section 3.2: ''a collection of
    over 100,000 expert trajectories spanning 50 tasks across five dual-arm robot
    platforms'''
suggested_new_enum_values:
  robot_platform: agilex_piper - RoboTwin 2.0's fifth supported embodiment is the
    AgileX Piper, a 6-DoF single arm deployed as a mirrored left/right pair for bimanual
    tasks (arXiv:2506.18088 Fig.5, Table 2). No existing robot_platform enum value
    corresponds to 'Piper'; the dataset overall is multi-embodiment (Aloha-AgileX,
    ARX-X5, Franka-Panda, UR5-WSG, Piper), which the current single-value robot_platform
    field cannot fully capture.
