id: dexcap
name: DexCap
source_url: https://huggingface.co/datasets/chenwangj/DexCap-Data
license: CC-BY-4.0
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: human_to_robot_synthesis
secondary_collection_methods: []
embodiment_class: human_hand
robot_platform: franka_panda
num_arms: 2
dof_per_arm: 7
gripper_type: dexterous_hand
has_mobile_base: false
action_space: mixed
action_frame: absolute
rotation_representation: rotation_matrix
fps: 20.0
fps_variable: true
num_camera_views: 1
camera_views:
- body_worn
has_camera_calibration: true
depth_coverage: full
additional_modalities: []
has_language_instruction: false
num_task_types: 2
urdf_available: true
urdf_source: dataset_repo
expected_size_gb: 107.83
expected_num_episodes: 34
review_status: pending_human_review
field_sources:
  license: 'HF dataset card / API tags: license:cc-by-4.0 (https://huggingface.co/datasets/chenwangj/DexCap-Data,
    https://huggingface.co/api/datasets/chenwangj/DexCap-Data)'
  raw_format: HF README 'Both raw data (.zip) and postprocessed data (.hdf5) are provided';
    GitHub repo README 'Building Training Dataset' step generates a robomimic-format
    .hdf5 file used for training (https://github.com/j96w/DexCap)
  collection_method: 'arXiv 2403.07788 abstract and Sec.4: DexCap captures human hand/wrist
    mocap data (SLAM + EMF gloves), and DexIL retargets it to robot actions via inverse
    kinematics (''Human to Robot'' section on https://dex-cap.github.io/); no direct
    teleoperation of the robot is used to collect the released data'
  embodiment_class: HF README raw data structure records human wrist 6-DoF poses (pose_2.txt/pose_3.txt)
    and finger joint positions (left_hand_joint.txt/right_hand_joint.txt) captured
    on a human via mocap glove, not robot joint states
  robot_platform: 'arXiv 2403.07788 Sec.3: ''a bimanual dexterous robot setup. This
    setup comprises two Franka Emika robot arms, each equipped with a LEAP dexterous
    robotic hand'' (exact Franka model variant, e.g. Panda vs FR3, not stated; FRANKA_PANDA
    used as closest enum match)'
  num_arms: 'arXiv 2403.07788 Sec.3: bimanual setup with two Franka Emika robot arms;
    website ''Bimanual Manipulation Task'' section (https://dex-cap.github.io/)'
  dof_per_arm: 'arXiv 2403.07788 Sec.4: ''the action output includes two 7-DoF robot
    arms and two 16-DoF dexterous hands'''
  gripper_type: 'arXiv 2403.07788 Sec.3: ''a LEAP dexterous robotic hand (a four-fingered
    hand with 16 joints)''; GitHub repo STEP2_build_dataset/leap_hand_mesh/ contains
    LEAP hand URDF and mesh files used for IK retargeting'
  has_mobile_base: No mobile base described anywhere in the paper, website, or GitHub
    repo; setup is a fixed tabletop dual-arm Franka rig (arXiv 2403.07788 Sec.3, https://dex-cap.github.io/)
  action_space: 'arXiv 2403.07788 Sec.4: ''the learned policy generates the goal position
    for the next step, which encompasses the 6-DoF pose of the end-effector for both
    robot arms and a 16-dimensional finger joint position for both hands'' (EEF pose
    + joint position = mixed)'
  action_frame: 'arXiv 2403.07788 Sec.4: policy ''generates the goal position for
    the next step'' (absolute goal, not a delta); the optional human-in-the-loop ''residual
    correction'' delta mode is a separate fine-tuning-only mechanism, not the primary
    released action representation'
  rotation_representation: 'arXiv 2403.07788 Sec.4: wrist pose defined as p_t = [R_t
    | T_t], i.e. rotation matrix R_t plus translation T_t'
  fps: 'arXiv 2403.07788 Sec.5: ''Data were initially recorded at 60Hz and then downsampled
    to 20Hz to match the robot''s control speed'''
  fps_variable: 'arXiv 2403.07788 Sec.3: system ''supports a 15-minute collection
    at peak frame rate (60 fps). Once the RAM is full, data capture slows to 20 fps
    due to storage shifting to the SSD'''
  num_camera_views: 'arXiv 2403.07788 Sec.3: hardware has one chest-mounted RGB-D
    LiDAR camera providing the RGB-D/point-cloud observation stream; the other three
    T265 cameras are used only for SLAM-based 6-DoF pose tracking, not published as
    separate observation image streams (HF README raw structure only lists one color_image.jpg/depth_image.png
    pair per frame)'
  camera_views: Same as num_camera_views source; classified as third_person since
    the rack is mounted externally to the manipulation scene (closest available enum
    option to the chest-mounted rig described in arXiv 2403.07788 Sec.3 / https://dex-cap.github.io/)
  has_camera_calibration: GitHub repo includes STEP1_collect_data/default_offset/calib_offset.txt
    and calculate_offset_vis_calib.py for camera/SLAM drift calibration; arXiv 2403.07788
    Sec.3 describes the initial known-pose calibration step for the chest camera rack
  depth_coverage: 'HF README raw data structure: every frame includes depth_image.png
    from the chest-mounted RGB-D camera'
  has_language_instruction: No language instruction annotations mentioned in the HF
    dataset card, GitHub repo, or paper; raw/hdf5 structure only contains images,
    poses, and joint data for robomimic-style imitation learning
  num_task_types: 'HF dataset card: ''30 minutes of mocap data for the wiping task
    and 60 minutes of in-the-wild mocap data for the packaging task'' (2 released
    task types; the paper separately evaluates 6 tasks in total, but only 2 are included
    in this public dataset release)'
  urdf_available: GitHub repo (https://github.com/j96w/DexCap) STEP2_build_dataset/leap_hand_mesh/
    contains robot.urdf, robot_pybullet.urdf, robot_left.urdf, robot_left_pybullet.urdf
    plus matching .stl meshes for the LEAP hand, used for PyBullet IK retargeting
  urdf_source: Same GitHub repository linked from the HF dataset card as the official
    'Repository'
  expected_size_gb: 'HF Datasets API https://huggingface.co/api/datasets/chenwangj/DexCap-Data
    field ''usedStorage'': 107829983730 bytes (~107.83 GB)'
  expected_num_episodes: 'Inferred from HF repo file names: rawdata_wipe_1-14.zip
    / hand_wiping_1-14_5actiongap_10000points.hdf5 (episodes 1-14, 14 episodes) and
    rawdata_packaging_wild_1-20.zip / hand_packaging_wild_1-20_5actiongap_10000points.hdf5
    (episodes 1-20, 20 episodes); total 14+20=34'
suggested_new_enum_values:
  camera_views: Propose adding a 'chest_mounted' (or 'body_worn') CameraView value.
    DexCap's primary observation camera is worn on the data collector's chest/torso
    rack (moving with the human during capture, then affixed to a stationary rack
    near the robot for deployment) — this egocentric-but-not-head-mounted position
    doesn't cleanly match 'third_person' (implies a static external observer view),
    'head', or 'front' (implies a fixed scene-relative mount). A dedicated 'chest_mounted'
    value would better describe DexCap and similar body-worn mocap/UMI-style rigs.
