  embodiment_class: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712 sec 3.1/3.2:
    dataset records human participants'' hands assembling/disassembling toys; 18M
    3D hand pose annotations; no robot embodiment'
  num_arms: 'RE-VERIFIED 2026-07-10, unchanged: arXiv:2203.14712 sec 1.2/3.2: 53 adult
    participants use both hands (bimanual) to assemble/disassemble toys; hand pose
    annotations cover both hands (21 3D keypoints per hand x 2 hands)'
  gripper_type: 'RE-VERIFIED 2026-07-10, unchanged: no robot gripper; task performed
    with bare human hands per arXiv:2203.14712 and project page abstract'
  hand_pose_representation: 'arXiv:2203.14712 sec 2.2/2.3 (hand pose pipeline): after
    egocentric tracking with a modified MegATrack model the paper states verbatim
    ''we extract the 3D keypoint locations (21 per hand) in world coordinates as our
    pose representation'' - the released annotation format is 3D keypoints, not MANO
    parameters or raw joint angles (joint angles are only an internal intermediate
    step of the tracker, not the distributed representation), so mapped to keypoints_3d.'
  has_mobile_base: 'RE-VERIFIED 2026-07-10, unchanged: recording rig is a fixed desk-based
