id: language_table
name: Language Table
source_url: https://console.cloud.google.com/storage/browser/gresearch/robotics/language_table/0.0.1;tab=objects?prefix=&forceOnObjectsSortingFiltering=false
license: Apache-2.0
raw_format: RLDS
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: single_arm
robot_platform: other
num_arms: 1
dof_per_arm: 6
gripper_type: none
has_mobile_base: false
action_space: eef_pose
action_frame: delta
rotation_representation: none
state_dim: 2
action_dim: 2
fps: 5.0
fps_variable: false
num_camera_views: 1
camera_views:
- third_person
has_camera_calibration: false
depth_coverage: none
additional_modalities: []
has_language_instruction: true
urdf_available: true
urdf_source: manufacturer_official
expected_size_gb: 428.67
expected_num_episodes: 442226
review_status: pending_human_review
field_sources:
  license: https://github.com/google-research/language-table/blob/main/LICENSE (Apache
    License 2.0)
  raw_format: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/dataset_info.json
    (fileFormat=tfrecord) and https://github.com/google-deepmind/open_x_embodiment
    (RLDS episode format)
  collection_method: paper arxiv.org/abs/2210.06407 sec III.A 'Real-World Data Collection'
    (10 teleoperators, 2.7k hours of teleoperation, hindsight relabeling)
  embodiment_class: 'paper arxiv.org/abs/2210.06407 Appendix A: single UFACTORY xArm6
    arm'
  robot_platform: 'paper arxiv.org/abs/2210.06407 Appendix A: ''Our real-world experiments
    use UFACTORY xArm6 robot arms'' (no exact enum match, see suggested_new_enum_values)'
  num_arms: paper arxiv.org/abs/2210.06407 Appendix A (single xArm6 arm setup)
  dof_per_arm: 'paper arxiv.org/abs/2210.06407 Appendix A: ''UFACTORY xArm6'' and
    main text ''a 6DOF robot ... constrained to move in a 2D plane'''
  gripper_type: 'paper arxiv.org/abs/2210.06407 Appendix A: ''end-effector is made
    from a 6 inch long plastic PVC pipe'' (fixed pusher, not a gripper)'
  has_mobile_base: 'paper arxiv.org/abs/2210.06407 Appendix A / homepage interactive-language.github.io:
    fixed tabletop arm setup'
  action_space: 'https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action field description: ''An action representing a 2D delta cartesian setpoint
    for the robot.'''
  action_frame: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action field description (delta cartesian setpoint)
  rotation_representation: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (action/observation only contain 2D translation fields, no rotation component)
  state_dim: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    observation.effector_translation shape (2,)
  action_dim: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    action tensor shape (2,)
  fps: 'paper arxiv.org/abs/2210.06407 Appendix A: ''we downsample the collected training
    and inference data to 5hz observations and actions'''
  fps_variable: 'paper arxiv.org/abs/2210.06407 Appendix A: pseudo-synchronous 5hz
    observation/action pairs derived from async 30Hz camera + 100Hz robot state logs,
    nominal fixed target rate'
  num_camera_views: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (single 'rgb' observation field) and paper Appendix A ('single-camera RGB-only
    images')
  camera_views: 'paper arxiv.org/abs/2210.06407 main text: ''third person view (line-of-sight
    in real)'''
  has_camera_calibration: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (no intrinsics/extrinsics fields present in observation schema)
  depth_coverage: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    (only 'rgb' image field, no depth field) and paper Appendix A ('RGB-only images')
  has_language_instruction: 'https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/features.json
    ''instruction'' field; README.md google-research/language-table (''language-labeled
    by: human'')'
  urdf_available: https://github.com/xArm-Developer/xarm_ros (UFACTORY's official
    GitHub org publishing ROS packages incl. URDF for xArm6/xArm7)
  urdf_source: https://github.com/xArm-Developer/xarm_ros - org page title 'UFACTORY',
    i.e. manufacturer's own GitHub account
  expected_size_gb: https://storage.googleapis.com/gresearch/robotics/language_table/0.0.1/dataset_info.json
    train split numBytes=428665067806 (~428.7 GB decimal)
  expected_num_episodes: 'https://raw.githubusercontent.com/google-research/language-table/main/README.md
    (''language_table: 442,226 episodes of real robot relabeled data'') confirmed
    by dataset_info.json shardLengths sum = 442226'
suggested_new_enum_values:
  robot_platform: xarm6 - the real-world data was collected with a UFACTORY xArm6
    (6-DOF arm), a different physical robot from the existing 'xarm7' enum value (7-DOF);
    using 'xarm7' would misstate the robot's DOF, so 'other' was used instead pending
    this addition.
