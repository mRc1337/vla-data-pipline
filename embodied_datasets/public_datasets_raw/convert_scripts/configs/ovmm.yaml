id: ovmm
name: OVMM
source_url: https://ovmm.github.io/
paper_url: https://arxiv.org/abs/2306.11565
license: CC-BY-NC-4.0
raw_format: Custom
release_type: rl_benchmark_env
collection_method: simulation
secondary_collection_methods:
- scene_asset_curation
- autonomous_policy
is_multi_embodiment: false
embodiment_class: mobile_manipulator
robot_platform: hello_robot_stretch
num_arms: 1
dof_per_arm: 6
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: true
action_space: mixed
action_frame: delta
rotation_representation: euler_xyz
num_camera_views: 1
camera_views:
- head
has_synchronized_multiview_rig: false
depth_coverage: full
additional_modalities: []
has_language_instruction: false
num_task_types: 1
urdf_available: true
urdf_source: dataset_repo
num_scenes: 60
num_objects: 2535
review_status: pending_human_review
field_sources:
  paper_url: 'arXiv abstract page https://arxiv.org/abs/2306.11565 (HomeRobot: Open-Vocabulary
    Mobile Manipulation)'
  license: HSSD scene dataset (used for all OVMM sim scenes) is licensed CC-BY-NC-4.0
    per https://huggingface.co/datasets/hssd/hssd-hab README/cardData; note the HomeRobot
    *code* repo (facebookresearch/home-robot) is separately MIT-licensed per its LICENSE
    file, but the dataset assets inherit HSSD's CC-BY-NC-4.0.
  raw_format: HF dataset ai-habitat/OVMM_episodes stores episodes as train/val/minival
    *.json.gz plus transformations.npy/viewpoints.npy; ai-habitat/OVMM_objects stores
    .glb meshes, csv metadata, and a pickle of CLIP embeddings -- none of the schema's
    named formats (RLDS/HDF5/LeRobot/ROS_bag/MCAP/TFRecord/VRS) match, so classified
    as Custom.
  release_type: 'arXiv paper: benchmark provides RL + heuristic baselines trained/evaluated
    via an EvalAI challenge (CVPR 2024 HomeRobot OVMM Challenge), i.e. an RL benchmark
    environment rather than a fixed static episode dump.'
  collection_method: 'arXiv paper Sec 3.1/App D: sim episodes are procedurally generated
    in the AI Habitat simulator over HSSD scenes (episode generation places objects/receptacles
    programmatically, not via teleoperated demonstrations).'
  secondary_collection_methods: 'arXiv paper: object/receptacle set is aggregated
    and manually curated/annotated from AI2-THOR, Amazon-Berkeley Objects, Google
    Scanned Objects and HSSD (scene_asset_curation); real-world and sim baselines
    are evaluated by running heuristic/RL autonomous policies in the loop rather than
    human teleop (autonomous_policy).'
  is_multi_embodiment: Only one physical embodiment (Hello Robot Stretch with DexWrist)
    is used for both the real-world stack and as the basis for the simulated agent's
    action/observation space in the paper; home-robot repo's minimal Spot support
    is a separate example package, not part of the OVMM benchmark itself.
  embodiment_class: 'arXiv paper: Hello Robot Stretch is a wheeled mobile base with
    a single telescoping arm -- fits mobile_manipulator.'
  robot_platform: arXiv paper Sec 3.2 ('We use the Hello Robot Stretch [22] with DexWrist...');
    Hello Robot Stretch is not present in the RobotPlatform enum, so set to other
    (see suggested_new_enum_values).
  num_arms: 'arXiv paper: Stretch has a single telescoping arm.'
  dof_per_arm: 'arXiv paper Sec 3.2, direct quote: Stretch with DexWrist ''...offers
    6 DoF manipulation''.'
  gripper_type: 'arXiv paper App D/E: heuristic grasping policy ''assumes a parallel
    gripper performing top-down grasps''.'
  hand_pose_representation: No dexterous hand; Stretch uses a simple parallel-jaw
    gripper, so hand_pose_representation is not applicable.
  has_mobile_base: 'arXiv paper: Stretch is a wheeled mobile manipulator; actions
    include base translation/rotation waypoints.'
  action_space: 'arXiv paper App D.6/E.3: actions are ''base translation and rotation
    waypoints, all arm joints (arm extension, arm lift, gripper yaw, pitch, and roll)''
    -- a mix of base pose and arm joint-position commands, so classified as mixed.'
  action_frame: 'arXiv paper App F: per-step action magnitudes are explicitly bounded
    increments (e.g. ''arm''s extension and lift can be changed by at most 2-10cm
    in a single step'', head/gripper joints by 0.02-0.1 rad, base by 10-25cm or 5-30
    degrees), i.e. delta/incremental actions.'
  rotation_representation: 'arXiv paper: wrist/gripper orientation is commanded via
    separate yaw/pitch/roll joint values, i.e. an Euler-angle-style decomposition.'
  num_camera_views: 'arXiv paper App F.2/F.3: observations consistently reference
    a single ''robot head camera'' (RGB-D + semantic segmentation); no wrist or other
    camera is described.'
  camera_views: Same as num_camera_views -- only the head-mounted RGB-D camera is
    described in the paper.
  has_synchronized_multiview_rig: Only a single camera view is used, so there is no
    multiview rig.
  depth_coverage: 'arXiv paper: depth from the head camera is used throughout for
    perception/mapping (e.g. ''Robot head camera depth...'').'
  has_language_instruction: 'arXiv paper Sec 6 (Discussion/Limitations), direct quote:
    ''We also currently consider full natural language queries out-of-scope.'' Task
    goals are specified via structured object_category/start_recep_category/goal_recep_category
    fields (see HF README for ai-habitat/OVMM_episodes), not free-form language instructions.'
  num_task_types: 'arXiv paper: single task template of the form ''move the <object>
    from the <start_receptacle> to the <goal_receptacle>'' (Open-Vocabulary Mobile
    Manipulation / pick-and-place rearrangement).'
  urdf_available: home-robot GitHub repo ships assets/hab_stretch/urdf/hab_stretch.urdf
    (verified reachable at raw.githubusercontent.com/facebookresearch/home-robot/main/assets/hab_stretch/urdf/hab_stretch.urdf).
  urdf_source: URDF is bundled directly in the facebookresearch/home-robot repo (assets/hab_stretch/urdf/),
    which backs this dataset/benchmark.
  num_scenes: 'arXiv paper App D.1, direct quote: ''these are divided into train,
    validation, and test splits of 38, 12, and 10 scenes each'' = 60 total HSSD scenes
    used for the OVMM sim benchmark; corroborated by ai-habitat/OVMM_episodes HF repo
    file listing (38 train/content/*.json.gz scene files plus combined val/minival
    episode files).'
  num_objects: 'arXiv paper App D.1, direct quote: ''In total, we annotated 2,535
    objects from 129 total categories'' (plus 21 separate receptacle categories, consistent
    with Table 1''s ''150 Cats'' = 129 object + 21 receptacle categories).'
suggested_new_enum_values:
  robot_platform: hello_robot_stretch -- Hello Robot Stretch (with DexWrist) is the
    real-world mobile-manipulator platform used by OVMM/HomeRobot and by several other
    Stretch-based datasets; not currently in the RobotPlatform enum, so this config
    falls back to 'other'.
