id: humanoid_x
name: Humanoid-X
source_url: https://huggingface.co/datasets/USC-PSI-Lab/Humanoid-X
paper_url: https://arxiv.org/abs/2412.14172
license: Unknown
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: human_to_robot_synthesis
secondary_collection_methods:
- simulation
is_multi_embodiment: false
embodiment_class: humanoid
robot_platform: unitree_h1_2
num_arms: 2
dof_per_arm: 7
gripper_type: none
hand_pose_representation: none
has_mobile_base: false
action_space: joint_position
action_frame: delta
rotation_representation: quaternion
action_dim: 27
num_camera_views: 0
camera_views: []
has_synchronized_multiview_rig: false
has_camera_calibration: false
depth_coverage: none
additional_modalities: []
has_language_instruction: true
urdf_available: true
urdf_source: manufacturer_official
expected_size_gb: 41.26
expected_num_episodes: 176674
review_status: pending_human_review
field_sources:
  paper_url: arXiv:2412.14172 abstract page (Mao et al., 'Learning from Massive Human
    Videos for Universal Humanoid Pose Control')
  license: 'No explicit license tag on HF dataset card (only ''task_categories: robotics'');
    dataset README (huggingface.co/datasets/USC-PSI-Lab/Humanoid-X) states original
    Internet videos are withheld ''to protect copyright'' and human-pose subsets are
    partially withheld ''due to license issues'' -> licensing status is unresolved/mixed,
    mapped to Unknown rather than guessed.'
  raw_format: HF repo file listing (texts.zip, humanoid_keypoint.zip, humanoid_action.zip,
    human_pose.zip, train/val/test .txt splits) is a custom zip/txt layout, not RLDS/HDF5/LeRobot/etc.
  release_type: Dataset ships a fixed, pre-split set of 176,674 motion-sample IDs
    (train.txt+val.txt+test.txt line counts verified via direct curl+wc -l on huggingface.co/datasets/USC-PSI-Lab/Humanoid-X
    resolve URLs), not a generation framework/scene platform/RL-env.
  collection_method: 'Paper abstract (arXiv:2412.14172) describes pipeline: mine Internet
    human videos -> caption -> retarget human motion to humanoid robot -> RL policy
    for real-world deployment. This is human video -> robot motion synthesis, not
    teleop or scripted autonomy. Confirms task hint of human_to_robot_synthesis.'
  secondary_collection_methods: Paper abstract pipeline step iv ('we employ reinforcement
    learning to generate physically deployable humanoid actions') and GitHub sihengz02/UH-1
    legged_gym/ (Isaac Gym RL training, h1_2_mimic task) show the released humanoid_action.zip
    data is produced via RL in simulation on top of the retargeted keypoints, hence
    simulation as a secondary method.
  is_multi_embodiment: 'github.com/sihengz02/UH-1 legged_gym/legged_gym/envs/ contains
    only a base/ and h1_2/ robot config (no other robot folders); the released RL-generated
    actions and mimic policy target only Unitree H1_2. (Note: a separate helper repo,
    song-siqi/retarget2humanoid, mentions generic retargeting support for Unitree
    G1, but that is not part of the Humanoid-X released data/pipeline itself.)'
  embodiment_class: 'Per task instructions and paper: source data is human video/pose,
    retargeted onto a bipedal humanoid robot (Unitree H1_2); released keypoint/action
    data represents robot embodiment, so humanoid (not human_hand).'
  robot_platform: github.com/sihengz02/UH-1 legged_gym/legged_gym/envs/h1_2/ (h1_2_mimic.py,
    h1_2_legged_robot_config.py) and README's 'python play.py ... --task h1_2_mimic'
    show target robot is Unitree H1_2. Enum has no h1_2-specific value; mapped to
    closest existing value unitree_h1 (see suggested_new_enum_values).
  num_arms: 'Confirmed by official Unitree H1_2 URDF (github.com/unitreerobotics/unitree_rl_gym
    resources/robots/h1_2/h1_2.urdf): left_*/right_* shoulder/elbow/wrist joint sets
    -> 2 arms.'
  dof_per_arm: Official Unitree H1_2 URDF (unitreerobotics/unitree_rl_gym, h1_2.urdf)
    lists 7 revolute joints per arm (shoulder pitch/roll/yaw, elbow pitch/roll, wrist
    pitch/yaw = 7); combined with 12 leg + 1 torso DOF this sums to 27, matching num_actions=27
    in UH-1's h1_2_mimic_config.py exactly (body-only, no hand joints).
  gripper_type: UH-1's h1_2_mimic_config.py sets num_actions/num_policy_actions=27,
    matching the 27 body-only DOF (12 leg + 1 torso + 14 arm) of the official H1_2
    URDF with no finger/hand joints included -> no gripper/hand actuation in the released
    action space.
  hand_pose_representation: 'Same as gripper_type: released keypoint (34-dim = 27
    DoF joint pose + 3 root pos + 4 root quat, per github.com/sihengz02/UH-1 README
    inference section) and action (27-dim) data contain no finger/hand pose channels.'
  has_mobile_base: Unitree H1_2 is a bipedal legged humanoid (legs+torso+arms per
    official URDF), not a wheeled/tracked mobile base.
  action_space: 'github.com/sihengz02/UH-1 legged_gym/legged_gym/envs/h1_2/h1_2_legged_robot_config.py:
    ''class control: control_type = "P" # P: position, V: velocity, T: torques'' ->
    policy outputs joint position targets for a PD controller.'
  action_frame: 'h1_2_legged_robot.py _compute_torques(): ''torques = p_gains*(actions_scaled
    + default_dof_pos_all - dof_pos) - ...'' i.e. action is a delta added to the default/nominal
    joint pose, not an absolute target.'
  rotation_representation: 'github.com/sihengz02/UH-1 top-level README inference section:
    generated keypoint is ''[num_frames, 34-dim]'' where ''34-dim = 27-dim DoFs +
    3-dim root position + 4-dim root orientation''; a 4-dim orientation is a quaternion.'
  action_dim: 'UH-1 h1_2_mimic_config.py: num_actions = num_policy_actions = 27 (body-only
    DOF, matches official H1_2 URDF joint count of 12 leg + 1 torso + 14 arm).'
  num_camera_views/camera_views/has_synchronized_multiview_rig/has_camera_calibration: HF
    README explicitly states original Internet source videos are NOT released ('We
    will not release the original Internet videos to protect copyright'); source videos
    were ordinary single monocular Internet clips (per arXiv abstract 'data mining
    from the Internet'), not a synchronized/calibrated multi-camera rig, and no camera
    imagery ships in the released dataset at all.
  depth_coverage: 3D human pose is estimated from monocular RGB Internet video (paper
    pipeline step ii / README-Humanoid-X.md '3D Human Pose Estimation' referencing
    VIBE/4D-Humans, both monocular-RGB methods); no depth sensor data involved.
  has_language_instruction: 'HF dataset card + README: ''we fully release the text
    description data texts.zip''; paper: dataset is pairs of <video, Text, human pose,
    robot pose, robot action> with text-based motion descriptions used to train UH-1
    (text -> action).'
  urdf_available/urdf_source: Unitree officially publishes the H1_2 URDF at github.com/unitreerobotics/unitree_rl_gym
    (resources/robots/h1_2/h1_2.urdf), an official Unitree Robotics GitHub org repo.
  expected_size_gb: 'HF Hub API (api/datasets/USC-PSI-Lab/Humanoid-X) field ''usedStorage'':
    41262884599 bytes ~= 41.26 GB (decimal).'
  expected_num_episodes: 'Direct line count of train.txt (141341) + val.txt (8827)
    + test.txt (26506) = all.txt (176674), fetched via curl+wc -l from huggingface.co/datasets/USC-PSI-Lab/Humanoid-X
    resolve/main/. Note: the project homepage (usc-gvl.github.io/UH-1, now redirecting
    to physical-superintelligence-lab.github.io/UH-1) states the dataset ''consists
    of 163,800 pairs of motion samples'', which does not match the directly counted
    file totals; the counted value (176,674) was preferred as it is independently
    verifiable from the actual released split files rather than a possibly-stale project-page
    figure.'
suggested_new_enum_values:
  robot_platform: 'unitree_h1_2 — Humanoid-X/UH-1 specifically targets the Unitree
    H1_2 variant (27 body DOF: 12 leg + 1 torso + 14 arm per official unitreerobotics/unitree_rl_gym
    h1_2.urdf), which is materially different from the base Unitree H1 (19 DOF per
    unitreerobotics/unitree_ros h1_description). The current enum only offers the
    generic ''unitree_h1'', losing this distinction; recommend adding a separate ''unitree_h1_2''
    value.'
