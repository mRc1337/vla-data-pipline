field_sources:
  license: 'https://github.com/mees/calvin/blob/main/LICENSE: MIT License, Copyright
    (c) 2021 Oier Mees (re-verified: fetched LICENSE file directly, text confirms
    MIT). Unchanged.'
  raw_format: 'https://github.com/mees/calvin/blob/main/dataset/README.md#data-structure:
    ''Each interaction timestep is stored in a dictionary inside a numpy file'' --
    custom per-timestep .npz keys (rgb_static, rgb_gripper, rgb_tactile, actions,
    rel_actions, robot_obs, scene_obs), not RLDS/HDF5/LeRobot. Re-verified, unchanged.'
  release_type: 'https://github.com/mees/calvin/blob/main/dataset/README.md#download:
    the primary downloadable artifact is a fixed set of pre-recorded play-data zips
    (task_D_D / task_ABC_D / task_ABCD_D), i.e. a fixed episode dataset, even though
    the repo also ships an interactive calvin_env for online rollout evaluation (the
    CALVIN Challenge). Classified by the artifact actually ingested for VLA training.'
  collection_method: 'arXiv:2112.03227 sec. III-B.1: ''we collect twenty-four hours
    of teleoperated "play" data in four environments with a HTC Vive VR headset''
    -- confirmed human teleoperation via VR controller, not scripted/autonomous. Re-verified
    against full paper text, unchanged.'
  secondary_collection_methods: 'arXiv:2112.03227 sec. III-B.1 (full text search):
    no mention of any autonomous-policy, UMI, or synthesis-based data collection for
    the training play data -- only VR teleoperation by human operators. Left empty.'
  is_multi_embodiment: 'arXiv:2112.03227 sec. III-A: single Franka Emika Panda arm
    used identically across all four environments (A, B, C, D); no other robot embodiment
    appears anywhere in the paper or repo.'
  embodiment_class: 'arXiv:2112.03227 sec. III-A: single 7-DOF Franka Emika Panda
    arm on a fixed desk. Re-verified, unchanged.'
  robot_platform: 'arXiv:2112.03227 sec. III-A: ''The environments contain a 7-DOF
    Franka Emika Panda robot arm with a parallel gripper''. Re-verified, unchanged.'
  num_arms: arXiv:2112.03227 sec. III-A (single arm environment). Re-verified, unchanged.
  dof_per_arm: 'arXiv:2112.03227 sec. III-A: ''7-DOF Franka Emika Panda robot arm''.
    Re-verified, unchanged.'
  gripper_type: 'arXiv:2112.03227 sec. III-A: ''...robot arm with a parallel gripper''.
    Re-verified, unchanged.'
  has_mobile_base: 'arXiv:2112.03227 sec. III-A: arm mounted at a fixed desk, no mobile
    base described anywhere in paper or repo. Re-verified, unchanged.'
  action_space: 'https://github.com/mees/calvin/blob/main/dataset/README.md#actions:
    ''actions''/''rel_actions'' keys are TCP (end-effector) position+orientation+gripper,
    i.e. eef pose. Re-verified against live README fetch, unchanged.'
  action_frame: 'https://github.com/mees/calvin/blob/main/dataset/README.md#actions:
    dataset stores both absolute (''actions'': tcp position/orientation in absolute
    world coordinates) and relative (''rel_actions'': normalized relative tcp deltas)
    per frame -- matches schema.py ActionFrame.BOTH. Re-verified, unchanged.'
  rotation_representation: 'https://github.com/mees/calvin/blob/main/dataset/README.md#actions:
    ''tcp orientation (3): euler angles x,y,z''. Re-verified, unchanged.'
  state_dim: 'https://github.com/mees/calvin/blob/main/dataset/README.md#state-observation:
    ''robot_obs'' shape (15,) = tcp position(3)+tcp orientation(3)+gripper opening
    width(1)+arm_joint_states(7)+gripper_action(1) = 15. Re-verified against live
    README fetch, unchanged.'
  action_dim: 'https://github.com/mees/calvin/blob/main/dataset/README.md#actions:
    ''actions'' shape (7,) = tcp pos(3)+orientation(3)+gripper(1). Re-verified, unchanged.'
  fps: 'arXiv:2112.03227 sec. III-A: ''sending continuous actions to the robot at
    30hz''. Re-verified against full paper text, unchanged.'
  fps_variable: 'arXiv:2112.03227 sec. III-A: fixed 30hz control loop, no mention
    of variable rate. Re-verified, unchanged.'
  num_camera_views: 'https://github.com/mees/calvin/blob/main/dataset/README.md#camera-observations
    + arXiv:2112.03227 sec. III-A: RGB-D from a static camera and a gripper (wrist)
    camera = 2 spatial camera views; the vision-based tactile sensor (rgb_tactile/depth_tactile)
    is recorded separately and captured instead in additional_modalities. Re-verified,
    unchanged.'
  camera_views: 'arXiv:2112.03227 sec. III-A + calvin_env conf/cameras/cameras/static.yaml
    and gripper.yaml: fixed ''static'' camera mapped to third_person; wrist-mounted
    ''gripper'' camera mapped to wrist (CORRECTED from ''other'' -- schema.py now
    defines CameraView.WRIST, a generic non-handed wrist camera value, which fits
    this single-arm robot better than the previous ''other'' workaround, since it
    has no left/right arm distinction). suggested_new_enum_values entry for this is
    now resolved and removed.'
  has_synchronized_multiview_rig: 'https://github.com/mees/calvin/blob/main/dataset/README.md#data-structure
    (''Each interaction timestep is stored in a dictionary inside a numpy file and
    contains all corresponding sensory observations'') + calvin_env camera configs
    (static.yaml, gripper.yaml, tactile.yaml) define all camera extrinsics/intrinsics
    in one consistent world/robot frame. Inferred: as a PyBullet simulation, all camera
    and tactile renders for a timestep are generated from the same simulation state,
    i.e. perfectly synchronized by construction -- not verified against an explicit
    ''synchronized rig'' statement in the paper, treat as a reasoned inference rather
    than a direct citation.'
  has_camera_calibration: 'https://github.com/mees/calvin_env/blob/main/conf/cameras/cameras/static.yaml
    and gripper.yaml (fetched directly): simulator defines exact camera intrinsics
    (fov, aspect, nearval/farval, width/height) and static camera extrinsic pose (look_at/look_from/up_vector).
    Re-verified by fetching the live files, unchanged.'
  depth_coverage: 'https://github.com/mees/calvin/blob/main/dataset/README.md#camera-observations:
    depth_static, depth_gripper, and depth_tactile are all recorded for every frame
    alongside RGB. Re-verified against live README fetch, unchanged.'
  additional_modalities: 'https://github.com/mees/calvin/blob/main/dataset/README.md#camera-observations
    (''rgb_tactile'' shape (160,120,6), ''depth_tactile'' shape (160,120,2)) + arXiv:2112.03227
    sec. III-A: ''vision-based tactile sensing''. CORRECTED from empty list -- the
    dataset includes a simulated two-finger vision-based tactile sensor (calvin_env
    conf/cameras/cameras/tactile.yaml, TactileSensor on digit_link_ids) that was previously
    omitted from the schema and not captured anywhere in the config.'
  has_language_instruction: 'arXiv:2112.03227 abstract/sec. III-B.2: ''~24 hours teleoperated
    unstructured play data together with 20K language directives''. Re-verified, unchanged.'
  num_task_types: 'arXiv:2112.03227 sec. III-A.2: ''We define 34 specific tasks (see
    Fig. 4)''. Re-verified against full paper text, unchanged.'
  urdf_available: 'https://github.com/mees/calvin_env/tree/main/data/franka_panda
    (re-fetched directory listing: panda.urdf, panda_digit.urdf, panda_longer_finger.urdf,
    meshes/). Re-verified, unchanged.'
  urdf_source: https://github.com/mees/calvin_env/tree/main/data/franka_panda (URDF
    bundled directly in the dataset's own env repo). Re-verified, unchanged.
  expected_size_gb: 'https://github.com/mees/calvin/blob/main/dataset/README.md#download:
    task_D_D=166GB, task_ABC_D=517GB, task_ABCD_D=656GB (largest/full split, re-verified
    against live README fetch, unchanged).'
  expected_num_episodes: 'arXiv:2112.03227 abstract and sec. III-B.2: ''~24 hours
    teleoperated unstructured play data together with 20K language directives''; sec.
    III-B.2 also states ''we collect over 400 crowd-sourced natural language instructions
    corresponding to over 34 tasks and label episodes procedurally''. 20K used as
    proxy for number of language-annotated episodes (raw play data is ~2.4M unsegmented
    interaction steps, not natively episodic). Re-verified, unchanged.'
  expected_duration_hours: 'arXiv:2112.03227 sec. III-B.1: ''we collect twenty-four
    hours of teleoperated "play" data in four environments ... spending an approximately
    equal time of six hours in each environment''. Newly filled: 24.0 (6h x 4 envs).'
  num_subjects: 'arXiv:2112.03227 sec. III-B.1: ''we asked three people to collect
    data, and these users were untrained and given no information about the downstream
    tasks''. Newly filled: 3 human teleoperators.'
  num_scenes: 'arXiv:2112.03227 sec. III-A: ''CALVIN features four different, yet
    structurally related environments (A, B, C, D)''. Newly filled: 4.'
  num_objects: 'arXiv:2112.03227 sec. III-A: ''there are three different colored and
    shaped rectangular blocks''. Newly filled: 3 (free-standing manipulable objects).
    Note: the desk also has fixed articulated/interactive elements not counted here
    (sliding door, drawer, a button toggling a green LED, and a switch controlling
    a light bulb) -- this is a judgment call on scope, flagged as uncertain in the
    review summary.'
suggested_new_enum_values: {}
