field_sources:
  source_url: Project page linked from the paper; sites.google.com/view/yubi-manipulation
    requires Google sign-in when fetched directly (re-verified in this pass), so all
    facts below come from the arXiv paper (2606.10244) and the linked GitHub hardware
    repo (github.com/Toyota/yubi-hw) instead.
  paper_url: arXiv:2606.10244 abstract page citation_pdf_url/canonical link, confirmed
    reachable via curl.
  license: 'arXiv:2606.10244 Appendix D.2 ''Software''/dataset-release paragraph:
    ''The processed LeRobot dataset will be released on Hugging Face under the CC-BY-NC-SA-4.0
    license.'' Re-verified verbatim in this pass; matches existing value. (Note: the
    arXiv paper text itself is separately tagged ''License: CC BY-SA 4.0'' by arXiv
    -- that is the paper''s own license, not the dataset''s; the hardware repo is
    CERN-OHL-W v2 and the collection software is Apache-2.0 -- neither applies to
    the dataset artifact.)'
  raw_format: 'arXiv:2606.10244 Sec. 4 ''Dataset Schema'': ''All sensor streams are
    initially recorded in rosbag2 format at their native frequencies and are subsequently
    converted to the LeRobot format ..., standardized at 30 Hz.'' The released/distributed
    dataset format is LeRobot. Re-verified, unchanged.'
  release_type: Dataset is a one-time, fixed-size release of 1.20M curated episodes
    (Table 2 'YUBI data statistics'), not a generator/framework/benchmark-env; matches
    fixed_episode_dataset per the registry's batch classification rule for this dataset
    family.
  collection_method: 'arXiv:2606.10244 Abstract: ''We curate a UMI-based dataset of
    unprecedented scale''; Sec 2 explicitly frames YUBI as an evolution of the handheld
    UMI (Universal Manipulation Interface) paradigm (finger-driven actuation + VR
    tracking instead of pistol-grip + SLAM), not a teleop/autonomous/simulation pipeline.
    Re-verified, unchanged; matches ''umi'' enum.'
  secondary_collection_methods: 'No secondary collection method found: the entire
    dataset is collected via the single handheld YUBI-gripper + VR-tracking pipeline
    (Sec. 3-4); no teleop, autonomous rollout, or simulation component is described.
    Left empty.'
  is_multi_embodiment: 'arXiv:2606.10244 Sec. 6 ''Robot Policy Deployment'' / Appendix
    C.2: policies trained on YUBI data are deployed and evaluated on three kinematically
    distinct bimanual robot platforms (UR, Franka, Toyota ELEY), each fitted with
    the same YUBI gripper end-effector. Re-verified, unchanged.'
  embodiment_class: 'arXiv:2606.10244 Sec. 6/Appendix C.2: ''three bimanual robot
    platforms with distinct kinematics: UR ..., Franka ..., and Toyota semi-humanoid
    ELEY''; data collection itself is also two-handed (two YUBI grippers, one per
    hand; see state_dim). Re-verified, unchanged.'
  robot_platform: 'arXiv:2606.10244 Sec. 6/Appendix C.2: policies are deployed and
    evaluated across three distinct platforms -- UR, Franka, and Toyota''s semi-humanoid
    ELEY -- each with its native gripper replaced by the YUBI gripper. No single value
    can capture all three, so per the registry''s explicit backfill decision for this
    dataset (2026-07-10 schema-refinement design doc, table row ''yubi -> robot_platform
    -> toyota_eley, is_multi_embodiment: true''), toyota_eley is kept as the representative
    single value (the platform with the dedicated new enum entry) while is_multi_embodiment=true
    flags that UR and Franka are also used. Re-verified this is still the documented
    convention, not a stale artifact; corrected this field_sources note itself, which
    had carried over stale text from an earlier pass claiming the value was mapped
    to ''other'' -- the actual stored value is toyota_eley, not other.'
  num_arms: 'arXiv:2606.10244 Sec. 4 ''Dataset Schema'': recorded pose data has separate
    right/left components (t^right, t^left, r^right, r^left, d^right, d^left) for
    a two-handed bimanual gripper setup; deployment platforms in Sec. 6 are likewise
    ''bimanual'' (2 arms each). Re-verified, unchanged.'
  dof_per_hand: 'arXiv:2606.10244 Sec. 4: each hand''s gripper contributes exactly
    one additional scalar degree of freedom beyond the 6-DoF wrist pose -- the fingertip
    jaw aperture angle d^right, d^left in R (Sec. 3.1 ''one gripper jaw is actuated
    by the thumb, while the opposing jaw is driven by the coordinated motion of the
    index and middle fingers'' -- a single yielding jaw-open/close DoF, not a multi-joint
    dexterous hand). dof_per_hand = 1.'
  gripper_type: 'arXiv:2606.10244 Sec. 3.1 ''Finger-aligned design'': ''the sharpened
    fingertip geometry enables precise, fine-grained control with a parallel-jaw gripper'';
    the YUBI mechanism has exactly two jaws (thumb-actuated and index/middle-actuated),
    consistent with parallel_jaw rather than a multi-fingered dexterous hand. Re-verified,
    unchanged.'
  hand_pose_representation: 'Set to ''none'': the YUBI gripper is a 1-DoF-per-hand
    parallel jaw (see dof_per_hand/gripper_type above), not a multi-fingered dexterous
    hand or bare-hand MANO/keypoint tracking system -- no finger-level hand-shape
    encoding exists beyond the single jaw-angle scalar already captured in state_dim/action_dim.
    The paper''s title phrase ''Bimanual Dexterous Manipulation'' describes the task
    domain, not the gripper''s own DoF, which is why the hand_pose_representation
    field (intended for MANO/keypoints/joint-angle dexterous-hand encodings) does
    not apply.'
  has_mobile_base: 'arXiv:2606.10244 Sec. 7 Limitations: ''a natural data source for
    embodiments beyond fixed-base bimanual arms'' -- confirms all three deployment
    platforms (UR/Franka/ELEY) are fixed-base bimanual arm rigs, not mobile bases.
    Re-verified, unchanged.'
  action_space: 'arXiv:2606.10244 Sec. 6: ''a single policy trained jointly on multiple
    tasks in the end-effector trajectory action space ... the action space is the
    gripper trajectory rather than robot-specific joint commands.'' Re-verified, unchanged.'
  action_frame: 'arXiv:2606.10244 Sec. 6: policy ''predicts relative end-effector
    poses in action chunks (e.g., 32 steps)''; Sec. 4 stores ''relative poses expressed
    in the wrist frames'' per-frame in the raw schema. Re-checked against the newly
    added relative_trajectory enum value (reserved for SLAM-tracked, relative-to-episode-origin
    UMI variants like mv_umi per the schema-refinement design doc): YUBI instead uses
    VR tracking (not SLAM) and explicitly frames its action as a per-chunk pose delta
    relative to the current wrist pose (standard diffusion-policy-style chunked delta,
    matching the original UMI convention), so ''delta'' remains the correct classification,
    not relative_trajectory.'
  rotation_representation: 'arXiv:2606.10244 Sec. 4 ''Dataset Schema'': ''we store
    the translational components t^right, t^left in R^3 and rotational components
    r^right, r^left in R^3, where rotation is represented as Euler angles.'' Re-verified,
    unchanged.'
  state_dim: 'Derived from arXiv:2606.10244 Sec. 4 schema: per hand, translation (3)
    + Euler rotation (3) + jaw angle d (1) = 7 dims; bimanual (2 hands) = 14. Re-verified,
    unchanged.'
  action_dim: 'Same basis as state_dim (Sec. 4 schema: t + r + jaw angle per hand);
    the policy predicts relative end-effector poses in this same representation (Sec.
    6), so action_dim = 14 (2 hands x 7). Re-verified, unchanged.'
  fps: 'arXiv:2606.10244 Sec. 4: raw rosbag2 streams recorded at native rates (wrist
    camera, Quest controller, magnetic encoder, top-view stereo camera all differ)
    but ''subsequently converted to the LeRobot format ..., standardized at 30 Hz'';
    Sec. 6 also conditions the policy on ''wrist RGB images at 30 Hz.'' Re-verified,
    unchanged.'
  fps_variable: 'arXiv:2606.10244 Sec. 4: the released/converted LeRobot dataset is
    explicitly ''standardized at 30 Hz'' (a single fixed rate), even though underlying
    raw rosbag2 sensor streams were captured at different native frequencies before
    conversion. Re-verified, unchanged.'
  num_camera_views: 'arXiv:2606.10244 Sec. 3.2/Sec. 4: a stereo top-view RealSense
    camera for workspace observation plus an onboard wrist camera on each of the two
    YUBI devices = 3 total camera views. Re-verified, unchanged.'
  camera_views: 'arXiv:2606.10244 Sec. 4: ''three synchronized camera streams (two
    wrist cameras and RealSense)'' -- one wrist camera per hand (left_wrist/right_wrist)
    plus the stationary top-view RealSense D435 (top). Re-verified, unchanged.'
  has_synchronized_multiview_rig: 'arXiv:2606.10244 Sec. 4 ''Dataset Schema'': ''Each
    recording is stored as a single episode file that includes three synchronized
    camera streams (two wrist cameras and RealSense)'' -- explicit confirmation the
    multi-camera rig is hardware/software synchronized, not merely co-located.'
  has_camera_calibration: 'arXiv:2606.10244 Appendix A.2 ''Data Processing: Calibration''
    and Fig. 12 ''Extrinsic calibration process'': a ChArUco board placed at a fixed
    position across desks is observed from all cameras (wrist + table-top) to align
    gripper trajectories to a shared table coordinate frame. Re-verified, unchanged.'
  depth_coverage: 'arXiv:2606.10244 Sec. 3.2 ''Fixed stereo camera'': the stationary
    RealSense D435 top-view camera ''provides a stable top-down view of the workspace
    at 30 Hz (RGB + depth)'', while the two wrist-mounted cameras are described only
    as RGB observation cameras with no depth channel mentioned -- hence ''partial''
    (1 of 3 views has depth). Re-verified, unchanged.'
  additional_modalities: 'No force_torque/tactile/audio/eye_gaze sensing found: arXiv:2606.10244''s
    own comparison table (Table 4) lists YUBI''s distinguishing ''Feature'' as only
    ''Finger-aligned gripper'', in contrast to other UMI-style datasets in the same
    table explicitly tagged Tactile/Audio/F-T/Dex-hand/Whole-body. YUBI''s sensing
    stack is limited to VR 6-DoF pose tracking + RGB(+depth on the top camera only),
    already captured via state_dim/depth_coverage. Left empty.'
  has_language_instruction: 'arXiv:2606.10244 Sec. 6: policy is ''conditioned on a
    natural-language task instruction''; Table 2 reports ''Total video-language-action
    triplets'' as a dataset statistic, and Sec. 4 records per-sub-action language/task
    metadata. Re-verified, unchanged.'
  num_task_types: 'arXiv:2606.10244 Abstract/Table 2 ''YUBI data statistics'': ''#
    Tasks 119''; Sec. 4/Fig. 3: ''119 tasks ... across seven categories (industrial,
    kitchen, toy, desk work, clothing, appliance, personal care).'' Re-verified, unchanged.'
  urdf_available: 'github.com/Toyota/yubi-hw ''Repository Structure'': hardware is
    released only as STEP/STL CAD files (glove, gripper, portable/stationary rig,
    flange) plus BOM/assembly-instruction docs; re-checked repo file listing in this
    pass, no .urdf file present anywhere in the tree.'
  urdf_source: Same as urdf_available -- no URDF file found in the official hardware
    repo (github.com/Toyota/yubi-hw), only STEP/STL mechanical CAD. Re-verified, unchanged.
  expected_num_episodes: 'arXiv:2606.10244 Abstract/Table 2 ''YUBI data statistics'':
    ''# Episodes 1.20M'' (1,200,000). Re-verified, unchanged.'
  expected_duration_hours: 'arXiv:2606.10244 Abstract and Table 2 ''YUBI data statistics'':
    ''Total duration (hrs) 8434''; abstract: ''8,434 hours across 1.20M episodes and
    119 tasks.'''
  num_subjects: 'arXiv:2606.10244 Sec. 4 ''Statistics'': ''Data collection was conducted
    24/7 over two months by 179 operators (125 male, 54 female).'''
  num_scenes: 'arXiv:2606.10244 Sec. 4 ''Statistics'': ''we collected YUBI-based manipulation
    data at scale on 22 desks''; Fig. 2 caption: ''we collect bimanual YUBI-based
    demonstrations at 22 desks in parallel from 179 operators.'' 22 physical desk
    setups = 22 scenes.'
suggested_new_enum_values: {}
