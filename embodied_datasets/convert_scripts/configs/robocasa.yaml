id: robocasa
name: RoboCasa
source_url: https://robocasa.ai/docs/build/html/introduction/overview.html
paper_url: https://arxiv.org/abs/2603.04356
license: CC-BY-4.0
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: human_to_robot_synthesis
secondary_collection_methods:
- teleop
is_multi_embodiment: false
embodiment_class: mobile_manipulator
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: true
action_space: mixed
action_frame: delta
rotation_representation: axis_angle
state_dim: 16
action_dim: 12
fps: 20.0
fps_variable: false
num_camera_views: 3
camera_views:
- third_person
- wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: none
additional_modalities: []
has_language_instruction: true
num_task_types: 365
urdf_available: true
urdf_source: manufacturer_official
expected_num_episodes: 655000
expected_duration_hours: 2227.0
num_scenes: 2510
num_objects: 3200
review_status: pending_human_review
field_sources:
  license: 'GitHub robocasa/robocasa README.md ''License'' section (reconfirmed verbatim):
    ''Code: MIT License ... Assets and Datasets: CC BY 4.0''; docs using_datasets.html
    has an identical License section. Dataset assets are CC-BY-4.0.'
  raw_format: 'robocasa.ai/docs using_datasets.html ''Dataset structure'': datasets
    are distributed as LeRobot-format dirs (meta/, data/*.parquet, videos/*.mp4),
    produced by robocasa/scripts/dataset_scripts/convert_hdf5_lerobot.py from internal
    HDF5; confirmed by reading that script directly on GitHub (creates a LerobotDatasetWrapper
    dataset).'
  release_type: Confirmed fixed_episode_dataset. RoboCasa/robosuite is a simulation+generation
    framework (MimicGen can synthesize more demos), but download_datasets.py + dataset_registry.py
    distribute a concrete, versioned (v1.0) set of pre-generated per-task HDF5/LeRobot
    demo files hosted on Box; this registry entry tracks that fixed released artifact
    (655k episodes), matching the precedent in configs/dexmimicgen.yaml and configs/libero.yaml
    for framework-backed fixed releases.
  collection_method: 'arXiv:2603.04356 (RoboCasa365) Sec 3.4.1-3.4.3, re-verified
    in full text: 30k (pretrain) + 25k (target) = 55k human-teleoperated seed demos,
    then MimicGen generates 60 atomic tasks x 10k demos = 600k synthetic demos from
    those seeds -- ~92% of the 655k total is MimicGen-synthesized from human seeds,
    matching ''human_to_robot_synthesis'' (same convention as configs/mimicgen.yaml,
    configs/dexmimicgen.yaml).'
  secondary_collection_methods: 'CORRECTED from [] to [teleop]. Same source as collection_method:
    the 55k human seed demos (8.4% of the 655k released total) are genuine teleoperation
    data that is itself separately downloadable (download_datasets.py --source human),
    not just an internal-only seed step -- matching the configs/mimicgen.yaml precedent
    (there, an even smaller 0.2% teleop-seed fraction was still recorded as a secondary
    method), more clearly warranted here given the larger fraction.'
  is_multi_embodiment: 'Newly filled: false. arXiv:2603.04356 Sec 3.4.1: ''For our
    data collection, we use the Franka Panda Emika robot, equipped with an Omron mobile
    base ... in principle, our simulation framework CAN SUPPORT data collection with
    other mobile manipulators and humanoid platforms'' -- the actual released dataset
    uses only one embodiment (PandaOmron); the multi-embodiment capability is a framework
    property, not something realized in the released data.'
  embodiment_class: 'arXiv:2603.04356 Sec 3.4.1: single Franka Panda arm on an actuated
    Omron wheeled mobile base (re-confirmed unchanged).'
  robot_platform: Same source; Franka Panda is the closest enum match for the arm
    component. The Omron mobile base has no dedicated enum value and is captured via
    has_mobile_base (re-confirmed unchanged).
  num_arms: 'Confirmed via robocasa/models/assets/groot_dataset_assets/PandaOmron_modality.json
    and dataset_registry.py: single-arm ''PandaOmron'' robot model throughout (re-confirmed).'
  dof_per_arm: 'Franka Emika Panda manufacturer spec: 7 revolute joints, unmodified
    by RoboCasa''s PandaOmron model (re-confirmed unchanged).'
  gripper_type: robocasa/environments/kitchen/kitchen.py default gripper_types='default'
    resolves to robosuite's stock 2-finger PandaGripper (re-confirmed unchanged).
  has_mobile_base: arXiv:2603.04356 Sec 3.4.1 + robot_type='PandaOmron' in convert_hdf5_lerobot.py;
    action.base_motion and state.base_position/base_rotation fields in PandaOmron_modality.json
    directly confirm an actuated mobile base (re-confirmed unchanged).
  action_space: 'robocasa/models/assets/groot_dataset_assets/PandaOmron_modality.json
    (fetched directly from GitHub main): action vector = base_motion(4) + control_mode(1)
    + end_effector_position(3) + end_effector_rotation(3) + gripper_close(1) = 12
    dims -- eef pose + gripper + mobile-base motion + discrete control-mode selector,
    i.e. mixed (re-confirmed unchanged, now with a more direct/official source than
    before).'
  action_frame: 'CORRECTED from ''both'' to ''delta''. Fetched robocasa/scripts/dataset_scripts/convert_hdf5_lerobot.py
    directly from GitHub main: the absolute-action computation is present in source
    but COMMENTED OUT (''# action_abs = env.base_env.convert_rel_to_abs_action(actions[t])'',
    ''# traj["actions_abs"].append(...)''), and the LeRobot feature schema written
    to disk defines only a single ''action'' key (shape (12,)) with no action_abs/actions_abs
    key -- the official released dataset ships only the delta/relative action (per
    robosuite OSC_POSE default: ''delta values from the current state''). The previous
    ''both'' classification relied on a third-party HF mirror (Asap7772/robocasa-mimicgen-PnPCounterToCab)
    of an older/different processing pipeline that did include action_abs; that is
    not representative of the current official conversion path.'
  rotation_representation: 'robosuite OSC_POSE controller docs (robosuite.ai/docs/modules/controllers.html,
    fetched directly): ''delta rotations from the current end-effector orientation
    in the form of axis-angle coordinates (ax, ay, az)''. Directly confirmed in PandaOmron_modality.json:
    action.end_effector_rotation occupies exactly 3 dims (indices 8-11 of the 12-dim
    action), consistent with axis-angle. Note state.end_effector_rotation_relative
    (proprioception) is separately a 4-dim quaternion -- a different, complementary
    encoding not captured by this action-oriented field.'
  state_dim: 'Newly filled: 16. convert_hdf5_lerobot.py feature schema: ''observation.state'':
    shape (16,), decomposed in PandaOmron_modality.json as base_position(3) + base_rotation(4)
    + end_effector_position_relative(3) + end_effector_rotation_relative(4) + gripper_qpos(2)
    = 16.'
  action_dim: 'Newly filled: 12. convert_hdf5_lerobot.py feature schema: ''action'':
    shape (12,), decomposed in PandaOmron_modality.json as base_motion(4) + control_mode(1)
    + end_effector_position(3) + end_effector_rotation(3) + gripper_close(1) = 12.'
  fps: 'robocasa/scripts/dataset_scripts/convert_hdf5_lerobot.py: ''FPS = 20  # default
    fps for robosuite'', used directly as the LeRobot dataset''s video/control fps;
    corroborated by kitchen.py control_freq=20 and arXiv:2406.02523 Sec IX-C ''20
    Hz'' for the simulated Franka (re-confirmed unchanged).'
  fps_variable: 'Same conversion script: FPS=20 is one constant used for every episode/task,
    no per-task override found (re-confirmed unchanged).'
  num_camera_views: 'Confirmed via convert_hdf5_lerobot.py feature dict: exactly 3
    video keys -- observation.images.robot0_eye_in_hand, robot0_agentview_left, robot0_agentview_right
    (re-confirmed unchanged).'
  camera_views: 'UPDATED mapping only (same underlying facts): robot0_agentview_left/right
    -> third_person; robot0_eye_in_hand -> wrist. Previously mapped eye-in-hand to
    ''other'' because no generic wrist value existed; schema.py now defines CameraView.WRIST,
    so the prior suggested_new_enum_values entry is resolved and removed.'
  has_synchronized_multiview_rig: 'Newly filled: true. convert_hdf5_lerobot.py extract_trajectory():
    a single env.reset_to(state) call per timestep populates obs for all three cameras
    from the same MuJoCo simulation state, so the three views are synchronized by
    construction (same reasoning precedent as configs/mimicgen.yaml, configs/libero.yaml).'
  has_camera_calibration: 'robocasa.ai/docs api reference: robocasa.utils.camera_utils
    exposes get_robot_cam_configs/set_cameras/randomize_cameras -- camera intrinsics/mount
    poses are simulator-defined and programmatically known (re-confirmed unchanged).'
  depth_coverage: robocasa/environments/kitchen/kitchen.py default camera_depths=False;
    convert_hdf5_lerobot.py VIDEO_INFO sets is_depth_map=False for all camera features;
    no depth video/array is written to the LeRobot output (re-confirmed unchanged).
  has_language_instruction: convert_hdf5_lerobot.py writes 'annotation.human.task_description'
    per timestep; using_datasets.html documents meta/tasks.jsonl as 'Language instructions
    with task indices' (re-confirmed unchanged).
  num_task_types: 'arXiv:2603.04356 Sec 3.3, re-verified in full text: ''our benchmark
    includes 365 everyday tasks: 65 atomic tasks and 300 composite tasks'' (re-confirmed
    unchanged).'
  urdf_available: 'RoboCasa/robosuite models the PandaOmron natively as MuJoCo MJCF
    (confirmed: GitHub repo tree contains no .urdf files anywhere), but the underlying
    Franka Panda arm has an official manufacturer URDF at github.com/frankaemika/franka_description
    -- kept true per the same convention used in configs/mimicgen.yaml for the identical
    arm. NOTE: configs/libero.yaml classifies the same Franka-Panda/robosuite stack
    as urdf_available=false/not_found, so this field''s exact intended semantics (repo-bundled
    vs any-manufacturer-source) is ambiguous across the registry and not fully resolved
    here.'
  urdf_source: github.com/frankaemika/franka_description -- Franka Robotics' own official
    ROS description package; manufacturer-official rather than bundled in the robocasa
    repo itself (re-confirmed unchanged; same registry ambiguity noted under urdf_available).
  expected_num_episodes: 'arXiv:2603.04356 Sec 3.4.1-3.4.2, re-verified: 30,000 pretrain-human
    + 25,000 target-human + 600,000 MimicGen-synthetic (60 atomic tasks x 10k) = 655,000
    total (re-confirmed unchanged; cross-checked against Fig. 4b ''55k episodes''
    human-only subset).'
  expected_duration_hours: 'Newly filled: 2227.0. arXiv:2603.04356 Sec 3.4.3/Fig.4
    text: synthetic MimicGen data ''1615 total hours'', human pretraining data ''404
    hours'', human target data ''208 hours'' -> 404+208+1615=2227; matches abstract/README
    headline ''600+ human, 1600+ synthetic'' / ''2200+ Hours of Data''.'
  num_scenes: 'Newly filled: 2510. arXiv:2603.04356 Sec 3.2, re-verified in full text:
    50 new layouts x 50 new styles = 2,500 pretraining kitchen scenes, plus the 10
    original RoboCasa target kitchen scenes (10 layouts × 10 styles, one-to-one) =
    2,500 + 10 = 2,510 total unique kitchen scenes.'
  num_objects: 'Newly filled: 3200 (approximate, per source''s own ''3200+'' figure).
    arXiv:2603.04356 Sec 3.1 + summary figure: 2,509 existing objects (Nasiriany et
    al. 2024, 153 categories) plus an additional collection spanning 57 more categories
    (exact added count not stated numerically in body text); the paper''s own headline
    figure and the GitHub README both state the combined total as ''3,200+ Objects/3D
    objects''.'
  review_status: 'Left as pending_human_review: high confidence on most fields (many
    now backed by direct GitHub source-file evidence rather than inference), but urdf_available/urdf_source
    semantics are ambiguous vs. the libero.yaml precedent, and num_objects/expected_duration_hours/num_scenes
    rely on the source''s own rounded ''X+'' figures rather than exact counts, so
    this is not marked confirmed.'
suggested_new_enum_values: {}
