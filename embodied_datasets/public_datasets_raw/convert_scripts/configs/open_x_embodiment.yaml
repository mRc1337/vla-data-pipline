  raw_format: 'arXiv:2310.08864 Section III-A ''Data format consolidation'': ''We
    use the RLDS data format [119], which saves data in serialized tfrecord files
    and accommodates the various action spaces and input modalities of different robot
    setups'''
  depth_coverage: 'Open X-Embodiment dataset spreadsheet (https://docs.google.com/spreadsheets/d/1rPBD77tk60AEIGZrGSODwyyzs5FgCU9Uz3h-3_t2A9g),
    ''# Depth Cams'' column across 72 listed constituent datasets: 52/72 have 0 depth
    cameras, 20/72 have >=1 -> depth is present in a minority but non-trivial subset
    of constituent datasets, i.e. partial coverage at the collection level'
  has_language_instruction: 'Open X-Embodiment dataset spreadsheet, ''Language Annotations''
    column: ~45/72 constituent datasets carry some form of language annotation (Templated/Natural/LLM-generated)
    vs 27/72 with none, so language instructions are present across most (majority
    of) constituent datasets; corroborated by arXiv:2310.08864 abstract/body discussing
    ''language annotations present in our data'' and 527 skills / 160,266 tasks derived
    from them'
  num_task_types: 'arXiv:2310.08864 abstract: ''We assemble a dataset from 22 different
    robots collected through a collaboration between 21 institutions, demonstrating
    527 skills (160266 tasks)'' -- 527 taken as the number of distinct task/skill
    types; 160,266 is the larger count of specific task instances/language descriptions'
  fps_variable: 'Open X-Embodiment dataset spreadsheet, ''Control Frequency'' column:
    values range from 1 Hz to 500 Hz across the 72 listed constituent datasets (plus
    several N/A / non-frequency-based entries for scripted/primitive-skill datasets),
    so there is no single fps for the collection'
  expected_size_gb: 'Open X-Embodiment dataset spreadsheet (https://docs.google.com/spreadsheets/d/1rPBD77tk60AEIGZrGSODwyyzs5FgCU9Uz3h-3_t2A9g),
    summary row ''Current Download Size (GB): 8964.94'' for the full unfiltered dataset
    list, cross-checked by summing the per-dataset ''File Size (GB)'' column (8964.94
    GB) referenced from the official GitHub repo and Open_X_Embodiment_Datasets.ipynb
    colab'
  expected_num_episodes: 'Open X-Embodiment dataset spreadsheet, summary row ''# Total
    Episodes: 2,419,193'' for the full unfiltered dataset list, cross-checked by summing
    the per-dataset ''# Episodes'' column (2,419,193); note this supersedes the paper''s
    headline ''1M+ trajectories'' figure from arXiv:2310.08864, which reflects an
    earlier snapshot of the collection before later dataset additions'
