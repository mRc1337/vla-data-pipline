field_sources:
  source_url: GCS bucket gs://gresearch/rt-1-data-release re-verified reachable today
    (LICENSE.txt, README.txt, dataset_info.json all fetched via curl).
  license: LICENSE.txt in the GCS bucket is the standard CC BY 4.0 legal text ('Attribution
    4.0 International'); re-verified by direct curl fetch.
  raw_format: 'README.txt: dataset conforms to the RLDS library episode/step format,
    loaded via tfds.builder_from_directory. Re-verified by direct curl fetch.'
  release_type: Static, fixed set of 87,212 pre-recorded episodes in dataset_info.json
    shards; not a generator/sim platform, so fixed_episode_dataset.
  collection_method: 'arXiv:2212.06817 Appendix C.2: operator teleoperates via 2 VR
    remotes with direct line-of-sight to the robot.'
  secondary_collection_methods: No evidence of any non-teleop collection method contributing
    to this specific release (fractal20220817_data); the Kuka co-training data in
    Sec 6.3 is a separate external dataset, not part of this release.
  embodiment_class: 'arXiv:2212.06817 Sec 4: ''mobile manipulators from Everyday Robots
    ... a 7 DoF arm, a two-fingered gripper, and a mobile base''.'
  robot_platform: Everyday Robots proprietary mobile-manipulator arm (arXiv:2212.06817
    Sec 4; https://robotics-transformer1.github.io/). No dedicated enum value exists
    for this platform (Everyday Robots shut down 2023, no public model name), so mapped
    to the generic 'other' literal; see suggested_new_enum_values for the specific
    name.
  num_arms: arXiv:2212.06817 Sec 4 describes a single 7-DoF arm per robot.
  dof_per_arm: 'arXiv:2212.06817 Sec 4: ''7 degree-of-freedom arm''.'
  gripper_type: 'arXiv:2212.06817 Sec 4: ''a two-fingered gripper'' = parallel_jaw.'
  hand_pose_representation: Gripper is a simple 2-finger parallel jaw controlled by
    a single scalar (gripper_closedness_action), not an articulated/dexterous hand
    or bare-hand tracking, so no hand-pose encoding applies (none).
  has_mobile_base: arXiv:2212.06817 Sec 4 explicitly states the platform has a mobile
    base.
  action_space: README.txt action FeaturesDict mixes eef world_vector/rotation_delta
    with base_displacement terms and a discrete terminate_episode mode -> mixed.
  action_frame: 'README.txt: ''world_vector'' and ''rotation_delta'' are commanded
    displacements; arXiv:2212.06817 App C.2 confirms remote deltas map to 6D tool
    displacements -> delta.'
  rotation_representation: 'arXiv:2212.06817 App C.2 / Sec 4: arm rotation action
    is roll/pitch/yaw (rotation_delta), i.e. euler_xyz.'
  action_dim: 'README.txt action FeaturesDict: world_vector(3)+rotation_delta(3)+gripper_closedness_action(1)+base_displacement_vector(2)+base_displacement_vertical_rotation(1)+terminate_episode(3)=13;
    re-verified by direct curl fetch of README.txt.'
  fps: 'arXiv:2212.06817 Sec 4: ''RT-1 performs closed-loop control and commands actions
    at 3 Hz''.'
  fps_variable: Paper describes a single fixed 3 Hz control rate with no mention of
    variable rate; also a fixed-time waiting mechanism is used to avoid jitter (App
    C.1).
  num_camera_views: README.txt observation FeaturesDict has exactly one image field
    ('image', shape (256,320,3)); re-verified by direct curl fetch.
  camera_views: No explicit mount-location label found in the paper text (searched
    for 'camera', 'head-mounted', 'overhead' - none describe mount location); moderate-confidence
    inference of a fixed body/head-mounted RGB camera from robot images in arXiv:2212.06817
    Fig. 2(d) and the project site, not a wrist camera. Left as-is from prior pass;
    could not raise confidence further this round.
  has_synchronized_multiview_rig: Only a single camera view exists in the observation
    spec (see num_camera_views/camera_views), so there is no multi-camera rig.
  has_camera_calibration: README.txt observation FeaturesDict has no intrinsics/extrinsics
    fields; re-verified by direct curl fetch.
  depth_coverage: README.txt observation FeaturesDict contains only an RGB 'image'
    field, no depth field; re-verified by direct curl fetch.
  additional_modalities: README.txt observation FeaturesDict has no force/torque,
    tactile, audio, or eye-gaze fields.
  has_language_instruction: README.txt observation FeaturesDict includes 'natural_language_instruction'
    (string) and 'natural_language_embedding'.
  num_task_types: CORRECTED 700 -> 744. arXiv:2212.06817 Table 1 (Sec 5.2) lists the
    exact per-skill instruction counts (Pick Object 130, Move Object Near Object 337,
    Place Object Upright 8, Knock Object Over 8, Open Drawer 3, Close Drawer 3, Place
    Object into Receptacle 84, Pick Object from Receptacle and Place on Counter 162,
    Sec 6.3/6.4 tasks 9) with an explicit row 'Total 744'; also matches the Model
    Card (App B) statement '130k tele-operation demonstrations over 13 robots and
    744 tasks'. The Sec 4 prose 'over 700 distinct task instructions' is the same
    fact stated approximately; 744 is the precise, table-sourced figure.
  urdf_available: No public URDF for the Everyday Robots arm/base found on the project
    site, https://github.com/google-research/robotics_transformer, or the GCS bucket;
    Everyday Robots was a proprietary Alphabet company that shut down in 2023.
  urdf_source: Same evidence as urdf_available - not found in dataset repo, manufacturer
    site, or community repos.
  expected_size_gb: 'dataset_info.json train split numBytes=118929634288 = 118.93
    GB decimal; re-verified by direct curl fetch and recomputation today. Cross-checked
    against TFDS catalog page for fractal20220817_data which lists ''Dataset size:
    111.38 GiB'' (a slightly different TFDS repackaging of the same release).'
  expected_num_episodes: 'dataset_info.json train split shardLengths sum to 87212
    (re-verified by direct curl fetch and summation today); matches TFDS catalog page
    ''train: 87,212'' examples for fractal20220817_data. Note the paper''s internal
    training set is ''over 130k'' demonstrations (arXiv:2212.06817 Sec 4/5.2), but
    only 87,212 episodes are present in this public release.'
  expected_duration_hours: 'Not found: neither the paper, README.txt, nor dataset_info.json
    give total footage hours or per-episode step counts needed to derive this; the
    paper''s ''17 months'' figure (Sec 5.2) is wall-clock collection calendar time
    for the full internal ~130k-episode dataset, not recorded video duration, so it
    was not used as a substitute. Left blank.'
  num_subjects: 'Not found: arXiv:2212.06817 App A credits ~16 named individuals for
    ''Data collection and evaluations'', but the paper never states how many of them
    were actual VR-teleop demonstrators (vs. evaluators/engineers), so this list is
    not a reliable operator/subject count. Left blank rather than guess.'
  num_scenes: 'arXiv:2212.06817 Sec 4: ''we use three kitchen-based environments:
    two real office kitchens [Kitchen1, Kitchen2] and a training environment [Robot
    Classroom] modelled off these real kitchens''. Moderate confidence: the paper
    describes the Robot Classroom as built ''for large scale data collection'' while
    Kitchen1/Kitchen2 are described mainly as evaluation environments, so it is not
    fully certain all 3 environments contributed episodes to this specific released
    dataset vs. some being eval-only.'
  num_objects: 'TFDS catalog page for this exact dataset (itemprop name ''fractal20220817_data'',
    source tfds.robotics.rtx.Fractal20220817Data) gives the official description ''Table-top
    manipulation with 17 objects''. Moderate confidence: the paper itself only says
    ''a large variety of objects'' and shows both a core object set (Fig 2e) and an
    expanded, more diverse picking-only object set (Fig 2f) without giving a single
    total count, so 17 may undercount the full expanded set.'
  is_multi_embodiment: arXiv:2212.06817 Sec 6.3 tests absorbing a separate Kuka IIWA
    bin-picking dataset for a co-training ablation, but that Kuka data is an external
    dataset, not part of this release; the released fractal20220817_data episodes
    are all collected on the single Everyday Robots mobile-manipulator platform.
suggested_new_enum_values:
  robot_platform: everyday_robots_arm - The RT-1 dataset was collected with Google/Everyday
    Robots' proprietary 7-DoF mobile-manipulator arm (2-fingered parallel gripper
    on a wheeled mobile base), described in arXiv:2212.06817 Section 4 and https://robotics-transformer1.github.io/.
    No existing named RobotPlatform enum value corresponds to this platform; currently
    mapped to the generic 'other' literal in the field itself pending a dedicated
    enum addition.
