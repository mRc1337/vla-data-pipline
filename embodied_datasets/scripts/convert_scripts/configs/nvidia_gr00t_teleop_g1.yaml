id: nvidia_gr00t_teleop_g1
name: NVIDIA GR00T-Teleop-G1
source_url: https://huggingface.co/datasets/nvidia/PhysicalAI-Robotics-GR00T-Teleop-G1
license: CC-BY-4.0
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
is_multi_embodiment: false
embodiment_class: humanoid
robot_platform: unitree_g1
num_arms: 2
dof_per_arm: 7
dof_per_hand: 7
gripper_type: dexterous_hand
hand_pose_representation: joint_angles
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 43
action_dim: 43
fps: 20.0
fps_variable: false
num_camera_views: 1
camera_views:
- head
has_synchronized_multiview_rig: false
has_camera_calibration: false
depth_coverage: none
additional_modalities: []
