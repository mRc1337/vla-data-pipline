  expected_size_gb: 'NEW FIELD, checked, left blank: docs.ego-exo4d-data.org/getting-started/
    states only that the default "recommended" partial download subset is "approximately
    14 TiB" - this is explicitly a subset, not the full released dataset size, and
    no page states a total size for all parts (takes, VRS, captures, annotations,
    features, point clouds) combined; left blank rather than report a partial-download
    figure as if it were the total.'
suggested_new_enum_values:
  license: Ego4D-EULA (custom Meta/Ego4D license agreement, signed per-institution
    via ego4d.dev/request/ego-exo4d; per https://docs.ego-exo4d-data.org/getting-started/
    it covers both research and commercial use with restrictions on redistribution,
    and is free but requires signature/approval - does not map to MIT/Apache/BSD/CC-*/GPL/Proprietary/Unknown)
  collection_method: 'RE-VERIFIED 2026-07-10, same issue as sibling assembly101.yaml:
    Ego-Exo4D simultaneously records one egocentric Aria camera AND 4-5 exocentric
    GoPro cameras per take (synchronized ego+exo capture of unassisted human activity).
    The existing egocentric_human value only captures the egocentric half; consider
    adding a value like ego_exo_human or multiview_human for datasets that jointly
    capture synchronized first-person + third-person human views (this affects multiple
    datasets in the registry: ego_exo4d, assembly101, egoexolearn).'
  additional_modalities: Ego-Exo4D also provides IMU (2x1kHz on Aria) and dense 3D
    point cloud / camera-pose (6DoF localization) data, per arXiv:2311.18259 abstract
    ("camera poses, IMU") and docs.ego-exo4d-data.org/overview/. The current SensorModality
    enum (force_torque/tactile/audio/eye_gaze) has no value for IMU or point-cloud/SLAM
    data; consider adding imu and point_cloud values.
