field_sources:
  license: 'https://github.com/MarkFzp/mobile-aloha/blob/main/LICENSE (MIT); confirmed
    also via HF tags e.g. https://huggingface.co/datasets/lerobot/aloha_mobile_wipe_wine
    (license:mit) RE-VERIFIED: GitHub LICENSE file (https://raw.githubusercontent.com/MarkFzp/mobile-aloha/main/LICENSE)
    confirms MIT; HF dataset card tags also confirm ''license:mit'' for all 6 lerobot/aloha_mobile_*
    mirrors.'
  raw_format: 'https://github.com/MarkFzp/mobile-aloha/blob/main/README.md (record_episodes.py
    ''will store a hdf5 file'') RE-VERIFIED via record_episodes.py: episodes stored
    as HDF5 with datasets qpos(14), qvel(14), effort(14), action(14), base_action(2),
    and per-camera RGB image arrays.'
  collection_method: 'arXiv paper abstract, https://arxiv.org/abs/2401.02117: ''low-cost
    and whole-body teleoperation system for data collection'''
  embodiment_class: arXiv paper 2401.02117 - bimanual mobile manipulator (two arms
    + wheeled mobile base)
  robot_platform: arXiv paper 2401.02117, references [3] 'Viperx 300 6dof' (Trossen/Interbotix
    ViperX-300 arms used for both master and puppet arms)
  is_multi_embodiment: 'arXiv 2401.02117: all 278 released episodes across the 6 tasks
    use the same single robot embodiment (bimanual ViperX-300 arms + AgileX Tracer
    mobile base). The paper''s co-training uses a SEPARATE existing dataset (static
    ALOHA, no mobile base) as an auxiliary training signal, but that is not part of
    the Mobile ALOHA dataset release itself, so the dataset is single-embodiment.'
  num_arms: 'arXiv paper 2401.02117, Figure 2/Hardware Details: two ViperX 300 puppet
    arms (bimanual)'
  dof_per_arm: 'arXiv paper 2401.02117, hardware table: ''#Dofs 14 (arms) + 2 (base)''
    => 14/2 arms = 7 DoF per arm (6 joints + 1 gripper), and action text ''aarms in
    R14 which includes two continuous gripper actions'''
  gripper_type: arXiv paper 2401.02117 and https://github.com/MarkFzp/mobile-aloha
    README (ViperX 300 parallel-jaw gripper, current-limited gripper motor XM430-W350)
  has_mobile_base: 'arXiv paper 2401.02117: ''augments the ALOHA system with a mobile
    base'' (AgileX Tracer base); README Step 4 ''Setup the AgileX Tracer base'''
  action_space: 'arXiv paper 2401.02117, Sec 3/4: bimanual actions are ''target joint
    positions aarms in R14'', base actions are ''target base linear and angular velocities
    abase in R2'' -> heterogeneous/mixed action space'
  action_frame: 'arXiv paper 2401.02117: actions formulated as ''target joint positions''
    (absolute targets, not deltas)'
  rotation_representation: 'arXiv paper 2401.02117: action/state space is joint-space
    (target joint positions), no explicit end-effector rotation representation used'
  state_dim: 'CORRECTED from 16 to 14 on re-verification. arXiv 2401.02117 Sec 4 (training
    objective): ''o^i is the observation consisting of two wrist camera RGB observations,
    one egocentric top camera RGB observation, and joint positions of the arms'' --
    i.e. proprioceptive state is qpos only (14-dim, 7 per arm incl. gripper), NOT
    the 16-dim vector (paper''s 16-dim figure describes the ACTION space: 14 arm joint
    targets + 2 base linear/angular velocity targets, per ''we concatenate the 14-DoF
    joint positions of ALOHA with the linear and angular velocity of the mobile base,
    forming a 16-dimensional action vector''). Confirmed by raw HDF5 layout in https://github.com/MarkFzp/mobile-aloha/blob/main/aloha_scripts/record_episodes.py
    (''/observations/qpos'' (14,), ''/action'' (14,), ''/base_action'' (2,) stored
    as SEPARATE datasets, base velocity only appears on the action side) and by HF
    LeRobot mirrors (e.g. https://huggingface.co/datasets/lerobot/aloha_mobile_cabinet
    meta/info.json: ''observation.state'' shape [14], though those mirrors also drop
    base_action entirely from ''action'' -- see action_dim note).'
  action_dim: 'arXiv paper 2401.02117: ''concatenate the 14-DoF joint positions of
    ALOHA with the linear and angular velocity of the mobile base, forming a 16-dimensional
    action vector'' RE-VERIFIED unchanged at 16 (14 arm joint targets + 2 base linear/angular
    velocity targets), per arXiv 2401.02117 and raw HDF5 layout in record_episodes.py
    (''/action'' (14,) + ''/base_action'' (2,)). Note: the publicly released HF LeRobot
    mirrors (lerobot/aloha_mobile_*) only expose the 14-dim arm ''action'' feature
    and drop base_action entirely, so 16 reflects the raw/original HDF5 release (this
    pipeline''s raw_format target), not the LeRobot re-encoded mirrors.'
  fps: 'arXiv paper 2401.02117, hardware section: ''streaming from three Logitech
    C922x RGB webcams, at 480x640 resolution and 50Hz'' RE-VERIFIED: HF LeRobot mirrors''
    meta/info.json report fps=50 for all 6 released task datasets, and video_info.fps=50.0
    for every camera stream, consistent with the paper''s main-text figure of 50Hz.
    NOTE: Appendix A.2 of the same paper separately states cameras ''stream at a resolution
    of 480x640 and a frame rate of 30 frames per second'' when describing the example
    image figure -- this appears to be an inconsistency/error within the paper itself;
    the actual released dataset (HF LeRobot mirrors, which mirror the raw HDF5 episode
    structure) is unambiguously 50Hz, so 50.0 is kept as the field value.'
  fps_variable: arXiv paper 2401.02117 - fixed 50Hz camera/control rate reported for
    all cameras and control loop
  num_camera_views: 'arXiv paper 2401.02117, Figure 2 caption: ''Mobile ALOHA has
    two wrist cameras and one top camera''; confirmed by aloha_scripts/constants.py
    camera_names [''cam_high'',''cam_left_wrist'',''cam_right_wrist''] at https://github.com/MarkFzp/mobile-aloha/blob/main/aloha_scripts/constants.py
    RE-VERIFIED via https://raw.githubusercontent.com/MarkFzp/mobile-aloha/main/aloha_scripts/constants.py
    camera_names=[''cam_high'',''cam_left_wrist'',''cam_right_wrist''] for all released
    mobile task configs.'
  camera_views: 'arXiv paper 2401.02117 Sec on image observations: ''the top egocentric
    camera, the left wrist camera, and the right wrist camera. The top camera is stationary
    with respect to the robot frame'''
  depth_coverage: 'arXiv paper 2401.02117: cameras specified as ''Logitech C922x RGB
    webcams'' (RGB-only, no depth sensor mentioned)'
  additional_modalities: Raw HDF5 layout in https://github.com/MarkFzp/mobile-aloha/blob/main/aloha_scripts/record_episodes.py
    logs '/observations/effort' (14,) per timestep (Dynamixel motor current/load,
    a joint-level force/torque proxy) in addition to qpos/qvel/images; confirmed present
    in HF LeRobot mirrors as 'observation.effort' feature, e.g. https://huggingface.co/datasets/lerobot/aloha_mobile_wipe_wine
    meta/info.json. Mapped to force_torque; note this is joint-level motor effort/current,
    not a dedicated 6-axis wrist F/T sensor, so treat with some caution -- flagged
    for human review.
  has_language_instruction: 'HF LeRobot mirrors (e.g. https://huggingface.co/datasets/lerobot/aloha_mobile_wipe_wine
    meta/info.json ''total_tasks'': 1) each episode is tagged with a fixed task/language
    description string'
  num_task_types: 'Official released LeRobot mirrors under https://huggingface.co/lerobot
    : aloha_mobile_wipe_wine, aloha_mobile_shrimp, aloha_mobile_wash_pan, aloha_mobile_cabinet,
    aloha_mobile_chair, aloha_mobile_elevator = 6 distinct tasks with public data
    (paper describes a 7th task, High Five, for which no public dataset release was
    found)'
  urdf_available: Trossen/Interbotix official description package https://github.com/Interbotix/interbotix_ros_manipulators/blob/main/interbotix_ros_xsarms/interbotix_xsarm_descriptions/urdf/vx300s.urdf.xacro
    provides the ViperX-300(S) arm URDF used by ALOHA/Mobile ALOHA
  urdf_source: https://github.com/Interbotix/interbotix_ros_manipulators (Interbotix/Trossen
    Robotics is the arm manufacturer; official xsarm_descriptions repo)
  expected_size_gb: 'CORRECTED from 30.0 to 30.7 on re-verification (more precise
    figure from same source): HF Hub API ''usedStorage'' for the 6 lerobot/aloha_mobile_*
    mirrors (wipe_wine=4785799211, shrimp=4840468250, wash_pan=4248007365, cabinet=8592773406,
    chair=6383061410, elevator=1806065863 bytes) sums to 30656175505 bytes = ~30.7
