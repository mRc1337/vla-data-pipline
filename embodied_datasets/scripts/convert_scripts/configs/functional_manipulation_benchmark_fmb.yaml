id: functional_manipulation_benchmark_fmb
name: Functional Manipulation Benchmark (FMB)
source_url: https://functional-manipulation-benchmark.github.io/
paper_url: https://arxiv.org/abs/2401.08553
license: CC-BY-4.0
raw_format: Custom
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods:
- autonomous_policy
is_multi_embodiment: false
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
hand_pose_representation: none
has_mobile_base: false
action_space: eef_pose
action_frame: delta
rotation_representation: euler_xyz
action_dim: 7
fps: 10.0
fps_variable: false
num_camera_views: 4
camera_views:
- side
- wrist
has_synchronized_multiview_rig: true
has_camera_calibration: true
depth_coverage: full
additional_modalities:
- force_torque
has_language_instruction: true
num_task_types: 2
urdf_available: true
urdf_source: manufacturer_official
expected_size_gb: 778.0
expected_num_episodes: 22550
expected_duration_hours: 31.32
num_objects: 66
review_status: pending_human_review
field_sources:
  source_url: Verified reachable; project homepage title/authors match recorded name
    'Functional Manipulation Benchmark (FMB)' -- https://functional-manipulation-benchmark.github.io/
  paper_url: New field, filled. arXiv abstract page confirms title match and IJRR
    2024 publication venue -- https://arxiv.org/abs/2401.08553
  license: 'Site footer: ''All data is provided under the Creative Commons Attribution
    4.0 International License.'' (same statement on homepage and dataset page); HF
    dataset card also lists License: cc-by-4.0 -- https://functional-manipulation-benchmark.github.io/dataset/index.html
    and https://huggingface.co/datasets/charlesxu0124/functional-manipulation-benchmark'
  raw_format: 'Dataset page ''Data Format'' section: each zip contains a folder of
    trajectories, each trajectory saved as a single .npy file containing a dict of
    numpy arrays (obs/side_1, obs/tcp_pose, action, primitive, object_info, ...) --
    not RLDS/HDF5/LeRobot as distributed -- https://functional-manipulation-benchmark.github.io/dataset/index.html'
  release_type: Re-confirmed unchanged. The benchmark's primary released artifact
    is the fixed set of 22,550 downloadable demonstration trajectories (zip archives
    of .npy files); it is not a generation framework, scene platform, or RL benchmark
    env -- https://functional-manipulation-benchmark.github.io/dataset/index.html
  collection_method: 'Paper Sec. 3.5 ''Robotic System and Data Collection'': ''To
    tele-operate the robot, we use a SpaceMouse to command 6 DoF end-effector twist
    at 10 Hz, which is then tracked by a low-level impedance controller running at
    1K Hz.'' -- arXiv:2401.08553'
  secondary_collection_methods: 'New field, filled with [autonomous_policy]. Paper
    Sec. 3.2 ''Repositioning'': ''Since objects land in the fixture in a relatively
    deterministic fashion, we partially script our demonstration collection process
    while maintaining a certain degree of randomness for the purpose of data diversity.''
    This applies to the Place_on_fixture and Regrasp primitives (2,250 trajectories
    each per Table 1, 4,500/22,550 total). Mapping ''partially scripted'' collection
    to the closest enum (autonomous_policy) is an interpretive judgment call; flagged
    for human review -- arXiv:2401.08553 (Sec. 3.2)'
  is_multi_embodiment: New field, filled (false). Every trajectory across both Single-Object
    and Multi-Object tasks was collected on the same single Franka Panda arm (Table
    1, Sec. 3.5); no other embodiment is described -- arXiv:2401.08553
  embodiment_class: 'Paper Sec. 3.5 and homepage: single Franka Panda arm (''We collected
    a total of 22,550 trajectories ... on a Franka Panda arm'') -- https://functional-manipulation-benchmark.github.io/
    and arXiv:2401.08553'
  robot_platform: 'Homepage: ''We collected a total of 22,550 trajectories across
    two different tasks on a Franka Panda arm.''; Paper Sec. 3.5: ''We use a Franka
    Panda robot to collect our dataset'' -- https://functional-manipulation-benchmark.github.io/
    and arXiv:2401.08553'
  num_arms: 'Single Franka Panda robot described throughout homepage, dataset page,
    and paper Sec. 3.5 (Fig. 8: ''a standard Franka arm equipped with four cameras'')
    -- no second arm mentioned anywhere -- https://functional-manipulation-benchmark.github.io/'
  dof_per_arm: 'Dataset page Data Format: obs/q is a (N, 7) numpy array of joint positions
    and obs/dq is (N, 7) joint velocities, i.e. 7-DoF Franka Panda arm -- https://functional-manipulation-benchmark.github.io/dataset/index.html'
  gripper_type: 'Dataset page: obs/gripper_pose is a binary (N,) array (0=open, 1=closed);
    robot_infra README --gripper_dist flag sets Franka parallel-jaw gripper opening
    distance -- https://functional-manipulation-benchmark.github.io/dataset/index.html
    and https://github.com/rail-berkeley/fmb/blob/main/robot_infra/README.md'
  hand_pose_representation: New field, filled (none). Parallel-jaw gripper with only
    a binary open/closed state (obs/gripper_pose); no dexterous hand, MANO, or keypoint
    hand-pose data recorded -- consistent with convention used for other parallel-jaw-gripper
    datasets in this registry -- https://functional-manipulation-benchmark.github.io/dataset/index.html
  has_mobile_base: Fixed-base Franka Panda arm on a tabletop workspace throughout
    paper Fig. 8 and homepage videos; no mobile base component described -- arXiv:2401.08553
    (Fig. 8) and https://functional-manipulation-benchmark.github.io/
  action_space: 'Dataset page: ''action a (N, 7) numpy array of the commanded cartesian
    action (XYZ, RPY, gripper)''; paper line: ''7DoF actions'' -- end-effector Cartesian
    pose/twist command, not joint control -- https://functional-manipulation-benchmark.github.io/dataset/index.html
    and arXiv:2401.08553'
  action_frame: 'Re-verified at the code level (stronger evidence than the prior pass):
    robot_infra/envs/franka_fmb_env.py FrankaFMB.step(action): ''self.nextpos[:3]
    = self.nextpos[:3] + a'' (a = action[:3]) and ''self.nextpos[3:] = (Rotation.from_euler(''xyz'',
    action[3:6]) * Rotation.from_quat(self.currpos[3:])).as_quat()'' -- the commanded
    action is explicitly added/composed onto the current pose each control step, confirming
    delta (not absolute) end-effector control -- https://github.com/rail-berkeley/fmb/blob/main/robot_infra/envs/franka_fmb_env.py
    and arXiv:2401.08553 (Sec. 3.5, SpaceMouse twist command)'
  rotation_representation: 'Re-verified at the code level: same franka_fmb_env.py
    step() composes the rotation delta via Rotation.from_euler(''xyz'', action[3:6]),
    i.e. the action''s orientation component is an XYZ Euler (RPY) delta rotation,
    matching the dataset page''s ''action a (N, 7) ... (XYZ, RPY, gripper)'' description
    -- https://github.com/rail-berkeley/fmb/blob/main/robot_infra/envs/franka_fmb_env.py
    and https://functional-manipulation-benchmark.github.io/dataset/index.html'
  action_dim: 'Dataset page: ''action a (N, 7) numpy array of the commanded cartesian
    action (XYZ, RPY, gripper)''; paper explicitly states ''7DoF actions'' -- https://functional-manipulation-benchmark.github.io/dataset/index.html
    and arXiv:2401.08553'
  fps: 'Paper Sec. 3.5: SpaceMouse commands are issued at 10 Hz (''command 6 DoF end-effector
    twist at 10 Hz''); this is the demonstration/action logging rate (separate from
    the 1 KHz low-level impedance controller) -- arXiv:2401.08553'
  fps_variable: Paper Sec. 3.5 describes a single fixed 10 Hz teleoperation command
    rate for all demonstrations, no mention of variable-rate logging -- arXiv:2401.08553
  num_camera_views: 'Paper Sec. 3.5: ''we have four Intel RealSense D405 cameras,
    two of which are mounted on the robot end-effector, and the rest are placed on
    each side of the bin''; dataset page lists exactly 4 camera keys (side_1, side_2,
    wrist_1, wrist_2) -- arXiv:2401.08553 and https://functional-manipulation-benchmark.github.io/dataset/index.html'
  camera_views: Re-verified. Dataset page keys obs/side_1, obs/side_2 (bin-side third-person-style
    cameras) map to 'side'; obs/wrist_1, obs/wrist_2 (two cameras mounted on the single
    arm's end-effector, per paper Sec. 3.5 Fig. 7) map to 'wrist'. The CameraView
    enum in schema.py now includes a first-class WRIST = "wrist" value (added since
    the prior onboarding pass, which had suggested it as a new enum value under the
    catch-all "other") -- confirmed still correct, no change needed, and the earlier
    suggested_new_enum_values entry for this field is now obsolete and removed --
    https://functional-manipulation-benchmark.github.io/dataset/index.html
  has_synchronized_multiview_rig: 'New field, filled (true). Paper Sec. 3.5: ''In
    total, we have four Intel RealSense D405 cameras ... We simultaneously capture
    RGB and depth images from these cameras''; dataset page stores all 4 RGB + 4 depth
    arrays indexed by the same per-timestep index N within a single trajectory .npy
    file, confirming frame-synchronized multi-camera capture -- arXiv:2401.08553 (Sec.
    3.5) and https://functional-manipulation-benchmark.github.io/dataset/index.html'
  has_camera_calibration: 'Paper Sec. 3.5: ''we also provide calibrated camera intrinsics.
    This calibration allows for the conversion of depth images into point clouds'';
    dataset page provides downloadable intrinsics files for all 4 cameras -- arXiv:2401.08553
    and https://functional-manipulation-benchmark.github.io/dataset/index.html'
  depth_coverage: 'Paper Sec. 3.5: ''We simultaneously capture RGB and depth images
    from these cameras'' (all four); dataset page lists a *_depth array for every
    one of the 4 camera keys (side_1_depth, side_2_depth, wrist_1_depth, wrist_2_depth)
    -- full depth coverage across all views -- arXiv:2401.08553 and https://functional-manipulation-benchmark.github.io/dataset/index.html'
  additional_modalities: 'New field, filled ([force_torque]). Paper Sec. 3.5: ''We
    also log the end-effector force/torque information provided by the Franka Panda
    robot''; dataset page keys obs/tcp_force (N,3) and obs/tcp_torque (N,3) confirm
    this is stored per trajectory (estimated via Franka''s internal model, not a dedicated
    F/T sensor, but still a real logged modality) -- arXiv:2401.08553 (Sec. 3.5) and
    https://functional-manipulation-benchmark.github.io/dataset/index.html'
  has_language_instruction: CORRECTED from false to true on re-verification. The raw
    distributed .npy trajectories themselves have no natural-language field (only
    categorical primitive/object_info labels), which is what the prior pass checked
    -- but the official FMB GitHub repo also ships fmb_dataset_builder/fmb_dataset/fmb_dataset_dataset_builder.py,
    which is the sanctioned way to convert this data to RLDS/TFDS for policy training,
    and it generates a templated natural-language 'language_instruction' (e.g. "Insert
    the {object} object.", "Regrasp the {object} object.") plus a Universal-Sentence-Encoder
    'language_embedding' for every timestep and episode, keyed off primitive + object
    identity. This is official, code-level evidence of a language-instruction-bearing
    release path, so the field is corrected to true -- https://github.com/rail-berkeley/fmb/blob/main/fmb_dataset_builder/fmb_dataset/fmb_dataset_dataset_builder.py
  num_task_types: 'Paper explicitly names two top-level tasks: Sec. 3.3 ''Single-Object
    Multi-Stage Manipulation Tasks'' and Sec. 3.4 ''Multi-Object Multi-Stage Manipulation
    Tasks''; homepage ''Dataset Overview'' likewise presents exactly these two tasks
    -- arXiv:2401.08553 and https://functional-manipulation-benchmark.github.io/'
  urdf_available: 'robot_infra README: robot is a standard Franka Emika Panda (or
    FR3) controlled via libfranka/franka_ros >= 0.8.0, the official Franka Emika ROS
    stack which ships the manufacturer''s franka_description URDF/xacro package for
    these arms -- https://github.com/rail-berkeley/fmb/blob/main/robot_infra/README.md'
  urdf_source: 'Same as above: franka_ros/franka_description is the manufacturer (Franka
    Emika)-maintained official package, not bundled directly in the FMB repo itself
    (no .urdf/.xacro files found in rail-berkeley/fmb repo tree) -- https://github.com/rail-berkeley/fmb/blob/main/robot_infra/README.md'
  expected_size_gb: 'Dataset page download links: Single-Object Multi-Stage Full Dataset
    (545GB) + Multi-Object Assembly 1 (86GB) + Assembly 2 (77GB) + Assembly 3 (70GB)
    = 778GB total -- https://functional-manipulation-benchmark.github.io/dataset/index.html'
  expected_num_episodes: 'Paper Sec. 3.5 and Table 1: ''the 22,550 demonstration trajectories
    that we collected and released as part of the benchmark'' (Table 1 subtotal column
    also sums to 22,550); homepage and HF dataset card state the same figure -- arXiv:2401.08553
    and https://functional-manipulation-benchmark.github.io/'
  expected_duration_hours: 'New field, filled (~31.32). Paper Table 1 caption: ''Each
    trajectory is approximately 5 seconds in length, for a total of 22,550 trajectories.''
    22,550 * 5s / 3600 = 31.32 hours; this is an estimate derived from a stated average
    duration rather than a directly reported total, flagged for human sanity-check
    -- arXiv:2401.08553 (Table 1 caption, Sec. 3.5)'
  num_objects: 'New field, filled (66). Homepage/paper Sec. 3.3: Single-Object task
    uses ''54 different assembly objects''; paper Sec. 3.4: Multi-Object task presents
    ''three sets of more challenging objects for assembly ... each set contains 4
    interlocking objects'' = 3*4 = 12 objects. Total distinct manipulated objects
    across both tasks = 54 + 12 = 66 -- arXiv:2401.08553 (Sec. 3.3-3.4) and https://functional-manipulation-benchmark.github.io/'
suggested_new_enum_values: {}
