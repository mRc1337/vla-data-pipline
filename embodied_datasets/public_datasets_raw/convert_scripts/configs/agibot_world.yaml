id: agibot_world
name: AgiBot-World
source_url: https://huggingface.co/datasets/agibot-world/AgiBotWorld2026
raw_format: LeRobot
release_type: fixed_episode_dataset
collection_method: teleop
secondary_collection_methods: []
embodiment_class: dual_arm
num_arms: 2
action_space: mixed
num_camera_views: 9
camera_views:
- head
- left_wrist
- right_wrist
has_camera_calibration: true
depth_coverage: partial
additional_modalities: []
has_language_instruction: true
num_task_types: 29
expected_size_gb: 9362.0
review_status: pending_human_review
field_sources:
  source_url: Verified reachable (HTTP 200); page title/card confirms 'agibot-world/AgiBotWorld2026'
    dataset, matching the stub's recorded name/id -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026
  raw_format: 'HF README.md ''Dataset Structure'' section: ''LeRobot version reference:
    v2.1'' -- data stored as meta/ (jsonl+json), data/ (Apache Parquet per episode),
    videos/ (MP4 per camera per episode) -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  collection_method: 'HF README.md Overview: ''Collected on the AGIBOT G2 robot platform
    through a free-form collection mode''; Annotation Layers section documents ''take_over''
    and ''Intervention Frame'' fields indicating supervised/corrected teleoperation
    (consistent with the original AgiBot World paper''s teleoperator + failure-recovery
    collection protocol) -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  embodiment_class: HF dataset card tags include 'dual-arm' -- https://huggingface.co/api/datasets/agibot-world/AgiBotWorld2026
    (cardData.tags)
  num_arms: Same 'dual-arm' tag, plus README schema example keys state/left_effector/position
    and state/right_effector/position confirming two arms -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md
  action_space: 'README.md ''State and Action Vectors'' example keys: action/joint/position
    and action/robot/velocity -- i.e. joint-position control for arms plus a separate
    velocity command channel (likely base/whole-body), which does not map to a single
    pure action_space value -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  num_camera_views: 'README.md ''Camera Feature Keys'' section lists 9 observation.images.*
    keys: top_head, hand_left, hand_right, head_depth, head_left_fisheye, head_right_fisheye,
    head_back_fisheye_color, head_stereo_left_color, head_stereo_right_color -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  camera_views: 'Same camera key list mapped to semantic categories: top_head/head_depth/head_*fisheye*/head_stereo_*
    -> head; hand_left -> left_wrist; hand_right -> right_wrist -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  has_camera_calibration: README.md notes info.json includes an optional 'camera_parameters'
    field, and camera key list includes stereo pairs (head_stereo_left_color/head_stereo_right_color)
    which require calibration -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md
  depth_coverage: Only 1 of the 9 documented camera keys (observation.images.head_depth)
    is a depth stream; the rest are RGB/fisheye/stereo-color -- partial depth coverage
    -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md
  has_language_instruction: 'README.md Annotation Layers: Task Frame entries carry
    a natural-language ''frame_detail.comment'' (subtask instruction) and Instruction
    Segments carry a step-level ''instruction'' field -- https://huggingface.co/datasets/agibot-world/AgiBotWorld2026/raw/main/README.md'
  num_task_types: 'Directory listing via HF tree API: ImitationLearning/CommercialSpaces
    (12 task_XXXX dirs) + ImitationLearning/Home (1) + RichInteraction/CommercialSpaces
    (6) + RichInteraction/Home (4) = 23 real-world tasks, plus simulation/ contains
    6 distinct simulated task types (scoop_popcorn_to_bucket, take_bagged_food_to_cart,
    take_cup_to_cart, take_drink_to_cart, take_laundry_detergent_to_cart, tidy_up_food_in_freezer)
    = 29 total -- https://huggingface.co/api/datasets/agibot-world/AgiBotWorld2026/tree/main?recursive=true'
  expected_size_gb: Computed by summing the 'size' field of every file entry returned
    by the HF tree API (recursive) for the whole repo (real-world tar.gz task archives
    + simulation lite/lite_depth_patch video archives) -- total ~9,362,161,628,659
    bytes ~= 9362 GB -- https://huggingface.co/api/datasets/agibot-world/AgiBotWorld2026/tree/main?recursive=true
suggested_new_enum_values:
  license: CC-BY-NC-SA-4.0 -- the dataset's HF card metadata, README badge, and License-and-Citation
    section all state 'CC BY-NC-SA 4.0'. The existing enum only offers CC-BY-NC-4.0
    (no ShareAlike clause), which is a materially different license, so the value
    was left unfilled rather than forced to the closest-but-wrong option.
  robot_platform: agibot_g2 -- README Overview explicitly states the dataset was 'Collected
    on the AGIBOT G2 robot platform'. The enum has agibot_g1 (the prior generation,
    used by the original 2024/2025 AgiBot World release) but no entry for the newer
    G2 platform used by this 2026 release.
