review_status: pending_human_review
field_sources:
  license: 'HF dataset card / API tags: license:cc-by-4.0 (https://huggingface.co/datasets/chenwangj/DexCap-Data,
    https://huggingface.co/api/datasets/chenwangj/DexCap-Data). Re-verified 2026-07:
    HF Datasets API tags=["license:cc-by-4.0", ...] still returns cc-by-4.0. Note
    the GitHub code repo (https://github.com/j96w/DexCap/blob/main/LICENSE) is separately
    MIT-licensed, but that covers the collection/training code, not the released dataset
    artifacts, which are the subject of this field.'
  paper_url: 'arXiv 2403.07788, "DexCap: Scalable and Portable Mocap Data Collection
    System for Dexterous Manipulation" (Wang et al., 2024), https://arxiv.org/abs/2403.07788;
    matches arxiv tag on the HF dataset card.'
  raw_format: HF README 'Both raw data (.zip) and postprocessed data (.hdf5) are provided';
    GitHub repo README 'Building Training Dataset' step generates a robomimic-format
    .hdf5 file used for training (https://github.com/j96w/DexCap). Re-verified via
    GitHub API tree listing (STEP2_build_dataset/demo_create_hdf5.py) and HF repo
    siblings list (hand_wiping_1-14_5actiongap_10000points.hdf5, hand_packaging_wild_1-20_5actiongap_10000points.hdf5).
  release_type: HF dataset siblings list is a fixed set of 2 raw .zip + 2 processed
    .hdf5 files covering a fixed 34-episode collection (14 wiping + 20 packaging);
    no mechanism to generate new episodes procedurally is exposed by the released
    dataset itself, so it is a fixed_episode_dataset rather than a generation_framework
    (the GitHub repo j96w/DexCap is itself a data-collection framework/toolkit, but
    the field describes the released dataset at source_url, not the toolkit).
  collection_method: 'arXiv 2403.07788 abstract and Sec.IV-A/IV-C (verified against
    full PDF text): DexCap captures human hand/wrist mocap data (SLAM + EMF gloves),
    and DexIL retargets it to robot actions via inverse kinematics (''Human to Robot''
    section on https://dex-cap.github.io/); no direct teleoperation of the robot is
    used to collect the released wiping/packaging data.'
  secondary_collection_methods: 'Re-verified: the paper describes an optional human-in-the-loop
    correction mode that includes direct teleoperation (Sec.IV-D, ''foot pedal'' switch
    between residual correction and full teleoperation), but the released HF dataset
    files (rawdata_wipe_1-14.zip, rawdata_packaging_wild_1-20.zip and their .hdf5
    counterparts) contain only the primary DexCap mocap-to-robot-synthesis data, no
    separate teleoperation-correction files by name; left empty for this release.'
  is_multi_embodiment: 'arXiv 2403.07788 Sec.III/IV: all released data targets a single
    fixed robot embodiment (bimanual Franka Emika arms + LEAP dexterous hands); the
    dataset is not a cross-embodiment collection covering multiple distinct robot
    platforms.'
  embodiment_class: HF README raw data structure records human wrist 6-DoF poses (pose_2.txt/pose_3.txt)
    and finger joint positions (left_hand_joint.txt/right_hand_joint.txt) captured
    on a human via mocap glove, not robot joint states
  robot_platform: 'arXiv 2403.07788 Sec.III (verified against full PDF text): ''a
    bimanual dexterous robot setup. This setup comprises two Franka Emika robot arms,
    each equipped with a LEAP dexterous robotic hand'' (exact Franka model variant,
    e.g. Panda vs FR3, still not stated anywhere in paper/repo/website; FRANKA_PANDA
    kept as closest enum match, unresolved ambiguity)'
  num_arms: 'arXiv 2403.07788 Sec.III: bimanual setup with two Franka Emika robot
    arms; website ''Bimanual Manipulation Task'' section (https://dex-cap.github.io/)'
  dof_per_arm: 'arXiv 2403.07788 Sec.IV-C (verified via PDF text extraction): ''the
    action output includes two 7-DoF robot arms and two 16-DoF dexterous hands'''
  dof_per_hand: 'arXiv 2403.07788 Sec.III: ''a LEAP dexterous robotic hand (a four-fingered
    hand with 16 joints)''; Sec.IV-C: ''two 16-DoF dexterous hands''; GitHub repo
    STEP2_build_dataset/leap_hand_mesh/robot.urdf models the same 16-joint LEAP hand.'
  gripper_type: 'arXiv 2403.07788 Sec.III: ''a LEAP dexterous robotic hand (a four-fingered
    hand with 16 joints)''; GitHub repo STEP2_build_dataset/leap_hand_mesh/ contains
    LEAP hand URDF and mesh files used for IK retargeting'
  hand_pose_representation: 'arXiv 2403.07788 Sec.IV-A (full PDF text, p.3): ''The
    6-DoF pose of the wrist p_t = [R_t | T_t] and the finger joint positions J_t of
    the LEAP hands are then used as the robot''s proprioception'' -- J_t denotes the
    retargeted LEAP hand''s per-joint positions (16-dim joint angles), which is the
    representation stored in the released robomimic-format .hdf5 files used for training.
    (Note: the raw, pre-retargeting human mocap glove data instead stores 3D fingertip
    keypoint positions in left_hand_joint.txt/right_hand_joint.txt -- this field reflects
    the primary/processed HDF5 representation, consistent with raw_format=HDF5.)'
  has_mobile_base: No mobile base described anywhere in the paper, website, or GitHub
    repo; setup is a fixed tabletop dual-arm Franka rig (arXiv 2403.07788 Sec.III,
    https://dex-cap.github.io/)
  action_space: 'arXiv 2403.07788 Sec.IV-C (verified via PDF text extraction): ''the
    learned policy generates the goal position for the next step, which encompasses
    the 6-DoF pose of the end-effector for both robot arms and a 16-dimensional finger
    joint position for both hands'' (EEF pose + joint position = mixed)'
  action_frame: 'arXiv 2403.07788 Sec.IV-C: policy ''generates the goal position for
    the next step'' (absolute goal, not a delta); the optional human-in-the-loop ''residual
    correction'' delta mode (Sec.IV-D) is a separate fine-tuning-only mechanism, not
    part of the released wiping/packaging dataset files, and not the primary action
    representation.'
  rotation_representation: 'arXiv 2403.07788 Sec.IV-A, confirmed via full PDF text
    extraction (arxiv.org/pdf/2403.07788, p.3): ''The 6-DoF pose of the wrist p_t
    = [R_t | T_t] ... '' i.e. rotation matrix R_t plus translation T_t.'
  fps: 'arXiv 2403.07788 Sec.V (verified via PDF text): ''Data were initially recorded
    at 60Hz and then downsampled to 20Hz to match the robot''s control speed''; also
    Sec.IV-C ''Both the robot arms and the LEAP hands operate at a control frequency
    of 20Hz.'''
  fps_variable: 'arXiv 2403.07788 Sec.III (verified via PDF text): system ''supports
    a 15-minute collection at peak frame rate (60 fps). Once the RAM is full, data
    capture slows to 20 fps due to storage shifting to the SSD'''
  num_camera_views: 'arXiv 2403.07788 Sec.III/Appendix A-A (verified via PDF text):
    hardware has one chest-mounted L515 RGB-D LiDAR camera providing the RGB-D observation
    stream; the three T265 fisheye cameras (one fixed on the rack, two detachable
    onto the gloves) are used only for SLAM-based 6-DoF pose tracking, not published
    as separate observation image streams. Confirmed by data-type enumeration in Appendix
    C: ''(4) RGB-D image frames from [the LiDAR camera]'' is the only image stream
    listed; HF README raw structure only lists one color_image.jpg/depth_image.png
    pair per frame.'
  camera_views: 'Same source as num_camera_views. Verified still correct: the single
    published camera is mounted on a chest rack worn by the human data collector during
    capture (then swapped onto a stationary rack near the robot for deployment/eval)
    -- this matches the body_worn CameraView enum value now present in schema.py.
    (A prior pass had proposed adding a new chest_mounted/body_worn enum value; body_worn
    was since added to the CameraView enum, so no further schema change is needed
    here -- see suggested_new_enum_values, now cleared.)'
  has_camera_calibration: GitHub repo includes STEP1_collect_data/default_offset/calib_offset.txt,
    calib_offset_left.txt, calib_ori_offset.txt, calib_ori_offset_left.txt and calculate_offset_vis_calib.py
    for camera/SLAM drift calibration (re-verified via GitHub API tree listing); arXiv
    2403.07788 Sec.III describes the initial known-pose calibration step for the chest
    camera rack
  depth_coverage: 'HF README raw data structure: every frame includes depth_image.png
    from the chest-mounted RGB-D camera'
  additional_modalities: Checked paper (full text), HF dataset card, and GitHub repo
    for force/torque, tactile, audio, or eye-gaze sensing -- none mentioned anywhere;
    the only sensing modalities are RGB-D vision, SLAM-based 6-DoF pose, and EMF-glove
    finger joint tracking, none of which map to the SensorModality enum options.
  has_synchronized_multiview_rig: 'arXiv 2403.07788 Sec.III/Appendix A-A: only one
    camera (L515 RGB-D LiDAR) produces published visual observations; the three T265
    cameras are pose-tracking-only (SLAM/IMU) and are not a synchronized multi-view
    image-capture rig in the sense of multiple simultaneous scene views for training
    -- set to false since there is effectively a single observation viewpoint, not
    a multi-camera rig.'
  has_language_instruction: No language instruction annotations mentioned in the HF
    dataset card, GitHub repo, or paper; raw/hdf5 structure only contains images,
    poses, and joint data for robomimic-style imitation learning
  num_task_types: 'HF dataset card: ''30 minutes of mocap data for the wiping task
    and 60 minutes of in-the-wild mocap data for the packaging task'' (2 released
    task types; the paper separately evaluates 6 tasks in total across lab experiments,
    but only 2 -- wiping and packaging -- are included in this public dataset release)'
  urdf_available: GitHub repo (https://github.com/j96w/DexCap) STEP2_build_dataset/leap_hand_mesh/
    contains robot.urdf, robot_pybullet.urdf, robot_left.urdf, robot_left_pybullet.urdf,
    robot_left_pybullet_2.urdf plus matching .stl meshes for the LEAP hand, used for
    PyBullet IK retargeting (re-verified via GitHub API recursive tree listing)
  urdf_source: Same GitHub repository linked from the HF dataset card as the official
    'Repository'
  expected_size_gb: 'HF Datasets API https://huggingface.co/api/datasets/chenwangj/DexCap-Data
    field ''usedStorage'': 107829983730 bytes = 107.83 GB (decimal GB convention;
    re-verified 2026-07, value unchanged)'
  expected_num_episodes: 'Inferred from HF repo file names: rawdata_wipe_1-14.zip
    / hand_wiping_1-14_5actiongap_10000points.hdf5 (episodes 1-14, 14 episodes) and
    rawdata_packaging_wild_1-20.zip / hand_packaging_wild_1-20_5actiongap_10000points.hdf5
    (episodes 1-20, 20 episodes); total 14+20=34 (re-verified via HF API siblings
    list, unchanged)'
  expected_duration_hours: 'HF dataset card Dataset Summary: ''30 minutes of mocap
    data for the wiping task and 60 minutes of in-the-wild mocap data for the packaging
    task'' = 90 minutes = 1.5 hours total across the two released task types.'
suggested_new_enum_values: {}
