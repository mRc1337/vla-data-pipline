id: roboset
name: RoboSet
source_url: https://robopen.github.io/roboset/
paper_url: https://arxiv.org/abs/2309.01918
license: MIT
raw_format: HDF5
release_type: fixed_episode_dataset
collection_method: kinesthetic
secondary_collection_methods:
- teleop
- autonomous_policy
is_multi_embodiment: false
embodiment_class: single_arm
robot_platform: franka_panda
num_arms: 1
dof_per_arm: 7
gripper_type: parallel_jaw
has_mobile_base: false
action_space: joint_position
action_frame: absolute
rotation_representation: none
state_dim: 8
action_dim: 8
fps: 5.0
fps_variable: false
num_camera_views: 4
camera_views:
- top
- side
- wrist
has_synchronized_multiview_rig: true
depth_coverage: full
additional_modalities:
- force_torque
has_language_instruction: true
num_task_types: 38
urdf_available: true
urdf_source: manufacturer_official
expected_num_episodes: 30050
expected_duration_hours: 70.12
num_scenes: 4
review_status: pending_human_review
field_sources:
  license: 'robopen.github.io/roboset/ page footer states: ''This work is licensed
    under the MIT-License''; confirmed in github.com/robopen/roboagent README License
    section (''The RoboAgent code and RoboSet datasets are both licensed under MIT
    License'').'
  raw_format: 'Re-verified: arXiv:2309.01918 Appendix A: ''The data was collected
    ... and saved in HDF5 format.'' robopen.github.io/roboset/ code snippet loads
    trials via h5py.File(...).'
  embodiment_class: 'arXiv:2309.01918 (RoboAgent paper) Section 4 / Appendix B.1:
    single fixed-base Franka Emika Panda arm in a table-top kitchen setup, no mobile
    base described.'
  robot_platform: 'arXiv:2309.01918 Section 4: ''a Franka Emika Panda arm with a two-finger
    Robotiq gripper''; github.com/robopen/roboagent README: ''evaluating on Franka
    Panda arms''.'
  num_arms: arXiv:2309.01918 describes a single Franka Panda arm throughout the RoboSet/RoboAgent
    system.
  dof_per_arm: 'arXiv:2309.01918 Appendix B.1: action space is ''8 (7 joint positions,
    1 dimension for end-effector open/close)'', i.e. the standard 7-DOF Franka Panda
    arm.'
  gripper_type: 'arXiv:2309.01918 Section 4: ''two-finger Robotiq gripper fitted with
    Festo Adaptive Fingers'' (Robotiq 2F-85/140 is a parallel-jaw gripper). Note:
    a separate, much larger ~70,000-trajectory autonomous bin-picking release described
    in the same paper''s Appendix A footnote and on robopen.github.io/roboset/autonomous.html
    includes some subsets (e.g. Set 13/15/16, ''D''Manus hand'') using a dexterous-hand
    end-effector instead; that release is not counted in this config''s episode/field
    values, which describe the core teleop+kinesthetic RoboSet.'
  has_mobile_base: 'arXiv:2309.01918 Section 4: fixed table-top/kitchen setup with
    a stationary Franka arm; no mobile base is mentioned anywhere in the paper or
    project site.'
  action_space: 'arXiv:2309.01918 Appendix B.1: ''The robot ... is operated with joint
    position control, with an action space dimension of 8 (7 joint positions, 1 dimension
    for end-effector open/close)''.'
  rotation_representation: 'arXiv:2309.01918 Appendix B.1: the 8-dim action space
    is pure joint-position + gripper; no explicit end-effector orientation/rotation
    representation is used for actions.'
  state_dim: 'CORRECTED 14->8. robopen.github.io/roboset/ Data Schema image: qp_arm
    float[7] (arm joint pos) + qp_ee float[1] (Robotiq gripper pos) = 8, mirroring
    action_dim (ctrl_arm[7]+ctrl_ee[1]=8). Previous ''14'' came from github.com/robopen/roboagent/train.py''s
    hardcoded state_dim=14, but that is a stale ALOHA/bimanual-derived config constant:
    detr_vae.py in the same repo builds input_proj_robot_state = nn.Linear(7, hidden_dim)
    with comment ''7 for qpos'', and elsewhere overrides state_dim = 8 (#14 commented
    out) for the CNNMLP baseline -- neither matches 14.'
  action_dim: arXiv:2309.01918 Appendix B.1 ('action space dimension of 8'); consistent
    with github.com/robopen/roboagent/blob/main/utils.py, which builds the action
    vector as np.concatenate([trial['data']['ctrl_arm'], trial['data']['ctrl_ee']]).
  fps: 'arXiv:2309.01918 Appendix A: ''data was collected using an Oculus Quest 2
    controller ... at 5Hz''; Appendix B.1: ''The robot is operated at a frequency
    of 5Hz.'''
  fps_variable: arXiv:2309.01918 states a single fixed control/collection frequency
    of 5Hz, with no mention of variable-rate recording.
  num_camera_views: 'robopen.github.io/roboset/ ''We collected the dataset with 4
    distinct camera views per frame''; arXiv:2309.01918 Section 4: ''The four Realsense
    D455 camera views provide complementary perspectives of the workspace''.'
  camera_views: 'Re-verified: robopen.github.io/roboset/ Data Schema image lists rgb_left,
    rgb_right, rgb_top, rgb_wrist (and matching d_* depth channels); arXiv:2309.01918
    Sec.4/App.A confirm top+left+right fixed cameras plus a wrist camera. schema.py
    now defines a ''wrist'' CameraView enum value, so the wrist camera is now represented
    directly instead of via suggested_new_enum_values; left/right map to ''side'',
    top to ''top''.'
  depth_coverage: 'arXiv:2309.01918 Appendix A: ''MT-ACT dataset consisted of RGB
    and depth frames from four camera views''; cameras are Realsense D455 RGB-D sensors,
    so depth is available for all views.'
  has_language_instruction: 'robopen.github.io/roboset/teleoperation.html: ''Since
    each task is defined through a language instruction, there could be opportunities
    for language guided sequencing''; arXiv:2309.01918 uses a language-conditioned
    policy (MT-ACT) trained on per-task language embeddings.'
  num_task_types: 'robopen.github.io/roboset/teleoperation.html: ''We have a total
    of 12 skills, adequately represented across 38 tasks''; arXiv:2309.01918 abstract:
    ''demonstrate its generalization over 38 tasks''.'
  urdf_available: github.com/frankarobotics/franka_ros (official 'ROS integration
    for Franka research robots' repo) ships the franka_description package containing
    the manufacturer's URDF/xacro model for the Franka Panda arm used in RoboSet.
  urdf_source: github.com/frankarobotics/franka_ros is maintained by Franka Robotics
    (the manufacturer), so the URDF is manufacturer-official rather than a community
    or dataset-repo reproduction.
  expected_num_episodes: 'Re-verified 30050: robopen.github.io/roboset/teleoperation.html
    states ''Overall we have 30,050 trajectories ... 9,500 are collected through teleoperation'';
    arXiv:2309.01918 footnote 3 corroborates with ''9,500 teleoperated ... 20,500
    kinesthetic'' (~30,000). Note: robopen.github.io/roboset/ (homepage) inconsistently
    states ''28,500'' trajectories (9,500 teleop + 19,000 kinesthetic) -- an apparent
    stale figure on that page; 30,050 is used as it is corroborated by both the teleoperation
    subpage and the paper''s footnote arithmetic.'
  additional_modalities: 'robopen.github.io/roboset/ Data Schema image: tau_arm float[7]
    ''measured torque of arm joints'' is recorded per trial -> force_torque modality
    confirmed. No tactile, audio, or eye_gaze fields appear in the schema or in arXiv:2309.01918.'
  paper_url: 'RoboAgent/MT-ACT paper describing RoboSet collection: arXiv:2309.01918
    (https://arxiv.org/abs/2309.01918).'
  is_multi_embodiment: arXiv:2309.01918 and robopen.github.io/roboset/ describe a
    single Franka Emika Panda + Robotiq gripper embodiment throughout the core teleop+kinesthetic
    RoboSet; only a separate autonomous bin-picking release (excluded from this config's
    counts) uses an alternate D'Manus dexterous-hand end-effector on some subsets.
  has_synchronized_multiview_rig: robopen.github.io/roboset/ Data Schema image groups
    rgb_left/right/top/wrist and d_left/right/top/wrist under a single 'data' record
    keyed by one shared 'time' field per trial step; robopen.github.io/roboset/teleoperation.html
    states 'four distinct camera views per frame', i.e. all 4 cameras are captured
    together at each recorded timestep.
  action_frame: 'Inferred: github.com/robopen/roboagent/blob/main/utils.py builds
    the action tensor directly from raw h5 ctrl_arm/ctrl_ee fields with no delta/differencing
    step, and arXiv:2309.01918 App.B.1 describes ''joint position control'' (not delta
    control). Moderate confidence, not explicitly labeled ''absolute'' in the source.'
  expected_duration_hours: 'Derived estimate, not directly stated: github.com/robopen/roboagent/blob/main/utils.py
    hardcodes a filter requiring trial[''data''][''time''].shape[0] == 42 (with a
    cutoff of 2), and arXiv:2309.01918 Appendix A separately describes trials via
    ''...the time-steps (40 steps)'', consistent with a ~42-raw-step / ~40-effective-step
    episode length. At fps=5Hz that is ~8.4s/episode; 30,050 episodes * 8.4s / 3600
    ~= 70.1 hours. This assumes episode length is roughly uniform across the whole
    30,050-trajectory corpus, which is not explicitly confirmed for the kinesthetic
    portion.'
  num_scenes: 'arXiv:2309.01918 Sec.4: ''We collect the overall dataset across four
    different physical setups'' with different kitchen-like environments; robopen.github.io/roboset/teleoperation.html
    data table enumerates trajectories under Scene 1/2/3/4.'
  release_type: 'Re-verified: RoboSet is a fixed, pre-collected set of teleoperated
    + kinesthetic trajectories released for download (robopen.github.io/roboset/),
    not a generative framework, scene platform, or RL benchmark environment.'
  collection_method: robopen.github.io/roboset/teleoperation.html states 30,050 trajectories
    total, 9,500 via Oculus Quest 2 teleoperation and ~20,500 via kinesthetic playback-into-rearranged-scene
    demonstrations -- kinesthetic is the majority (~68%), mapped as primary; teleop
    as secondary. 'kinesthetic' now exists as a CollectionMethod enum member (added
    in the round-1 schema extension) -- the stale suggested_new_enum_values entry
    proposing it is removed.
  secondary_collection_methods: '9,500 of 30,050 core trajectories (~32%) were collected
    via Oculus Quest 2 teleoperation, alongside the majority kinesthetic portion (source:
    same as collection_method). Additionally, the RoboSet project separately publishes
    a ~58,000-trajectory autonomous bin-pick-and-place sub-release at robopen.github.io/roboset/autonomous.html
    (17 sets, Franka arm + parallel gripper/D''Manus dexterous hand for reorientation
    sets, eval sets explicitly marked ''contains successes and failures'' i.e. autonomous-policy
    rollouts, hosted at dl.fbaipublicfiles.com/RoboSet/AutonomousSet/, MIT license)
    -- a distinct release from the 30,050-trajectory core counted in this config''s
    expected_num_episodes/expected_duration_hours, but part of the same RoboSet project
    umbrella, hence added as a secondary_collection_methods tag rather than a separate
    registry entry.'
suggested_new_enum_values: {}
