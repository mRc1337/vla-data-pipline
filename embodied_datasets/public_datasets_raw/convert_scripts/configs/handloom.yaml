review_status: pending_human_review
field_sources:
  source_url: 'arXiv:2303.08975 abstract page (export.arxiv.org/abs/2303.08975), title
    ''HANDLOOM: Learned Tracing of One-Dimensional Objects for Inspection and Manipulation''
    (Viswanath, Shivakumar, Ajmera, Parulekar, Kerr, Ichnowski, Cheng, Kollar, Goldberg
    -- Berkeley AUTOLab), confirms this is the correct, resolvable paper page.'
  paper_url: Same as source_url; this dataset has no separate non-arXiv paper venue
    page found. arXiv:2303.08975.
  license: No LICENSE file found in the code repo (github.com/vainaviv/handloom, checked
    LICENSE/LICENSE.md/LICENSE.txt at master, all 404), no license statement on the
    project page (sites.google.com/view/cable-tracing), and no license clause in the
    paper itself. Mapped to Unknown rather than guessed.
  raw_format: 'github.com/vainaviv/handloom README.md ''Datasets'' section: data lives
    in a plain ''data'' folder split into real_data/ and sim_data/ subfolders, each
    holding images plus per-example label fields for ground-truth trace generation
    -- a bespoke folder-of-images-and-labels layout, not RLDS/HDF5/LeRobot/ROS_bag/
    MCAP/TFRecord/VRS. Mapped to Custom.'
  release_type: 'arXiv:2303.08975 abstract: networks ''trained with 30,000 simulated
    examples and 568 real examples'' -- a fixed-size released annotated example set
    (images + ground-truth traces), not a generation framework, scene platform, or
    RL benchmark env. Closest fit is fixed_episode_dataset, even though ''episode''
    here means a single annotated cable image/trace pair rather than a multi-step
    robot trajectory episode.'
  collection_method: arXiv:2303.08975 abstract states the tracer/crossing-classifier
    networks are trained on 30,000 simulated examples + 568 real examples (30,000/30,568
    ~= 98% simulated). Mapped to simulation as the dominant method; the 568 real examples
    are camera-captured/hand-annotated still images, not robot-teleoperated or autonomous-policy
    trajectories, so they do not cleanly map to any other CollectionMethod enum value
    and are not added as a secondary_collection_methods entry (left empty rather than
    force-fit).
  is_multi_embodiment: 'Paper Sec 5 ''Physical Experiments'': all physical-robot experiments
    (tracing, multi-cable inspection, knot-tying demonstrations, knot detection, untangling)
    use a single robot, the bimanual ABB YuMi -- no other physical embodiment is used
    anywhere in the paper.'
  embodiment_class: 'Paper Sec 5, p.5: ''The workspace has a 1 m x 0.75 m foam-padded,
    black surface, a bimanual ABB YuMi robot, and an overhead Photoneo PhoXi camera''
    -- ABB YuMi (IRB 14000) is a two-armed/dual-arm robot.'
  robot_platform: ABB YuMi is not present in the current RobotPlatform enum (schema.py
    has franka_panda/ur5/ur5e/agilex_aloha/agilex_cobot_magic/xarm7/ kinova_gen3/sawyer/widowx/viperx/agibot_g1/tien_kung/arx5/unitree_g1/unitree_h1/
    fourier_gr1/flexiv_rizon4/galaxea_r1_lite/toyota_eley/other). Left null rather
    than lumped into 'other'; see suggested_new_enum_values.
  num_arms: 'Paper Sec 5, p.5: ''a bimanual ABB YuMi robot'' -- 2 arms, matching the
    schema''s num_arms<=2 constraint.'
  gripper_type: 'Paper Appendix 7.2.6 ''Manipulation Primitives'' / ''Cage-Pinch Dilation'':
    ''We use cage-pinch grippers as in Viswanath et al. [3]. We have one gripper cage
    grasp the cable ... The other gripper pinch grasps the cable.'' This is a bespoke
    two-fingered cage-pinch gripper design specific to cable manipulation, not a standard
    off-the-shelf parallel_jaw/dexterous_hand/three_jaw/ suction gripper as enumerated
    in GripperType. Left null rather than force-mapped to parallel_jaw; see suggested_new_enum_values.'
  hand_pose_representation: No dexterous hand or bare-hand tracking is used anywhere
    in the paper (only the bespoke cage-pinch two-finger grippers on the YuMi arms,
    described above) -- mapped to the explicit 'none' enum value rather than left
    blank, since the field clearly does not apply and NONE exists precisely for this
    case.
  has_mobile_base: Paper Sec 5 describes the ABB YuMi as fixed at a tabletop workspace
    (1m x 0.75m foam-padded surface); no mobile base is mentioned or used anywhere
    in the paper.
  action_space: Left blank intentionally. The 30,000 simulated + 568 real 'annotated
    dataset' referenced in the abstract consists of RGB(-D) images of cables with
    ground-truth trace/crossing labels only -- it is a perception/ tracing-algorithm
    training dataset, not an action-labeled robot trajectory dataset. The paper's
    downstream physical-robot demonstrations (Sec 5.3, 'pick-place actions, parameterized
    by absolute arc-length or arc-length relative to crossings') are a separate, small-scale
    experiment whose trajectories are not part of the released/registered annotated
    dataset, and that parameterization (arc-length along a traced cable) does not
    map to any joint_position/joint_velocity/joint_torque/eef_pose/mixed enum value
    anyway.
  action_frame: Left blank for the same reason as action_space -- no action data ships
    with the released annotated tracing dataset.
  rotation_representation: Left blank for the same reason as action_space -- no end-effector
    orientation data ships with the released annotated tracing dataset.
  state_dim: Left blank -- no robot proprioceptive state vector is part of the released
    annotated dataset (images + trace/crossing labels only).
  action_dim: Left blank -- no action vector is part of the released annotated dataset
    (images + trace/crossing labels only).
  fps: Not found -- the dataset consists of static annotated images (simulated renders
    and real photographs), not a recorded video/control stream with a stated frame
    rate, in either the paper or the GitHub repo.
  num_camera_views: 'Paper Sec 5, p.5: ''an overhead Photoneo PhoXi camera with 773
    x 1032 x 4 RGB-D observations'' -- a single fixed overhead camera is used for
    all physical-robot experiments.'
  camera_views: Paper Sec 5, p.5 describes the Photoneo PhoXi as an 'overhead' camera
    facing down at the tabletop workspace -- mapped to the 'top' enum value (closest
    match to a fixed downward-facing overhead camera).
  has_synchronized_multiview_rig: Only a single overhead camera is described anywhere
    in the paper (Sec 5) -- no multi-camera synchronized rig is used.
  depth_coverage: 'Paper Sec 5, p.5: the overhead Photoneo PhoXi outputs ''773 x 1032
    x 4 RGB-D observations ... the depth data is used for grasping'' -- full-frame
    RGB-D depth is captured for the whole camera view.'
  has_language_instruction: No natural-language task instructions, language conditioning,
    or text annotations are described anywhere in the paper, README, or project page;
    tasks/cables are specified by fixed experimental setup (tiers/cable IDs), not
    free-form language.
  expected_num_episodes: 'arXiv:2303.08975 abstract: networks ''trained with 30,000
    simulated examples and 568 real examples'' -> 30,000 + 568 = 30,568 total annotated
    examples. Note: these are individual annotated image/trace examples, not multi-step
    robot trajectory episodes -- recorded here as the closest available numeric field
    for total released dataset scale.'
  urdf_available: Not confirmed -- no URDF/MJCF robot description file was found in
    the github.com/vainaviv/handloom repo contents examined, and the paper does not
    reference one. Left blank rather than assumed from general ABB YuMi availability
    elsewhere.
suggested_new_enum_values:
  robot_platform: 'abb_yumi -- ABB YuMi (IRB 14000) bimanual collaborative robot,
    used for all physical experiments in this paper (Sec 5, p.5: ''a bimanual ABB
    YuMi robot''). Not present in the current RobotPlatform enum; also referenced
    by other Berkeley AUTOLab cable-manipulation papers (e.g. SGTM 2.0), so likely
    reusable across multiple future dataset entries.'
  gripper_type: cage_pinch -- bespoke two-fingered 'cage-pinch' gripper design used
    for deformable linear object (cable/rope) manipulation, where one gripper 'cage'
    grasps allow the cable to slide while the other 'pinch' grasps hold it firmly
    (Appendix 7.2.6, citing Viswanath et al. and Shivakumar et al.'s SGTM 2.0). Distinct
    from a generic parallel_jaw gripper because the cage/pinch functional asymmetry
    between the two grippers is central to the manipulation primitive; not present
    in the current GripperType enum.
